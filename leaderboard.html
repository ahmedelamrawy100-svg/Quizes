<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 المتصدرين - Quiz Hub</title>
<link rel="icon" type="image/png" href="pic/Logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #000; --bg-gradient: radial-gradient(circle at center, #1a1015 0%, #000 100%);
    --text-color: #fff; --subtitle-color: #aaa; --card-bg: #111; --card-border: #333; --gold: #ffd700;
  }
  body.light-mode {
    --bg-color: #f4f4f4; --bg-gradient: radial-gradient(circle at center, #ffffff 0%, #e0e0e0 100%);
    --text-color: #111; --subtitle-color: #555; --card-bg: #fff; --card-border: #ccc; --gold: #b8860b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg-gradient); background-color: var(--bg-color); color: var(--text-color); font-family: 'Cairo', sans-serif; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; transition: 0.3s; }
  
  .top-controls { position: fixed; top: 20px; left: 20px; display: flex; gap: 10px; z-index: 999; }
  .ctrl-btn { background: #333; color: #fff; border: 2px solid #555; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; text-decoration: none; transition: 0.3s; }
  .ctrl-btn:hover { background: #ff0000; border-color: #ff0000; }

  .leaderboard-container { width: 100%; max-width: 800px; margin-top: 60px; }
  .header-title { text-align: center; font-size: 40px; color: var(--gold); margin-bottom: 10px; text-shadow: 0 0 20px rgba(255, 215, 0, 0.5); font-weight: 900; }
  .header-subtitle { text-align: center; color: var(--subtitle-color); margin-bottom: 30px; font-size: 18px; }

  .tabs-container { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
  .tab-btn { padding: 10px 25px; border-radius: 25px; border: 2px solid var(--card-border); background: var(--card-bg); color: var(--text-color); font-family: 'Cairo'; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; }
  .tab-btn.active { background: var(--gold); color: #000; border-color: var(--gold); box-shadow: 0 0 15px rgba(255, 215, 0, 0.5); }
  .tab-btn:hover:not(.active) { border-color: var(--gold); }

  .filters { display: flex; justify-content: center; gap: 10px; margin-bottom: 40px; flex-wrap: wrap; }
  .filter-btn { background: var(--card-bg); color: var(--text-color); border: 1px solid var(--card-border); padding: 8px 20px; border-radius: 20px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; transition: 0.3s; }
  .filter-btn.active { background: var(--gold); color: #000; border-color: var(--gold); }
  .filter-btn:hover:not(.active) { background: rgba(255, 215, 0, 0.1); border-color: var(--gold); }

  .podium-wrapper { display: flex; justify-content: center; align-items: flex-end; gap: 15px; margin-bottom: 40px; min-height: 200px; flex-wrap: wrap; }
  .podium-item { display: flex; flex-direction: column; align-items: center; width: 120px; animation: fadeInUp 0.5s ease-out; }
  .podium-avatar { width: 70px; height: 70px; background: var(--gold); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; color: #000; font-weight: bold; margin-bottom: 10px; background-size: cover; background-position: center; border: 3px solid #fff; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
  .podium-name { font-weight: bold; font-size: 16px; margin-bottom: 5px; text-align: center; word-break: break-all; }
  .podium-score { font-size: 14px; color: var(--gold); font-weight: bold; margin-bottom: 10px; }
  .podium-base { width: 100%; border-radius: 10px 10px 0 0; text-align: center; font-weight: bold; font-size: 26px; padding-top: 15px; color: #000; box-shadow: 0 -5px 15px rgba(0,0,0,0.3); }
  
  .rank-1 { order: 2; }
  .rank-2 { order: 1; }
  .rank-3 { order: 3; }

  .rank-1 .podium-base { height: 140px; background: linear-gradient(to top, #b8860b, #ffd700); }
  .rank-2 .podium-base { height: 110px; background: linear-gradient(to top, #708090, #c0c0c0); }
  .rank-3 .podium-base { height: 90px; background: linear-gradient(to top, #8b4513, #cd7f32); }
  
  .podium-wrapper.single { justify-content: center; }
  .podium-wrapper.single .podium-item { order: 0; }

  .leaderboard-list { background: var(--card-bg); border: 2px solid var(--gold); border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .lb-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; border-bottom: 1px solid var(--card-border); font-size: 18px; transition: 0.3s; }
  .lb-item:hover { background: rgba(255, 215, 0, 0.1); }
  .lb-item:last-child { border-bottom: none; }
  .lb-rank { font-size: 20px; font-weight: bold; width: 50px; text-align: center; color: var(--subtitle-color); }
  .lb-name { flex: 1; text-align: right; font-weight: bold; display: flex; align-items: center; gap: 10px; }
  .lb-avatar { width: 40px; height: 40px; background: var(--gold); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; color: #000; font-weight: bold; background-size: cover; background-position: center; }
  .lb-score { color: #ff0000; font-weight: 900; font-size: 20px; background: rgba(255,0,0,0.1); padding: 5px 15px; border-radius: 20px; }
  .no-data { text-align: center; color: var(--subtitle-color); padding: 40px; font-size: 18px; }
  
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  
  @media (max-width: 600px) {
    .header-title { font-size: 30px; }
    .podium-item { width: 90px; }
    .podium-avatar { width: 60px; height: 60px; font-size: 24px; }
    .podium-name { font-size: 14px; }
    .podium-score { font-size: 12px; }
    .rank-1 .podium-base { height: 120px; }
    .rank-2 .podium-base { height: 90px; }
    .rank-3 .podium-base { height: 70px; }
    .lb-item { padding: 12px 15px; font-size: 16px; }
    .lb-score { font-size: 16px; padding: 4px 10px; }
  }
</style>
</head>
<body>

<div class="top-controls">
  <a href="index.html" class="ctrl-btn" id="backBtn" data-ar="⬅ رجوع" data-en="⬅ Back">⬅ رجوع</a>
  <button class="ctrl-btn" onclick="toggleLanguage()" id="langBtn">EN</button>
</div>

<div class="leaderboard-container">
  <h1 class="header-title" id="mainTitle" data-ar="🏆 قاعة المشاهير" data-en="🏆 Hall of Fame">🏆 قاعة المشاهير</h1>
  <p class="header-subtitle" id="subtitle" data-ar="أفضل 10 لاعبين في منصة Quiz Hub" data-en="Top 10 players on Quiz Hub">أفضل 10 لاعبين في منصة Quiz Hub</p>

  <div class="tabs-container">
    <button class="tab-btn active" onclick="switchTimeFilter('all', this)" id="tabAll" data-ar="👑 كل الأوقات" data-en="👑 All Time">👑 كل الأوقات</button>
    <button class="tab-btn" onclick="switchTimeFilter('week', this)" id="tabWeek" data-ar="🔥 أبطال الأسبوع" data-en="🔥 Week Heroes">🔥 أبطال الأسبوع</button>
  </div>

  <!-- تم إضافة زرار الغموض هنا -->
  <div class="filters" id="categoryFilters">
    <button class="filter-btn active" onclick="filterLeaderboard('all', this)" data-ar="الكل" data-en="All">الكل</button>
    <button class="filter-btn" onclick="filterLeaderboard('horror', this)" data-ar="رعب 🎃" data-en="Horror 🎃">رعب 🎃</button>
    <button class="filter-btn" onclick="filterLeaderboard('action', this)" data-ar="أكشن 💥" data-en="Action 💥">أكشن 💥</button>
    <button class="filter-btn" onclick="filterLeaderboard('kdrama', this)" data-ar="دراما كورية 💖" data-en="K-Drama 💖">دراما كورية 💖</button>
    <button class="filter-btn" onclick="filterLeaderboard('mystery', this)" data-ar="غموض 🕵️" data-en="Mystery 🕵️">غموض 🕵️</button>
  </div>

  <div class="podium-wrapper" id="podiumContainer"></div>
  
  <div class="leaderboard-list" id="leaderboardList">
    <div class="no-data" id="loadingText" data-ar="جاري تحميل البيانات..." data-en="Loading data...">جاري تحميل البيانات...</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBmyW4tZGJfcHJ4jKSD3_6hebZK58Y3jXo",
    authDomain: "quiz-hub-app-f4cd0.firebaseapp.com",
    databaseURL: "https://quiz-hub-app-f4cd0-default-rtdb.firebaseio.com",
    projectId: "quiz-hub-app-f4cd0",
    storageBucket: "quiz-hub-app-f4cd0.firebasestorage.app",
    messagingSenderId: "282772179392",
    appId: "1:282772179392:web:64646d757592b29ff3a025"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  window.db = db; window.ref = ref; window.onValue = onValue; window.get = get;

  let allScoresData = null;
  let allUsersData = {}; 
  let currentTimeFilter = 'all';
  let currentCategory = 'all';
  let currentLang = localStorage.getItem('lang') || 'ar';

  window.toggleLanguage = function() {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      localStorage.setItem('lang', currentLang);
      applyLanguage();
  }

  function applyLanguage() {
      document.body.dir = currentLang === 'en' ? 'ltr' : 'rtl';
      document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'EN' : 'AR';
      
      document.querySelectorAll('[data-ar]').forEach(el => {
          el.innerText = currentLang === 'en' ? el.getAttribute('data-en') : el.getAttribute('data-ar');
      });
      
      if (allScoresData) renderLeaderboard();
  }

  window.onValue(window.ref(window.db, 'users_data'), (snapshot) => {
      allUsersData = snapshot.val() || {};
      if (allScoresData) renderLeaderboard();
  });

  window.onValue(window.ref(window.db, 'scores'), (snapshot) => {
    allScoresData = snapshot.val();
    renderLeaderboard();
  });

  window.switchTimeFilter = function(timeType, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTimeFilter = timeType;
      renderLeaderboard();
  }

  window.filterLeaderboard = function(category, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCategory = category;
    renderLeaderboard();
  }

  function renderLeaderboard() {
    const podiumContainer = document.getElementById('podiumContainer');
    const leaderboardList = document.getElementById('leaderboardList');
    
    if (!allScoresData) { 
        leaderboardList.innerHTML = `<div class="no-data">${currentLang === 'en' ? 'No data yet. Play a quiz!' : 'مفيش نتايج لحد دلوقتي. العب كويز عشان تتصدر!'}</div>`; 
        return; 
    }
    
    let horrorKeys = ['annabelle', 'conjuring', 'fnaf', 'thenun', 'traintobusan'];
    let actionKeys = ['squidgame', 'wonderfools'];
    let kdramaKeys = ['family', 'beauty', 'dream', 'whyher'];
    let mysteryKeys = ['wednesday']; // مفاتيح كويز الغموض

    let players = [];
    const oneWeekAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);

    for (let username in allScoresData) {
      if (username.toLowerCase() === 'ahmed') continue; 
      let playerTotal = 0;
      
      for (let quiz in allScoresData[username]) {
        let shouldCount = false;
        let quizLower = quiz.toLowerCase();
        
        if (currentCategory === 'all') shouldCount = true;
        else if (currentCategory === 'horror' && horrorKeys.some(k => quizLower.includes(k))) shouldCount = true;
        else if (currentCategory === 'action' && actionKeys.some(k => quizLower.includes(k))) shouldCount = true;
        else if (currentCategory === 'kdrama' && kdramaKeys.some(k => quizLower.includes(k))) shouldCount = true;
        else if (currentCategory === 'mystery' && mysteryKeys.some(k => quizLower.includes(k))) shouldCount = true;

        if (shouldCount) {
            const attempts = Object.values(allScoresData[username][quiz]);
            
            let validAttempts = attempts;
            if (currentTimeFilter === 'week') {
                validAttempts = attempts.filter(entry => {
                    const entryTime = new Date(entry.time).getTime();
                    return entryTime >= oneWeekAgo;
                });
            }

            if (validAttempts.length > 0) {
                const bestScore = Math.max(...validAttempts.map(entry => entry.score));
                playerTotal += bestScore;
            }
        }
      }
      
      if (playerTotal > 0 || (currentCategory === 'all' && currentTimeFilter === 'all')) {
          players.push({ username, total: playerTotal });
      }
    }
    
    players.sort((a, b) => b.total - a.total);
    const top10 = players.slice(0, 10);
    const top3 = top10.slice(0, 3);
    const rest = top10.slice(3);

    podiumContainer.innerHTML = '';
    if (top3.length === 1) podiumContainer.classList.add('single'); else podiumContainer.classList.remove('single');

    const displayOrder = [top3[1], top3[0], top3[2]];
    const classes = ['rank-2', 'rank-1', 'rank-3'];
    const medals = ['🥈', '🥇', '🥉'];

    displayOrder.forEach((player, index) => {
        if (!player) return;
        const div = document.createElement('div');
        div.className = `podium-item ${classes[index]}`;
        
        let avatarHTML = index === 1 ? '👑' : '👤';
        if (allUsersData[player.username] && allUsersData[player.username].profilePic) {
            avatarHTML = `<img src="${allUsersData[player.username].profilePic}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
        }

        const ptsText = currentLang === 'en' ? 'pts' : 'نقطة';

        div.innerHTML = `
            <div class="podium-avatar">${avatarHTML}</div>
            <div class="podium-name">${player.username}</div>
            <div class="podium-score">${player.total} ${ptsText}</div>
            <div class="podium-base">${medals[index]}</div>
        `;
        podiumContainer.appendChild(div);
    });

    leaderboardList.innerHTML = '';
    if (rest.length === 0) {
        leaderboardList.innerHTML = `<div class="no-data">${currentLang === 'en' ? 'Need more players to fill the list!' : 'محتاجين لاعبين أكتر عشان نكمل القائمة!'}</div>`;
    } else {
        rest.forEach((player, index) => {
            const actualRank = index + 4;
            const div = document.createElement('div');
            div.className = 'lb-item';
            
            let avatarHTML = player.username.charAt(0).toUpperCase();
            if (allUsersData[player.username] && allUsersData[player.username].profilePic) {
                avatarHTML = `<img src="${allUsersData[player.username].profilePic}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
            }

            const ptsText = currentLang === 'en' ? 'pts' : 'نقطة';

            div.innerHTML = `
                <span class="lb-rank">#${actualRank}</span>
                <span class="lb-name"><div class="lb-avatar">${avatarHTML}</div> ${player.username}</span>
                <span class="lb-score">${player.total} ${ptsText}</span>
            `;
            leaderboardList.appendChild(div);
        });
    }
  }

  window.onload = () => {
      applyLanguage();
  };

</script>
</body>
</html>
