<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 المتصدرين - Quiz Hub</title>
<link rel="icon" type="image/png" href="pic/Logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #000; --bg-gradient: radial-gradient(circle at center, #1a1015 0%, #000 100%);
    --text-color: #fff; --subtitle-color: #aaa; --card-bg: #111; --card-border: #333; --gold: #ffd700; --blue: #00ffff; --accent: #ff3333;
  }
  body.light-mode {
    --bg-color: #f4f4f4; --bg-gradient: radial-gradient(circle at center, #ffffff 0%, #e0e0e0 100%);
    --text-color: #111; --subtitle-color: #555; --card-bg: #fff; --card-border: #ccc; --gold: #b8860b; --blue: #0088cc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg-gradient); background-color: var(--bg-color); color: var(--text-color); font-family: 'Cairo', sans-serif; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; transition: 0.3s; overflow-x: hidden; }
  
  .top-controls { position: fixed; top: 20px; left: 20px; display: flex; gap: 10px; z-index: 999; }
  .ctrl-btn { background: #333; color: #fff; border: 2px solid #555; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; text-decoration: none; transition: 0.3s; }
  .ctrl-btn:hover { background: #ff0000; border-color: #ff0000; }

  .leaderboard-container { width: 100%; max-width: 800px; margin-top: 60px; }
  .header-title { text-align: center; font-size: 40px; color: var(--gold); margin-bottom: 10px; text-shadow: 0 0 20px rgba(255, 215, 0, 0.5); font-weight: 900; }
  .header-subtitle { text-align: center; color: var(--subtitle-color); margin-bottom: 30px; font-size: 18px; }

  .main-tabs { display: flex; width: 100%; max-width: 500px; margin: 0 auto 25px auto; background: var(--card-bg); border: 2px solid var(--card-border); border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
  .main-tab-btn { flex: 1; padding: 15px 10px; border: none; background: transparent; color: var(--subtitle-color); font-family: 'Cairo'; font-weight: 900; font-size: 18px; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 8px; }
  .main-tab-btn.active { background: var(--gold); color: #000; box-shadow: inset 0 0 10px rgba(0,0,0,0.1); }
  .main-tab-btn.speed-btn.active { background: var(--blue); color: #000; }
  .main-tab-btn:hover:not(.active) { background: rgba(255,255,255,0.05); color: var(--text-color); }

  .filters-wrapper { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-bottom: 40px; }
  .time-filters { display: flex; gap: 10px; background: rgba(255,255,255,0.05); padding: 5px; border-radius: 25px; }
  .time-btn { padding: 8px 20px; border-radius: 20px; border: none; background: transparent; color: var(--subtitle-color); font-family: 'Cairo'; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.3s; }
  .time-btn.active { background: var(--card-bg); color: var(--gold); box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
  .category-filters { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .cat-btn { padding: 6px 16px; border-radius: 15px; border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text-color); font-family: 'Cairo'; font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.3s; }
  .cat-btn.active { background: var(--gold); color: #000; border-color: var(--gold); }
  .cat-btn:hover:not(.active) { border-color: var(--gold); }

  .hall-of-fame-container { display: flex; justify-content: center; align-items: flex-end; gap: 20px; margin: 40px 0; min-height: 280px; perspective: 1000px; }
  .fame-card { background: linear-gradient(145deg, #1a1a1a, #0a0a0a); border: 2px solid var(--gold); border-radius: 20px; width: 160px; height: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; transform-style: preserve-3d; transition: transform 0.1s ease, box-shadow 0.3s; box-shadow: 0 15px 35px rgba(0,0,0,0.8); }
  .fame-card:hover { box-shadow: 0 0 40px rgba(255, 215, 0, 0.6); border-color: #fff; }

  .fame-rank-1 { width: 190px; height: 260px; border-color: #ffd700; box-shadow: 0 0 30px rgba(255, 215, 0, 0.4); transform: translateZ(50px); }
  .fame-rank-1 .fame-avatar { border-color: #ffd700; box-shadow: 0 0 20px #ffd700; width: 90px; height: 90px; font-size: 40px;}
  .fame-rank-2 { border-color: #c0c0c0; transform: translateZ(20px); }
  .fame-rank-2 .fame-avatar { border-color: #c0c0c0; }
  .fame-rank-3 { border-color: #cd7f32; transform: translateZ(0px); }
  .fame-rank-3 .fame-avatar { border-color: #cd7f32; }

  .crown-icon { position: absolute; top: -35px; font-size: 45px; animation: floatCrown 2s infinite ease-in-out; filter: drop-shadow(0 0 10px #ffd700); z-index: 10; }
  @keyframes floatCrown { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

  .fame-avatar { width: 70px; height: 70px; background: #222; border-radius: 50%; border: 3px solid #555; display: flex; justify-content: center; align-items: center; font-size: 30px; font-weight: bold; color: #fff; margin-bottom: 15px; background-size: cover; background-position: center; overflow: hidden; }
  .fame-name { color: #fff; font-size: 18px; font-weight: 900; text-align: center; margin-bottom: 5px; width: 100%; padding: 0 5px; word-break: break-all; display: flex; align-items: center; justify-content: center; gap: 5px;}
  .fame-score { color: var(--gold); font-size: 16px; font-weight: bold; background: rgba(255,215,0,0.1); padding: 3px 12px; border-radius: 15px; }

  /* ✅ علامة التوثيق */
  .verified-badge { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; background: #1DA1F2; color: #fff; border-radius: 50%; font-size: 9px; font-weight: bold; vertical-align: middle; }

  @media (max-width: 768px) {
      .top-controls { top: 10px; left: 10px; gap: 5px; }
      .ctrl-btn { padding: 6px 10px; font-size: 12px; }
      .leaderboard-container { margin-top: 70px; padding: 0 10px; }
      .header-title { font-size: 26px; }
      .header-subtitle { font-size: 14px; margin-bottom: 20px; }
      .main-tabs { flex-direction: row; }
      .main-tab-btn { font-size: 14px; padding: 10px 5px; }
      .time-filters { flex-wrap: wrap; justify-content: center; }
      .time-btn { font-size: 12px; padding: 6px 12px; }
      .category-filters { gap: 6px; }
      .cat-btn { font-size: 11px; padding: 5px 10px; }
      .hall-of-fame-container { flex-direction: row; flex-wrap: wrap; gap: 8px; justify-content: center; perspective: none; }
      .fame-card { width: 105px; height: 160px; transform: none !important; }
      .fame-rank-1 { width: 120px; height: 180px; transform: none !important; }
      .fame-avatar { width: 45px; height: 45px; font-size: 18px; }
      .fame-rank-1 .fame-avatar { width: 55px; height: 55px; }
      .fame-name { font-size: 12px; }
      .fame-score { font-size: 11px; padding: 2px 6px; }
      .crown-icon { font-size: 24px; top: -20px; }
      .lb-item { padding: 10px; font-size: 14px; }
      .lb-name { font-size: 13px; }
      .lb-score, .lb-time { font-size: 12px; padding: 3px 8px; }
  }

  .leaderboard-list { background: var(--card-bg); border: 2px solid var(--gold); border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .lb-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; border-bottom: 1px solid var(--card-border); font-size: 18px; transition: 0.3s; }
  .lb-item:hover { background: rgba(255, 215, 0, 0.1); }
  .lb-item:last-child { border-bottom: none; }
  .lb-rank { font-size: 20px; font-weight: bold; width: 50px; text-align: center; color: var(--subtitle-color); }
  .lb-name { flex: 1; text-align: right; font-weight: bold; display: flex; align-items: center; gap: 10px; }
  .lb-avatar { width: 40px; height: 40px; background: var(--gold); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; color: #000; font-weight: bold; background-size: cover; background-position: center; overflow: hidden; }
  .lb-score { color: #ff0000; font-weight: 900; font-size: 20px; background: rgba(255,0,0,0.1); padding: 5px 15px; border-radius: 20px; }
  .lb-time { color: var(--blue); font-weight: 900; font-size: 20px; background: rgba(0,255,255,0.1); padding: 5px 15px; border-radius: 20px; direction: ltr;}
  .no-data { text-align: center; color: var(--subtitle-color); padding: 40px; font-size: 18px; }
</style>
</head>
<body>

<div class="top-controls">
  <a href="index.html" class="ctrl-btn" id="backBtn" data-ar="⬅ رجوع" data-en="⬅ Back">⬅ رجوع</a>
  <button class="ctrl-btn" onclick="toggleLanguage()" id="langBtn">EN</button>
  <button class="ctrl-btn" onclick="toggleTheme()" id="themeBtn">☀️</button>
</div>

<div class="leaderboard-container">
  <h1 class="header-title" id="mainTitle" data-ar="🏆 قاعة المشاهير" data-en="🏆 Hall of Fame">🏆 قاعة المشاهير</h1>
  <p class="header-subtitle" id="subtitle" data-ar="أفضل اللاعبين في منصة Quiz Hub" data-en="Top players on Quiz Hub">أفضل اللاعبين في منصة Quiz Hub</p>

  <div class="main-tabs">
    <button class="main-tab-btn active" onclick="switchMainTab('normal', this)" id="tabNormal" data-ar="👑 النقاط" data-en="👑 Points">👑 النقاط</button>
    <button class="main-tab-btn speed-btn" onclick="switchMainTab('speedrun', this)" id="tabSpeed" data-ar="⚡ السرعة" data-en="⚡ Speedrun">⚡ السرعة</button>
  </div>

  <div id="normalSection">
      <div class="filters-wrapper" id="filtersWrapper">
          <div class="time-filters">
            <button class="time-btn active" onclick="switchTimeFilter('all', this)" data-ar="👑 كل الأوقات" data-en="👑 All Time">👑 كل الأوقات</button>
            <button class="time-btn" onclick="switchTimeFilter('week', this)" data-ar="🔥 أبطال الأسبوع" data-en="🔥 Week Heroes">🔥 أبطال الأسبوع</button>
          </div>
          <div class="category-filters" id="categoryFilters">
            <button class="cat-btn active" onclick="filterLeaderboard('all', this)" data-ar="الكل" data-en="All">الكل</button>
            <button class="cat-btn" onclick="filterLeaderboard('horror', this)" data-ar="رعب 🎃" data-en="Horror 🎃">رعب 🎃</button>
            <button class="cat-btn" onclick="filterLeaderboard('action', this)" data-ar="أكشن 💥" data-en="Action 💥">أكشن 💥</button>
            <button class="cat-btn" onclick="filterLeaderboard('thriller', this)" data-ar="تشويق 🎬" data-en="Thriller 🎬">تشويق 🎬</button>
            <button class="cat-btn" onclick="filterLeaderboard('mystery', this)" data-ar="غموض 🕵️" data-en="Mystery 🕵️">غموض 🕵️</button>
            <button class="cat-btn" onclick="filterLeaderboard('egyptian', this)" data-ar="مصري 🇪🇬" data-en="Egyptian 🇪🇬">مصري 🇪🇬</button>
        </div>
      </div>
      <div class="hall-of-fame-container" id="podiumContainer"></div>
      <div class="leaderboard-list" id="leaderboardList">
        <div class="no-data" id="loadingText" data-ar="جاري تحميل البيانات..." data-en="Loading data...">جاري تحميل البيانات...</div>
      </div>
  </div>

  <div id="speedSection" style="display: none;">
      <div class="leaderboard-list" id="speedrunList">
          <div class="no-data">جاري تحميل البيانات...</div>
      </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = { apiKey: "AIzaSyBmyW4tZGJfcHJ4jKSD3_6hebZK58Y3jXo", authDomain: "quiz-hub-app-f4cd0.firebaseapp.com", databaseURL: "https://quiz-hub-app-f4cd0-default-rtdb.firebaseio.com", projectId: "quiz-hub-app-f4cd0", storageBucket: "quiz-hub-app-f4cd0.firebasestorage.app", messagingSenderId: "282772179392", appId: "1:282772179392:web:64646d757592b29ff3a025" };
  const app = initializeApp(firebaseConfig); const db = getDatabase(app);
  window.db = db; window.ref = ref; window.onValue = onValue; window.get = get;

  let currentLang = localStorage.getItem('lang') || 'ar';
  let currentTimeFilter = 'all';
  let currentCategory = 'all';
  let allScoresData = null;
  let allLeaderboardData = null;
  let allUsersData = {}; 
  let verifiedUsers = {}; // ✅ متغير للتوثيق
  let speedrunData = null;

  if (localStorage.getItem('theme') === 'light') { 
      document.body.classList.add('light-mode'); 
      const btn = document.getElementById('themeBtn');
      if(btn) btn.innerText = '🌙';
  }

  window.toggleTheme = function() {
      const body = document.body;
      const isLight = body.classList.toggle('light-mode');
      const icon = isLight ? '🌙' : '☀️';
      const btn = document.getElementById('themeBtn');
      if(btn) btn.innerText = icon;
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
  }

  window.toggleLanguage = function() {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      localStorage.setItem('lang', currentLang);
      applyLanguage();
  }

  function applyLanguage() {
      document.body.dir = currentLang === 'en' ? 'ltr' : 'rtl';
      document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'EN' : 'AR';
      document.querySelectorAll('[data-ar]').forEach(el => {
          el.innerText = currentLang === 'en' ? el.getAttribute('data-en') : el.getAttribute('data-ar');
      });
      
      if (document.getElementById('normalSection').style.display !== 'none') {
          if (allScoresData) renderLeaderboard();
      } else {
          if (speedrunData) renderSpeedrun();
      }
  }

  document.addEventListener('mousemove', (e) => {
      const cards = document.querySelectorAll('.fame-card');
      const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
      const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
      cards.forEach(card => { card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`; });
  });

  window.onValue(window.ref(window.db, 'verified_users'), (snapshot) => {
      verifiedUsers = snapshot.val() || {};
      if (allScoresData) renderLeaderboard();
      if (speedrunData) renderSpeedrun();
  });

  window.onValue(window.ref(window.db, 'users_data'), (snapshot) => {
      allUsersData = snapshot.val() || {};
      if (allScoresData) renderLeaderboard();
      if (speedrunData) renderSpeedrun();
  });

  window.onValue(window.ref(window.db, 'scores'), (snapshot) => {
    allScoresData = snapshot.val();
    renderLeaderboard();
  });

  window.onValue(window.ref(window.db, 'leaderboard'), (snapshot) => {
    allLeaderboardData = snapshot.val();
    renderLeaderboard();
  });

  window.onValue(window.ref(window.db, 'speedrun_scores'), (snapshot) => {
    speedrunData = snapshot.val();
    renderSpeedrun();
  });

  window.switchMainTab = function(tab, btn) {
      document.querySelectorAll('.main-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (tab === 'normal') {
          document.getElementById('normalSection').style.display = 'block';
          document.getElementById('speedSection').style.display = 'none';
          document.getElementById('subtitle').innerText = currentLang === 'ar' ? 'أفضل اللاعبين في منصة Quiz Hub' : 'Top players on Quiz Hub';
      } else {
          document.getElementById('normalSection').style.display = 'none';
          document.getElementById('speedSection').style.display = 'block';
          document.getElementById('subtitle').innerText = currentLang === 'ar' ? 'أسرع 10 لاعبين في وضع السرعة' : 'Fastest 10 players in Speedrun';
          renderSpeedrun();
      }
  }

  window.switchTimeFilter = function(timeType, btn) {
      document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTimeFilter = timeType;
      renderLeaderboard();
  }

  window.filterLeaderboard = function(category, btn) {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCategory = category;
    renderLeaderboard();
  }

  function checkVerified(username) {
      for(let v in verifiedUsers) {
          if(v.toLowerCase() === username.toLowerCase()) return true;
      }
      return false;
  }

  function renderLeaderboard() {
    let combinedData = { ...allScoresData, ...allLeaderboardData }; 
    if (!combinedData) return;
    
    let horrorKeys = ['annabelle', 'conjuring', 'fnaf', 'thenun', 'traintobusan', 'scream'];
    let actionKeys = ['squidgame', 'spiderman', 'spiderman2026', 'avengers', 'avatar', 'venom', 'birdsofprey'];
    let thrillerKeys = ['fall'];
    let mysteryKeys = ['wednesday', 'knivesout'];
    let egyptianKeys = ['elharifa']; 

    let playersMap = {};
    const oneWeekAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);

    for (let username in combinedData) {
      if (username.toLowerCase() === 'ahmed' || username.toLowerCase() === 'owner') continue; 
      
      let lowerUsername = username.toLowerCase();
      if (!playersMap[lowerUsername]) {
          playersMap[lowerUsername] = { username: username, total: 0 };
      }
      
      for (let quiz in combinedData[username]) {
        let shouldCount = false;
        let quizLower = quiz.toLowerCase();
        
        if (currentCategory === 'all') shouldCount = true;
        else if (currentCategory === 'horror' && horrorKeys.some(k => quizLower.includes(k))) shouldCount = true;
        else if (currentCategory === 'action' && actionKeys.some(k => quizLower.includes(k))) shouldCount = true;
        else if (currentCategory === 'thriller' && thrillerKeys.some(k => quizLower.includes(k))) shouldCount = true;
        else if (currentCategory === 'mystery' && mysteryKeys.some(k => quizLower.includes(k))) shouldCount = true;
        else if (currentCategory === 'egyptian' && egyptianKeys.some(k => quizLower.includes(k))) shouldCount = true;

        if (shouldCount) {
            const attempts = Object.values(combinedData[username][quiz]);
            let validAttempts = attempts;
            
            if (currentTimeFilter === 'week') {
                validAttempts = attempts.filter(entry => {
                    const entryTime = new Date(entry.time).getTime();
                    return entryTime >= oneWeekAgo;
                });
            }

            if (validAttempts.length > 0) {
                const bestScore = Math.max(...validAttempts.map(entry => entry.score));
                playersMap[lowerUsername].total += bestScore;
            }
        }
      }
    }
    
    let players = Object.values(playersMap).filter(p => p.total > 0 || (currentCategory === 'all' && currentTimeFilter === 'all'));
    players.sort((a, b) => b.total - a.total);
    
    const top10 = players.slice(0, 10);
    const top3 = top10.slice(0, 3);
    const rest = top10.slice(3);

    const podiumContainer = document.getElementById('podiumContainer');
    podiumContainer.innerHTML = '';
    podiumContainer.className = 'hall-of-fame-container';

    const displayOrder = [top3[1], top3[0], top3[2]]; 
    const rankClasses = ['fame-rank-2', 'fame-rank-1', 'fame-rank-3'];
    const rankIcons = ['🥈', '👑', '🥉'];

    displayOrder.forEach((player, index) => {
        if (!player) return;
        
        const isVerified = checkVerified(player.username);
        const badge = isVerified ? ' <span class="verified-badge">✓</span>' : '';

        const div = document.createElement('div');
        div.className = `fame-card ${rankClasses[index]}`;
        
        let avatarHTML = player.username.charAt(0).toUpperCase();
        for(let key in allUsersData) {
            if(key.toLowerCase() === player.username.toLowerCase() && allUsersData[key].profilePic) {
                avatarHTML = `<img src="${allUsersData[key].profilePic}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
                break;
            }
        }

        const ptsText = currentLang === 'en' ? 'pts' : 'نقطة';
        const crownHTML = index === 1 ? `<div class="crown-icon">👑</div>` : '';

        div.innerHTML = `
            ${crownHTML}
            <div class="fame-avatar">${avatarHTML}</div>
            <div class="fame-name">${player.username}${badge}</div>
            <div class="fame-score">${player.total} ${ptsText}</div>
            <div style="font-size: 24px; margin-top: 10px;">${rankIcons[index]}</div>
        `;
        podiumContainer.appendChild(div);
    });

    const leaderboardList = document.getElementById('leaderboardList');
    leaderboardList.innerHTML = '';
    if (rest.length === 0) {
        leaderboardList.innerHTML = `<div class="no-data">${currentLang === 'en' ? 'Need more players to fill the list!' : 'محتاجين لاعبين أكتر عشان نكمل القائمة!'}</div>`;
    } else {
        rest.forEach((player, index) => {
            const actualRank = index + 4;
            const div = document.createElement('div');
            div.className = 'lb-item';
            
            let avatarHTML = player.username.charAt(0).toUpperCase();
            for(let key in allUsersData) {
                if(key.toLowerCase() === player.username.toLowerCase() && allUsersData[key].profilePic) {
                    avatarHTML = `<img src="${allUsersData[key].profilePic}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
                    break;
                }
            }

            const isVerified = checkVerified(player.username);
            const badge = isVerified ? ' <span class="verified-badge">✓</span>' : '';
            const ptsText = currentLang === 'en' ? 'pts' : 'نقطة';

            div.innerHTML = `
                <span class="lb-rank">#${actualRank}</span>
                <span class="lb-name"><div class="lb-avatar">${avatarHTML}</div> ${player.username}${badge}</span>
                <span class="lb-score">${player.total} ${ptsText}</span>
            `;
            leaderboardList.appendChild(div);
        });
    }
  }

  function renderSpeedrun() {
    const list = document.getElementById('speedrunList');
    if (!list) return;
    list.innerHTML = '';

    if (!speedrunData) {
        list.innerHTML = `<div class="no-data">${currentLang === 'en' ? 'No speedrun records yet. Play a quiz in speedrun mode!' : 'لا توجد نتائج سرعة لحد دلوقتي. العب كويز في وضع السرعة عشان تتصدر!'}</div>`;
        return;
    }

    let scores = Object.values(speedrunData);
    let bestSpeedRuns = {};
    scores.forEach(entry => {
        let lowerUser = entry.user.toLowerCase();
        if (!bestSpeedRuns[lowerUser] || entry.time < bestSpeedRuns[lowerUser].time) {
            bestSpeedRuns[lowerUser] = entry;
        }
    });

    let finalScores = Object.values(bestSpeedRuns);
    finalScores.sort((a, b) => a.time - b.time);

    const top10 = finalScores.slice(0, 10);
    const medals = ['🥇', '🥈', '🥉'];

    top10.forEach((entry, index) => {
        const div = document.createElement('div');
        div.className = 'lb-item';
        
        let rankHTML = `#${index + 1}`;
        if (index < 3) rankHTML = medals[index];

        let avatarHTML = entry.user.charAt(0).toUpperCase();
        for(let key in allUsersData) {
            if(key.toLowerCase() === entry.user.toLowerCase() && allUsersData[key].profilePic) {
                avatarHTML = `<img src="${allUsersData[key].profilePic}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
                break;
            }
        }

        const isVerified = checkVerified(entry.user);
        const badge = isVerified ? ' <span class="verified-badge">✓</span>' : '';

        div.innerHTML = `
            <div class="lb-rank">${rankHTML}</div>
            <div class="lb-name">
                <div class="lb-avatar">${avatarHTML}</div> 
                ${entry.user}${badge}
                <span style="font-size:12px; color:#aaa; font-weight:normal;">(${entry.quiz.toUpperCase()})</span>
            </div>
            <div class="lb-time">⏱️ ${entry.time}s</div>
        `;
        list.appendChild(div);
    });
  }

  window.onload = () => { applyLanguage(); };
</script>
</body>
</html>
