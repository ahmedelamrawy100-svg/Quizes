<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ كويز الجمال الحقيقي - True Beauty</title>
<link rel="icon" type="image/png" href="pic/Logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="quiz-style.css">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
<div id="stars-bg"></div>
<div class="top-buttons-container">
    <a href="index.html" class="back-btn" id="backBtn" data-ar="⬅ رجوع" data-en="⬅ Back">⬅ رجوع</a>
    <button onclick="toggleTheme()" id="themeBtn">🌙</button>
    <button onclick="toggleLanguage()" id="langBtn">EN</button>
</div>

<div id="selectionScreen" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
  <h1 id="main-title" class="main-title" data-ar="✨ كويز الجمال الحقيقي ✨" data-en="✨ True Beauty Quiz ✨">✨ كويز الجمال الحقيقي ✨</h1>
  <p class="subtitle" data-ar="اختر طريقة اللعب" data-en="Choose game mode">اختر طريقة اللعب</p>
  <div class="grid-container" style="grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); max-width: 900px;">
    <div class="quiz-card" onclick="startGame('all')" style="background-image: url('pic/True Beauty.jpg');"><h2 class="card-title" data-ar="العب الشامل" data-en="Play Comprehensive">العب الشامل</h2></div>
  </div>
  <button class="speedrun-btn" onclick="startSpeedrun()" data-ar="⚡ العب في وضع السرعة" data-en="⚡ Play Speedrun">⚡ العب في وضع السرعة</button>
  <button class="speedrun-btn" style="background: #222; border-color: #f7a8d8; margin-top: 10px;" onclick="openChallengeModal()" data-ar="⚔️ تحدي صديق" data-en="⚔️ Challenge Friend">⚔️ تحدي صديق</button>
  <button class="speedrun-btn" style="background: #ff9800; border-color: #ffd700; margin-top: 10px; color: #000;" onclick="startRandomMatch()" data-ar="🎲 تحدي عشوائي" data-en="🎲 Random Match">🎲 تحدي عشوائي</button>
</div>

<div id="playScreen" class="play-screen">
  <h1 id="quiz-title" style="font-size: 30px; margin-bottom: 20px; color:#f7a8d8;">✨ كويز الجمال الحقيقي ✨</h1>
  <div class="progress"><div class="progress-bar" id="progress"></div></div>
  <div class="timer" id="timer">⏱️ 20</div>
  <div id="question" class="question"></div>
  <div id="options"></div>
  <div id="score"></div>
  <button id="next" onclick="nextQuestion()">السؤال التالي ←</button>
</div>

<div class="modal-overlay" id="challengeModal">
  <div class="modal-box">
    <h2>تحدي صديق ⚔️</h2>
    <div id="roomOptions">
      <button class="room-btn" onclick="createRoom()">إنشاء غرفة جديدة</button>
      <p style="color:#aaa; margin: 10px 0;">أو</p>
      <input type="text" id="roomCodeInput" class="room-input" maxlength="6" placeholder="كود الغرفة">
      <button class="room-btn" onclick="joinRoom()">انضمام لغرفة</button>
    </div>
    <div id="waitingRoom" style="display: none;">
      <p class="status-text">ابعت الكود ده لصاحبك:</p>
      <div class="room-code-display" id="displayRoomCode">------</div>
      <p class="status-text" id="waitingStatus">في انتظار انضمام صديقك...</p>
    </div>
    <button class="room-btn" style="background:#222;" onclick="closeChallengeModal()">إغلاق</button>
  </div>
</div>

<script src="questions.js"></script>
<script src="quiz-core.js" type="module"></script>
<script>
    const quizKey = 'beauty'; 
    const quizData = allQuizzesData.beauty;
    window.onload = () => { initQuiz({ title: "✨ كويز الجمال الحقيقي ✨", quizKey: quizKey, quizData: quizData, hasParts: false, partsList: {}, bgMusic: 'sounds/heartbeat.wav' }); }
</script>
<script src="room-cleaner.js"></script>
</body>
</html>
