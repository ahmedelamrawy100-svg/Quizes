<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>📊 تقرير الاختبار</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #111; color: #fff; font-family: 'Cairo', sans-serif; padding: 20px; }
        .header { text-align: center; margin-bottom: 20px; }
        .btn { background: #00ffcc; color: #000; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; }
        .console { background: #000; border: 1px solid #333; padding: 15px; border-radius: 10px; height: 600px; overflow-y: auto; font-family: monospace; }
        .log { margin-bottom: 5px; padding-bottom: 5px; border-bottom: 1px dashed #222; }
        .log-success { color: #00cc66; }
        .log-error { color: #ff3333; }
        .log-info { color: #00ffcc; }
        .log-done { color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 بوت الاختبار الشامل</h1>
        <button class="btn" onclick="startTest()">▶️ ابدأ الاختبار</button>
    </div>
    <div class="console" id="console"></div>

    <script>
        let interval;
        function startTest() {
            document.getElementById('console').innerHTML = '';
            fetch('/api/start');
            interval = setInterval(fetchLogs, 500);
        }

        async function fetchLogs() {
            const res = await fetch('/api/logs');
            const data = await res.json();
            
            const consoleDiv = document.getElementById('console');
            consoleDiv.innerHTML = '';
            
            data.logs.forEach(log => {
                const div = document.createElement('div');
                div.className = `log log-${log.type}`;
                div.innerText = `[${log.time}] ${log.msg}`;
                consoleDiv.appendChild(div);
            });
            
            if (!data.isRunning && interval) {
                clearInterval(interval);
            }
        }
    </script>
</body>
</html>
