  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Cairo',sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:20px 0; }
  
  .top-bar { width:100%; max-width:1200px; display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; background:var(--card); backdrop-filter:blur(20px); padding:15px 25px; border-radius:15px; border:1px solid var(--border); flex-wrap:wrap; gap:10px; }
  .back-btn,.lang-btn { background:rgba(0,0,0,0.5); color:#fff; border:1px solid rgba(255,255,255,0.2); padding:8px 15px; border-radius:8px; text-decoration:none; font-weight:bold; font-size:14px; cursor:pointer; font-family:'Cairo'; transition: 0.3s; }
  body.light-mode .back-btn, body.light-mode .lang-btn { background:rgba(0,0,0,0.1); color:#111; border-color:rgba(0,0,0,0.2); }
  .back-btn:hover,.lang-btn:hover { background:var(--accent); border-color:var(--accent); color:#fff; }
  .stat-pill { font-weight:900; font-size:16px; background:rgba(0,0,0,0.5); padding:8px 20px; border-radius:20px; border:1px solid var(--gold); color:var(--gold); }

  .progress-ring-wrap { width:100%; max-width:1200px; display:flex; align-items:center; gap:20px; background:var(--card); border:1px solid var(--border); border-radius:15px; padding:15px 25px; margin-bottom:20px; flex-wrap:wrap; }
  .progress-ring { width:80px; height:80px; flex-shrink:0; }
  .progress-ring circle { fill:none; stroke-width:8; }
  .progress-ring .bg { stroke:var(--border); }
  .progress-ring .fg { stroke:var(--gold); stroke-linecap:round; transition:stroke-dashoffset 0.8s ease; }
  .progress-text-info h3 { font-size:18px; margin-bottom:4px; }
  .progress-text-info p { color:var(--sub); font-size:13px; }

  .tabs-wrapper { width:100%; max-width:1200px; overflow-x:auto; scrollbar-width:none; margin-bottom:25px; padding:0 10px; }
  .tabs-wrapper::-webkit-scrollbar { display:none; }
  .tabs { display:flex; gap:10px; width:max-content; min-width:100%; }
  .tab-btn { background:var(--card); color:var(--text); border:1px solid var(--border); padding:12px 25px; border-radius:25px; cursor:pointer; font-family:'Cairo'; font-weight:900; font-size:15px; white-space:nowrap; transition:0.2s; }
  .tab-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }

  .content-area { width:100%; max-width:1200px; display:none; padding:0 15px; margin-bottom:40px; }
  .content-area.active { display:block; }

  .status-bar { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 20px; margin-bottom:15px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; font-size:14px; }
  .status-text { color:var(--sub); }
  .retry-btn { background:var(--accent); color:#fff; border:none; padding:6px 15px; border-radius:8px; font-family:'Cairo'; font-weight:900; font-size:12px; cursor:pointer; }
  
  .owner-tools { margin-right: auto; display: flex; gap: 10px; flex-wrap: wrap; }
  .owner-btn { background: linear-gradient(135deg, #9c27b0, #2196f3); color: #fff; border: none; padding: 8px 15px; border-radius: 8px; font-weight: 900; cursor: pointer; font-family: 'Cairo'; box-shadow: 0 0 15px rgba(156,39,176,0.5); transition: 0.3s; }
  .owner-btn.reset { background: linear-gradient(135deg, #d32f2f, #b71c1c); box-shadow: 0 0 15px rgba(211,47,47,0.5); }
  .owner-btn:hover { transform: scale(1.05); }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:15px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:15px 12px; text-align:center; display:flex; flex-direction:column; transition:0.2s; position:relative; min-height:190px; }
  .card:hover { transform:translateY(-4px); border-color:var(--gold); }

  .icon-wrap { width:60px; height:60px; margin:0 auto 10px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:30px; background:rgba(128,128,128,0.1); border:2px solid var(--border); transition: 0.3s; }
  .card.owned .icon-wrap { background:linear-gradient(135deg,rgba(255,215,0,0.25),rgba(76,175,80,0.15)); border-color:var(--gold); box-shadow:0 0 20px rgba(255,215,0,0.3); }
  .card.locked .icon-wrap { filter:grayscale(0.9); opacity:0.5; }
  .card.locked { opacity:0.85; }

  .card-name { font-weight:900; font-size:15px; margin-bottom:6px; }
  .card-desc { font-size:11px; color:var(--sub); margin-bottom:8px; min-height:26px; line-height:1.3; flex-grow:1; }

  .progress-bar-mini { width:100%; height:6px; background:rgba(128,128,128,0.2); border-radius:3px; margin-bottom:4px; overflow:hidden; }
  .progress-fill-mini { height:100%; background:var(--gold); border-radius:3px; transition:width 0.5s; }
  .progress-label { font-size:10px; color:var(--sub); margin-bottom:6px; }

  .count-badge { display:inline-flex; align-items:center; justify-content:center; gap:4px; background:rgba(0,188,212,0.15); border:1px solid rgba(0,188,212,0.4); color:var(--cyan); font-size:12px; font-weight:900; padding:5px 12px; border-radius:14px; margin-bottom:8px; min-width:70px; }
  .count-badge.loading { opacity:0.6; }
  .count-badge.failed { background:rgba(255,0,0,0.15); border-color:rgba(255,0,0,0.4); color:#ff6b6b; }

  .status-badge { display:inline-block; font-size:11px; font-weight:900; padding:5px 12px; border-radius:10px; width: 100%;}
  .status-badge.owned { background:var(--green); color:#fff; }
  .status-badge.locked { background:rgba(128,128,128,0.2); color:var(--sub); }

  .action-btn { width: 100%; margin-top: 10px; padding: 8px; border: none; border-radius: 8px; font-family: 'Cairo'; font-weight: 900; cursor: pointer; transition: 0.3s; font-size: 13px; text-transform: uppercase; }
  .btn-claim { background: #00bcd4; color: #fff; animation: pulseClaim 1.5s infinite; }
  .btn-claim:hover { background: #0097a7; }
  .btn-equip { background: #333; color: #fff; }
  body.light-mode .btn-equip { background: #ccc; color: #111; }
  .btn-equip:hover { background: #555; }
  .btn-equipped { background: var(--green); color: #fff; cursor: default; }

  @keyframes pulseClaim { 0% { box-shadow: 0 0 0 0 rgba(0, 188, 212, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(0, 188, 212, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 188, 212, 0); } }

  /* Toast */
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #222; color: #fff; padding: 12px 24px; border-radius: 10px; border: 2px solid var(--gold); font-weight: bold; z-index: 9999; transition: 0.3s; opacity: 0; text-align: center; }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  #toast.error { border-color: #ff0000; }
  #toast.success { border-color: var(--green); }

  @media (max-width:768px) {
    .grid { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
    .icon-wrap { width:50px; height:50px; font-size:24px; }
    .card { min-height:170px; padding:12px 10px; }
    .card-name { font-size:13px; }
  }
</style>

  function isOwned(srcObj, id) {
    if (!srcObj) return false;
    if (typeof srcObj === 'string') return srcObj === id;
    if (Array.isArray(srcObj)) {
        return srcObj.some(v => v === id || (v && typeof v === 'object' && (v.id === id || v.key === id)));
    }
    if (typeof srcObj === 'object') {
        const val = srcObj[id];
        if (val === true || val === 1 || (val && typeof val === 'object' && val.unlocked === true)) return true;
    }
    return false;
  }

  function hasAch(id) {
    return isOwned(userData.achievements, id) 
        || isOwned(userData.unlocked_achievements, id) 
        || isOwned(userData.achievements_list, id) 
        || isOwned(userData.ach, id);
  }

  function hasTitle(id) {
    return isOwned(userData.owned_titles, id) 
        || isOwned(userData.titles, id) 
        || isOwned(userData.purchased_titles, id);
  }

  window.claimAch = async function(id) {
    if (hasAch(id)) return;
    const a = ACH.find(x => x.id === id);
    if (!a) return;
    
    if (a.stat && a.target) {
        if ((userData[a.stat] || 0) < a.target) {
            showToast(lang === 'ar' ? 'أنت لم تحقق الشروط بعد!' : 'You have not met the requirements yet!', 'error');
            return;
        }
    }

    try {
        await set(ref(db, `users_data/${CU}/achievements/${id}`), true);
        if (achCounts && achCounts[id] !== undefined) achCounts[id]++;
        else if (achCounts) achCounts[id] = 1;
        localStorage.removeItem('ach_counts_v3'); localStorage.removeItem('ach_counts_v3_at');
        showToast(T[lang].achUnlocked, 'success');
    } catch(e) { showToast(T[lang].error + ": " + e.message, 'error'); }
  };

  window.claimTitle = async function(id) {
    if (hasTitle(id)) return;
    const t = TITLES.find(x => x.id === id);

  window.loadCounts = async function(force = false) {
    const now = Date.now();
    if (!force && now - lastFetchTime < 5000) return; 
    lastFetchTime = now;

    const t = T[lang];
    achCounts = null; titleCounts = null;
    document.getElementById('achStatus').innerText = t.loading;
    document.getElementById('titleStatus').innerText = t.loading;
    document.getElementById('achRetry').style.display = 'none';
    document.getElementById('titleRetry').style.display = 'none';
    
    renderAch(); renderTitles();

    const CACHE_KEY = 'ach_counts_v3';
    const CACHE_TIME = 'ach_counts_v3_at';
    if (!force) {
      const cached = localStorage.getItem(CACHE_KEY);
      const cachedAt = +localStorage.getItem(CACHE_TIME);
      if (cached && now - cachedAt < 3600_000) {
        try {
          const parsed = JSON.parse(cached);
          achCounts = parsed.ach || {}; titleCounts = parsed.title || {}; playersCount = parsed.players || 0;
          updateStatusTexts(); renderAch(); renderTitles();
          return;
        } catch(e) {}
      }
    }

    try {
      const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 12000));
      const snap = await Promise.race([get(ref(db, 'users_data')), timeout]);
      const users = snap.val() || {};
      
      const ac = {}; const tc = {};
      ACH.forEach(a => ac[a.id] = 0); TITLES.forEach(t => tc[t.id] = 0);

      const achFields = ['achievements', 'unlocked_achievements', 'achievements_list', 'ach'];
      const titleFields = ['owned_titles', 'titles', 'purchased_titles'];

      Object.values(users).forEach(u => {
        if (!u || typeof u !== 'object') return;
        
        const userAchSet = new Set();
        achFields.forEach(field => {
          const v = u[field];
          if (!v) return;
          let ids = Array.isArray(v) ? v.map(x => typeof x === 'string' ? x : (x && (x.id || x.key))) : (typeof v === 'object' ? Object.keys(v).filter(k => v[k]) : (typeof v === 'string' ? [v] : []));
          ids.forEach(id => { if (id && ac[id] !== undefined) userAchSet.add(id); });
        });
        userAchSet.forEach(id => ac[id]++);

        const userTitleSet = new Set();
        titleFields.forEach(field => {
          const v = u[field];
          if (!v) return;
          let ids = Array.isArray(v) ? v.map(x => typeof x === 'string' ? x : (x && (x.id || x.key))) : (typeof v === 'object' ? Object.keys(v).filter(k => v[k]) : (typeof v === 'string' ? [v] : []));
          ids.forEach(id => { if (id && tc[id] !== undefined) userTitleSet.add(id); });
        });
        userTitleSet.forEach(id => tc[id]++);
      });

      achCounts = ac; titleCounts = tc; playersCount = Object.keys(users).length;
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({ ach: ac, title: tc, players: playersCount }));
        localStorage.setItem(CACHE_TIME, String(now));
      } catch(e) {}
      updateStatusTexts(); renderAch(); renderTitles();
    } catch(err) {
      console.error('Counts failed:', err);
      achCounts = {}; titleCounts = {};
      document.getElementById('achStatus').innerText = T[lang].failed;
      document.getElementById('titleStatus').innerText = T[lang].failed;
      document.getElementById('achRetry').style.display = 'inline-block';
      document.getElementById('titleRetry').style.display = 'inline-block';
      renderAch(); renderTitles();
    }
  };

  function updateStatusTexts() {
    const t = T[lang];
    const playerWord = lang === 'ar' ? 'لاعب' : 'players';
    const msg = `${t.success} — ${playersCount} ${playerWord}`;
    document.getElementById('achStatus').innerText = msg;
    document.getElementById('titleStatus').innerText = msg;
  }

  function countBadge(counts, id) {
    const t = T[lang];
    if (counts === null) return `<span class="count-badge loading">⏳ ${t.players}</span>`;
    const n = counts[id];
    if (n === undefined) return `<span class="count-badge failed">— ${t.players}</span>`;
    return `<span class="count-badge">👥 ${n} ${t.players}</span>`;
  }

  function renderAch() {
    const grid = document.getElementById('achGrid');
    const t = T[lang];

    grid.innerHTML = ACH.map(a => {
      const owned = hasAch(a.id);
      const nm = lang === 'ar' ? a.name : a.nameEn;
      
      let actionHtml = '';
      if (!owned) {
         let progHtml = '';
         let canClaim = false;
         
         if (a.stat && a.target) {
             const curr = userData[a.stat] || 0;
             const pct = Math.min(100, Math.round((curr / a.target) * 100));
             progHtml = `<div class="progress-bar-mini"><div class="progress-fill-mini" style="width:${pct}%"></div></div><div class="progress-label">${curr} / ${a.target}</div>`;
             if (curr >= a.target) canClaim = true;
         } else {
             canClaim = true; 
         }

         if (canClaim) {
             actionHtml = `${progHtml}<button class="action-btn btn-claim" onclick="claimAch('${a.id}')">${t.claim}</button>`;
         } else {
             actionHtml = `${progHtml}<div class="status-badge locked" style="margin-top:10px;">${t.locked}</div>`;
         }
      } else {
         actionHtml = `<div class="status-badge owned" style="margin-top:10px;">${t.owned}</div>`;
      }

      return `
        <div class="card ${owned ? 'owned' : 'locked'}">
          <div class="icon-wrap">${a.icon}</div>
          <div class="card-name">${nm}</div>
          <div class="card-desc">${a.desc}</div>
          ${countBadge(achCounts, a.id)}
          ${actionHtml}
        </div>`;
    }).join('');
  }

  function renderTitles() {
    const grid = document.getElementById('titlesGrid');
    const t = T[lang];
    const currentEquipped = userData.currentTitle || '';

    grid.innerHTML = TITLES.map(tt => {
      const owned = hasTitle(tt.id);
      const isEquipped = currentEquipped === tt.id;
      const nm = lang === 'ar' ? tt.name : tt.nameEn;
      
      let actionHtml = '';
      if (!owned) {
         let progHtml = '';
         let canClaim = false;
         
         if (tt.stat && tt.target) {
             const curr = userData[tt.stat] || 0;
             const pct = Math.min(100, Math.round((curr / tt.target) * 100));
             progHtml = `<div class="progress-bar-mini"><div class="progress-fill-mini" style="width:${pct}%"></div></div><div class="progress-label">${curr} / ${tt.target}</div>`;
             if (curr >= tt.target) canClaim = true;
         } else {
             canClaim = true; 
         }

         if (canClaim) {
             actionHtml = `${progHtml}<button class="action-btn btn-claim" onclick="claimTitle('${tt.id}')">${t.claim}</button>`;
         } else {
             actionHtml = `${progHtml}<div class="status-badge locked" style="margin-top:10px;">${t.locked}</div>`;
         }
      } else {
          actionHtml = isEquipped 
            ? `<button class="action-btn btn-equipped">${t.equipped}</button>` 
            : `<button class="action-btn btn-equip" onclick="equipTitle('${tt.id}')">${t.equip}</button>`;
      }

      return `
        <div class="card ${owned ? 'owned' : 'locked'}" style="${isEquipped ? 'border-color: var(--green); box-shadow: 0 0 15px rgba(76,175,80,0.3);' : ''}">
          <div class="icon-wrap">${tt.icon}</div>
          <div class="card-name" style="color:var(--gold);">${nm}</div>
          <div class="card-desc">${tt.desc}</div>
          ${countBadge(titleCounts, tt.id)}
          ${actionHtml}
        </div>`;
    }).join('');
  }

  function renderInventory() {
    const grid = document.getElementById('inventoryGrid');
    if (!grid) return;
    const t = T[lang];
    const inv = userData.inventory || {};
    const ownedThemes = userData.ownedThemes || {};
    
    let html = '';
    let hasItems = false;
    
    for (const [id, count] of Object.entries(inv)) {
      if (count > 0) {
        hasItems = true;
        const item = SHOP_ITEMS.find(i => i.id === id);
        if (item) {
           html += `
             <div class="card owned">
               <div class="icon-wrap">${item.icon}</div>
               <div class="card-name">${lang === 'ar' ? item.title : item.titleEn}</div>
               <div class="count-badge" style="margin-top: 10px; background:rgba(76,175,80,0.15); border-color:rgba(76,175,80,0.4); color:#4caf50;">${t.youHave} ${count}</div>
             </div>`;
        }
      }
    }

    for (const [id, owned] of Object.entries(ownedThemes)) {
      if (owned) {
        hasItems = true;
        const theme = SHOP_THEMES.find(t => t.id === id);
        if (theme) {
           html += `
             <div class="card owned" style="padding:0; overflow:hidden;">
               <img src="${theme.bg}" style="width:100%; height:120px; object-fit:cover; filter: saturate(1.5);">
               <div style="padding: 10px;">
                   <div class="card-name">${lang === 'ar' ? theme.name : theme.nameEn}</div>
                   <div class="count-badge" style="margin-top: 5px; background:rgba(156,39,176,0.15); border-color:rgba(156,39,176,0.4); color:#9c27b0;">${t.themes}</div>
               </div>
             </div>`;
        }
      }
    }
    
    if (!hasItems) {
      grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 50px; color: var(--sub); font-size: 18px;">🎒<br><br>${t.emptyInv}</div>`;
    } else {
      grid.innerHTML = html;
    }
  }

  function updateProgressRing() {
    const total = ACH.length;
    const done = ACH.filter(a => hasAch(a.id)).length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    const circumference = 283; 
    const offset = circumference - (pct / 100) * circumference;
    const ring = document.getElementById('ringFg');
    if (ring) ring.style.strokeDashoffset = offset;
    const t = T[lang];
    document.getElementById('progressTitle').innerText = `${pct}%`;
    document.getElementById('progressSub').innerText = t.progressSub.replace('{done}', done).replace('{total}', total);
  }

  function applyLang() {
    const t = T[lang];
    document.body.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.getElementById('btnBack').innerText = t.back;
    document.getElementById('lblCoins').innerText = t.coins;
    document.getElementById('tabAch').innerText = t.tabAch;
    document.getElementById('tabTitles').innerText = t.tabTitles;
    document.getElementById('tabInventory').innerText = t.tabInv;
    document.getElementById('btnLang').innerText = lang === 'ar' ? 'EN' : 'AR';

    if (achCounts === null) {
      document.getElementById('achStatus').innerText = t.loading;
      document.getElementById('titleStatus').innerText = t.loading;
    } else if (achCounts && Object.keys(achCounts).length === 0) {
      document.getElementById('achStatus').innerText = t.failed;
      document.getElementById('achRetry').innerText = t.retry;
      document.getElementById('titleStatus').innerText = t.failed;
      document.getElementById('titleRetry').innerText = t.retry;
    } else {
      updateStatusTexts();
    }

    let toolsHtml = `<button class="owner-btn reset" onclick="resetUserData()">${t.resetAll}</button>`;
    if (isOwner) {
        document.getElementById('coinPill').style.display = 'none';
        toolsHtml = `<button class="owner-btn" onclick="claimAllOwner()">${t.claimAll}</button>` + toolsHtml;
    }
    document.getElementById('ownerTools').innerHTML = toolsHtml;

    renderAch();
    renderTitles();
    renderInventory();
    updateProgressRing();
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.content-area').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      const target = document.getElementById('tab-' + id);
      if (target) target.classList.add('active');
    });
  });

  onValue(ref(db, `users_data/${CU}`), snap => {
    userData = snap.val() || {};
    document.getElementById('topCoins').innerText = userData.coins || 0;
    renderAch();
    renderTitles();
    renderInventory();
    updateProgressRing();
  });

  applyLang();
  loadCounts();
  if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');

  // Toast Notification Logic
  let toastTimeout;
  function showToast(msg, type = 'success') {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.className = `show ${type}`;
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
      toast.classList.remove('show');
    }, 3000);
  }
</script>
<script type="module" src="notifications.js"></script>
<script type="module" src="theme-engine.js"></script>
</body>
</html>
