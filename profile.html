<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👤 الملف الشخصي - Quiz Hub</title>
<link rel="icon" type="image/png" href="pic/Logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #000; --bg-gradient: radial-gradient(circle at center, #1a1015 0%, #000 100%);
    --text-color: #fff; --subtitle-color: #aaa; --card-bg: #111; --card-border: #333; --accent: #ff0000;
  }
  body.light-mode {
    --bg-color: #f4f4f4; --bg-gradient: radial-gradient(circle at center, #ffffff 0%, #e0e0e0 100%);
    --text-color: #111; --subtitle-color: #555; --card-bg: #fff; --card-border: #ccc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background: var(--bg-gradient); background-color: var(--bg-color); color: var(--text-color); 
    font-family: 'Cairo', sans-serif; min-height: 100vh; padding: 20px; 
    display: flex; flex-direction: column; align-items: center; 
  }
  
  .back-btn { position: fixed; top: 20px; left: 20px; background: rgba(30, 30, 30, 0.9); color: #fff; border: 2px solid #555; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-family: 'Cairo', sans-serif; font-weight: bold; text-decoration: none; z-index: 999; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
  .back-btn:hover { background: var(--accent); border-color: var(--accent); }
  body.light-mode .back-btn { background: #fff; color: #111; border-color: #aaa; }

  .profile-container { width: 100%; max-width: 800px; margin-top: 50px; display: flex; flex-direction: column; gap: 30px; }

  .header-card { background: var(--card-bg); border: 2px solid var(--accent); border-radius: 15px; padding: 30px; text-align: center; }
  .avatar { width: 100px; height: 100px; background: var(--accent); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 50px; color: #fff; margin: 0 auto 15px auto; font-weight: bold; border: 4px solid #fff; }
  body.light-mode .avatar { border-color: #111; }
  .username { font-size: 32px; color: var(--accent); margin-bottom: 10px; font-weight: bold; display: flex; justify-content: center; align-items: center; gap: 10px; }
  .total-score { color: var(--text-color); font-size: 18px; background: rgba(255,0,0,0.1); padding: 10px 20px; border-radius: 20px; display: inline-block; }

  .history-section h2 { color: var(--accent); margin-bottom: 15px; font-size: 24px; }
  .history-list { background: var(--card-bg); border: 2px solid var(--card-border); border-radius: 15px; overflow: hidden; }
  .history-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--card-border); }
  .history-item:last-child { border-bottom: none; }
  .history-item .q-name { font-weight: bold; color: var(--text-color); }
  .history-item .q-score { color: var(--accent); font-weight: bold; }
  
  .no-data { text-align: center; color: var(--subtitle-color); padding: 20px; }

  .owner-badge {
      color: #ffd700; font-size: 14px; background: #333; padding: 4px 10px; border-radius: 10px;
  }
</style>
</head>
<body>

<a href="index.html" class="back-btn">⬅ رجوع / Back</a>

<div class="profile-container">
  <div class="header-card">
    <div class="avatar" id="userAvatar">A</div>
    <div class="username" id="userName">Ahmed</div>
    <div class="total-score">🏆 مجموع النقاط: <span id="totalScoreDisplay">0</span></div>
  </div>

  <div class="history-section">
    <h2>📜 سجل كويزاتك</h2>
    <div class="history-list" id="historyList">
      <div class="no-data">جاري التحميل...</div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBmyW4tZGJfcHJ4jKSD3_6hebZK58Y3jXo",
    authDomain: "quiz-hub-app-f4cd0.firebaseapp.com",
    databaseURL: "https://quiz-hub-app-f4cd0-default-rtdb.firebaseio.com",
    projectId: "quiz-hub-app-f4cd0",
    storageBucket: "quiz-hub-app-f4cd0.firebasestorage.app",
    messagingSenderId: "282772179392",
    appId: "1:282772179392:web:64646d757592b29ff3a025"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const currentUser = localStorage.getItem('loggedInUser');

  if (!currentUser) { window.location.href = 'index.html'; }

  document.getElementById('userAvatar').innerText = currentUser.charAt(0).toUpperCase();
  
  // إضافة لقب Owner
  if (currentUser.toLowerCase() === 'ahmed') {
      document.getElementById('userName').innerHTML = `${currentUser} <span class="owner-badge">👑 Owner</span>`;
  } else {
      document.getElementById('userName').innerText = currentUser;
  }

  const historyList = document.getElementById('historyList');
  const quizNames = {
    "annabelle": "أنابيل", "conjuring": "الكونجورينج", "nun": "الراهبة", "fnaf": "FNAF", "squid": "لعبة الحبار",
    "wednesday": "وينزداي", "busan": "قطار بوسان", "beauty": "الجمال الحقيقي", "family": "عيلة بالاختيار",
    "dream": "حلم إليك", "whyher": "لماذا هي", "wonderfools": "الحمقى الخارقون"
  };

  let totalScore = 0;

  onValue(ref(db, 'scores/' + currentUser), (snapshot) => {
    const data = snapshot.val();
    historyList.innerHTML = '';
    totalScore = 0;
    
    if (!data) {
      historyList.innerHTML = '<div class="no-data">لسه ما لعبتش كويزات.</div>';
    } else {
      for (let quizKey in data) {
        const attempts = data[quizKey];
        let bestScore = 0;
        let totalQuestions = 0;
        
        for (let attemptId in attempts) {
            const attempt = attempts[attemptId];
            if (attempt.score > bestScore) {
                bestScore = attempt.score;
                totalQuestions = attempt.total;
            }
        }
        
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `<span class="q-name">${quizNames[quizKey] || quizKey}</span> <span class="q-score">${bestScore} / ${totalQuestions}</span>`;
        historyList.appendChild(div);
        
        totalScore += bestScore;
      }
    }
    document.getElementById('totalScoreDisplay').innerText = totalScore;
  });
</script>
</body>
</html>
