<style>

  async function loadProfileData() {
      const dbUser = profileUser.toLowerCase();
      
      const friendsPromise = loadFriendsData(dbUser).catch(e => console.warn('friends load:', e));
      
      try {
          const results = await Promise.allSettled([
              window.get(window.ref(window.db, 'users_data/' + dbUser)),
              window.get(window.ref(window.db, 'scores/' + dbUser)),
              window.get(window.ref(window.db, 'roles/admins')),
              window.get(window.ref(window.db, 'roles/users')),
              window.get(window.ref(window.db, 'badges/' + dbUser)),
              window.get(window.ref(window.db, 'warnings/' + dbUser)),
              window.get(window.ref(window.db, 'users_data/' + dbUser + '/history'))
          ]);
          
          const getUser = (i) => results[i].status === 'fulfilled' ? results[i].value : null;
          
          // ============ 1. البيانات الأساسية ============
          const userSnap = getUser(0);
          const userData = (userSnap && userSnap.val()) || {};
          currentUserData = userData;
          
          const avatarEl = document.getElementById('userAvatar');
          if (userData.profilePic && userData.profilePic.startsWith('http')) {
              avatarEl.innerHTML = `<img src="${userData.profilePic}">`;
              if (profileUser.toLowerCase() === loggedInUser.toLowerCase()) document.getElementById('removeImgBtn').style.display = 'block';
          } else {
              avatarEl.innerHTML = profileUser.charAt(0).toUpperCase();
              if (profileUser.toLowerCase() === loggedInUser.toLowerCase()) document.getElementById('removeImgBtn').style.display = 'none';
          }
          
          if (userData.profileFrame === 'fire') { avatarEl.classList.add('fire-frame'); }
          
          if (userData.persona) {
              const badge = document.getElementById('personaBadge');
              badge.innerText = userData.persona;
              badge.style.display = 'inline-block';
          }
          
          let xp = userData.xp || 0;
          document.getElementById('xpDisplay').innerText = xp;
          
          let coins = userData.coins || 0;
          document.getElementById('coinsDisplay').innerText = coins;
          
          // ✅ نظام XP الجديد (1000 لفل، كل لفل 500 XP، الإجمالي 500,000 XP)
          let xpPerLevel = 500;
          let maxLevel = 1000;
          
          let level = Math.floor(xp / xpPerLevel) + 1;
          if (level > maxLevel) level = maxLevel;
          
          document.getElementById('levelDisplay').innerText = level;
          
          // ✅ هنا التعديل: بيظهر المستوى الحالي من 1000 زي ما طلبت
          document.getElementById('xpProgressText').innerText = `${level} / ${maxLevel}`;
          document.getElementById('xpProgressBar').style.width = `${(level / maxLevel) * 100}%`;
          
          let streak = userData.streak || 0;
          document.getElementById('bestStreakDisplay').innerText = streak;
          
          // ============ 2. النقاط ============
          const scoresSnap = getUser(1);
          const scoresData = scoresSnap ? scoresSnap.val() : null;
          
          let totalPoints = 0, totalCorrect = 0, totalQuestions = 0, completedCount = 0;
          if (scoresData) {
              for (let quizKey in scoresData) {
                  const attempts = scoresData[quizKey];
                  let bestScoreForQuiz = 0, bestTotalForQuiz = 0;
                  for (let attemptId in attempts) {
                      const attempt = attempts[attemptId];
                      if (attempt && attempt.score !== undefined) {
                          if (attempt.score > bestScoreForQuiz) { bestScoreForQuiz = attempt.score; bestTotalForQuiz = attempt.total || 0; }
                      }
                  }
                  totalPoints += bestScoreForQuiz;
                  totalCorrect += bestScoreForQuiz;
                  totalQuestions += bestTotalForQuiz;
                  if (bestScoreForQuiz > 0) completedCount++;
              }
          }
          document.getElementById('totalScoreDisplay').innerText = totalPoints;
          document.getElementById('completedDisplay').innerText = completedCount;
          if (totalQuestions > 0) {
              let accuracy = Math.round((totalCorrect / totalQuestions) * 100);
              document.getElementById('accuracyDisplay').innerText = accuracy + '%';
          } else { document.getElementById('accuracyDisplay').innerText = '0%'; }
          
          // ============ 3. الرتب ============
          const adminsSnap = getUser(2);
          const ranksSnap = getUser(3);
          const admins = (adminsSnap && adminsSnap.val()) || {};
          const ranks = (ranksSnap && ranksSnap.val()) || {};
          const isOwner = dbUser === 'ahmed';
          let isAdmin = false;
          for (let adminName in admins) { if (adminName.toLowerCase() === dbUser) { isAdmin = true; break; } }
          
          let rankText = translations[currentLang].rankPlayer;
          for (let user in ranks) { if (user.toLowerCase() === dbUser) { rankText = ranks[user]; break; } }
          if (isOwner) rankText = translations[currentLang].rankOwner;
          else if (isAdmin && (rankText.includes('لاعب') || rankText.includes('Player'))) rankText = translations[currentLang].rankAdmin;
          
          document.getElementById('rankBox').style.display = 'inline-flex';
          document.getElementById('userRankValue').innerText = rankText;
          
          // ============ 4. الشارات ============
          const badgesSnap = getUser(4);
          const badgesData = badgesSnap ? badgesSnap.val() : null;
          const badgesContainer = document.getElementById('badgesContainer');
          const badgesSection = document.getElementById('badgesSection');
          badgesContainer.innerHTML = '';
          if (badgesData && Object.keys(badgesData).length > 0) {
              badgesSection.style.display = 'block';
              Object.keys(badgesData).forEach(badge => {
                  const span = document.createElement('span'); span.className = 'badge-item'; span.innerText = badge; badgesContainer.appendChild(span);
              });
          } else { badgesSection.style.display = 'none'; }
          
          // ============ 5. التحذير ============
          const warningSnap = getUser(5);
          if (warningSnap && warningSnap.exists()) {
              const w = warningSnap.val();
              if (w && w.text) {
                  document.getElementById('warningBox').style.display = 'block';
                  document.getElementById('warningText').innerText = translations[currentLang].warnPrefix + w.text;
              }
          } else { 
              document.getElementById('warningBox').style.display = 'none'; 
          }
          
          // ============ 6. الأرشيف ============
          const historySnap = getUser(6);
          if (historySnap && historySnap.exists()) {
              currentTimelineEvents = historySnap.val();
              renderTimeline(currentTimelineEvents);
          } else {
              currentTimelineEvents = null;
              document.getElementById('timelineList').innerHTML = `<div class="no-data">${translations[currentLang].noEvents}</div>`;
          }
          
          // ============ 7. صندوق اليوم + المخزون ============
          if (profileUser.toLowerCase() === loggedInUser.toLowerCase()) {
              document.getElementById('lootBoxContainer').style.display = 'block';
              checkLootBoxTimer(userData);
              currentInventory = userData.inventory || {};
              document.getElementById('inventorySection').style.display = 'block';
              renderInventoryTabs();
              renderInventory(currentInventory);
          }
          
          await friendsPromise;
          
      } catch (error) { 
          console.error("حدث خطأ أثناء تحميل البيانات:", error);
      }
  }

  function renderTimeline(events) {
      const historyList = document.getElementById('timelineList');
      historyList.innerHTML = '';
      
      if (!events || Object.keys(events).length === 0) {
          historyList.innerHTML = `<div class="no-data">${translations[currentLang].noEvents}</div>`;
          return;
      }

      const sortedEvents = Object.values(events).sort((a, b) => b.time - a.time);
      sortedEvents.forEach(event => {
          const date = new Date(event.time).toLocaleDateString(currentLang === 'en' ? 'en-US' : 'ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
          
          let tTitle = event.title || '';
          let tDesc = event.description || '';
          
          if (currentLang === 'en') {
              if (tTitle.includes('أنهى كويز: ')) tTitle = tTitle.replace('أنهى كويز: ', 'Finished Quiz: ');
              if (tDesc.includes('بنتيجة ')) tDesc = tDesc.replace('بنتيجة ', 'Score: ').replace(' من ', ' / ');
          } else {
              if (tTitle.includes('Finished Quiz: ')) tTitle = tTitle.replace('Finished Quiz: ', 'أنهى كويز: ');
              if (tDesc.includes('Score: ')) tDesc = tDesc.replace('Score: ', 'بنتيجة ').replace(' / ', ' من ');
          }

          const wrapper = document.createElement('div');
          wrapper.className = 'timeline-item-wrapper';
          wrapper.innerHTML = `
              <div class="timeline-dot"></div>
              <div class="timeline-content">
                  <div class="timeline-date">${date}</div>
                  <div class="timeline-title">${tTitle}</div>
                  <div class="timeline-desc">${tDesc}</div>
              </div>
          `;
          historyList.appendChild(wrapper);
      });
  }

  async function loadFriendsData(dbUser) {
      const friendsListEl = document.getElementById('friendsList');
      try {
          let friendsSnap = await window.get(window.ref(window.db, 'friends/' + dbUser));
          let myFriends = friendsSnap.exists() ? friendsSnap.val() : null;
          
          if (!myFriends) {
              const allSnap = await window.get(window.ref(window.db, 'friends'));
              if (allSnap.exists()) {
                  const allFriendsData = allSnap.val();
                  for (let key in allFriendsData) {
                      if (key.toLowerCase() === dbUser) { myFriends = allFriendsData[key]; break; }
                  }
              }
          }
          
          if (!myFriends || Object.keys(myFriends).length === 0) {
              friendsListEl.innerHTML = `<div class="no-data">${translations[currentLang].noFriends}</div>`;
              return;
          }
          
          friendsListEl.innerHTML = `<div class="no-data">${translations[currentLang].loading}</div>`;
          
          const friendNames = Object.keys(myFriends);
          const friendData = await Promise.all(
              friendNames.map(async (name) => {
                  try {
                      const picSnap = await window.get(window.ref(window.db, `users_data/${name.toLowerCase()}/profilePic`));
                      return { name, pic: picSnap.exists() ? picSnap.val() : null };
                  } catch { return { name, pic: null }; }
              })
          );
          
          friendsListEl.innerHTML = '';
          friendData.forEach(({ name, pic }) => {
              let avatarHTML = name.charAt(0).toUpperCase();
              if (pic && pic.startsWith('http')) avatarHTML = `<img src="${pic}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;
              
              const card = document.createElement('div');
              card.className = 'friend-card';
              card.innerHTML = `
                  <div class="friend-info">
                      <div class="friend-avatar">${avatarHTML}</div>
                      <div class="friend-name">${name}</div>
                  </div>
                  <div>
                      <a href="profile.html?user=${name}" class="action-btn">${translations[currentLang].visitProfile}</a>
                  </div>
              `;
              friendsListEl.appendChild(card);
          });
      } catch (error) { 
          friendsListEl.innerHTML = `<div class="no-data" style="color:var(--accent);">${translations[currentLang].errorOccurred}</div>`; 
      }
  }

  function renderInventoryTabs() {

      if (!tabsEl) return;
      tabsEl.innerHTML = invTabsData.map(t => 
          `<button class="inv-tab ${currentInvTab === t.id ? 'active' : ''}" onclick="changeInvTab('${t.id}')">${currentLang === 'en' ? t.nameEn : t.name}</button>`
      ).join('');
  }

  window.changeInvTab = function(tabId) {
      currentInvTab = tabId;
      renderInventoryTabs();
      renderInventory(currentInventory);
  };

  function renderInventory(inventory) {
      const grid = document.getElementById('inventoryGrid');
      const totalEl = document.getElementById('invTotalCount');
      if (!grid) return;
      
      let total = 0;
      for (const k in inventory) { total += inventory[k] || 0; }
      if (totalEl) totalEl.innerText = `(${total} ${translations[currentLang].invTotal.replace(':', '')})`;
      
      const itemKeys = Object.keys(inventory).filter(k => (inventory[k] || 0) > 0 && inventoryItemsMeta[k]);
      
      if (itemKeys.length === 0) {
          grid.innerHTML = `<div class="inv-empty" style="grid-column: 1 / -1;">${translations[currentLang].invEmpty}</div>`;
          return;
      }
      
      const filtered = currentInvTab === 'all' ? itemKeys : itemKeys.filter(k => inventoryItemsMeta[k].cat === currentInvTab);
      
      if (filtered.length === 0) {
          grid.innerHTML = `<div class="inv-empty" style="grid-column: 1 / -1;">${currentLang === 'en' ? 'No items in this category.' : 'مفيش أدوات في التصنيف ده.'}</div>`;
          return;
      }
      
      grid.innerHTML = '';
      filtered.forEach(itemId => {
          const meta = inventoryItemsMeta[itemId];
          const count = inventory[itemId];
          const displayName = currentLang === 'en' ? meta.nameEn : meta.name;
          
          let btnHtml = '';
          if (meta.action === 'open') {
              btnHtml = `<button class="inv-btn unpack" onclick="useInventoryItem('${itemId}')">🎁 ${translations[currentLang].open}</button>`;
          } else if (meta.action === 'unpack') {
              btnHtml = `<button class="inv-btn unpack" onclick="useInventoryItem('${itemId}')">📦 ${translations[currentLang].unpack}</button>`;
          } else if (meta.action === 'use') {
              btnHtml = `<button class="inv-btn profile-use" onclick="useInventoryItem('${itemId}')">${translations[currentLang].use} ✓</button>`;
          } else if (meta.cat === 'quiz') {
              btnHtml = `<button class="inv-btn quiz-note" disabled>🎮 ${translations[currentLang].quizUse}</button>`;
          }
          
          const card = document.createElement('div');
          card.className = 'inv-item';
          card.innerHTML = `
              <div class="inv-count">${count}</div>
              <div class="inv-icon">${meta.icon}</div>
              <div class="inv-name">${displayName}</div>
              ${btnHtml}
          `;
          grid.appendChild(card);
      });
  }

  async function refreshInventory() {
      const invSnap = await window.get(window.ref(window.db, 'users_data/' + profileUser.toLowerCase() + '/inventory'));
      currentInventory = invSnap.exists() ? invSnap.val() : {};
      renderInventory(currentInventory);
  }

  window.useInventoryItem = async function(itemId) {
      const meta = inventoryItemsMeta[itemId];
      if (!meta) return;
      if ((currentInventory[itemId] || 0) <= 0) {
          showAlert('⚠️', currentLang === 'en' ? 'You don\'t have this item!' : 'مفيش عندك من الأداة دي!');
          return;
      }
      
      try {
          switch (itemId) {
              case 'box_bronze':
              case 'box_silver':
              case 'box_gold':
              case 'box_diamond':
              case 'box_legendary':
                  await openShopBox(itemId);
                  break;
              case 'starter_bundle':
              case 'survival_kit':
              case 'speed_demon':
              case 'ultimate_pack':
                  await unpackBundle(itemId);
                  break;
              case 'fix_streak':
                  await useFixStreak();
                  break;
              case 'team_boost':
                  await useTeamBoost();
                  break;
              case 'shield':
                  await useShield();
                  break;
              default:
                  showAlert('⚠️', currentLang === 'en' ? 'This item is used inside quizzes.' : 'الأداة دي بتتستخدم جوه الكويزات.');
          }
      } catch (e) {
          console.error(e);
          showAlert('❌', translations[currentLang].errorOccurred);
      }
  };

  async function consumeItem(itemId) {
      const user = profileUser.toLowerCase();
      const currentCount = currentInventory[itemId] || 0;
      if (currentCount <= 0) return false;
      const newCount = currentCount - 1;
      const updates = {};
      updates[`users_data/${user}/inventory/${itemId}`] = newCount > 0 ? newCount : null;
      await window.update(window.ref(window.db), updates);
      currentInventory[itemId] = newCount > 0 ? newCount : 0;
      if (newCount <= 0) delete currentInventory[itemId];
      renderInventory(currentInventory);
      return true;
  }

  async function openShopBox(boxId) {
      const user = profileUser.toLowerCase();
      const boxConfig = {
          box_bronze:    { coins: [30, 100],    xp: [50, 150],    weights: { coins: 60, xp: 40 } },
          box_silver:    { coins: [100, 300],   xp: [150, 400],   weights: { coins: 40, xp: 40, item: 20 } },
          box_gold:      { coins: [300, 800],   xp: [400, 800],   weights: { coins: 35, xp: 35, item: 15, frame: 15 } },
          box_diamond:   { coins: [800, 2000],  xp: [1000, 2000], weights: { coins: 30, xp: 30, item: 20, frame: 20 } },
          box_legendary: { coins: [2000, 5000], xp: [3000, 5000], weights: { coins: 25, xp: 25, item: 25, frame: 25 } }
      };
      const cfg = boxConfig[boxId];
      if (!cfg) return;
      
      const consumed = await consumeItem(boxId);
      if (!consumed) return;
      
      const rand = Math.random() * 100;
      let cumulative = 0;
      let type = 'coins';
      for (const [k, w] of Object.entries(cfg.weights)) {
          cumulative += w;
          if (rand < cumulative) { type = k; break; }
      }
      
      const updates = {};
      let rewardText = '';
      
      if (type === 'coins') {
          const amount = Math.floor(Math.random() * (cfg.coins[1] - cfg.coins[0] + 1)) + cfg.coins[0];
          const cSnap = await window.get(window.ref(window.db, `users_data/${user}/coins`));
          const current = cSnap.exists() ? cSnap.val() : 0;
          updates[`users_data/${user}/coins`] = current + amount;
          rewardText = `🪙 ${amount} ${currentLang === 'en' ? 'Coins' : 'كوينز'}`;
      } else if (type === 'xp') {
          const amount = Math.floor(Math.random() * (cfg.xp[1] - cfg.xp[0] + 1)) + cfg.xp[0];
          const xpSnap = await window.get(window.ref(window.db, `users_data/${user}/xp`));
          const current = xpSnap.exists() ? xpSnap.val() : 0;
          updates[`users_data/${user}/xp`] = current + amount;
          rewardText = `✨ ${amount} XP`;
      } else if (type === 'item') {
          const quizItems = ['fifty','skip','hint_half','reveal','second_chance','freeze10','freeze20','add10','add30','stop_timer','double_xp','double_coins','double_lb'];
          const randomItem = quizItems[Math.floor(Math.random() * quizItems.length)];
          const meta = inventoryItemsMeta[randomItem];
          const cSnap = await window.get(window.ref(window.db, `users_data/${user}/inventory/${randomItem}`));
          const current = cSnap.exists() ? cSnap.val() : 0;
          updates[`users_data/${user}/inventory/${randomItem}`] = current + 1;
          rewardText = `${meta.icon} ${currentLang === 'en' ? meta.nameEn : meta.name} x1`;
      } else if (type === 'frame') {
          const frameSnap = await window.get(window.ref(window.db, `users_data/${user}/profileFrame`));
          const currentFrame = frameSnap.exists() ? frameSnap.val() : null;
          if (currentFrame === 'fire') {
              const amount = Math.floor(Math.random() * (cfg.coins[1] - cfg.coins[0] + 1)) + cfg.coins[0];
              const cSnap = await window.get(window.ref(window.db, `users_data/${user}/coins`));
              const current = cSnap.exists() ? cSnap.val() : 0;
              updates[`users_data/${user}/coins`] = current + amount;
              rewardText = `🪙 ${amount} ${currentLang === 'en' ? 'Coins (frame already owned)' : 'كوينز (الإطار موجود عندك)'}`;
          } else {
              updates[`users_data/${user}/profileFrame`] = 'fire';
              rewardText = `🔥 ${currentLang === 'en' ? 'Legendary Fire Frame!' : 'إطار ناري أسطوري!'}`;
          }
      }
      
      await window.update(window.ref(window.db), updates);
      confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });
      
      showAlert(
          currentLang === 'en' ? '🎉 Box Opened!' : '🎉 مبروك!',
          `${translations[currentLang].boxOpened}\n\n${rewardText}`
      );
      
      await refreshInventory();
  }

  async function unpackBundle(bundleId) {
      const user = profileUser.toLowerCase();
      const contents = bundleContents[bundleId];
      if (!contents) return;
      
      const consumed = await consumeItem(bundleId);
      if (!consumed) return;
      
      const updates = {};
      let parts = [];
      for (const [itemId, qty] of Object.entries(contents)) {
          const cSnap = await window.get(window.ref(window.db, `users_data/${user}/inventory/${itemId}`));
          const current = cSnap.exists() ? cSnap.val() : 0;
          updates[`users_data/${user}/inventory/${itemId}`] = current + qty;
          const meta = inventoryItemsMeta[itemId];
          parts.push(`${meta.icon} ${currentLang === 'en' ? meta.nameEn : meta.name} x${qty}`);
      }
      
      await window.update(window.ref(window.db), updates);
      confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
      
      showAlert(translations[currentLang].bundleUnpacked, parts.join('\n'));
      
      await refreshInventory();
  }

  async function useFixStreak() {
      const user = profileUser.toLowerCase();
      const streakSnap = await window.get(window.ref(window.db, `users_data/${user}/streak`));
      const currentStreak = streakSnap.exists() ? streakSnap.val() : 0;
      
      if (currentStreak > 0) {
          showAlert('⚠️', translations[currentLang].streakHealthy);
          return;
      }
      
      const consumed = await consumeItem('fix_streak');
      if (!consumed) return;
      
      const restored = Math.max(1, Math.floor(Math.random() * 3) + 1);
      await window.set(window.ref(window.db, `users_data/${user}/streak`), restored);
      document.getElementById('bestStreakDisplay').innerText = restored;
      
      confetti({ particleCount: 60, spread: 60, origin: { y: 0.6 } });
      showAlert('🔥', `${translations[currentLang].streakFixed} (${restored} ${currentLang === 'en' ? 'days' : 'أيام'})`);
  }

  async function useTeamBoost() {
      const user = profileUser.toLowerCase();
      const teamSnap = await window.get(window.ref(window.db, `users_data/${user}/team`));
      if (!teamSnap.exists()) {
          showAlert('⚠️', translations[currentLang].noTeam);
          return;
      }
      
      const consumed = await consumeItem('team_boost');
      if (!consumed) return;
      
      const teamId = teamSnap.val();
      const teamScoreSnap = await window.get(window.ref(window.db, `teams/${teamId}`));
      const currentScore = teamScoreSnap.exists() ? teamScoreSnap.val() : 0;
      await window.set(window.ref(window.db, `teams/${teamId}`), currentScore + 1000);
      
      confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
      showAlert('⚔️', translations[currentLang].teamBoosted);
  }

  async function useShield() {
      const user = profileUser.toLowerCase();
      const today = new Date().toDateString();
      const lastPlaySnap = await window.get(window.ref(window.db, `users_data/${user}/lastPlay`));
      const lastPlay = lastPlaySnap.exists() ? lastPlaySnap.val() : null;
      
      if (lastPlay === today) {
          showAlert('🛡️', translations[currentLang].shieldAlready);
          return;
      }
      
      const consumed = await consumeItem('shield');
      if (!consumed) return;
      
      await window.set(window.ref(window.db, `users_data/${user}/lastPlay`), today);
      
      confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
      showAlert('🛡️', translations[currentLang].shieldUsed);
  }

  let selectedFile = null;
  window.previewImage = function(event) {
    selectedFile = event.target.files[0];
    if (selectedFile) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const avatarEl = document.getElementById('userAvatar');
        avatarEl.innerHTML = `<img src="${e.target.result}">`;
        document.getElementById('saveImgBtn').style.display = 'block';
        document.getElementById('removeImgBtn').style.display = 'block';
      }
      reader.readAsDataURL(selectedFile);
    }
  }

  window.uploadProfilePic = async function() {
    if (!selectedFile || profileUser.toLowerCase() !== loggedInUser.toLowerCase()) return;
    const btn = document.getElementById('saveImgBtn');
    const t = translations[currentLang];
    btn.innerText = '...'; btn.disabled = true;
    const formData = new FormData();
    formData.append('image', selectedFile);
    try {
      const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
      const data = await response.json();
      if (data.success) {
          await window.set(window.ref(window.db, 'users_data/' + profileUser.toLowerCase() + '/profilePic'), data.data.url);
          showAlert(t.successTitle, t.uploadedImg);
          btn.style.display = 'none';
      } else { showAlert(t.errTitle, t.errorImg); }
    } catch (error) { showAlert(t.errTitle, error.message); }
    btn.innerText = t.saveImg; btn.disabled = false;
  }

  window.removeProfilePic = async function() {
    if (profileUser.toLowerCase() !== loggedInUser.toLowerCase()) return;
    const t = translations[currentLang];
    if (confirm(t.confirmRemove)) {
      try {
        await window.set(window.ref(window.db, 'users_data/' + profileUser.toLowerCase() + '/profilePic'), null);
        const avatarEl = document.getElementById('userAvatar');
        avatarEl.innerHTML = loggedInUser.charAt(0).toUpperCase();
        document.getElementById('saveImgBtn').style.display = 'none';
        document.getElementById('removeImgBtn').style.display = 'none';
        showAlert(t.successTitle, t.removedImg);
      } catch(e) { showAlert(t.errTitle, e.message); }
    }
  }

  function checkLootBoxTimer(userData) {
      const t = translations[currentLang];
      const lastBox = userData.lastLootBox || 0;
      const now = Date.now();
      const cooldown = 24 * 60 * 60 * 1000;
      const timeLeft = (lastBox + cooldown) - now;
      const btn = document.getElementById('openBoxBtn');
      const timerText = document.getElementById('lootBoxTimer');

      if (timeLeft > 0) {
          btn.disabled = true; 
          btn.style.background = '#333'; 
          btn.style.boxShadow = 'none'; 
          btn.style.cursor = 'not-allowed'; 
          btn.innerText = t.lootBoxLocked;
          
          timerText.style.display = 'block';
          
          if (window.lootBoxInterval) clearInterval(window.lootBoxInterval);
          
          window.lootBoxInterval = setInterval(() => {
              const newTimeLeft = (lastBox + cooldown) - Date.now();
              if (newTimeLeft <= 0) {
                  btn.disabled = false; 
                  btn.style.background = 'linear-gradient(45deg, #ff9800, #ff5722)'; 
                  btn.style.boxShadow = '0 0 20px rgba(255, 87, 34, 0.5)'; 
                  btn.style.cursor = 'pointer'; 
                  btn.innerText = translations[currentLang].lootBoxBtn; 
                  timerText.style.display = 'none'; 
                  clearInterval(window.lootBoxInterval);
                  return;
              }
              const hours = Math.floor(newTimeLeft / (1000 * 60 * 60));
              const minutes = Math.floor((newTimeLeft % (1000 * 60 * 60)) / (1000 * 60));
              const seconds = Math.floor((newTimeLeft % (1000 * 60)) / 1000);
              timerText.innerText = `${translations[currentLang].lootBoxTimerPrefix}${hours}${translations[currentLang].h} ${minutes}${translations[currentLang].m} ${seconds}${translations[currentLang].s}`;
          }, 1000);
      } else {
          btn.disabled = false; 
          btn.innerText = t.lootBoxBtn;
          btn.style.background = 'linear-gradient(45deg, #ff9800, #ff5722)'; 
          btn.style.boxShadow = '0 0 20px rgba(255, 87, 34, 0.5)'; 
          btn.style.cursor = 'pointer';
          timerText.style.display = 'none';
      }
  }

  window.openLootBox = async function() {
      const t = translations[currentLang];
      const btn = document.getElementById('openBoxBtn');
      const user = profileUser.toLowerCase();
      
      btn.innerText = t.lootBoxOpening; 
      btn.disabled = true;
      
      try {
          const rewards = [ 
              { type: 'coins', amount: 50, text: t.rewardCoins50 }, 
              { type: 'coins', amount: 100, text: t.rewardCoins100 }, 
              { type: 'xp', amount: 100, text: t.rewardXp100 }, 
              { type: 'xp', amount: 200, text: t.rewardXp200 }, 
              { type: 'frame', text: t.rewardFrame } 
          ];
          
          let randomReward = rewards[Math.floor(Math.random() * 4)]; 
          if (Math.random() > 0.7) randomReward = rewards[4]; 

          const updates = {}; 
          updates[`users_data/${user}/lastLootBox`] = Date.now();

          if (randomReward.type === 'coins') {
              const coinSnap = await window.get(window.ref(window.db, `users_data/${user}/coins`));
              updates[`users_data/${user}/coins`] = (coinSnap.exists() ? coinSnap.val() : 0) + randomReward.amount;
          } else if (randomReward.type === 'xp') {
              const xpSnap = await window.get(window.ref(window.db, `users_data/${user}/xp`));
              updates[`users_data/${user}/xp`] = (xpSnap.exists() ? xpSnap.val() : 0) + randomReward.amount;
          } else if (randomReward.type === 'frame') {
              updates[`users_data/${user}/profileFrame`] = 'fire'; 
          }

          await window.update(window.ref(window.db), updates);
          confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 } });
          
          showAlert(t.lootBoxCongrats, `${t.lootBoxResult}${randomReward.text}`);
          
          const userSnap = await window.get(window.ref(window.db, 'users_data/' + user));
          const newData = userSnap.val() || {};
          checkLootBoxTimer(newData);
          document.getElementById('coinsDisplay').innerText = newData.coins || 0;
          document.getElementById('xpDisplay').innerText = newData.xp || 0;

      } catch(e) {
          showAlert(t.errTitle, t.lootBoxError);
          btn.innerText = t.lootBoxBtn; 
          btn.disabled = false;
      }
  }

  if (localStorage.getItem('theme') === 'light') { document.body.classList.add('light-mode'); }
</script>
<script src="notifications.js" type="module"></script>
