<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👤 الملف الشخصي - Quiz Hub</title>
<link rel="icon" type="image/png" href="pic/Logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { 
      --bg-color: #080808; --text-color: #fff; --subtitle-color: #aaa; --card-bg: #111; --card-border: #333; 
      --accent: #ff0000; --gold: #ffd700; --green: #4caf50; --blue: #0088cc; --purple: #9c27b0; --orange: #ff9800;
  }
  body.light-mode { 
      --bg-color: #f4f4f4; --text-color: #111; --subtitle-color: #555; --card-bg: #fff; --card-border: #ccc; 
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Cairo', sans-serif; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
  
  .custom-alert-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 99999; display: none; justify-content: center; align-items: center; }
  .custom-alert-box { background: var(--card-bg); border: 2px solid var(--accent); border-radius: 15px; padding: 30px; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 0 30px rgba(255,0,0,0.3); font-family: 'Cairo'; }
  .custom-alert-box h2 { color: var(--accent); margin-bottom: 15px; }
  .custom-alert-box p { margin-bottom: 20px; font-size: 16px; }
  .custom-alert-btn { background: var(--accent); color: #fff; border: none; padding: 10px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: 'Cairo'; font-size: 16px; }
  .custom-alert-btn:hover { background: #cc0000; }

  .top-controls { position: fixed; top: 20px; left: 20px; display: flex; gap: 10px; z-index: 999; }
  .back-btn { background: #222; color: #fff; border: 2px solid #555; padding: 8px 15px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; }
  .lang-btn { background: #333; color: #fff; border: 2px solid #555; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: 'Cairo'; font-size: 14px; }
  
  .profile-container { width: 100%; max-width: 800px; margin-top: 50px; display: flex; flex-direction: column; gap: 30px; }
  .header-card { background: var(--card-bg); border: 2px solid var(--accent); border-radius: 15px; padding: 30px; text-align: center; display: flex; flex-direction: column; align-items: center; position: relative; box-shadow: 0 10px 30px rgba(255,0,0,0.1); }
  .avatar { width: 130px; height: 130px; background: var(--accent); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 60px; color: #fff; margin-bottom: 15px; font-weight: bold; border: 4px solid #fff; background-size: cover; background-position: center; transition: 0.3s; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  body.light-mode .avatar { border-color: #111; }
  .username { font-size: 32px; color: var(--accent); margin-bottom: 10px; font-weight: 900; }
  .rank-box { background: linear-gradient(135deg, #1a1a1a, #000); border: 2px solid var(--gold); padding: 10px 30px; border-radius: 30px; display: inline-flex; align-items: center; gap: 10px; margin-bottom: 20px; box-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }
  body.light-mode .rank-box { background: #fff; }
  .rank-label { font-size: 14px; color: var(--subtitle-color); margin-left: 5px; }
  .rank-value { font-size: 20px; font-weight: bold; color: var(--gold); }
  .stats-row { display: flex; gap: 15px; justify-content: center; margin-bottom: 15px; flex-wrap: wrap;}
  .stat-badge { font-size: 16px; padding: 10px 20px; border-radius: 20px; display: flex; align-items: center; gap: 8px; font-weight: bold; border: 1px solid; }
  .score-badge { color: var(--gold); background: rgba(255, 215, 0, 0.1); border-color: var(--gold); }
  .xp-badge { color: var(--green); background: rgba(76, 175, 80, 0.1); border-color: var(--green); }
  .level-badge { color: var(--purple); background: rgba(156, 39, 176, 0.1); border-color: var(--purple); }
  .progress-container { width: 100%; max-width: 400px; margin: 10px auto; }
  .progress-bar-bg { width: 100%; height: 15px; background: #333; border-radius: 10px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--green), #00ff00); width: 0%; transition: width 0.5s; }
  .advanced-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; margin-top: 20px; }
  .adv-stat-box { background: var(--bg-color); border: 1px solid var(--card-border); padding: 15px; border-radius: 12px; text-align: center; transition: 0.3s; }
  .adv-stat-box:hover { transform: translateY(-5px); border-color: var(--accent); }
  .adv-stat-title { font-size: 13px; color: var(--subtitle-color); margin-bottom: 8px; font-weight: bold; }
  .adv-stat-value { font-size: 24px; font-weight: 900; color: var(--text-color); }
  .adv-stat-value.accuracy { color: var(--blue); }
  .adv-stat-value.streak { color: var(--orange); }
  .adv-stat-value.completed { color: var(--green); }
  .badges-section { width: 100%; margin-top: 15px; }
  .badges-title { font-size: 14px; color: var(--subtitle-color); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
  .badges-container { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .badge-item { background: rgba(255,0,0,0.1); border: 1px solid var(--accent); color: var(--accent); padding: 6px 15px; border-radius: 20px; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 5px; }
  #warningBox { display: none; background: rgba(255,0,0,0.1); border: 2px solid var(--accent); color: var(--accent); padding: 15px; border-radius: 10px; width: 100%; margin-top: 15px; text-align: center; font-weight: bold; }
  .upload-section { display: flex; gap: 10px; align-items: center; justify-content: center; background: var(--bg-color); padding: 10px; border-radius: 10px; border: 1px dashed var(--card-border); margin-top: 15px; flex-wrap: wrap; }
  .upload-section input[type="file"] { display: none; }
  .upload-label { background: #333; color: #fff; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 14px; }
  .upload-label:hover { background: var(--accent); }
  .upload-btn { background: #4caf50; color: #fff; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: 'Cairo'; font-size: 14px; display: none;}
  .upload-btn:hover { background: #388e3c; }
  .section-title { color: var(--accent); margin-bottom: 15px; font-size: 22px; border-bottom: 2px solid var(--card-border); padding-bottom: 10px; }
  .friends-container { display: flex; flex-direction: column; gap: 10px; }
  
  /* تحسين شكل صورة الصديق */
  .friend-card { background: var(--card-bg); border: 2px solid var(--card-border); border-radius: 10px; padding: 15px; display: flex; align-items: center; justify-content: space-between; }
  .friend-info { display: flex; align-items: center; gap: 15px; }
  .friend-avatar { width: 45px; height: 45px; background: var(--gold); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; color: #000; font-weight: bold; overflow: hidden; }
  .friend-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .friend-name { font-weight: bold; font-size: 16px; }
  .action-btn { padding: 6px 15px; border-radius: 8px; text-decoration: none; color: #fff; font-weight: bold; background: #0088cc; font-size: 13px; }
  .no-data { text-align: center; color: var(--subtitle-color); padding: 20px; background: var(--card-bg); border-radius: 15px; }

  #challengeModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 99999; justify-content: center; align-items: center; }
  .challenge-modal-box { background: var(--card-bg); border: 2px solid var(--accent); border-radius: 15px; padding: 30px; width: 90%; max-width: 400px; text-align: center; }
  .challenge-modal-box h2 { color: var(--accent); margin-bottom: 20px; }
  .challenge-select { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid var(--card-border); background: var(--bg-color); color: var(--text-color); font-family: 'Cairo'; font-size: 16px; outline: none; }
  .challenge-actions { display: flex; gap: 10px; justify-content: center; }
  .challenge-btn-submit { background: #4caf50; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; }
  .challenge-btn-cancel { background: #f44336; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; }
  @media (max-width: 600px) { .advanced-stats { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="custom-alert-overlay" id="customAlert">
    <div class="custom-alert-box">
        <h2 id="alertTitle">تنبيه</h2>
        <p id="alertMessage">رسالة التنبيه</p>
        <button class="custom-alert-btn" onclick="closeCustomAlert()" id="alertOkBtn">حسناً</button>
    </div>
</div>

<div id="challengeModal">
    <div class="challenge-modal-box">
        <h2 id="challengeModalTitle">⚔️ اختر الكويز للتحدي</h2>
        <select id="quizSelect" class="challenge-select">
            <option value="scream">Scream (سكريم)</option>
            <option value="annabelle">Annabelle (أنابيل)</option>
            <option value="conjuring">The Conjuring (الكونجورينج)</option>
            <option value="thenun">The Nun (الراهبة)</option>
            <option value="traintobusan">Train to Busan (قطار بوسان)</option>
            <option value="fnaf">FNAF (فايف نايتس)</option>
            <option value="squidgame">Squid Game (لعبة الحبار)</option>
            <option value="spiderman">Spider-Man (سبايدرمان)</option>
            <option value="avengers">Avengers (المنتقمون)</option>
            <option value="avatar">Avatar (أفاتار)</option>
            <option value="venom">Venom (فينوم)</option>
            <option value="birdsofprey">Birds of Prey (الطيور الجارحة)</option>
            <option value="fall">Fall (السقوط)</option>
            <option value="wednesday">Wednesday (وينزداي)</option>
            <option value="knivesout">Knives Out (مطارق)</option>
            <option value="elharifa">El Harifa (الحريفة)</option>
        </select>
        <div class="challenge-actions">
            <button class="challenge-btn-submit" onclick="submitChallenge()" id="challengeSubmitBtn">تحدي ⚔️</button>
            <button class="challenge-btn-cancel" onclick="closeChallengeModal()" id="challengeCancelBtn">إلغاء ❌</button>
        </div>
    </div>
</div>

<div class="top-controls">
  <a href="index.html" class="back-btn" id="backBtn">⬅ رجوع</a>
  <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">EN</button>
</div>

<div class="profile-container">
  <div class="header-card">
    <div class="avatar" id="userAvatar">A</div>
    <div class="username" id="userName">Loading...</div>
    
    <div class="rank-box" id="rankBox" style="display: none;">
        <span class="rank-label" id="rankLabelText">الرتبة:</span>
        <span class="rank-value" id="userRankValue">-</span>
    </div>

    <div class="stats-row">
      <div class="stat-badge score-badge">🏆 <span id="totalScoreDisplay">0</span> <span id="pointsText">نقطة</span></div>
      <div class="stat-badge xp-badge">✨ <span id="xpDisplay">0</span> XP</div>
      <div class="stat-badge level-badge"><span id="levelText">⭐ المستوى:</span> <span id="levelDisplay">1</span></div>
    </div>

    <div class="progress-container">
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="xpProgressBar"></div></div>
        <div style="font-size: 12px; color: var(--subtitle-color); margin-top: 5px; direction: ltr;" id="xpProgressText">0 / 100 XP</div>
    </div>

    <div class="advanced-stats" id="advancedStatsSection">
        <div class="adv-stat-box">
            <div class="adv-stat-title" id="accLabel">🎯 دقة التصويب</div>
            <div class="adv-stat-value accuracy" id="accuracyDisplay">0%</div>
        </div>
        <div class="adv-stat-box">
            <div class="adv-stat-title" id="streakLabel">🔥 أفضل نتيجة</div>
            <div class="adv-stat-value streak" id="bestStreakDisplay">0</div>
        </div>
        <div class="adv-stat-box">
            <div class="adv-stat-title" id="compLabel">🎮 كويزات مكتملة</div>
            <div class="adv-stat-value completed" id="completedDisplay">0</div>
        </div>
    </div>

    <div id="warningBox"><span id="warningText"></span></div>

    <div class="badges-section" id="badgesSection" style="display: none;">
        <div class="badges-title" id="badgesTitleText">الإنجازات (Badges)</div>
        <div class="badges-container" id="badgesContainer"></div>
    </div>

    <div class="upload-section" id="uploadSection" style="display: none;">
      <label for="imageUpload" class="upload-label" id="uploadLabelText">📷 اختر صورة</label>
      <input type="file" id="imageUpload" accept="image/*" onchange="window.previewImage(event)">
      <button id="saveImgBtn" class="upload-btn" onclick="window.uploadProfilePic()">حفظ الصورة</button>
      <button class="upload-btn" style="background: #ff3333; display: none;" id="removeImgBtn" onclick="window.removeProfilePic()">🗑️ مسح</button>
    </div>

    <button id="challengeBtn" class="upload-btn" style="background: #e91e63; display: none; margin-top: 15px; width: 100%; max-width: 300px;" onclick="window.openChallengeModal()">⚔️ تحدى هذا اللاعب</button>
  </div>

  <div>
    <h2 class="section-title" id="friendsSectionTitle">👥 أصدقاء <span id="friendsNameDisplay"></span></h2>
    <div id="friendsList" class="friends-container">
      <div class="no-data">جاري التحميل...</div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, get, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
  
  const firebaseConfig = { apiKey: "AIzaSyBmyW4tZGJfcHJ4jKSD3_6hebZK58Y3jXo", authDomain: "quiz-hub-app-f4cd0.firebaseapp.com", databaseURL: "https://quiz-hub-app-f4cd0-default-rtdb.firebaseio.com", projectId: "quiz-hub-app-f4cd0", storageBucket: "quiz-hub-app-f4cd0.firebasestorage.app", messagingSenderId: "282772179392", appId: "1:282772179392:web:64646d757592b29ff3a025" };
  const app = initializeApp(firebaseConfig); const db = getDatabase(app);
  window.db = db; window.ref = ref; window.get = get; window.set = set; window.push = push; window.onValue = onValue; window.remove = remove;
  
  const IMGBB_API_KEY = "3e7c71a0a091350d70363ef5909198d7";
  const urlParams = new URLSearchParams(window.location.search);
  let loggedInUser = localStorage.getItem('loggedInUser');
  let profileUser = urlParams.get('user') || loggedInUser; 

  if (!profileUser) { window.location.href = 'index.html'; }

  window.showAlert = function(title, message) {
      document.getElementById('alertTitle').innerText = title;
      document.getElementById('alertMessage').innerText = message;
      document.getElementById('customAlert').style.display = 'flex';
  };
  window.closeCustomAlert = function() {
      document.getElementById('customAlert').style.display = 'none';
  };

  document.getElementById('userName').innerText = profileUser;
  document.getElementById('friendsNameDisplay').innerText = profileUser;

  let currentLang = localStorage.getItem('lang') || 'ar';
  const translations = {
    ar: { back: "⬅ رجوع", rank: "الرتبة:", points: "نقطة", level: "⭐ المستوى:", badges: "الإنجازات (Badges)", uploadLabel: "📷 اختر صورة", saveImg: "حفظ الصورة", removeImg: "🗑️ مسح", friends: "👥 أصدقاء", noFriends: "لسه مفيش أصدقاء.", loading: "جاري التحميل...", visitProfile: "زيارة البروفايل", warnPrefix: "⚠️ تحذير: ", confirmRemove: "هل أنت متأكد من مسح صورتك؟", removedImg: "تم مسح الصورة بنجاح! 🗑️", uploadedImg: "تم رفع الصورة بنجاح! 🎉", errorImg: "فشل رفع الصورة، حاول تاني.", rankPlayer: "👤 لاعب عادي", rankOwner: "👑 الأونر", rankAdmin: "🛡️ أدمن", accuracy: "🎯 دقة التصويب", bestStreak: "🔥 أفضل نتيجة", completed: "🎮 كويزات مكتملة", challenge: "⚔️ تحدى هذا اللاعب", errTitle: "خطأ", okBtn: "حسناً", challengeTitle: "⚔️ اختر الكويز للتحدي", challengeBtn: "تحدي ⚔️", cancelBtn: "إلغاء ❌", successTitle: "نجاح", challengeSent: "تم إرسال التحدي!" },
    en: { back: "⬅ Back", rank: "Rank:", points: "Points", level: "⭐ Level:", badges: "Achievements (Badges)", uploadLabel: "📷 Choose Image", saveImg: "Save Image", removeImg: "🗑️ Remove", friends: "👥 Friends of", noFriends: "No friends yet.", loading: "Loading...", visitProfile: "Visit Profile", warnPrefix: "⚠️ Warning: ", confirmRemove: "Are you sure you want to remove your picture?", removedImg: "Image removed successfully! 🗑️", uploadedImg: "Image uploaded successfully! 🎉", errorImg: "Failed to upload image, try again.", rankPlayer: "👤 Normal Player", rankOwner: "👑 Owner", rankAdmin: "🛡️ Admin", accuracy: "🎯 Accuracy", bestStreak: "🔥 Best Score", completed: "🎮 Quizzes Completed", challenge: "⚔️ Challenge this player", errTitle: "Error", okBtn: "OK", challengeTitle: "⚔️ Choose Quiz to Challenge", challengeBtn: "Challenge ⚔️", cancelBtn: "Cancel ❌", successTitle: "Success", challengeSent: "Challenge sent!" }
  };

  function applyLanguage() {
      const t = translations[currentLang];
      document.body.dir = currentLang === 'en' ? 'ltr' : 'rtl';
      document.getElementById('backBtn').innerText = t.back;
      document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'EN' : 'AR';
      
      document.getElementById('rankLabelText').innerText = t.rank;
      document.getElementById('pointsText').innerText = t.points;
      document.getElementById('levelText').innerText = t.level;
      document.getElementById('badgesTitleText').innerText = t.badges;
      document.getElementById('uploadLabelText').innerText = t.uploadLabel;
      document.getElementById('saveImgBtn').innerText = t.saveImg;
      document.getElementById('removeImgBtn').innerText = t.removeImg;
      document.getElementById('friendsSectionTitle').innerHTML = `${t.friends} <span id="friendsNameDisplay">${profileUser}</span>`;
      
      document.getElementById('accLabel').innerText = t.accuracy;
      document.getElementById('streakLabel').innerText = t.bestStreak;
      document.getElementById('compLabel').innerText = t.completed;
      document.getElementById('challengeBtn').innerText = t.challenge;
      
      document.getElementById('challengeModalTitle').innerText = t.challengeTitle;
      document.getElementById('challengeSubmitBtn').innerText = t.challengeBtn;
      document.getElementById('challengeCancelBtn').innerText = t.cancelBtn;
      document.getElementById('alertOkBtn').innerText = t.okBtn;
  }
  applyLanguage();

  window.toggleLanguage = function() {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      localStorage.setItem('lang', currentLang);
      applyLanguage();
  }

  window.openChallengeModal = function() { document.getElementById('challengeModal').style.display = 'flex'; };
  window.closeChallengeModal = function() { document.getElementById('challengeModal').style.display = 'none'; };

  window.submitChallenge = async function() {
      const quizType = document.getElementById('quizSelect').value;
      window.closeChallengeModal();
      
      if (!loggedInUser || loggedInUser === 'Unknown') {
          showAlert(translations[currentLang].errTitle, currentLang === 'en' ? 'You must be logged in!' : 'لازم تسجل دخول الأول!');
          return;
      }
      
      if (!profileUser || profileUser.toLowerCase() === loggedInUser.toLowerCase()) {
          showAlert(translations[currentLang].errTitle, currentLang === 'en' ? 'Cannot challenge yourself!' : 'مش ممكن تتحدى نفسك!');
          return;
      }

      try {
          const existingChallenges = await window.get(window.ref(window.db, 'challenges/' + profileUser));
          if (existingChallenges.exists()) {
              const challenges = existingChallenges.val();
              const hasPending = Object.values(challenges).some(c => c.status === 'pending');
              if (hasPending) {
                  showAlert(translations[currentLang].errTitle, currentLang === 'en' ? 'This player has a pending challenge.' : 'اللاعب ده عنده تحدي معلق. جرب تاني بعدين.');
                  return;
              }
          }

          const roomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
          await window.set(window.ref(window.db, 'rooms/' + roomCode), {
              player1_score: null, player2_score: null, status: 'waiting', quizType: quizType,
              created_at: Date.now(), isFriendChallenge: true,
              player1_name: loggedInUser, player2_name: profileUser
          });

          await window.push(window.ref(window.db, 'challenges/' + profileUser), {
              challenger: loggedInUser, quiz: quizType, roomCode: roomCode, time: Date.now(), status: 'pending'
          });

          localStorage.setItem('activeRoomCode', roomCode);
          showAlert(translations[currentLang].successTitle, currentLang === 'en' ? 'Challenge sent! Waiting...' : 'تم إرسال التحدي! في انتظار صاحبك...');
          
          const timeoutId = setTimeout(async () => {
              const snap = await window.get(window.ref(window.db, 'rooms/' + roomCode));
              if (snap.exists() && snap.val().status === 'waiting') {
                  window.remove(window.ref(window.db, 'rooms/' + roomCode));
                  localStorage.removeItem('activeRoomCode');
                  showAlert(translations[currentLang].errTitle, currentLang === 'en' ? 'Challenge expired.' : 'انتهت صلاحية التحدي.');
              }
          }, 180000);

          window.onValue(window.ref(window.db, 'rooms/' + roomCode), (snapshot) => {
              const data = snapshot.val();
              if (data && data.status === 'playing') {
                  clearTimeout(timeoutId);
                  const fileMap = { 'elharifa': 'El Harifa Quiz', 'annabelle': 'Annabelle Quiz', 'scream': 'Scream Quiz', 'knivesout': 'Knives Out Quiz', 'conjuring': 'Conjuring Quiz', 'thenun': 'The Nun Quiz', 'traintobusan': 'Train to Busan Quiz', 'fnaf': 'FNAF Quiz', 'squidgame': 'Squid Game Quiz', 'spiderman': 'Spider-Man Quiz', 'avengers': 'Avengers Quiz', 'avatar': 'Avatar Quiz', 'venom': 'Venom Quiz', 'birdsofprey': 'Birds of Prey Quiz', 'fall': 'Fall Quiz', 'wednesday': 'Wednesday Quiz' };
                  const quizFileName = fileMap[quizType] || quizType;
                  window.location.href = `${quizFileName}.html?room=${roomCode}&role=player1`;
              } else if (!data) {
                  clearTimeout(timeoutId);
                  localStorage.removeItem('activeRoomCode');
                  showAlert(translations[currentLang].errTitle, currentLang === 'en' ? 'Challenge cancelled.' : 'تم إلغاء التحدي.');
              }
          });
      } catch (e) { showAlert(translations[currentLang].errTitle, e.message); }
  };

  window.get(window.ref(window.db, 'usernames')).then(snap => {
      if(snap.exists()) {
          const allUsers = snap.val();
          for(let user in allUsers) {
              if(user.toLowerCase() === profileUser.toLowerCase()) { profileUser = user; break; }
          }
      }
      document.getElementById('userName').innerText = profileUser;
      document.getElementById('friendsNameDisplay').innerText = profileUser;
      if (profileUser.toLowerCase() === loggedInUser.toLowerCase()) {
          document.getElementById('uploadSection').style.display = 'flex';
      } else {
          document.getElementById('challengeBtn').style.display = 'inline-block';
      }
      loadProfileData(); 
  });

  // ==========================================
  // 🚀 دالة تحميل البروفايل (الحل النهائي)
  // ==========================================
  async function loadProfileData() {
      try {
          const [
              userSnap, 
              adminsSnap, 
              ranksSnap, 
              badgesSnap, 
              scoresSnap, 
              xpSnap, 
              warnSnap, 
              friendsSnap, 
              usersDataSnap
          ] = await Promise.all([
              window.get(window.ref(window.db, 'users_data/' + profileUser)),
              window.get(window.ref(window.db, 'roles/admins')),
              window.get(window.ref(window.db, 'roles/users')),
              window.get(window.ref(window.db, 'badges/' + profileUser)),
              window.get(window.ref(window.db, 'scores/' + profileUser)),
              window.get(window.ref(window.db, 'users_data/' + profileUser + '/xp')),
              window.get(window.ref(window.db, 'warnings/' + profileUser)),
              window.get(window.ref(window.db, 'friends')),
              window.get(window.ref(window.db, 'users_data'))
          ]);

          // 1. الصورة
          const avatarEl = document.getElementById('userAvatar');
          const userData = userSnap.val();
          if (userData && userData.profilePic && userData.profilePic.startsWith('http')) {
              avatarEl.innerHTML = `<img src="${userData.profilePic}">`;
              if (profileUser.toLowerCase() === loggedInUser.toLowerCase()) document.getElementById('removeImgBtn').style.display = 'block';
          } else {
              avatarEl.innerHTML = profileUser.charAt(0).toUpperCase();
              if (profileUser.toLowerCase() === loggedInUser.toLowerCase()) document.getElementById('removeImgBtn').style.display = 'none';
          }

          // 2. الرتب
          const admins = adminsSnap.val() || {};
          const ranks = ranksSnap.val() || {};
          const isOwner = profileUser.toLowerCase() === 'ahmed';
          let isAdmin = false;
          for (let adminName in admins) { if (adminName.toLowerCase() === profileUser.toLowerCase()) { isAdmin = true; break; } }
          
          let rankText = translations[currentLang].rankPlayer;
          for (let user in ranks) { if (user.toLowerCase() === profileUser.toLowerCase()) { rankText = ranks[user]; break; } }
          if (isOwner) rankText = translations[currentLang].rankOwner;
          else if (isAdmin && (rankText.includes('لاعب') || rankText.includes('Player'))) rankText = translations[currentLang].rankAdmin;

          document.getElementById('rankBox').style.display = 'inline-flex';
          document.getElementById('userRankValue').innerText = rankText;

          // 3. البادجات
          const badgesData = badgesSnap.val();
          const badgesContainer = document.getElementById('badgesContainer');
          const badgesSection = document.getElementById('badgesSection');
          badgesContainer.innerHTML = '';
          if (badgesData && Object.keys(badgesData).length > 0) {
              badgesSection.style.display = 'block';
              Object.keys(badgesData).forEach(badge => {
                  const span = document.createElement('span'); span.className = 'badge-item'; span.innerText = badge; badgesContainer.appendChild(span);
              });
          } else { badgesSection.style.display = 'none'; }

          // 4. النقاط والدقة
          const scoresData = scoresSnap.val(); 
          let total = 0, totalCorrect = 0, totalQuestions = 0, maxTotalScore = 0, completedCount = 0;
          if (scoresData) { 
              for (let quiz in scoresData) { 
                  const attempts = scoresData[quiz]; 
                  let quizBest = 0, bestAttemptCorrect = 0, bestAttemptTotal = 0;
                  for (let id in attempts) { 
                      const attempt = attempts[id];
                      if (attempt.score > quizBest) { quizBest = attempt.score; bestAttemptCorrect = attempt.score; bestAttemptTotal = attempt.total; }
                  } 
                  total += quizBest; totalCorrect += bestAttemptCorrect; totalQuestions += bestAttemptTotal; completedCount++;
              } 
              maxTotalScore = total; 
          }
          document.getElementById('totalScoreDisplay').innerText = total;
          document.getElementById('bestStreakDisplay').innerText = maxTotalScore;
          document.getElementById('completedDisplay').innerText = completedCount;
          document.getElementById('accuracyDisplay').innerText = totalQuestions > 0 ? Math.round((totalCorrect / totalQuestions) * 100) + '%' : '0%';

          // 5. XP والمستوى
          let xp = xpSnap.exists() ? xpSnap.val() : 0;
          document.getElementById('xpDisplay').innerText = xp;
          let level = 1, nextLevelXp = 100, currentLevelXp = 0;
          if (xp >= 4500) { level = 10; currentLevelXp = 4500; nextLevelXp = "Max"; }
          else if (xp >= 3600) { level = 9; currentLevelXp = 3600; nextLevelXp = 4500; }
          else if (xp >= 2800) { level = 8; currentLevelXp = 2800; nextLevelXp = 3600; }
          else if (xp >= 2100) { level = 7; currentLevelXp = 2100; nextLevelXp = 2800; }
          else if (xp >= 1500) { level = 6; currentLevelXp = 1500; nextLevelXp = 2100; }
          else if (xp >= 1000) { level = 5; currentLevelXp = 1000; nextLevelXp = 1500; }
          else if (xp >= 600) { level = 4; currentLevelXp = 600; nextLevelXp = 1000; }
          else if (xp >= 300) { level = 3; currentLevelXp = 300; nextLevelXp = 600; }
          else if (xp >= 100) { level = 2; currentLevelXp = 100; nextLevelXp = 300; }
          document.getElementById('levelDisplay').innerText = level;
          document.getElementById('xpProgressText').innerText = `${xp - currentLevelXp} / ${nextLevelXp === "Max" ? "Max" : nextLevelXp - currentLevelXp} XP`;
          document.getElementById('xpProgressBar').style.width = `${nextLevelXp === "Max" ? 100 : ((xp - currentLevelXp) / (nextLevelXp - currentLevelXp)) * 100}%`;

          // 6. التحذيرات
          const warnData = warnSnap.val();
          if (warnData && warnData.text) { 
              document.getElementById('warningBox').style.display = 'block'; 
              document.getElementById('warningText').innerText = translations[currentLang].warnPrefix + warnData.text; 
          } else { 
              document.getElementById('warningBox').style.display = 'none'; 
          }

          // 7. الأصدقاء
          const friendsList = document.getElementById('friendsList');
          friendsList.innerHTML = '';
          
          let myFriendsObj = {};
          const allFriendsData = friendsSnap.val();
          
          if (allFriendsData) {
              for (let key in allFriendsData) {
                  if (key.toLowerCase() === profileUser.toLowerCase()) {
                      myFriendsObj = allFriendsData[key];
                      break;
                  }
              }
          }

          if (!myFriendsObj || typeof myFriendsObj !== 'object' || Object.keys(myFriendsObj).length === 0) {
              friendsList.innerHTML = `<div class="no-data">${translations[currentLang].noFriends}</div>`;
          } else {
              const allUsersData = usersDataSnap.val() || {};
              
              for (let friendName in myFriendsObj) {
                  let picUrl = null;
                  for (let u in allUsersData) {
                      if (u.toLowerCase() === friendName.toLowerCase() && allUsersData[u].profilePic) {
                          picUrl = allUsersData[u].profilePic;
                          break;
                      }
                  }

                  let avatarHTML = friendName.charAt(0).toUpperCase();
                  if (picUrl) avatarHTML = `<img src="${picUrl}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">`;

                  const card = document.createElement('div');
                  card.className = 'friend-card';
                  card.innerHTML = `
                      <div class="friend-info">
                          <div class="friend-avatar">${avatarHTML}</div>
                          <div class="friend-name">${friendName}</div>
                      </div>
                      <div>
                          <a href="profile.html?user=${friendName}" class="action-btn">${translations[currentLang].visitProfile}</a>
                      </div>
                  `;
                  friendsList.appendChild(card);
              }
          }

      } catch (error) {
          console.error("حدث خطأ أثناء تحميل البيانات:", error);
          document.getElementById('friendsList').innerHTML = `<div class="no-data" style="color:var(--accent); direction:ltr; text-align:left; word-break:break-all;">خطأ: ${error.message}</div>`;
      }
  }

  let selectedFile = null;
  window.previewImage = function(event) {
    selectedFile = event.target.files[0];
    if (selectedFile) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const avatarEl = document.getElementById('userAvatar');
        avatarEl.innerHTML = `<img src="${e.target.result}">`;
        document.getElementById('saveImgBtn').style.display = 'block';
        document.getElementById('removeImgBtn').style.display = 'block';
      }
      reader.readAsDataURL(selectedFile);
    }
  }

  window.uploadProfilePic = async function() {
    if (!selectedFile || profileUser.toLowerCase() !== loggedInUser.toLowerCase()) return;
    const btn = document.getElementById('saveImgBtn');
    const t = translations[currentLang];
    btn.innerText = '...'; btn.disabled = true;
    const formData = new FormData();
    formData.append('image', selectedFile);
    try {
      const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: formData });
      const data = await response.json();
      if (data.success) {
          await window.set(window.ref(window.db, 'users_data/' + profileUser + '/profilePic'), data.data.url);
          showAlert(t.successTitle, t.uploadedImg);
          btn.style.display = 'none';
      } else { showAlert(t.errTitle, t.errorImg); }
    } catch (error) { showAlert(t.errTitle, error.message); }
    btn.innerText = t.saveImg; btn.disabled = false;
  }

  window.removeProfilePic = async function() {
    if (profileUser.toLowerCase() !== loggedInUser.toLowerCase()) return;
    const t = translations[currentLang];
    if (confirm(t.confirmRemove)) {
      try {
        await window.set(window.ref(window.db, 'users_data/' + profileUser + '/profilePic'), null);
        const avatarEl = document.getElementById('userAvatar');
        avatarEl.innerHTML = loggedInUser.charAt(0).toUpperCase();
        document.getElementById('saveImgBtn').style.display = 'none';
        document.getElementById('removeImgBtn').style.display = 'none';
        showAlert(t.successTitle, t.removedImg);
      } catch(e) { showAlert(t.errTitle, e.message); }
    }
  }

  if (localStorage.getItem('theme') === 'light') { document.body.classList.add('light-mode'); }
</script>
<script src="notifications.js" type="module"></script>
</body>
