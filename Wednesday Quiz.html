<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🖤 كويز وينزداي - Wednesday</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0a; color: #eee; font-family: 'Cairo', sans-serif;
    min-height: 100vh; display: flex; justify-content: center; align-items: center;
    padding: 20px; overflow-x: hidden;
    background: radial-gradient(circle at center, #1a0f1c 0%, #000 100%);
  }

  .quiz-box {
    background: rgba(15,15,15,0.98); border: 2px solid #5c2a75;
    border-radius: 15px; padding: 25px; max-width: 750px; width: 100%;
    box-shadow: 0 0 30px rgba(92,42,117,0.6); position: relative;
  }
  h1 { text-align: center; color: #b17edb; text-shadow: 0 0 15px #5c2a75; margin-bottom: 15px; font-size: 30px; }
  
  .start-content { text-align: center; padding: 30px 10px; }
  .start-content h2 { color: #b17edb; font-size: 32px; margin-bottom: 20px; }
  .start-content p { color: #aaa; font-size: 17px; margin-bottom: 25px; line-height: 1.7; }
  .start-btn {
    padding: 15px 50px; background: #5c2a75; color: #fff; border: 2px solid #b17edb;
    border-radius: 10px; cursor: pointer; font-family: 'Cairo', sans-serif;
    font-size: 20px; font-weight: 900; transition: 0.3s;
  }
  .start-btn:hover { background: #b17edb; color: #000; box-shadow: 0 0 20px #5c2a75; }
  
  .progress { background: #2a2a2a; height: 8px; border-radius: 4px; margin-bottom: 15px; }
  .progress-bar { background: #b17edb; height: 100%; width: 0%; transition: width 0.5s; box-shadow: 0 0 10px #5c2a75; }
  .timer { text-align: center; font-size: 18px; color: #b17edb; margin-bottom: 15px; font-weight: 700; }
  
  .movie-image {
    width: 100%; height: 250px; border-radius: 10px; margin-bottom: 15px;
    border: 2px solid #5c2a75; box-shadow: 0 0 20px rgba(92,42,117,0.5);
    background: #000; display: flex; justify-content: center; align-items: center;
    overflow: hidden; position: relative;
  }
  .movie-image svg { width: 100%; height: 100%; display: block; }

  .question { font-size: 20px; margin-bottom: 20px; color: #fff; line-height: 1.6; }
  .option {
    display: block; background: #1a1a1a; border: 1px solid #333;
    padding: 13px 18px; margin: 9px 0; border-radius: 10px; cursor: pointer;
    transition: 0.25s; font-size: 16px;
  }
  .option:hover:not(.disabled) { background: #2d1a3d; border-color: #b17edb; transform: translateX(-5px); }
  .option.correct { background: #1a5c2a; border-color: #4caf50; }
  .option.wrong { background: #5c2a2a; border-color: #f44336; }
  
  #next {
    display: none; margin-top: 20px; padding: 12px; background: #5c2a75;
    color: #fff; border: none; border-radius: 8px; cursor: pointer;
    font-family: 'Cairo', sans-serif; font-size: 16px; font-weight: 700; width: 100%;
  }
  #next:hover { background: #b17edb; color: #000; box-shadow: 0 0 15px #5c2a75; }
  #score { margin-top: 15px; font-size: 15px; color: #b17edb; text-align: center; font-weight: 700; }
</style>
</head>
<body>

<div class="quiz-box" id="quizBox">
  <div id="startScreen">
    <h1>🖤 كويز وينزداي 🖤</h1>
    <div class="start-content">
      <h2>أهلاً بك في أكاديمية Nevermore</h2>
      <p>20 سؤال عن أحداث مسلسل Wednesday<br><strong>لديك 20 ثانية لكل سؤال</strong><br>استعد للغموض...</p>
      <button class="start-btn" onclick="startQuiz()">🖤 ابدأ التحقيق</button>
    </div>
  </div>

  <div id="quizScreen" style="display:none;">
    <h1>🖤 كويز وينزداي 🖤</h1>
    <div class="progress"><div class="progress-bar" id="progress"></div></div>
    <div class="timer" id="timer">⏱️ 20</div>
    
    <div id="movieImage" class="movie-image"></div>
    
    <div id="question" class="question"></div>
    <div id="options"></div>
    <div id="score"></div>
    <button id="next">السؤال التالي ←</button>
  </div>
</div>

<script>
// بوستر Wednesday
function generatePoster(title, subtitle) {
  return `
  <svg viewBox="0 0 500 250" xmlns="http://www.w3.org/2000/svg">
    <rect width="500" height="250" fill="#0a0510"/>
    <circle cx="250" cy="125" r="80" fill="#5c2a75" opacity="0.3"/>
    <text x="50%" y="40%" dominant-baseline="middle" text-anchor="middle" fill="#b17edb" font-family="Cairo, sans-serif" font-weight="900" font-size="40" filter="drop-shadow(0 0 10px #5c2a75)">${title}</text>
    <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-family="Cairo, sans-serif" font-weight="bold" font-size="20" opacity="0.7">${subtitle}</text>
    <path d="M 0 250 L 250 180 L 500 250" fill="none" stroke="#5c2a75" stroke-width="4"/>
  </svg>
  `;
}

const questions = [
  { q: "في بداية المسلسل، وينزداي بتتنقل لمدرسة إيه؟", options: ["Nevermore Academy", "Hogwarts", "Xavier's School", "Jericho High"], answer: 0, title: "WEDNESDAY", subtitle: "THE SCHOOL" },
  { q: "إيه موهبة وينزداي الخاصة اللي بتورثها عن أمها؟", options: ["قراءة الأفكار", "الرؤية (العرافة)", "التحكم في العقل", "الطيران"], answer: 1, title: "WEDNESDAY", subtitle: "THE POWER" },
  { q: "إيه اسم المخلوق اللي بيتحول ليه الطلاب في المدرسة؟", options: ["مستذئب", "مصاص دماء", "ساحر", "شبح"], answer: 0, title: "WEDNESDAY", subtitle: "THE CREATURES" },
  { q: "مين الشخص اللي بيحاول يقتل وينزداي في أول حلقة؟", options: ["صديقها", "وحش غامض", "أستاذها", "زوج أمها"], answer: 1, title: "WEDNESDAY", subtitle: "THE MURDER" },
  { q: "وينزداي بتنضم لنادي إيه في المدرسة؟", options: ["نادي الشطرنج", "نادي علم النبات", "نادي الرسم", "نادي الفنون"], answer: 1, title: "WEDNESDAY", subtitle: "THE CLUB" },
  { q: "المدينة اللي جنب المدرسة اسمها إيه؟", options: ["Jericho", "Salem", "Mystic Falls", "Riverdale"], answer: 0, title: "WEDNESDAY", subtitle: "THE TOWN" },
  { q: "الشخص اللي بيحل مع وينزداي الجرائم (الشرطي) اسمه إيه؟", options: ["Sheriff Galpin", "Xavier", "Tyler", "Enid"], answer: 0, title: "WEDNESDAY", subtitle: "THE SHERIFF" },
  { q: "إيه اللغز الأساسي اللي وينزداي بتحاول تحله؟", options: ["سرقة البنك", "اختفاء طالب", "جرائم قتل الوحش", "حادثة المدرسة"], answer: 2, title: "WEDNESDAY", subtitle: "THE MYSTERY" },
  { q: "مين اللي بيحاول يساعد وينزداي من غير ما تطلب؟", options: ["Enid", "Xavier", "Tyler", "Bianca"], answer: 0, title: "WEDNESDAY", subtitle: "THE FRIEND" },
  { q: "إيه علاقة عيلة وينزداي بالمدرسة؟", options: ["جدها أسسها", "أمها وأبوها درسوا فيها", "هي بتملكها", "ملهاش علاقة"], answer: 1, title: "WEDNESDAY", subtitle: "THE FAMILY" },
  { q: "في الحفلة المدرسية، إيه اللي بيحصل؟", options: ["بتتحرق المدرسة", "بيتم قتل طالب", "بتهرب وينزداي", "بتكشف سر"], answer: 1, title: "WEDNESDAY", subtitle: "THE DANCE" },
  { q: "مين الشخصية اللي بتخفي سر كبير عن الجميع؟", options: ["Xavier", "Tyler", "Enid", "Bianca"], answer: 1, title: "WEDNESDAY", subtitle: "THE SECRET" },
  { q: "الوحش اللي بيقتل الطلاب بيطلع إيه؟", options: ["مستذئب", "مصاص دماء", "هجين", "شبح"], answer: 2, title: "WEDNESDAY", subtitle: "THE MONSTER" },
  { q: "قضية القتل الأساسية في الموسم الأول كانت مرتبطة بمين؟", options: ["عيلة وينزداي", "المدير", "الطلاب", "شرطة المدينة"], answer: 0, title: "WEDNESDAY", subtitle: "THE PAST" },
  { q: "إيه اللي بتكتشفه وينزداي عن أصلها؟", options: ["إنها تبنت", "إنها بتحمل قدرة غامضة", "إنها مش بشر", "إنها بتحب الرسم"], answer: 1, title: "WEDNESDAY", subtitle: "THE TRUTH" },
  { q: "في نهاية الموسم، مين اللي بيظهر إنه الشرير الحقيقي؟", options: ["المدير", "المعلم", "الطلاب", "شخص مقرب"], answer: 3, title: "WEDNESDAY", subtitle: "THE VILLAIN" },
  { q: "إيه اللي بيحصل لوينزداي في نهاية الموسم الأول؟", options: ["بترجع بيتها", "بتتقبل في المدرسة", "بتتحب من الجميع", "بتصير بطلة"], answer: 1, title: "WEDNESDAY", subtitle: "THE ENDING" },
  { q: "العلاقة بين وينزداي وEnid بتتطور لإيه؟", options: ["خناقة", "صداقة قوية", "منافسة", "كره"], answer: 1, title: "WEDNESDAY", subtitle: "THE BOND" },
  { q: "في المسلسل، مين اللي بيساعد وينزداي في حل الجرائم؟", options: ["Xavier", "Tyler", "Sheriff Galpin", "الجميع"], answer: 2, title: "WEDNESDAY", subtitle: "THE INVESTIGATION" },
  { q: "إيه الميزة الأساسية اللي بتميز وينزداي عن باقي الطلاب؟", options: ["ذكاؤها التحليلي", "قوتها الجسدية", "جمالها", "سرعتها"], answer: 0, title: "WEDNESDAY", subtitle: "THE CHARACTER" }
];

const TOTAL_TIME = 20;
let current = 0, score = 0, answered = false, timerInterval = null, timeLeft = TOTAL_TIME;
let shuffled = [];

function shuffleArray(array) {
  let currentIndex = array.length, randomIndex;
  while (currentIndex != 0) {
    randomIndex = Math.floor(Math.random() * currentIndex);
    currentIndex--;
    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
  }
  return array;
}

// صوت بسيط (تكة خفيفة)
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playClick() {
  if(audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  osc.type = 'sine'; 
  osc.frequency.setValueAtTime(400, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime); 
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
  osc.connect(gain); gain.connect(audioCtx.destination); 
  osc.start(); osc.stop(audioCtx.currentTime + 0.1);
}

function startQuiz() {
  if(audioCtx.state === 'suspended') audioCtx.resume();
  shuffled = [...questions].sort(() => Math.random() - 0.5);
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('quizScreen').style.display = 'block';
  current = 0; score = 0;
  document.getElementById('next').onclick = nextQuestion;
  loadQuestion();
}

function loadQuestion() {
  answered = false; timeLeft = TOTAL_TIME;
  const q = shuffled[current];
  
  document.getElementById('movieImage').innerHTML = generatePoster(q.title, q.subtitle);
  document.getElementById('question').innerText = q.q;
  
  const optEl = document.getElementById('options');
  optEl.innerHTML = '';
  
  let optionsWithAnswers = q.options.map((opt, index) => ({ text: opt, isCorrect: index === q.answer }));
  optionsWithAnswers = shuffleArray(optionsWithAnswers); 
  
  optionsWithAnswers.forEach((opt) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerText = opt.text;
    div.onclick = () => checkAnswer(opt.isCorrect, div);
    optEl.appendChild(div);
  });
  
  document.getElementById('score').innerText = `السؤال ${current + 1} من ${shuffled.length} | النقاط: ${score}`;
  document.getElementById('next').style.display = 'none';
  document.getElementById('progress').style.width = ((current) / shuffled.length * 100) + '%';
  
  clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 1000);
  updateTimer();
}

function updateTimer() {
  const timerEl = document.getElementById('timer');
  timerEl.innerText = `⏱️ ${timeLeft}`;
  if (timeLeft <= 5) timerEl.style.color = '#f44336'; else timerEl.style.color = '#b17edb';
  
  if (timeLeft <= 0) {
    clearInterval(timerInterval);
    if (!answered) {
      answered = true;
      document.querySelectorAll('.option').forEach(o => o.classList.add('disabled'));
      document.querySelectorAll('.option').forEach(o => {
        if(o.innerText === shuffled[current].options[shuffled[current].answer]) o.classList.add('correct');
      });
      document.getElementById('next').style.display = 'inline-block';
    }
  }
  timeLeft--;
}

function checkAnswer(isCorrect, el) {
  if (answered) return;
  answered = true; clearInterval(timerInterval);
  
  const allOpts = document.querySelectorAll('.option');
  allOpts.forEach(o => o.classList.add('disabled'));
  
  allOpts.forEach(o => {
    if(o.innerText === shuffled[current].options[shuffled[current].answer]) o.classList.add('correct');
  });
  
  if (isCorrect) {
    score++;
    playClick(); // تكة خفيفة لو صح
  } else {
    el.classList.add('wrong');
    playClick(); // تكة خفيفة لو غلط
  }
  
  document.getElementById('score').innerText = `السؤال ${current + 1} من ${shuffled.length} | النقاط: ${score}`;
  document.getElementById('next').style.display = 'inline-block';
}

function nextQuestion() {
  current++;
  if (current < shuffled.length) { loadQuestion(); } else { showFinal(); }
}

function showFinal() {
  clearInterval(timerInterval);
  document.getElementById('progress').style.width = '100%';
  document.getElementById('question').innerHTML = `<div style="text-align:center; padding:20px;">
    <h2 style="color:#b17edb; font-size:36px;">انتهى التحقيق! 🖤</h2>
    <p style="color:#fff; font-size:22px;">نتيجتك: ${score} / ${shuffled.length}</p>
    <button onclick="location.reload()" style="margin-top:20px; padding:10px 30px; background:#5c2a75; color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:18px;">🔄 العب تاني</button>
  </div>`;
  document.getElementById('options').innerHTML = '';
  document.getElementById('movieImage').style.display = 'none';
  document.getElementById('timer').style.display = 'none';
  document.getElementById('score').innerText = '';
  document.getElementById('next').style.display = 'none';
}
</script>
</body>
</html>
