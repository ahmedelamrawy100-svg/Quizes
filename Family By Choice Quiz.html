<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏡 كويز عائلة بالاختيار - Family By Choice</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000; color: #eee; font-family: 'Cairo', sans-serif;
    min-height: 100vh; display: flex; justify-content: center; align-items: center;
    padding: 20px; overflow-x: hidden;
    background: radial-gradient(circle at center, #1a1510 0%, #000 100%);
  }

  .quiz-box {
    background: rgba(15,15,15,0.98); border: 2px solid #c9a87c;
    border-radius: 15px; padding: 25px; max-width: 750px; width: 100%;
    box-shadow: 0 0 30px rgba(201,168,124,0.4); position: relative;
  }
  h1 { text-align: center; color: #f0d9b5; text-shadow: 0 0 15px #c9a87c; margin-bottom: 15px; font-size: 30px; }
  
  .start-content { text-align: center; padding: 30px 10px; }
  .start-content h2 { color: #f0d9b5; font-size: 32px; margin-bottom: 20px; }
  .start-content p { color: #ccc; font-size: 17px; margin-bottom: 25px; line-height: 1.7; }
  .start-btn {
    padding: 15px 50px; background: #c9a87c; color: #fff; border: 2px solid #f0d9b5;
    border-radius: 10px; cursor: pointer; font-family: 'Cairo', sans-serif;
    font-size: 20px; font-weight: 900; transition: 0.3s;
  }
  .start-btn:hover { background: #f0d9b5; color: #000; box-shadow: 0 0 20px #c9a87c; }
  
  .progress { background: #2a2a2a; height: 8px; border-radius: 4px; margin-bottom: 15px; }
  .progress-bar { background: #f0d9b5; height: 100%; width: 0%; transition: width 0.5s; box-shadow: 0 0 10px #c9a87c; }
  .timer { text-align: center; font-size: 18px; color: #f0d9b5; margin-bottom: 15px; font-weight: 700; }
  
  .movie-image {
    width: 100%; height: 250px; border-radius: 10px; margin-bottom: 15px;
    border: 2px solid #c9a87c; box-shadow: 0 0 20px rgba(201,168,124,0.4);
    background: #000; display: flex; justify-content: center; align-items: center;
    overflow: hidden; position: relative;
  }
  .movie-image svg { width: 100%; height: 100%; display: block; }

  .question { font-size: 20px; margin-bottom: 20px; color: #fff; line-height: 1.6; }
  .option {
    display: block; background: #1a1a1a; border: 1px solid #333;
    padding: 13px 18px; margin: 9px 0; border-radius: 10px; cursor: pointer;
    transition: 0.25s; font-size: 16px;
  }
  .option:hover:not(.disabled) { background: #2d2418; border-color: #f0d9b5; transform: translateX(-5px); }
  .option.correct { background: #1a5c2a; border-color: #4caf50; }
  .option.wrong { background: #5c2a2a; border-color: #f44336; }
  
  #next {
    display: none; margin-top: 20px; padding: 12px; background: #c9a87c;
    color: #fff; border: none; border-radius: 8px; cursor: pointer;
    font-family: 'Cairo', sans-serif; font-size: 16px; font-weight: 700; width: 100%;
  }
  #next:hover { background: #f0d9b5; color: #000; box-shadow: 0 0 15px #c9a87c; }
  #score { margin-top: 15px; font-size: 15px; color: #f0d9b5; text-align: center; font-weight: 700; }
</style>
</head>
<body>

<div class="quiz-box" id="quizBox">
  <div id="startScreen">
    <h1>🏡 كويز عائلة بالاختيار 🏡</h1>
    <div class="start-content">
      <h2>عائلة مش بالدم</h2>
      <p>20 سؤال عن أحداث مسلسل Family By Choice<br><strong>لديك 20 ثانية لكل سؤال</strong><br>هل أنت مستعد؟</p>
      <button class="start-btn" onclick="startQuiz()">🏡 ابدأ</button>
    </div>
  </div>

  <div id="quizScreen" style="display:none;">
    <h1>🏡 كويز عائلة بالاختيار 🏡</h1>
    <div class="progress"><div class="progress-bar" id="progress"></div></div>
    <div class="timer" id="timer">⏱️ 20</div>
    
    <div id="movieImage" class="movie-image"></div>
    
    <div id="question" class="question"></div>
    <div id="options"></div>
    <div id="score"></div>
    <button id="next">السؤال التالي ←</button>
  </div>
</div>

<script>
function generatePoster(title, subtitle) {
  return `
  <svg viewBox="0 0 500 250" xmlns="http://www.w3.org/2000/svg">
    <rect width="500" height="250" fill="#1a1510"/>
    <circle cx="250" cy="125" r="80" fill="#c9a87c" opacity="0.3"/>
    <text x="50%" y="40%" dominant-baseline="middle" text-anchor="middle" fill="#f0d9b5" font-family="Cairo, sans-serif" font-weight="900" font-size="40" filter="drop-shadow(0 0 10px #c9a87c)">${title}</text>
    <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-family="Cairo, sans-serif" font-weight="bold" font-size="20" opacity="0.7">${subtitle}</text>
    <path d="M 0 250 L 250 180 L 500 250" fill="none" stroke="#c9a87c" stroke-width="4"/>
  </svg>
  `;
}

const questions = [
  { q: "في بداية المسلسل، إيه اللي بيجمع البطلة (Ju-won) بـ (San-ha) و(Hae-joon)؟", options: ["بيحبوا نفس الهواية", "بيتنقلوا لنفس العمارة وبيتربوا مع بعض", "أصدقاء دراسة", "بيشتغلوا مع بعض"], answer: 1, title: "FAMILY BY CHOICE", subtitle: "THE BEGINNING" },
  { q: "إيه الحاجة اللي بتتمناها Ju-won عشان تحس إنهم عيلة واحدة؟", options: ["يسافروا مع بعض", "ياخدوا نفس اللقب العائلي بالتبني", "يعملوا حفلة", "يغيروا المدرسة"], answer: 1, title: "FAMILY BY CHOICE", subtitle: "THE WISH" },
  { q: "مين الشخص اللي بيربي العيال التلاتة مع بعض؟", options: ["أم Ju-won", "أبو Ju-won وأبو San-ha", "الجد", "المدرسة"], answer: 1, title: "FAMILY BY CHOICE", subtitle: "THE FAMILY" },
  { q: "إيه اللي بيخلي San-ha وHae-joon يسيبوا Ju-won ويسافروا؟", options: ["عشان الشغل", "عشان يرجعوا لعائلاتهم الحقيقية", "عشان الدراسة", "عشان مشاكل مادية"], answer: 1, title: "FAMILY BY CHOICE", subtitle: "THE SEPARATION" },
  { q: "بعد كام سنة بيرجعوا يتقابلوا تاني؟", options: ["5 سنين", "10 سنين", "سنة", "20 سنة"], answer: 1, title: "FAMILY BY CHOICE", subtitle: "THE REUNION" },
  { q: "إيه إحساس Ju-won لما بيرجعوا بعد الغياب الطويل؟", options: ["فرحة كبيرة", "زعل وإحساس إنهم سابوها", "لامبالاة", "خوف"], answer: 1, title: "FAMILY BY CHOICE", subtitle: "THE FEELINGS" },
  { q: "إيه اللي بيتغير في العلاقة بين التلاتة لما يكبروا؟", options: ["بيقربوا أكتر", "بتظهر مشاعر حب بينهم", "بيسيبوا بعض", "بيتخانقوا"], answer: 1, title: "FAMILY BY CHOICE", subtitle: "THE CHANGE" },
  { q: "مين اللي بيعترف بحبه لـ Ju-won الأول؟", options: ["Hae-joon", "San-ha", "صديق تاني", "محدش"], answer: 1, title: "FAMILY BY CHOICE", subtitle: "THE CONFESSION" },
  { q: "إيه المشكلة الأساسية اللي بتواجهها العيلة في المسلسل؟", options: ["الفقر", "مشاكل عائلية ومشاعر معقدة", "المرض", "السفر"], answer: 1, title: "FAMILY BY CHOICE", subtitle: "THE CONFLICT" },
  { q: "مين الشخص اللي بيعترف بحبه لـ Hae-joon في النهاية؟", options: ["Ju-won", "Park Dal", "أخت San-ha", "صديقة تانية"], answer: 1, title: "FAMILY BY CHOICE", subtitle: "THE LOVE" },
  { q: "إيه اللي بيحصل لأبو Ju-won في نهاية المسلسل؟", options: ["بيسافر", "بيتجوز", "بيموت", "بيعمل مشروع"], answer: 1, title: "FAMILY BY CHOICE", subtitle: "THE FATHER" },
  { q: "مين اللي بيتجوز في النهاية؟", options: ["San-ha وJu-won", "أبو Ju-won وأم Hae-joon", "Hae-joon وPark Dal", "محدش"], answer: 1, title: "FAMILY BY CHOICE", subtitle: "THE WEDDING" },
  { q: "إيه اللي بيعمله Hae-joon عشان يقرب من Park Dal في النهاية؟", options: ["بيعترف بحبه", "بيتحداها في كرة السلة", "بيسافر", "بيشتري ليها هدية"], answer: 1, title: "FAMILY BY CHOICE", subtitle: "THE CHASE" },
  { q: "إيه الرسالة الأساسية للمسلسل؟", options: ["الحب هو كل حاجة", "العيلة مش بالدم بس", "الفقر هو المشكلة", "السفر هو الحل"], answer: 1, title: "FAMILY BY CHOICE", subtitle: "THE MESSAGE" },
  { q: "مين اللي كان بيعارض علاقة San-ha وJu-won في البداية؟", options: ["أبو Ju-won", "أم San-ha", "Hae-joon", "كل الإجابات صح"], answer: 3, title: "FAMILY BY CHOICE", subtitle: "THE OPPOSITION" },
  { q: "إيه اللي بيخلي أبو Ju-won يوافق على علاقة San-ha وJu-won في النهاية؟", options: ["بيحب San-ha", "San-ha بيثبت حبه وصدقه", "Ju-won بتقنعه", "بيغير رأيه فجأة"], answer: 1, title: "FAMILY BY CHOICE", subtitle: "THE APPROVAL" },
  { q: "إيه اللي بيميز مسلسل Family By Choice عن باقي المسلسلات؟", options: ["الأكشن", "الرومانسية العائلية الدافئة", "الرعب", "الكوميديا بس"], answer: 1, title: "FAMILY BY CHOICE", subtitle: "THE STORY" },
  { q: "مين الشخص اللي بيحب Ju-won من غير ما يقولها في البداية؟", options: ["Hae-joon", "San-ha", "صديق تالت", "محدش"], answer: 1, title: "FAMILY BY CHOICE", subtitle: "THE SECRET LOVE" },
  { q: "إيه اللي بيحصل للعلاقة بين Ju-won وSan-ha في النهاية؟", options: ["بيفترقوا", "بيحبوا بعض وبيتقربوا", "بيسيبوا البلد", "بيتجوزوا"], answer: 1, title: "FAMILY BY CHOICE", subtitle: "THE ENDING" },
  { q: "إيه اللي بتتعلمه الشخصيات في النهاية؟", options: ["إن العيلة هي اللي بتختارها", "إن الحب صعب", "إن السفر هو الحل", "إن الفلوس هي كل حاجة"], answer: 0, title: "FAMILY BY CHOICE", subtitle: "THE LESSON" }
];

const TOTAL_TIME = 20;
let current = 0, score = 0, answered = false, timerInterval = null, timeLeft = TOTAL_TIME;
let shuffled = [];

function shuffleArray(array) {
  let currentIndex = array.length, randomIndex;
  while (currentIndex != 0) {
    randomIndex = Math.floor(Math.random() * currentIndex);
    currentIndex--;
    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
  }
  return array;
}

// صوت تكة خفيفة
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playClick() {
  if(audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  osc.type = 'sine'; 
  osc.frequency.setValueAtTime(400, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime); 
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
  osc.connect(gain); gain.connect(audioCtx.destination); 
  osc.start(); osc.stop(audioCtx.currentTime + 0.1);
}

function startQuiz() {
  if(audioCtx.state === 'suspended') audioCtx.resume();
  shuffled = [...questions].sort(() => Math.random() - 0.5);
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('quizScreen').style.display = 'block';
  current = 0; score = 0;
  document.getElementById('next').onclick = nextQuestion;
  loadQuestion();
}

function loadQuestion() {
  answered = false; timeLeft = TOTAL_TIME;
  const q = shuffled[current];
  
  document.getElementById('movieImage').innerHTML = generatePoster(q.title, q.subtitle);
  document.getElementById('question').innerText = q.q;
  
  const optEl = document.getElementById('options');
  optEl.innerHTML = '';
  
  let optionsWithAnswers = q.options.map((opt, index) => ({ text: opt, isCorrect: index === q.answer }));
  optionsWithAnswers = shuffleArray(optionsWithAnswers); 
  
  optionsWithAnswers.forEach((opt) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerText = opt.text;
    div.onclick = () => checkAnswer(opt.isCorrect, div);
    optEl.appendChild(div);
  });
  
  document.getElementById('score').innerText = `السؤال ${current + 1} من ${shuffled.length} | النقاط: ${score}`;
  document.getElementById('next').style.display = 'none';
  document.getElementById('progress').style.width = ((current) / shuffled.length * 100) + '%';
  
  clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 1000);
  updateTimer();
}

function updateTimer() {
  const timerEl = document.getElementById('timer');
  timerEl.innerText = `⏱️ ${timeLeft}`;
  if (timeLeft <= 5) timerEl.style.color = '#f44336'; else timerEl.style.color = '#f0d9b5';
  
  if (timeLeft <= 0) {
    clearInterval(timerInterval);
    if (!answered) {
      answered = true;
      document.querySelectorAll('.option').forEach(o => o.classList.add('disabled'));
      document.querySelectorAll('.option').forEach(o => {
        if(o.innerText === shuffled[current].options[shuffled[current].answer]) o.classList.add('correct');
      });
      document.getElementById('next').style.display = 'inline-block';
    }
  }
  timeLeft--;
}

function checkAnswer(isCorrect, el) {
  if (answered) return;
  answered = true; clearInterval(timerInterval);
  
  const allOpts = document.querySelectorAll('.option');
  allOpts.forEach(o => o.classList.add('disabled'));
  
  allOpts.forEach(o => {
    if(o.innerText === shuffled[current].options[shuffled[current].answer]) o.classList.add('correct');
  });
  
  if (isCorrect) {
    score++;
    playClick();
  } else {
    el.classList.add('wrong');
    playClick();
  }
  
  document.getElementById('score').innerText = `السؤال ${current + 1} من ${shuffled.length} | النقاط: ${score}`;
  document.getElementById('next').style.display = 'inline-block';
}

function nextQuestion() {
  current++;
  if (current < shuffled.length) { loadQuestion(); } else { showFinal(); }
}

function showFinal() {
  clearInterval(timerInterval);
  document.getElementById('progress').style.width = '100%';
  document.getElementById('question').innerHTML = `<div style="text-align:center; padding:20px;">
    <h2 style="color:#f0d9b5; font-size:36px;">انتهى الكويز! 🏡</h2>
    <p style="color:#fff; font-size:22px;">نتيجتك: ${score} / ${shuffled.length}</p>
    <button onclick="location.reload()" style="margin-top:20px; padding:10px 30px; background:#c9a87c; color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:18px;">🔄 العب تاني</button>
  </div>`;
  document.getElementById('options').innerHTML = '';
  document.getElementById('movieImage').style.display = 'none';
  document.getElementById('timer').style.display = 'none';
  document.getElementById('score').innerText = '';
  document.getElementById('next').style.display = 'none';
}
</script>
</body>
</html>
