<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💬 صندوق الرسائل - Quiz Hub</title>
<link rel="icon" type="image/png" href="pic/Logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg-color: #000; --bg-gradient: radial-gradient(circle at center, #1a1015 0%, #000 100%); --text-color: #fff; --subtitle-color: #aaa; --card-bg: #111; --card-border: #333; --accent: #ff0000; }
  body.light-mode { --bg-color: #f4f4f4; --bg-gradient: radial-gradient(circle at center, #ffffff 0%, #e0e0e0 100%); --text-color: #111; --subtitle-color: #555; --card-bg: #fff; --card-border: #ccc; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg-gradient); background-color: var(--bg-color); color: var(--text-color); font-family: 'Cairo', sans-serif; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
  
  .top-bar { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .back-btn { background: #222; color: #fff; border: 2px solid #555; padding: 8px 15px; border-radius: 8px; text-decoration: none; font-weight: bold; }
  .lang-btn { background: #333; color: #fff; border: 2px solid #555; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: 'Cairo'; }

  .inbox-container { width: 100%; max-width: 600px; }
  .header-title { text-align: center; color: var(--accent); font-size: 32px; margin-bottom: 20px; }
  
  .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid var(--card-border); overflow-x: auto; }
  .tab { flex: 1; padding: 12px 5px; text-align: center; cursor: pointer; font-weight: bold; color: var(--subtitle-color); border-bottom: 3px solid transparent; transition: 0.3s; white-space: nowrap; font-size: 13px; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .card-list { display: flex; flex-direction: column; gap: 15px; }
  .friend-card { background: var(--card-bg); border: 2px solid var(--card-border); border-radius: 15px; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
  .btn-msg { background: #0088cc; color: #fff; padding: 8px 15px; border-radius: 8px; text-decoration: none; font-weight: bold; }
  
  .request-actions { display: flex; gap: 10px; }
  .btn-accept { background: #4caf50; color: #fff; padding: 8px 15px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-family: 'Cairo'; }
  .btn-reject { background: #f44336; color: #fff; padding: 8px 15px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-family: 'Cairo'; }

  .no-data { text-align: center; color: var(--subtitle-color); padding: 30px; background: var(--card-bg); border-radius: 15px; }
  
  .request-box { background: var(--card-bg); border: 2px solid var(--accent); border-radius: 15px; padding: 20px; margin-bottom: 20px; }
  .request-box h3 { color: var(--accent); margin-bottom: 15px; }
  .request-input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid var(--card-border); background: var(--bg-color); color: var(--text-color); font-family: 'Cairo'; outline: none; }
  .request-input:focus { border-color: var(--accent); }
  .btn-submit { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-weight: bold; font-family: 'Cairo'; cursor: pointer; transition: 0.3s; }
  .btn-submit:hover { background: #cc0000; }
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html" class="back-btn" id="backBtn">⬅ رجوع</a>
  <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">EN</button>
</div>

<div class="inbox-container">
  <h1 class="header-title" id="pageTitle">💬 صندوق الرسائل</h1>
  
  <div class="tabs">
    <div class="tab active" onclick="switchTab('friends', this)" id="tabFriends">👥 الأصدقاء</div>
    <div class="tab" onclick="switchTab('admin', this)" id="tabAdmin">📩 الإدارة</div>
    <div class="tab" onclick="switchTab('requests', this)" id="tabRequests">🤝 طلبات</div>
    <div class="tab" onclick="switchTab('ownerReq', this)" id="tabOwnerReq">📩 للأونر</div>
  </div>

  <div id="tab-friends" class="tab-content active">
    <div class="card-list" id="friendsList">
      <div class="no-data" id="loadingFriends">جاري تحميل الأصدقاء...</div>
    </div>
  </div>

  <div id="tab-admin" class="tab-content">
    <div class="card-list" id="adminMessagesList">
      <div class="no-data" id="loadingAdmin">جاري تحميل الرسائل...</div>
    </div>
  </div>

  <div id="tab-requests" class="tab-content">
    <div class="card-list" id="requestsList">
      <div class="no-data" id="loadingRequests">جاري تحميل الطلبات...</div>
    </div>
  </div>

  <div id="tab-ownerReq" class="tab-content">
    <div class="request-box">
      <h3 id="ownerReqTitle">📩 إرسال طلب جديد للأونر</h3>
      <p id="ownerReqDesc" style="font-size: 13px; color: var(--subtitle-color); margin-bottom: 10px;">اكتب طلبك (مثلاً: عايز رتبة VIP، أو بادج معين)، والأونر هيراجعه وهيرد عليك.</p>
      <input type="text" id="reqReason" class="request-input" placeholder="اكتب طلبك هنا...">
      <button class="btn-submit" id="btnSendReq" onclick="sendAdminRequest()">إرسال الطلب 🚀</button>
    </div>
    <h3 id="myReqTitle" style="color: var(--accent); margin-bottom: 10px;">📋 طلباتك السابقة</h3>
    <div class="card-list" id="myOwnerRequestsList">
      <div class="no-data" id="loadingMyReq">جاري تحميل طلباتك...</div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, set, remove, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = { apiKey: "AIzaSyBmyW4tZGJfcHJ4jKSD3_6hebZK58Y3jXo", authDomain: "quiz-hub-app-f4cd0.firebaseapp.com", databaseURL: "https://quiz-hub-app-f4cd0-default-rtdb.firebaseio.com", projectId: "quiz-hub-app-f4cd0", storageBucket: "quiz-hub-app-f4cd0.firebasestorage.app", messagingSenderId: "282772179392", appId: "1:282772179392:web:64646d757592b29ff3a025" };
  const app = initializeApp(firebaseConfig); const db = getDatabase(app);
  window.db = db; window.ref = ref; window.onValue = onValue; window.set = set; window.remove = remove; window.push = push;
</script>

<script>
  if (localStorage.getItem('theme') === 'light') { document.body.classList.add('light-mode'); }

  const currentUser = localStorage.getItem('loggedInUser');
  if (!currentUser) { window.location.href = 'index.html'; }

  let currentLang = localStorage.getItem('lang') || 'ar';
  
  const translations = {
    ar: { 
      back: "⬅ رجوع", title: "💬 صندوق الرسائل", 
      tabFriends: "👥 الأصدقاء", tabAdmin: "📩 الإدارة", tabRequests: "🤝 طلبات", tabOwnerReq: "📩 للأونر", 
      noFriends: "ليس لديك أصدقاء بعد.", noAdmin: "لا توجد رسائل من الإدارة.", noRequests: "لا توجد طلبات صداقة جديدة.", noOwnerReq: "لا توجد طلبات سابقة.", 
      msg: "💬 محادثة", accept: "قبول", reject: "رفض", fromAdmin: "👑 من: ", 
      ownerReqTitle: "📩 إرسال طلب جديد للأونر", ownerReqDesc: "اكتب طلبك (مثلاً: عايز رتبة VIP، أو بادج معين)، والأونر هيراجعه وهيرد عليك.", 
      reqPlaceholder: "اكتب طلبك هنا...", btnSendReq: "إرسال الطلب 🚀", myReqTitle: "📋 طلباتك السابقة",
      reqSent: "تم إرسال طلبك بنجاح! الأونر هيراجعه.", 
      statusPending: "⏳ قيد الانتظار", statusApproved: "✅ تم القبول", writeFirst: "اكتب طلبك الأول!" 
    },
    en: { 
      back: "⬅ Back", title: "💬 Inbox", 
      tabFriends: "👥 Friends", tabAdmin: "📩 Admin", tabRequests: "🤝 Requests", tabOwnerReq: "📩 Owner", 
      noFriends: "You have no friends yet.", noAdmin: "No messages from admin.", noRequests: "No new friend requests.", noOwnerReq: "No previous requests.", 
      msg: "💬 Chat", accept: "Accept", reject: "Reject", fromAdmin: "👑 From: ", 
      ownerReqTitle: "📩 Send New Request to Owner", ownerReqDesc: "Write your request (e.g., I want a VIP rank or a specific badge). The Owner will review it.", 
      reqPlaceholder: "Write your request here...", btnSendReq: "Send Request 🚀", myReqTitle: "📋 Your Previous Requests",
      reqSent: "Request sent successfully! The Owner will review it.", 
      statusPending: "⏳ Pending", statusApproved: "✅ Approved", writeFirst: "Write your request first!" 
    }
  };

  function applyLanguage() {
    const t = translations[currentLang];
    document.body.dir = currentLang === 'en' ? 'ltr' : 'rtl';
    document.getElementById('backBtn').innerText = t.back;
    document.getElementById('pageTitle').innerText = t.title;
    document.getElementById('tabFriends').innerText = t.tabFriends;
    document.getElementById('tabAdmin').innerText = t.tabAdmin;
    document.getElementById('tabRequests').innerText = t.tabRequests;
    document.getElementById('tabOwnerReq').innerText = t.tabOwnerReq;
    document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'EN' : 'AR';
    
    // ترجمة نصوص تبويب طلبات الأونر
    document.getElementById('ownerReqTitle').innerText = t.ownerReqTitle;
    document.getElementById('ownerReqDesc').innerText = t.ownerReqDesc;
    document.getElementById('reqReason').placeholder = t.reqPlaceholder;
    document.getElementById('btnSendReq').innerText = t.btnSendReq;
    document.getElementById('myReqTitle').innerText = t.myReqTitle;
    
    // إعادة تحميل البيانات عشان تتحدث باللغة الجديدة
    loadFriends(); 
    loadAdminMessages(); 
    loadRequests();
    loadMyOwnerRequests();
  }

  window.toggleLanguage = function() {
    currentLang = currentLang === 'ar' ? 'en' : 'ar';
    localStorage.setItem('lang', currentLang);
    applyLanguage();
  }

  window.switchTab = function(tabName, el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('tab-' + tabName).classList.add('active');
  }

  function loadFriends() {
    const friendsList = document.getElementById('friendsList');
    const t = translations[currentLang];
    
    window.onValue(window.ref(window.db, 'friends'), (snapshot) => {
      const allFriendsData = snapshot.val();
      let myFriends = {};

      if (allFriendsData) {
        for (let userKey in allFriendsData) {
          if (userKey.toLowerCase() === currentUser.toLowerCase()) {
            myFriends = allFriendsData[userKey];
            break; 
          }
        }
      }

      friendsList.innerHTML = '';
      if (!myFriends || Object.keys(myFriends).length === 0) { 
        friendsList.innerHTML = `<div class="no-data">${t.noFriends}</div>`; 
        return; 
      }
      
      for (let friend in myFriends) {
        const div = document.createElement('div');
        div.className = 'friend-card';
        div.innerHTML = `<div style="display:flex; align-items:center; gap:10px;"><div style="width:40px; height:40px; background:var(--accent); border-radius:50%; display:flex; justify-content:center; align-items:center; color:#fff; font-weight:bold;">${friend.charAt(0).toUpperCase()}</div> <b>${friend}</b></div> <a href="messages.html?to=${friend}" class="btn-msg">${t.msg}</a>`;
        friendsList.appendChild(div);
      }
    });
  }

  function loadAdminMessages() {
    window.onValue(window.ref(window.db, 'messages/' + currentUser), (snapshot) => {
      const data = snapshot.val();
      const adminList = document.getElementById('adminMessagesList');
      const t = translations[currentLang];
      adminList.innerHTML = '';
      if (!data) { adminList.innerHTML = `<div class="no-data">${t.noAdmin}</div>`; return; }
      const msgs = Object.values(data).reverse();
      msgs.forEach(msg => {
        const div = document.createElement('div');
        div.style.cssText = "background: var(--card-bg); border-right: 5px solid var(--accent); border-radius: 10px; padding: 15px; margin-bottom: 10px;";
        div.innerHTML = `<h4 style="color:var(--accent); margin-bottom:5px;">${t.fromAdmin}${msg.from}</h4><p>${msg.text}</p>`;
        adminList.appendChild(div);
      });
    });
  }

  function loadRequests() {
    const requestsList = document.getElementById('requestsList');
    const t = translations[currentLang];

    window.onValue(window.ref(window.db, 'friend_requests'), (snapshot) => {
      const allRequests = snapshot.val();
      let myRequests = {};
      let myKeyInDB = null;

      if (allRequests) {
        for (let userKey in allRequests) {
          if (userKey.toLowerCase() === currentUser.toLowerCase()) {
            myRequests = allRequests[userKey];
            myKeyInDB = userKey;
            break;
          }
        }
      }

      requestsList.innerHTML = '';
      if (!myRequests || Object.keys(myRequests).length === 0) { 
        requestsList.innerHTML = `<div class="no-data">${t.noRequests}</div>`; 
        return; 
      }
      
      for (let sender in myRequests) {
        const div = document.createElement('div');
        div.className = 'friend-card';
        div.innerHTML = `
            <div style="display:flex; align-items:center; gap:10px;">
                <div style="width:40px; height:40px; background:#ffd700; border-radius:50%; display:flex; justify-content:center; align-items:center; color:#000; font-weight:bold;">${sender.charAt(0).toUpperCase()}</div> 
                <b>${sender}</b>
            </div> 
            <div class="request-actions">
                <button class="btn-accept" onclick="acceptRequest('${sender}', '${myKeyInDB}')">${t.accept}</button>
                <button class="btn-reject" onclick="rejectRequest('${sender}', '${myKeyInDB}')">${t.reject}</button>
            </div>
        `;
        requestsList.appendChild(div);
      }
    });
  }

  window.acceptRequest = async function(sender, myKey) {
    await window.set(window.ref(window.db, 'friends/' + currentUser + '/' + sender), true);
    await window.set(window.ref(window.db, 'friends/' + sender + '/' + currentUser), true);
    await window.remove(window.ref(window.db, 'friend_requests/' + myKey + '/' + sender));
    alert(currentLang === 'en' ? 'Friend request accepted!' : 'تم قبول طلب الصداقة!');
  }

  window.rejectRequest = async function(sender, myKey) {
    await window.remove(window.ref(window.db, 'friend_requests/' + myKey + '/' + sender));
    alert(currentLang === 'en' ? 'Friend request rejected.' : 'تم رفض طلب الصداقة.');
  }

  // ================= دوال الطلبات (للأونر) =================
  window.sendAdminRequest = async function() {
    const input = document.getElementById('reqReason');
    const text = input.value.trim();
    const t = translations[currentLang];
    if(!text) { alert(t.writeFirst); return; }

    try {
      await window.push(window.ref(window.db, 'admin_requests'), {
        user: currentUser,
        text: text,
        status: 'pending',
        time: Date.now()
      });
      input.value = '';
      alert(t.reqSent);
    } catch(e) {
      alert("Error: " + e.message);
    }
  }

  function loadMyOwnerRequests() {
    const list = document.getElementById('myOwnerRequestsList');
    const t = translations[currentLang];

    window.onValue(window.ref(window.db, 'admin_requests'), (snapshot) => {
      const data = snapshot.val();
      list.innerHTML = '';
      if(!data) { list.innerHTML = `<div class="no-data">${t.noOwnerReq}</div>`; return; }

      let myReqs = [];
      for(let key in data) {
        if(data[key].user.toLowerCase() === currentUser.toLowerCase()) {
          myReqs.push({ id: key, ...data[key] });
        }
      }

      if(myReqs.length === 0) { list.innerHTML = `<div class="no-data">${t.noOwnerReq}</div>`; return; }

      myReqs.sort((a,b) => b.time - a.time).forEach(req => {
        const div = document.createElement('div');
        div.className = 'friend-card';
        div.style.flexDirection = 'column';
        div.style.alignItems = 'flex-start';
        
        const statusBadge = req.status === 'approved' 
          ? `<span style="background:#4caf50; color:#fff; padding:3px 8px; border-radius:5px; font-size:12px; margin-top:5px; display:inline-block;">${t.statusApproved}</span>`
          : `<span style="background:#ff9800; color:#000; padding:3px 8px; border-radius:5px; font-size:12px; margin-top:5px; display:inline-block;">${t.statusPending}</span>`;

        div.innerHTML = `<p style="margin-bottom:5px; font-weight:bold;">${req.text}</p>${statusBadge}`;
        list.appendChild(div);
      });
    });
  }

  window.onload = () => {
    if (localStorage.getItem('theme') === 'light') { document.body.classList.add('light-mode'); }
    applyLanguage();
  };
</script>
</body>
</html>
