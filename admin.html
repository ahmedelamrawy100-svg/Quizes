<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛡️ لوحة الإدارة - Quiz Hub</title>
<link rel="icon" type="image/png" href="pic/Logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --surface-2: #f0f2f5;
    --text: #1a1a1a;
    --text-secondary: #6b7280;
    --border: #e5e7eb;
    --primary: #3b82f6;
    --primary-hover: #2563eb;
    --primary-light: #eff6ff;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --gold: #eab308;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --radius: 12px;
    --radius-sm: 8px;
  }

  body.dark-mode {
    --bg: #0f1419;
    --surface: #1a1f26;
    --surface-2: #232a33;
    --text: #f9fafb;
    --text-secondary: #9ca3af;
    --border: #2d3748;
    --primary-light: #0f1e35;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: background 0.3s, color 0.3s;
    -webkit-font-smoothing: antialiased;
  }

  #adminContent {
    display: none;
    width: 100%;
    max-width: 1280px;
    animation: fadeUp 0.4s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== Toast ===== */
  #toast-container {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .toast {
    background: var(--surface);
    border-right: 4px solid var(--success);
    color: var(--text);
    padding: 14px 18px;
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-md);
    font-weight: 600;
    font-size: 14px;
    animation: slideIn 0.3s ease;
    min-width: 240px;
  }

  .toast.error { border-right-color: var(--danger); }

  @keyframes slideIn {
    from { transform: translateX(-100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* ===== Header ===== */
  .top-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--surface);
    padding: 16px 24px;
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-icon {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, var(--primary), #60a5fa);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
  }

  .brand-text h1 {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.2;
  }

  .brand-text p {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .icon-btn {
    width: 40px;
    height: 40px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    font-family: 'Cairo';
  }

  .icon-btn:hover {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
    transform: translateY(-1px);
  }

  .btn-back {
    padding: 10px 18px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .btn-back:hover {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  /* ===== Nav Tabs ===== */
  .tabs-bar {
    display: flex;
    gap: 4px;
    background: var(--surface);
    padding: 6px;
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    margin-bottom: 24px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .tabs-bar::-webkit-scrollbar { display: none; }

  .tab-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-family: 'Cairo';
    font-size: 14px;
    font-weight: 600;
    padding: 10px 16px;
    cursor: pointer;
    border-radius: var(--radius-sm);
    transition: all 0.2s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .tab-btn:hover {
    background: var(--surface-2);
    color: var(--text);
  }

  .tab-btn.active {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 2px 8px rgba(59, 130, 246, 0.35);
  }

  /* ===== Tab Content ===== */
  .tab-content {
    display: none;
    animation: fadeUp 0.3s ease;
  }

  .tab-content.active {
    display: block;
  }

  /* ===== Stats Grid ===== */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    text-align: center;
    transition: all 0.2s;
  }

  .stat-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: var(--primary);
  }

  .stat-card .stat-label {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 8px;
    font-weight: 600;
  }

  .stat-card .stat-value {
    font-size: 28px;
    font-weight: 900;
    color: var(--primary);
    line-height: 1;
  }

  .stat-card.gold .stat-value { color: var(--gold); }
  .stat-card.green .stat-value { color: var(--success); }
  .stat-card.purple .stat-value { color: #a855f7; }

  /* ===== Section ===== */
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: var(--shadow-sm);
  }

  .section-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--border);
  }

  .section-title.danger { color: var(--danger); }
  .section-title.gold { color: var(--gold); }

  /* ===== List ===== */
  .list-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .item {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    transition: all 0.2s;
  }

  .item:hover {
    border-color: var(--primary);
  }

  .item h3 {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }

  .item p {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 4px;
  }

  /* ===== Form ===== */
  .form-control {
    width: 100%;
    padding: 11px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-family: 'Cairo';
    font-size: 14px;
    outline: none;
    margin-bottom: 12px;
    transition: all 0.2s;
  }

  .form-control:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    background: var(--surface);
  }

  .form-control::placeholder {
    color: var(--text-secondary);
    opacity: 0.7;
  }

  /* ===== Buttons ===== */
  .btn {
    padding: 9px 16px;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'Cairo';
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }

  .btn:hover {
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }

  .btn:active {
    transform: translateY(0);
  }

  .btn-blue { background: var(--primary); color: #fff; }
  .btn-blue:hover { background: var(--primary-hover); }

  .btn-red { background: var(--danger); color: #fff; }
  .btn-red:hover { background: #dc2626; }

  .btn-green { background: var(--success); color: #fff; }
  .btn-green:hover { background: #059669; }

  .btn-gold { background: var(--gold); color: #000; }
  .btn-gold:hover { background: #ca8a04; }

  .btn-orange { background: var(--warning); color: #fff; }
  .btn-orange:hover { background: #d97706; }

  .btn-ghost {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover {
    background: var(--surface-2);
    border-color: var(--primary);
    color: var(--primary);
  }

  /* ===== Responsive ===== */
  @media (max-width: 640px) {
    body { padding: 12px; }
    .top-header { padding: 12px 16px; }
    .brand-text h1 { font-size: 16px; }
    .stat-card .stat-value { font-size: 24px; }
    .tab-btn { font-size: 13px; padding: 9px 12px; }
    .item { padding: 12px 14px; }
  }
</style>
</head>
<body>

<div id="adminContent">
  <div id="toast-container"></div>

  <!-- Header -->
  <div class="top-header">
    <div class="brand">
      <div class="brand-icon">🛡️</div>
      <div class="brand-text">
        <h1 id="panelTitle">لوحة الإدارة</h1>
        <p>مرحباً <span id="adminName">Admin</span></p>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="window.toggleTheme()" id="themeBtn" title="تبديل الثيم">🌙</button>
      <a href="index.html" class="btn-back">⬅ رجوع</a>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs-bar">
    <button class="tab-btn active" onclick="switchTab('dashboard', this)">📊 الإحصائيات</button>
    <button class="tab-btn" onclick="switchTab('users', this)">👥 اللاعبين</button>
    <button class="tab-btn" onclick="switchTab('content', this)">📝 المحتوى</button>
    <button class="tab-btn" onclick="switchTab('rooms', this)">🚪 الغرف</button>
    <button class="tab-btn" onclick="switchTab('warnings', this)">⚠️ التحذيرات</button>
    <button class="tab-btn" onclick="switchTab('tickets', this)">🎫 الدعم</button>
    <button class="tab-btn" onclick="switchTab('owner_msg', this)">📩 الأونر</button>
  </div>

  <!-- ============ Dashboard ============ -->
  <div id="tab-dashboard" class="tab-content active">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">👥 اللاعبين</div>
        <div class="stat-value" id="statUsers">0</div>
      </div>
      <div class="stat-card gold">
        <div class="stat-label">🎮 كويزات اتلعبت</div>
        <div class="stat-value" id="statPlays">0</div>
      </div>
      <div class="stat-card purple">
        <div class="stat-label">🚪 غرف نشطة</div>
        <div class="stat-value" id="statRooms">0</div>
      </div>
    </div>
  </div>

  <!-- ============ Users ============ -->
  <div id="tab-users" class="tab-content">
    <div class="section">
      <div class="section-title">👥 إدارة اللاعبين</div>
      <input type="text" id="searchUser" class="form-control" placeholder="🔍 ابحث عن لاعب..." onkeyup="window.renderUsers()">
      <div class="list-container" id="usersList">
        <div class="item">جاري التحميل...</div>
      </div>
    </div>
  </div>

  <!-- ============ Content ============ -->
  <div id="tab-content" class="tab-content">
    <div class="section">
      <div class="section-title danger">💬 التعليقات</div>
      <div class="list-container" id="commentsList"></div>
    </div>

    <div class="section">
      <div class="section-title danger">💡 الاقتراحات</div>
      <div class="list-container" id="suggestionsList"></div>
    </div>

    <div class="section">
      <div class="section-title danger">🎬 طلبات الكويزات</div>
      <div class="list-container" id="requestsList"></div>
    </div>
  </div>

  <!-- ============ Rooms ============ -->
  <div id="tab-rooms" class="tab-content">
    <div class="section">
      <div class="section-title">🚪 الغرف النشطة حالياً</div>
      <div class="list-container" id="roomsList"></div>
    </div>
  </div>

  <!-- ============ Warnings ============ -->
  <div id="tab-warnings" class="tab-content">
    <div class="section">
      <div class="section-title danger">⚠️ التحذيرات المسجلة</div>
      <div class="list-container" id="warningsList"></div>
    </div>
  </div>

  <!-- ============ Tickets ============ -->
  <div id="tab-tickets" class="tab-content">
    <div class="section">
      <div class="section-title">🎫 تذاكر الدعم الفني</div>
      <div class="list-container" id="adminTicketsList"></div>
    </div>
  </div>

  <!-- ============ Owner Msg ============ -->
  <div id="tab-owner_msg" class="tab-content">
    <div class="section">
      <div class="section-title gold">📩 إرسال رسالة للأونر</div>
      <textarea id="adminMsgInput" class="form-control" rows="4" placeholder="اكتب رسالتك هنا..."></textarea>
      <button class="btn btn-green" onclick="window.sendToOwner()" style="width:100%;">إرسال 📨</button>
    </div>

    <div class="section">
      <div class="section-title gold">📋 الردود من الأونر</div>
      <div class="list-container" id="ownerRepliesList">
        <div class="item">لا توجد ردود بعد</div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, get, set, remove, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = { apiKey: "AIzaSyBmyW4tZGJfcHJ4jKSD3_6hebZK58Y3jXo", authDomain: "quiz-hub-app-f4cd0.firebaseapp.com", databaseURL: "https://quiz-hub-app-f4cd0-default-rtdb.firebaseio.com", projectId: "quiz-hub-app-f4cd0", storageBucket: "quiz-hub-app-f4cd0.firebasestorage.app", messagingSenderId: "282772179392", appId: "1:282772179392:web:64646d757592b29ff3a025" };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  window.db = db; window.ref = ref; window.onValue = onValue; window.get = get;
  window.set = set; window.remove = remove; window.push = push;

  const currentUser = localStorage.getItem('loggedInUser');
  if (!currentUser) window.location.href = 'index.html';

  // التحقق من الصلاحية
  if (currentUser.toLowerCase() === 'ahmed') {
      document.getElementById('adminContent').style.display = 'block';
      document.getElementById('adminName').innerText = currentUser;
      initData();
  } else {
      window.get(window.ref(window.db, 'roles/admins/' + currentUser)).then(snap => {
          if (snap.exists()) {
              document.getElementById('adminContent').style.display = 'block';
              document.getElementById('adminName').innerText = currentUser;
              initData();
          } else {
              document.body.innerHTML = '<h1 style="color:red; text-align:center; margin-top:20%;">⛔ وصول مرفوض. أنت لست أدمن.</h1>';
          }
      });
  }

  // الثيم
  if (localStorage.getItem('adminTheme') === 'dark') {
      document.body.classList.add('dark-mode');
      setTimeout(() => { const btn = document.getElementById('themeBtn'); if (btn) btn.innerText = '☀️'; }, 100);
  }

  window.toggleTheme = function() {
      const isDark = document.body.classList.toggle('dark-mode');
      document.getElementById('themeBtn').innerText = isDark ? '☀️' : '🌙';
      localStorage.setItem('adminTheme', isDark ? 'dark' : 'light');
  };

  // Toast
  window.showToast = function(msg, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast' + (type === 'error' ? ' error' : '');
      toast.innerText = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
  };

  // Tabs
  window.switchTab = function(id, el) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(n => n.classList.remove('active'));
      document.getElementById('tab-' + id).classList.add('active');
      el.classList.add('active');
  };

  let allUsers = {}, allScores = {}, allRooms = {};
  let isDataLoaded = false;

  function initData() {
      if (isDataLoaded) return;
      isDataLoaded = true;

      window.onValue(window.ref(window.db, 'usernames'), snap => {
          allUsers = snap.val() || {};
          document.getElementById('statUsers').innerText = Object.keys(allUsers).length;
          window.renderUsers();
      });

      window.onValue(window.ref(window.db, 'scores'), snap => {
          allScores = snap.val() || {};
          let plays = 0;
          for (let u in allScores) {
              for (let q in allScores[u]) {
                  plays += Object.keys(allScores[u][q]).length;
              }
          }
          document.getElementById('statPlays').innerText = plays;
      });

      window.onValue(window.ref(window.db, 'rooms'), snap => {
          allRooms = snap.val() || {};
          document.getElementById('statRooms').innerText = Object.keys(allRooms).length;
          window.renderRooms();
      });

      loadContent('comments', 'commentsList');
      loadContent('suggestions', 'suggestionsList');
      loadContent('quiz_requests', 'requestsList');
      loadWarnings();

      // تذاكر الدعم
      window.onValue(window.ref(window.db, 'support_tickets'), snap => {
          const list = document.getElementById('adminTicketsList');
          if (!list) return;
          list.innerHTML = '';
          if (!snap.exists()) {
              list.innerHTML = '<div class="item">لا توجد تذاكر دعم.</div>';
              return;
          }
          const data = snap.val();
          Object.keys(data).reverse().forEach(key => {
              const t = data[key];
              const div = document.createElement('div');
              div.className = 'item';
              div.innerHTML = `
                  <div>
                      <h3 style="color:var(--gold);">🎫 تذكرة #${key.slice(-4)}</h3>
                      <p>${t.text}</p>
                      <p style="font-size:12px; color:var(--text-secondary);">من: ${t.by}</p>
                  </div>
                  <button class="btn btn-green" onclick="window.resolveTicket('${key}')">تم الحل ✅</button>
              `;
              list.appendChild(div);
          });
      });

      // ردود الأونر
      window.onValue(window.ref(window.db, 'messages/' + currentUser), snap => {
          const list = document.getElementById('ownerRepliesList');
          if (!list || !snap.exists()) return;
          list.innerHTML = '';
          Object.values(snap.val()).reverse().forEach(msg => {
              const div = document.createElement('div');
              div.className = 'item';
              div.innerHTML = `<div><h3 style="color:var(--primary);">👑 من الأونر</h3><p>${msg.text}</p></div>`;
              list.appendChild(div);
          });
      });
  }

  window.resolveTicket = async (key) => {
      await window.remove(window.ref(window.db, 'support_tickets/' + key));
      showToast('تم حل التذكرة');
  };

  window.sendToOwner = async function() {
      const text = document.getElementById('adminMsgInput').value;
      if (!text) return;
      await window.push(window.ref(window.db, 'messages/owner_inbox'), { from: 'Admin: ' + currentUser, text: text, time: Date.now() });
      showToast('تم إرسال الرسالة للأونر!');
      document.getElementById('adminMsgInput').value = '';
  };

  window.renderUsers = function() {
      const container = document.getElementById('usersList');
      if (!container) return;
      container.innerHTML = '';
      const search = document.getElementById('searchUser').value.toLowerCase();

      Object.keys(allUsers).filter(u => u.toLowerCase().includes(search)).forEach(u => {
          const div = document.createElement('div');
          div.className = 'item';
          div.innerHTML = `
              <div>
                  <h3>👤 ${u}</h3>
              </div>
              <div style="display:flex; gap:6px; flex-wrap:wrap;">
                  <button class="btn btn-blue" onclick="window.editXP('${u}')">تعديل XP</button>
                  <button class="btn btn-gold" onclick="window.sendDM('${u}')">رسالة</button>
                  <button class="btn btn-orange" onclick="window.warnUser('${u}')">تحذير ⚠️</button>
              </div>
          `;
          container.appendChild(div);
      });
  };

  window.renderRooms = function() {
      const list = document.getElementById('roomsList');
      if (!list) return;
      list.innerHTML = '';
      if (Object.keys(allRooms).length === 0) {
          list.innerHTML = '<div class="item">لا توجد غرف نشطة.</div>';
          return;
      }
      for (let room in allRooms) {
          const div = document.createElement('div');
          div.className = 'item';
          div.innerHTML = `
              <div><p>كود الغرفة: <b style="color:var(--gold)">${room}</b></p></div>
              <button class="btn btn-red" onclick="window.deleteRoom('${room}')">مسح 🗑️</button>
          `;
          list.appendChild(div);
      }
  };

  function loadContent(node, elId) {
      window.onValue(window.ref(window.db, node), snap => {
          const list = document.getElementById(elId);
          if (!list) return;
          list.innerHTML = '';
          if (!snap.exists()) {
              list.innerHTML = '<div class="item">لا يوجد محتوى.</div>';
              return;
          }
          Object.keys(snap.val()).reverse().forEach(key => {
              const c = snap.val()[key];
              const div = document.createElement('div');
              div.className = 'item';
              div.innerHTML = `
                  <div>
                      <p style="color:var(--gold); font-size:12px;">👤 ${c.user || 'Unknown'}</p>
                      <p>${c.text || ''}</p>
                  </div>
                  <button class="btn btn-red" onclick="window.deleteItem('${node}', '${key}')">مسح 🗑️</button>
              `;
              list.appendChild(div);
          });
      });
  }

  function loadWarnings() {
      window.onValue(window.ref(window.db, 'warnings'), snap => {
          const list = document.getElementById('warningsList');
          if (!list) return;
          list.innerHTML = '';
          if (!snap.exists()) {
              list.innerHTML = '<div class="item">لا توجد تحذيرات.</div>';
              return;
          }
          const data = snap.val();
          Object.keys(data).forEach(user => {
              const warn = data[user];
              const div = document.createElement('div');
              div.className = 'item';
              div.innerHTML = `
                  <div>
                      <h3 style="color:var(--gold);">👤 ${user}</h3>
                      <p>السبب: ${warn.text}</p>
                  </div>
                  <button class="btn btn-red" onclick="window.removeWarning('${user}')">إزالة 🗑️</button>
              `;
              list.appendChild(div);
          });
      });
  }

  window.removeWarning = (user) => {
      if (confirm('متأكد؟')) {
          window.remove(window.ref(window.db, 'warnings/' + user));
          showToast('تم الإزالة');
      }
  };

  window.editXP = async (u) => {
      const xpSnap = await window.get(window.ref(window.db, 'users_data/' + u + '/xp'));
      const xp = xpSnap.exists() ? xpSnap.val() : 0;
      const newXp = prompt(`XP for ${u}:`, xp);
      if (newXp !== null && !isNaN(newXp)) {
          await window.set(window.ref(window.db, 'users_data/' + u + '/xp'), parseInt(newXp));
          showToast('تم تحديث XP');
      }
  };

  window.sendDM = (u) => {
      const msg = prompt(`رسالة لـ ${u}:`);
      if (msg) {
          window.push(window.ref(window.db, 'messages/' + u), { from: 'Admin', text: msg, time: Date.now() });
          showToast('تم الإرسال!');
      }
  };

  window.warnUser = async (u) => {
      const msg = prompt(`سبب التحذير لـ ${u}:`);
      if (msg) {
          await window.set(window.ref(window.db, 'warnings/' + u), { text: msg, date: Date.now() });
          showToast('تم إرسال التحذير');
      }
  };

  window.deleteRoom = (room) => {
      if (confirm('مسح الغرفة؟')) {
          window.remove(window.ref(window.db, 'rooms/' + room));
          showToast('تم المسح');
      }
  };

  window.deleteItem = (node, key) => {
      if (confirm('متأكد؟')) {
          window.remove(window.ref(window.db, node + '/' + key));
          showToast('تم المسح');
      }
  };
</script>
</body>
</html>
