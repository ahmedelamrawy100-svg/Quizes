<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏗️ Quiz Builder - Quiz Hub</title>
<link rel="icon" type="image/png" href="pic/Logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f7fa; --surface: #ffffff; --surface-2: #f0f2f5;
    --text: #1a1a1a; --text-secondary: #6b7280; --border: #e5e7eb;
    --primary: #10b981; --primary-hover: #059669; --primary-light: #ecfdf5;
    --danger: #ef4444; --gold: #eab308; --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --radius: 12px; --radius-sm: 8px;
  }
  body.dark-mode {
    --bg: #0f1419; --surface: #1a1f26; --surface-2: #232a33;
    --text: #f9fafb; --text-secondary: #9ca3af; --border: #2d3748;
    --primary-light: #052e16;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; padding: 24px 16px; display: flex; flex-direction: column; align-items: center; transition: 0.3s; }
  
  #builderContent { display: none; width: 100%; max-width: 900px; animation: fadeUp 0.4s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  
  .top-header { display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 16px 24px; border-radius: var(--radius); box-shadow: var(--shadow-sm); margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-icon { width: 44px; height: 44px; background: linear-gradient(135deg, var(--primary), #34d399); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
  .brand-text h1 { font-size: 18px; font-weight: 700; line-height: 1.2; }
  
  .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .icon-btn { width: 40px; height: 40px; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: var(--radius-sm); cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; font-family: 'Cairo'; }
  .icon-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); transform: translateY(-1px); }
  .btn-back { padding: 10px 18px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm); text-decoration: none; font-weight: 600; font-size: 14px; transition: all 0.2s; }
  .btn-back:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
  
  .tabs-bar { display: flex; gap: 4px; background: var(--surface); padding: 6px; border-radius: var(--radius); box-shadow: var(--shadow-sm); margin-bottom: 24px; overflow-x: auto; scrollbar-width: none; }
  .tabs-bar::-webkit-scrollbar { display: none; }
  .tab-btn { background: transparent; border: none; color: var(--text-secondary); font-family: 'Cairo'; font-size: 14px; font-weight: 600; padding: 10px 16px; cursor: pointer; border-radius: var(--radius-sm); transition: all 0.2s; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .tab-btn:hover { background: var(--surface-2); color: var(--text); }
  .tab-btn.active { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(16, 185, 129, 0.35); }
  
  .tab-content { display: none; animation: fadeUp 0.3s ease; }
  .tab-content.active { display: block; }
  
  .section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 25px; margin-bottom: 25px; box-shadow: var(--shadow-sm); }
  .section h3 { color: var(--primary); margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 15px; font-size: 18px; display: flex; align-items: center; gap: 10px; }
  
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; margin-bottom: 8px; color: var(--text); font-size: 15px; font-weight: 700; }
  .form-control { width: 100%; padding: 12px 15px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-family: 'Cairo'; font-size: 14px; outline: none; transition: 0.3s; }
  .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15); background: var(--surface); }
  
  .question-block { background: var(--surface-2); border: 2px dashed var(--border); border-radius: var(--radius-sm); padding: 25px; margin-bottom: 20px; position: relative; transition: 0.3s; }
  .question-block:hover { border-color: var(--primary); }
  .question-block::before { content: attr(data-number); position: absolute; top: -14px; right: 20px; background: var(--primary); color: #fff; padding: 4px 15px; border-radius: 10px; font-size: 14px; font-weight: bold; }
  .remove-q { position: absolute; top: 15px; left: 15px; background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-family: 'Cairo'; font-size: 13px; transition: 0.3s; }
  .remove-q:hover { background: var(--danger); color: #fff; }
  
  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; padding-top: 20px; border-top: 1px solid var(--border); }
  @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }
  
  .option-row { display: flex; align-items: center; gap: 10px; background: var(--surface); padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border); transition: 0.3s; }
  .option-row:focus-within { border-color: var(--primary); }
  .option-row input[type="radio"] { cursor: pointer; width: 20px; height: 20px; accent-color: var(--primary); }
  .option-row input[type="text"] { border: none; background: transparent; color: var(--text); font-family: 'Cairo'; width: 100%; outline: none; font-size: 14px; }
  
  .btn { padding: 12px 25px; border: none; border-radius: var(--radius-sm); font-family: 'Cairo'; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn:hover { transform: translateY(-2px); opacity: 0.9; }
  .btn-green { background: var(--primary); color: #fff; }
  .btn-blue { background: #3b82f6; color: #fff; }
  .btn-gold { background: var(--gold); color: #000; }
  .btn-full { width: 100%; padding: 15px; border: 2px dashed var(--primary); background: transparent; color: var(--primary); font-size: 16px; }
  .btn-full:hover { background: var(--primary-light); }
  
  #outputCode { width: 100%; height: 500px; background: #000; color: #00ffcc; font-family: monospace; padding: 20px; border-radius: var(--radius-sm); border: 1px solid var(--border); display: none; margin-top: 20px; direction: ltr; text-align: left; font-size: 13px; line-height: 1.5; }
  #toast { visibility: hidden; min-width: 250px; background: var(--primary); color: #fff; text-align: center; border-radius: 8px; padding: 15px; position: fixed; z-index: 10000; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 16px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.3s, bottom 0.3s; }
  #toast.show { visibility: visible; opacity: 1; bottom: 50px; }
  #toast.error { background: var(--danger); }
  
  .list-box { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 15px; min-height: 100px; }
</style>
</head>
<body>

<div id="toast">تم النسخ بنجاح!</div>

<div id="builderContent">
  <div class="top-header">
    <div class="brand">
      <div class="brand-icon">🏗️</div>
      <div class="brand-text">
        <h1>صانع الكويزات</h1>
        <p>Quiz Builder</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
      <a href="index.html" class="btn-back">⬅ رجوع</a>
    </div>
  </div>

  <div class="tabs-bar">
      <button class="tab-btn active" onclick="switchTab('builder', this)">🛠️ صانع الكويزات</button>
      <button class="tab-btn" onclick="switchTab('owner_msg', this)">📩 رسائل الأونر</button>
  </div>

  <div id="tab-builder" class="tab-content active">
      <div class="section">
        <h3>1. إعدادات الكويز الأساسية</h3>
        <div class="form-group">
          <label>📄 اسم الملف (File Name)</label>
          <input type="text" id="quizFileName" class="form-control" placeholder="مثال: Comedy.html">
        </div>
        <div class="form-group">
          <label>🏷️ عنوان الكويز</label>
          <input type="text" id="quizTitle" class="form-control" placeholder="مثال: كويز الكوميديا 🎭">
        </div>
        <div class="form-group">
          <label>🔑 كود الكويز (Quiz ID)</label>
          <input type="text" id="quizVarName" class="form-control" placeholder="مثال: comedyQuizData" value="customQuizData">
        </div>
      </div>

      <div class="section">
        <h3>2. الأسئلة والإجابات</h3>
        <div id="questionsContainer"></div>
        <button class="btn btn-full" onclick="addQuestion()">➕ إضافة سؤال جديد</button>
      </div>

      <div class="section" style="text-align:center; display:flex; flex-direction:column; gap:15px;">
        <h3>3. توليد الكود</h3>
        <button class="btn btn-gold" style="font-size:18px; padding:15px;" onclick="generateHTML()">🚀 توليد كود الملف الكامل</button>
        <button class="btn btn-green" id="copyBtn" style="display:none; font-size:18px; padding:15px;" onclick="copyCode()">📋 نسخ الكود</button>
      </div>

      <textarea id="outputCode" readonly></textarea>
  </div>

  <div id="tab-owner_msg" class="tab-content">
      <div class="section" style="max-width:600px; margin:0 auto;">
          <h3>📩 إرسال رسالة للأونر</h3>
          <textarea id="builderMsgInput" class="form-control" rows="4" placeholder="اكتب رسالتك هنا..."></textarea>
          <button class="btn btn-green" style="width:100%; margin-top:10px;" onclick="sendToOwner()">إرسال 📨</button>
          
          <h3 style="color:var(--primary); margin:20px 0 10px;">📋 الردود من الأونر</h3>
          <div class="list-box" id="ownerRepliesList">
              <div style="text-align:center; color:var(--text-secondary);">لا توجد ردود بعد</div>
          </div>
      </div>
  </div>
</div>

</template>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, get, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
  
  const firebaseConfig = { apiKey: "AIzaSyBmyW4tZGJfcHJ4jKSD3_6hebZK58Y3jXo", authDomain: "quiz-hub-app-f4cd0.firebaseapp.com", databaseURL: "https://quiz-hub-app-f4cd0-default-rtdb.firebaseio.com", projectId: "quiz-hub-app-f4cd0", storageBucket: "quiz-hub-app-f4cd0.firebasestorage.app", messagingSenderId: "282772179392", appId: "1:282772179392:web:64646d757592b29ff3a025" };
  const app = initializeApp(firebaseConfig); const db = getDatabase(app);
  window.db = db; window.ref = ref; window.get = get; window.push = push; window.onValue = onValue;

  const currentUser = localStorage.getItem('loggedInUser');
  if (!currentUser) window.location.href = 'index.html';

  // الثيم
  if (localStorage.getItem('builderTheme') === 'dark') {
      document.body.classList.add('dark-mode');
      setTimeout(() => { const btn = document.getElementById('themeBtn'); if (btn) btn.innerText = '☀️'; }, 100);
  }
  window.toggleTheme = function() {
      const isDark = document.body.classList.toggle('dark-mode');
      document.getElementById('themeBtn').innerText = isDark ? '☀️' : '🌙';
      localStorage.setItem('builderTheme', isDark ? 'dark' : 'light');
  };

  document.addEventListener('DOMContentLoaded', () => {
      window.get(window.ref(window.db, 'roles/users/' + currentUser)).then(snap => {
          const role = snap.exists() ? snap.val() : 'Player';
          if (role === 'Admin' || role === 'Manager' || currentUser.toLowerCase() === 'ahmed') {
              document.getElementById('builderContent').style.display = 'block';
              
              window.onValue(window.ref(window.db, 'messages/' + currentUser), msgSnap => {
                  const list = document.getElementById('ownerRepliesList');
                  if(!list) return;
                  list.innerHTML = '';
                  if (!msgSnap.exists()) {
                      list.innerHTML = '<div style="text-align:center; color:var(--text-secondary);">لا توجد ردود بعد</div>';
                      return;
                  }
                  Object.values(msgSnap.val()).reverse().forEach(msg => {
                      list.innerHTML += `<div style="border-bottom:1px solid var(--border); padding:8px 0; color:var(--text);">${msg.text}</div>`;
                  });
              });
          } else {
              document.body.innerHTML = '<h1 style="color:red; text-align:center; margin-top:20%; font-family:Cairo;">⛔ وصول مرفوض. الأداة دي للمديرين والأدمنز فقط.</h1>';
          }
      });
  });

  window.switchTab = function(tabId, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + tabId).classList.add('active');
  };

  window.sendToOwner = async function() {
      const text = document.getElementById('builderMsgInput').value;
      if(!text) return;
      await window.push(window.ref(window.db, 'messages/owner_inbox'), { from: 'Builder: ' + currentUser, text: text, time: Date.now() });
      alert('تم إرسال الرسالة للأونر!');
      document.getElementById('builderMsgInput').value = '';
  };

  window.showToastMessage = function(msg, isError = false) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.className = isError ? 'show error' : 'show';
      setTimeout(() => { toast.className = toast.className.replace('show', ''); }, 3000);
  }

  let qCount = 0;
  window.addQuestion = function() {
      qCount++;
      const div = document.createElement('div');
      div.className = 'question-block';
      div.id = 'q' + qCount;
      div.setAttribute('data-number', 'سؤال ' + qCount);
      
      div.innerHTML = `
          <button class="remove-q" onclick="document.getElementById('q${qCount}').remove()">🗑️ مسح السؤال</button>
          <div class="form-group">
            <label>السؤال (بالعربي)</label>
            <input type="text" class="form-control q-text" placeholder="اكتب السؤال هنا...">
          </div>
          <div class="form-group">
            <label>السؤال (بالإنجليزي - اختياري)</label>
            <input type="text" class="form-control q-text-en" placeholder="English question here...">
          </div>
          <label style="color:var(--primary); font-weight:bold; margin-bottom:10px; display:block; font-size:15px;">حدد الإجابة الصحيحة من الدائرة:</label>
          <div class="options-grid">
              <div class="option-row"><input type="radio" name="correct_${qCount}" value="0"><input type="text" class="opt-text" placeholder="الإجابة 1"></div>
              <div class="option-row"><input type="radio" name="correct_${qCount}" value="1"><input type="text" class="opt-text" placeholder="الإجابة 2"></div>
              <div class="option-row"><input type="radio" name="correct_${qCount}" value="2"><input type="text" class="opt-text" placeholder="الإجابة 3"></div>
              <div class="option-row"><input type="radio" name="correct_${qCount}" value="3"><input type="text" class="opt-text" placeholder="الإجابة 4"></div>
          </div>
      `;
      document.getElementById('questionsContainer').appendChild(div);
  }

  window.generateHTML = function() {
      const title = document.getElementById('quizTitle').value.trim() || 'كويز جديد';
      const varName = document.getElementById('quizVarName').value.trim() || 'customQuizData';
      
      let questionsData = [];
      let hasError = false;

      document.querySelectorAll('.question-block').forEach((block, index) => {
          const qAr = block.querySelector('.q-text').value.trim();
          const qEn = block.querySelector('.q-text-en').value.trim() || qAr;
          const optInputs = block.querySelectorAll('.opt-text');
          const optionsAr = Array.from(optInputs).map(i => i.value.trim());
          const correctRadio = block.querySelector('input[type="radio"]:checked');
          
          if(!qAr || !optionsAr[0]) { hasError = true; block.style.borderColor = 'var(--danger)'; return; }
          if(!correctRadio) { showToastMessage('لازم تحدد الإجابة الصحيحة للسؤال رقم ' + (index + 1), true); hasError = true; block.style.borderColor = 'var(--danger)'; return; }

          const answerIdx = parseInt(correctRadio.value);
          questionsData.push({ q_ar: qAr, q_en: qEn, options_ar: optionsAr, options_en: optionsAr, answer: answerIdx });
      });

      if (hasError || questionsData.length === 0) {
          if(questionsData.length === 0) showToastMessage('أضف سؤال واحد على الأقل!', true);
          else showToastMessage('تأكد من ملء جميع الحقول وتحديد الإجابات الصحيحة', true);
          return;
      }

      const jsData = JSON.stringify(questionsData, null, 4);
      
      let template = document.getElementById('quizTemplate').innerHTML;
      
      let fullCode = template.split('[[TITLE]]').join(title)
                             .split('[[VARNAME]]').join(varName)
                             .split('[[JSDATA]]').join(jsData);

      const output = document.getElementById('outputCode');
      output.style.display = 'block';
      output.value = fullCode;
      
      document.getElementById('copyBtn').style.display = 'inline-flex';
      showToastMessage('تم توليد الكود بنجاح! انزل تحت وانسخه.');
      output.scrollIntoView({ behavior: 'smooth' });
  }

  window.copyCode = function() {
      const output = document.getElementById('outputCode');
      output.select();
      document.execCommand('copy');
      showToastMessage('تم نسخ الكود! الصقه في الملف الجديد.');
  }

  addQuestion();
</script>
</body>
<script type="module" src="notifications.js"></script>
<script type="module" src="theme-engine.js"></script>
</html>
