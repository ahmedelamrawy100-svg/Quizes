<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛒 المتجر - Quiz Hub</title>
<link rel="icon" type="image/png" href="pic/Logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #000; --text: #fff; --subtitle: #aaa; --card-bg: #111; --border: #333; --accent: #ff0000; --gold: #ffd700; --green: #4caf50; }
  body.light-mode { --bg: #f4f4f4; --text: #111; --subtitle: #555; --card-bg: #fff; --border: #ccc; --gold: #b8860b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background-color: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
  
  .top-bar { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
  .back-btn { background: #222; color: #fff; border: 2px solid #555; padding: 8px 15px; border-radius: 8px; text-decoration: none; font-weight: bold; }
  .coin-badge { background: rgba(255, 215, 0, 0.1); border: 2px solid var(--gold); color: var(--gold); padding: 8px 20px; border-radius: 20px; font-weight: bold; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  
  .header-title { text-align: center; color: var(--accent); font-size: 36px; margin-bottom: 10px; text-shadow: 0 0 15px rgba(255,0,0,0.3); }
  .header-subtitle { text-align: center; color: var(--subtitle); margin-bottom: 40px; }
  
  .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; width: 100%; max-width: 900px; }
  .shop-card { background: var(--card-bg); border: 2px solid var(--border); border-radius: 15px; padding: 25px; text-align: center; transition: 0.3s; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
  .shop-card:hover { transform: translateY(-5px); border-color: var(--gold); box-shadow: 0 0 20px rgba(255,215,0,0.1); }
  
  .item-icon { font-size: 50px; margin-bottom: 15px; }
  .item-title { font-size: 20px; font-weight: bold; color: var(--text); margin-bottom: 10px; }
  .item-desc { font-size: 14px; color: var(--subtitle); margin-bottom: 20px; min-height: 42px; }
  
  .btn-buy { width: 100%; padding: 12px; border: none; border-radius: 8px; font-family: 'Cairo'; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; background: var(--gold); color: #000; display: flex; justify-content: center; align-items: center; gap: 8px; }
  .btn-buy:hover { background: #ffcc00; transform: scale(1.02); }
  .btn-buy:disabled { background: #333; color: #888; cursor: not-allowed; transform: none; }
  
  /* ✅ علامة التوثيق */
  .verified-badge { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; background: #1DA1F2; color: #fff; border-radius: 50%; font-size: 10px; font-weight: bold; vertical-align: middle; }

  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--green); color: #fff; padding: 15px 30px; border-radius: 8px; font-weight: bold; z-index: 9999; opacity: 0; transition: 0.3s; }
  .toast.show { opacity: 1; top: 30px; }
  .toast.error { background: var(--accent); }
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html" class="back-btn">⬅ رجوع للرئيسية</a>
  <div class="coin-badge">🪙 <span id="userCoins">0</span> كوينز</div>
</div>

<h1 class="header-title">🛒 متجر المساعدات</h1>
<p class="header-subtitle">اشتري مساعدات عشان تسهل عليك الكويزات وتجيب أعلى النتايج!</p>

<div class="shop-grid" id="shopGrid">
  <!-- كروت المتجر هتظهر هنا -->
</div>

<div class="toast" id="toast">تمت العملية بنجاح</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = { apiKey: "AIzaSyBmyW4tZGJfcHJ4jKSD3_6hebZK58Y3jXo", authDomain: "quiz-hub-app-f4cd0.firebaseapp.com", databaseURL: "https://quiz-hub-app-f4cd0-default-rtdb.firebaseio.com", projectId: "quiz-hub-app-f4cd0", storageBucket: "quiz-hub-app-f4cd0.firebasestorage.app", messagingSenderId: "282772179392", appId: "1:282772179392:web:64646d757592b29ff3a025" };
  const app = initializeApp(firebaseConfig); const db = getDatabase(app);
  window.db = db; window.ref = ref; window.onValue = onValue; window.get = get; window.update = update;

  const currentUser = localStorage.getItem('loggedInUser');
  if (!currentUser) { window.location.href = 'index.html'; }

  let userCoins = 0;

  const shopItems = [
    { id: 'skip', icon: '🎯', title: 'تخطي سؤال', desc: 'بيشيل إجابتين غلط من السؤال عشان تختار صح.', price: 50 },
    { id: 'freeze', icon: '⏱️', title: 'تجميد الوقت', desc: 'بيوقف عداد الوقت لمدة 15 ثانية عشان تفكر براحتك.', price: 30 },
    { id: 'double_xp', icon: '🔥', title: 'مضاعف النقاط', desc: 'بيضاعف الـ XP اللي هتاخده في الكويز الجاي.', price: 100 },
    { id: 'shield', icon: '🛡️', title: 'درع الحماية', desc: 'بيحميك من الخسارة في السؤال الجاي لو غلطت.', price: 75 },
    { id: 'hint', icon: '💡', title: 'تلميح ذكي', desc: 'بيوريك أول حرف من الإجابة الصحيحة.', price: 40 },
    { id: 'mega_box', icon: '🎁', title: 'صندوق المفاجآت', desc: 'بياخدك لجوايز عشوائية (XP أو كوينز).', price: 200 }
  ];

  // جلب كوينز اللاعب
  window.onValue(window.ref(window.db, 'users_data/' + currentUser + '/coins'), (snap) => {
      userCoins = snap.exists() ? snap.val() : 0;
      document.getElementById('userCoins').innerText = userCoins;
      renderShop();
  });

  function renderShop() {
      const grid = document.getElementById('shopGrid');
      grid.innerHTML = '';
      
      shopItems.forEach(item => {
          const canAfford = userCoins >= item.price;
          const div = document.createElement('div');
          div.className = 'shop-card';
          div.innerHTML = `
              <div>
                  <div class="item-icon">${item.icon}</div>
                  <div class="item-title">${item.title}</div>
                  <div class="item-desc">${item.desc}</div>
              </div>
              <button class="btn-buy" ${!canAfford ? 'disabled' : ''} onclick="buyItem('${item.id}', ${item.price}, '${item.title}')">
                  ${canAfford ? `شراء بـ ${item.price} 🪙` : 'كوينز غير كافية'}
              </button>
          `;
          grid.appendChild(div);
      });
  }

  window.buyItem = async function(itemId, price, title) {
      if (userCoins < price) {
          showToast('معندكش كوينز كفاية!', true);
          return;
      }

      try {
          // خصم الكوينز
          const newCoins = userCoins - price;
          await window.update(window.ref(window.db, 'users_data/' + currentUser), { coins: newCoins });
          
          // إضافة العنصر للمخزون
          const itemRef = window.ref(window.db, `users_data/${currentUser}/inventory/${itemId}`);
          const itemSnap = await window.get(itemRef);
          const currentCount = itemSnap.exists() ? itemSnap.val() : 0;
          await window.update(window.ref(window.db, `users_data/${currentUser}/inventory`), { [itemId]: currentCount + 1 });

          showToast(`تم شراء ${title} بنجاح!`);
      } catch(e) {
          showToast('حدث خطأ أثناء الشراء', true);
      }
  }

  function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.className = isError ? 'toast show error' : 'toast show';
      setTimeout(() => { t.className = 'toast'; }, 3000);
  }

  if (localStorage.getItem('theme') === 'light') { document.body.classList.add('light-mode'); }
</script>
</body>
</html>
