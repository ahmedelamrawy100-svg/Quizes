  <!DOCTYPE html>
  <html lang="ar" dir="rtl">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛒 المتجر - Quiz Hub</title>
  <link rel="icon" type="image/png" href="pic/Logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root { 
      --bg: #050505; --text: #fff; --card-bg: #111; --border: #333; 
      --accent: #ff0000; --gold: #ffd700; --green: #4caf50; --blue: #0088cc; 
      --purple: #9c27b0; --subtitle: #aaa; 
    }
    body.light-mode { 
      --bg: #121212; --text: #fff; --card-bg: #1a1a1a; --border: #444; 
      --gold: #ffd700; --subtitle: #bbb; 
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; transition: 0.3s; }
    
    .top-bar { width: 100%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .back-btn { background: #222; color: #fff; border: 2px solid #555; padding: 8px 15px; border-radius: 8px; text-decoration: none; font-weight: bold; font-family: 'Cairo'; cursor: pointer; transition: 0.3s; }
    .back-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    .lang-btn { background: #333; color: #fff; border: 2px solid #555; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: 'Cairo'; transition: 0.3s; }
    .lang-btn:hover { background: var(--blue); border-color: var(--blue); }
    .coin-badge { background: rgba(255, 215, 0, 0.1); border: 2px solid var(--gold); color: var(--gold); padding: 8px 20px; border-radius: 20px; font-weight: bold; font-size: 18px; display: flex; align-items: center; gap: 8px; box-shadow: 0 0 15px rgba(255,215,0,0.2); }
    
    .header-title { text-align: center; color: var(--accent); font-size: 36px; margin-bottom: 10px; text-shadow: 0 0 15px rgba(255,0,0,0.3); }
    .header-subtitle { text-align: center; color: var(--subtitle); margin-bottom: 30px; }
    
    .main-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 1000px;}
    .main-tab-btn { background: var(--card-bg); color: var(--text); border: 2px solid var(--border); padding: 12px 20px; border-radius: 20px; cursor: pointer; font-family: 'Cairo'; font-weight: 900; font-size: 15px; transition: 0.3s; flex: 1; text-align: center; min-width: 150px;}
    .main-tab-btn:hover { border-color: var(--gold); transform: translateY(-2px); }
    .main-tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 20px rgba(255,0,0,0.4); }
    
    /* شريط الخصومات */
    .flash-sale-banner { background: linear-gradient(90deg, #ff8c00, #ff0000); color: #fff; padding: 10px 20px; border-radius: 10px; text-align: center; font-weight: bold; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 0 20px rgba(255,0,0,0.5); animation: pulseBorder 2s infinite alternate; width: 100%; max-width: 1200px;}
    @keyframes pulseBorder { from { box-shadow: 0 0 10px rgba(255,0,0,0.5); } to { box-shadow: 0 0 25px rgba(255,0,0,0.9); } }

    .tab-content { width: 100%; max-width: 1200px; display: none; animation: fadeUp 0.3s ease; }
    .tab-content.active { display: block; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* الكاردات */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    .card { background: var(--card-bg); border: 2px solid var(--border); border-radius: 15px; padding: 15px; text-align: center; transition: 0.3s; position: relative; display: flex; flex-direction: column; justify-content: space-between;}
    .card:hover { transform: translateY(-5px); border-color: var(--gold); box-shadow: 0 5px 20px rgba(255,215,0,0.15); }
    .card.has-discount { border-color: #ff0000; box-shadow: 0 0 15px rgba(255,0,0,0.3); }
    .discount-badge { position: absolute; top: -10px; right: 10px; background: #ff0000; color: #fff; font-size: 12px; font-weight: 900; padding: 2px 8px; border-radius: 10px; z-index: 2; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
    
    .item-icon { font-size: 40px; margin-bottom: 10px; display: block;}
    .item-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; line-height: 1.2;}
    .item-desc { font-size: 12px; color: var(--subtitle); margin-bottom: 15px; flex-grow: 1; min-height: 36px; }
    .item-owned { position: absolute; top: 10px; left: 10px; background: #4caf50; color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: bold; z-index: 2;}
    
    .price-wrap { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }
    .old-price { text-decoration: line-through; color: #888; font-size: 14px; }
    .new-price { color: var(--gold); font-weight: 900; font-size: 16px; }

    .btn-buy { width: 100%; padding: 10px; border: none; border-radius: 8px; font-family: 'Cairo'; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.3s; background: var(--gold); color: #000; margin-top: auto; }
    .btn-buy:hover { background: #ffcc00; transform: scale(1.02); }
    .btn-buy:disabled { background: #333; color: #888; cursor: not-allowed; transform: none; }
    .btn-discount { background: linear-gradient(135deg, #ff0000, #ff8c00); color: #fff; }
    .btn-discount:hover { background: linear-gradient(135deg, #cc0000, #e67e00); }
    .btn-owned { background: #4caf50; color: #fff; }

    /* التخصيص */
    .custom-box { background: var(--card-bg); border: 2px solid var(--border); border-radius: 15px; padding: 25px; margin-bottom: 20px; max-width: 600px; margin-left: auto; margin-right: auto;}
    .form-group { margin-bottom: 20px; position: relative;}
    .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--subtitle); }
    .form-control { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: rgba(0,0,0,0.4); color: var(--text); font-family: 'Cairo'; font-size: 15px; outline: none; }
    .color-picker-wrapper { display: flex; align-items: center; gap: 15px; }
    input[type="color"] { width: 60px; height: 60px; border: none; border-radius: 10px; cursor: pointer; background: transparent; padding: 0; }
    .theme-preview { height: 100px; border-radius: 12px; border: 2px solid var(--border); margin-top: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; color: #fff; }

    /* الثيمات */
    .themes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .theme-card { background: #111; border: 2px solid #333; border-radius: 16px; overflow: hidden; transition: 0.3s; position: relative; display: flex; flex-direction: column; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    .theme-card:hover { transform: translateY(-5px); border-color: #555; box-shadow: 0 10px 25px rgba(0,0,0,0.8); }
    .theme-card.is-active { border-color: var(--gold); box-shadow: 0 0 20px rgba(255,215,0,0.3); }
    .theme-card.is-previewing { border-color: #00bcd4; box-shadow: 0 0 20px rgba(0,188,212,0.5); }
    .theme-card.has-discount { border-color: #ff0000; box-shadow: 0 0 15px rgba(255,0,0,0.3); }
    .theme-img-wrap { position: relative; height: 150px; overflow: hidden; }
    .theme-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; filter: saturate(1.6) contrast(1.1); }
    .theme-rarity { position: absolute; top: 10px; right: 10px; font-size: 12px; padding: 4px 12px; border-radius: 8px; font-weight: 900; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.8); z-index: 2;}
    .theme-info { padding: 15px; text-align: center; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(to top, #111, #1a1a1a); flex-grow: 1; }
    .theme-info h4 { font-size: 16px; color: #fff; font-weight: 900; }
    
    .theme-actions { display: flex; gap: 8px; flex-direction: column;}
    .theme-btn { padding: 10px; border: none; border-radius: 8px; font-family: 'Cairo'; font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.3s; width: 100%;}
    .theme-btn.buy { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #000; }
    .theme-btn.buy-discount { background: linear-gradient(135deg, #ff0000, #ff8c00); color: #fff; }
    .theme-btn.apply { background: #2196f3; color: #fff; }
    .theme-btn.active { background: #4caf50; color: #fff; cursor: default; }
    .theme-btn.preview { background: #333; color: #fff; }
    .theme-btn.preview:disabled { background: #111; color: #444; cursor: not-allowed; }

    /* Modals */
    .site-alert-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999999; display: none; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
    .site-alert-box { background: #111; border: 2px solid var(--gold); border-radius: 20px; padding: 35px; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.6); transform: scale(0.9); transition: 0.3s; }
    .site-alert-overlay.active { display: flex; }
    .site-alert-overlay.active .site-alert-box { transform: scale(1); }
    .site-alert-title { color: var(--gold); font-size: 24px; margin-bottom: 15px; font-weight: 900; }
    .site-alert-msg { color: #fff; font-size: 16px; margin-bottom: 25px; line-height: 1.6; }
    .site-alert-actions { display: flex; gap: 10px; justify-content: center; }
    .site-alert-btn { background: var(--gold); color: #000; border: none; padding: 12px 25px; border-radius: 10px; font-family: 'Cairo'; font-weight: 900; font-size: 16px; cursor: pointer; transition: 0.2s; }
    .site-alert-btn.secondary { background: #333; color: #fff; }

    @media (max-width: 600px) {
      .header-title { font-size: 26px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
      .themes-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    }
  </style>
  </head>
  <body>

  <div class="site-alert-overlay" id="siteAlert">
    <div class="site-alert-box">
      <div class="site-alert-title" id="alertTitle">تنبيه</div>
      <div class="site-alert-msg" id="alertMsg">رسالة التنبيه</div>
      <div class="site-alert-actions">
        <button class="site-alert-btn" id="alertBtnOk" onclick="closeAlert()">حسناً</button>
        <button class="site-alert-btn secondary" id="alertBtnCancel" onclick="closeAlert()" style="display:none;">إلغاء</button>
      </div>
    </div>
  </div>

  <div class="top-bar">
    <div style="display:flex; gap:10px;">
      <a href="index.html" class="back-btn" id="btnBack">⬅ رجوع للرئيسية</a>
      <button class="lang-btn" onclick="toggleLang()" id="btnLang">EN</button>
    </div>
    <div class="coin-badge" id="coinBadgeWrap">🪙 <span id="userCoins">0</span> <span id="lblCoins">كوينز</span></div>
  </div>

  <h1 class="header-title" id="lblTitle">🛒 المتجر</h1>
  <p class="header-subtitle" id="lblSubTitle">كل ما تحتاجه لتطوير حسابك</p>

  <div class="flash-sale-banner" id="flashSaleBanner">
    <span id="flashSaleText">🔥 عروض فلاش (خصم حتى 70%)!</span>
    <span id="flashSaleTimer">⏳ 00:00</span>
  </div>

  <div class="main-tabs">
    <button class="main-tab-btn active" onclick="switchTab('assistants', this)" id="tabAssistants">🧰 المساعدات</button>
    <button class="main-tab-btn" onclick="switchTab('custom', this)" id="tabCustom">⚙️ تخصيص</button>
    <button class="main-tab-btn" onclick="switchTab('themes', this)" id="tabThemes">🎨 الثيمات</button>
  </div>

  <div id="tab-assistants" class="tab-content active">
    <div class="grid" id="assistantsGrid"></div>
  </div>

  <div id="tab-custom" class="tab-content">
    <div class="custom-box">
      <div class="form-group" id="customColorGroup">
        <label id="lblColor">🎨 تغيير لون الموقع</label>
        <div class="color-picker-wrapper">
          <input type="color" id="customColor" value="#ff0000" oninput="updateColorPreview()">
        </div>
        <div class="theme-preview" id="colorPreview" style="background:#ff0000;">معاينة</div>
        <button class="btn-buy" style="margin-top:15px;" id="btnBuyColor" onclick="buyFeature('customColor', 20000)">شراء</button>
      </div>

      <div class="form-group" id="customBgGroup">
        <label id="lblBg">🖼️ صورة خلفية مخصصة</label>
        <input type="text" id="customBg" class="form-control" placeholder="https://example.com/image.jpg">
        <button class="btn-buy" style="margin-top:15px;" id="btnBuyBg" onclick="buyFeature('customBg', 30000)">شراء</button>
      </div>

      <div class="form-group" id="customAnimGroup">
        <label id="lblAnim">✨ تأثير حركي للخلفية</label>
        <select id="customAnim" class="form-control">
          <option value="none">بدون تأثير</option>
          <option value="star">نجوم ✨</option>
          <option value="sakura">ساكورا 🌸</option>
          <option value="pulse">نبض 💓</option>
        </select>
        <button class="btn-buy" style="margin-top:15px;" id="btnBuyAnim" onclick="buyFeature('customAnim', 50000)">شراء</button>
      </div>

      <button class="btn-buy" style="background:linear-gradient(135deg, var(--purple), var(--blue)); color:#fff; padding:15px; font-size:18px;" onclick="saveCustomTheme()" id="btnSaveCustom">حفظ وتطبيق 🚀</button>
    </div>
  </div>

  <div id="tab-themes" class="tab-content">
    <div class="themes-grid" id="themesGrid"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set, update, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { apiKey: "AIzaSyBmyW4tZGJfcHJ4jKSD3_6hebZK58Y3jXo", authDomain: "quiz-hub-app-f4cd0.firebaseapp.com", databaseURL: "https://quiz-hub-app-f4cd0-default-rtdb.firebaseio.com", projectId: "quiz-hub-app-f4cd0", storageBucket: "quiz-hub-app-f4cd0.firebasestorage.app", messagingSenderId: "282772179392", appId: "1:282772179392:web:64646d757592b29ff3a025" };
    const app = initializeApp(firebaseConfig); 
    const db = getDatabase(app);
    
    window.db = db; window.ref = ref; window.onValue = onValue; window.get = get; window.update = update; window.set = set; window.runTransaction = runTransaction;

    const currentUser = (localStorage.getItem('loggedInUser') || '').toLowerCase();
    if (!currentUser) window.location.href = 'index.html';

    const isOwner = (currentUser === 'ahmed');

    let currentLang = localStorage.getItem('shopLang') || 'ar';
    let userCoins = 0;
    let userInventory = {};
    let unlockedFeatures = {};
    let ownedThemes = {};
    let savedTheme = {};
    
    let isPreviewing = false;
    let previewTimer = null;
    let previewedThemes = JSON.parse(localStorage.getItem('previewedThemes') || '{}');
    let currentDiscounts = { assistants: {}, themes: {}, custom: {} };

    const translations = {
      ar: {
        back: "⬅ رجوع للرئيسية", coins: "كوينز", title: "🛒 المتجر", subtitle: "كل ما تحتاجه لتطوير حسابك",
        tabAssistants: "🧰 المساعدات", tabCustom: "⚙️ تخصيص", tabThemes: "🎨 الثيمات",
        buy: "شراء بـ", notEnough: "غير كافية", owned: "مملوك",
        lblColor: "🎨 تغيير لون الموقع", lblBg: "🖼️ صورة خلفية مخصصة", lblAnim: "✨ تأثير حركي (50,000 🪙)",
        btnSaveCustom: "حفظ وتطبيق 🚀", ok: "حسناً", error: "خطأ", success: "نجاح 🎉",
        confirmBuy: "تأكيد الشراء؟", yes: "نعم", no: "لا",
        colorPreview: "معاينة اللون", missingCoins: "ناقصك",
        applyTheme: "تطبيق", activeTheme: "مُطبق حالياً", buyTheme: "شراء",
        preview: "👁️ معاينة", previewWait: "⏳ تمت المعاينة", free: "مجاناً (أونر)",
        flashSale: "🔥 خصومات فلاش سارية الآن!", endsIn: "ينتهي في"
      },
      en: {
        back: "⬅ Back to Home", coins: "Coins", title: "🛒 Shop", subtitle: "Everything you need to upgrade your account",
        tabAssistants: "🧰 Assistants", tabCustom: "⚙️ Customization", tabThemes: "🎨 Themes",
        buy: "Buy for", notEnough: "Not enough", owned: "Owned",
        lblColor: "🎨 Custom Color", lblBg: "🖼️ Custom Background", lblAnim: "✨ Custom Animation",
        btnSaveCustom: "Save & Apply 🚀", ok: "OK", error: "Error", success: "Success 🎉",
        confirmBuy: "Confirm purchase?", yes: "Yes", no: "No",
        colorPreview: "Color preview", missingCoins: "Missing",
        applyTheme: "Apply", activeTheme: "Active", buyTheme: "Buy",
        preview: "👁️ Preview", previewWait: "⏳ Previewed", free: "Free (Owner)",
        flashSale: "🔥 Flash Sale Active!", endsIn: "Ends in"
      }
    };

    const THEMES = [
      { id:'vibrant_synth', name:'موجة اصطناعية', nameEn:'Synthwave', bg:'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1920&q=80', animation:'pulse', rarity:'legendary', price: 15000 },
      { id:'vibrant_aurora', name:'شفق قطبي', nameEn:'Aurora', bg:'https://images.unsplash.com/photo-1531366936337-7c912a4589a7?auto=format&fit=crop&w=1920&q=80', animation:'star', rarity:'legendary', price: 15000 },
      { id:'vibrant_cosmic', name:'ألوان كونية', nameEn:'Cosmic Paint', bg:'https://images.unsplash.com/photo-1541701494587-cb58502866ab?auto=format&fit=crop&w=1920&q=80', animation:'sakura', rarity:'epic', price: 7500 },
      { id:'space_nebula', name:'سديم أزرق', nameEn:'Blue Nebula', bg:'https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=1920&q=80', animation:'star', rarity:'legendary', price: 15000 },
      { id:'nature_sunset', name:'غروب دافئ', nameEn:'Warm Sunset', bg:'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1920&q=80', animation:'none', rarity:'epic', price: 7500 },
      { id:'nature_forest', name:'غابة خضراء', nameEn:'Green Forest', bg:'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1920&q=80', animation:'none', rarity:'rare', price: 2500 },
      { id:'cyber_neon', name:'مدينة النيون', nameEn:'Neon City', bg:'https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=1920&q=80', animation:'none', rarity:'legendary', price: 15000 },
      { id:'cyber_tokyo', name:'شوارع طوكيو', nameEn:'Tokyo Streets', bg:'https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=1920&q=80', animation:'none', rarity:'epic', price: 7500 },
      { id:'tech_neon', name:'إضاءة نيون', nameEn:'Neon Lights', bg:'https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1920&q=80', animation:'pulse', rarity:'epic', price: 7500 },
      { id:'fan_magic', name:'غابة سحرية', nameEn:'Magic Forest', bg:'https://images.pexels.com/photos/2832034/pexels-photo-2832034.jpeg?auto=compress&cs=tinysrgb&w=1920', animation:'sakura', rarity:'epic', price: 7500 },
      { id:'abs_liquid', name:'ألوان سائلة', nameEn:'Liquid Colors', bg:'https://images.unsplash.com/photo-1550684376-efcbd6e3f031?auto=format&fit=crop&w=1920&q=80', animation:'none', rarity:'epic', price: 7500 },
      { id:'vibrant_retro', name:'ريترو 80s', nameEn:'Retro 80s', bg:'https://images.unsplash.com/photo-1557672172-298e090bd0f1?auto=format&fit=crop&w=1920&q=80', animation:'pulse', rarity:'rare', price: 2500 },
      { id:'pastel_dream', name:'حلم مبهج', nameEn:'Pastel Dream', bg:'https://images.unsplash.com/photo-1557682250-33bd709cbe85?auto=format&fit=crop&w=1920&q=80', animation:'star', rarity:'rare', price: 2500 },
      { id:'golden_hour', name:'الساعة الذهبية', nameEn:'Golden Hour', bg:'https://images.unsplash.com/photo-1495571758719-6ec1e876d6ae?auto=format&fit=crop&w=1920&q=80', animation:'none', rarity:'epic', price: 7500 },
      { id:'ocean_blue', name:'أعماق زرقاء', nameEn:'Deep Blue', bg:'https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1920&q=80', animation:'none', rarity:'rare', price: 2500 }
    ];

    const RARITY_COLORS = { common:'#888', rare:'#2196f3', epic:'#9c27b0', legendary:'#ffd700' };
    const RARITY_LABELS = { ar:{common:'عادي',rare:'نادر',epic:'ملحمي',legendary:'أسطوري'}, en:{common:'Common',rare:'Rare',epic:'Epic',legendary:'Legendary'} };

    window.toggleLang = () => {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      localStorage.setItem('shopLang', currentLang);
      applyLang();
    };

    function applyLang() {
      const t = translations[currentLang];
      document.body.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      document.getElementById('btnBack').innerText = t.back;
      document.getElementById('lblCoins').innerText = t.coins;
      document.getElementById('lblTitle').innerText = t.title;
      document.getElementById('lblSubTitle').innerText = t.subtitle;

    // حساب خصومات الساعة (3 مساعدات + 3 ثيمات + 3 تخصيص)
    function calculateHourlyDiscounts() {
      const now = Date.now();
      const currentHour = Math.floor(now / 3600000);
      const cacheKey = `discounts_v2_${currentHour}`;
      let cached = localStorage.getItem(cacheKey);
      
      if (cached) return JSON.parse(cached);

      let result = { assistants: {}, themes: {}, custom: {} };

      // اختيار 3 مساعدات
      let aIndices = [];
      while(aIndices.length < 3) {
          let r = Math.floor(Math.random() * shopItems.length);
          if(!aIndices.includes(r)) {
              aIndices.push(r);
              result.assistants[shopItems[r].id] = Math.floor(Math.random() * 51) + 20;
          }
      }

      // اختيار 3 ثيمات
      let tIndices = [];
      while(tIndices.length < 3) {
          let r = Math.floor(Math.random() * THEMES.length);
          if(!tIndices.includes(r)) {
              tIndices.push(r);
              result.themes[THEMES[r].id] = Math.floor(Math.random() * 51) + 20;
          }
      }

      // التخصيص (الـ 3 حاجات مع بعض)
      result.custom['customColor'] = Math.floor(Math.random() * 51) + 20;
      result.custom['customBg'] = Math.floor(Math.random() * 51) + 20;
      result.custom['customAnim'] = Math.floor(Math.random() * 51) + 20;
      
      localStorage.setItem(cacheKey, JSON.stringify(result));
      // مسح الكاش القديم
      for(let i=0; i<localStorage.length; i++){
          let k = localStorage.key(i);
          if(k.startsWith('discounts_v2_') && k !== cacheKey) localStorage.removeItem(k);
      }
      return result;
    }

    function startFlashSaleTimer() {
      const updateTimer = () => {
        const now = new Date();
        const nextHour = new Date(now);
        nextHour.setHours(now.getHours() + 1, 0, 0, 0);
        const diff = nextHour - now;
        
        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((diff % (1000 * 60)) / 1000);
        
        document.getElementById('flashSaleTimer').innerText = `⏳ ${m}:${s < 10 ? '0' : ''}${s}`;
        
        if (diff <= 0) {
          currentDiscounts = calculateHourlyDiscounts();
          renderAssistants();
          renderThemes();
          renderCustomStore();
        }
      };
      updateTimer();
      setInterval(updateTimer, 1000);
    }

          const result = await runTransaction(coinsRef, (current) => {
            if ((current || 0) < price) return;
            return current - price;
          });
          if (!result.committed) return showSiteAlert(t.error, t.notEnough);
          await update(ref(db, `unlocked_features/${currentUser}`), { [featureName]: true });
          showSiteAlert(t.success, currentLang === 'ar' ? 'مبروك! تم فتح الصلاحية.' : 'Feature unlocked!');
        } catch(e) { showSiteAlert(t.error, e.message); }
        finally { btn.disabled = false; btn.innerText = original; }
      });
    };

    window.saveCustomTheme = async () => {
      const t = translations[currentLang];
      const themeObj = { presetId: 'custom' };
      
      if (isOwner) {
        themeObj.color = document.getElementById('customColor').value;
        themeObj.bgImage = document.getElementById('customBg').value.trim() || null;
        themeObj.animation = document.getElementById('customAnim').value;
      } else {
        let hasAny = false;
        if (unlockedFeatures.customColor) { themeObj.color = document.getElementById('customColor').value; hasAny = true; }
        if (unlockedFeatures.customBg) { themeObj.bgImage = document.getElementById('customBg').value.trim() || null; hasAny = true; }
        if (unlockedFeatures.customAnim) { themeObj.animation = document.getElementById('customAnim').value; hasAny = true; }
        if (!hasAny) {
          return showSiteAlert(currentLang === 'ar' ? 'تنبيه' : 'Notice', currentLang === 'ar' ? 'لازم تشتري صلاحية واحدة على الأقل!' : 'Buy at least one feature first!');
        }
      }

      try {
        await update(ref(db, `users_data/${currentUser}`), { activeTheme: themeObj });
        showSiteAlert(t.success, currentLang === 'ar' ? 'تم حفظ وتطبيق الثيم!' : 'Theme saved & applied!');
      } catch(e) { showSiteAlert(t.error, e.message); }
    };

    // Init
    currentDiscounts = calculateHourlyDiscounts();
    startFlashSaleTimer();

    applyLang();
    if (localStorage.getItem('theme') === 'light') { document.body.classList.add('light-mode'); }
  </script>
  <script type="module" src="notifications.js"></script>
  <script type="module" src="theme-engine.js"></script>
  </body>
  </html>
