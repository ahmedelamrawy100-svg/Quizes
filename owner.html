<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👑 لوحة الأونر العليا - Quiz Hub</title>
<link rel="icon" type="image/png" href="pic/Logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="owner-style.css">
</head>
<body>

<div id="toast-container"></div>

<div id="modal-overlay" class="modal-overlay">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">✖</button>
    <div class="modal-title" id="modal-title">معلومات</div>
    <div class="modal-content" id="modal-content"></div>
  </div>
</div>

<div id="ownerContent">
  <div class="owner-header">
    <div class="owner-title">👑 لوحة الأونر العليا</div>
    <div class="owner-sub">
      مرحباً <b id="ownerName" style="color:var(--primary);">...</b> — تحكم كامل في الموقع
    </div>

    <div class="working-box">
      <div class="working-text">✅ شغالة</div>
      <div id="redLinesContainer"></div>
    </div>

    <div class="header-actions">
      <button class="icon-btn" onclick="window.toggleTheme()">🌓 تبديل الثيم</button>
      <button class="icon-btn" onclick="window.refreshAll()">🔄 تحديث شامل</button>
      <button class="icon-btn" onclick="location.href='index.html'">⬅ رجوع للرئيسية</button>
      <button class="icon-btn" onclick="window.logout()">🚪 تسجيل خروج</button>
    </div>
  </div>

  <div class="tabs-bar" id="tabsBar"></div>
  <div id="tabsContainer"></div>
</div>

<script type="module" src="owner-core.js"></script>
</body>
</html>
