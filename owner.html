<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👑 لوحة الأونر - Plot Twist</title>
<link rel="icon" type="image/png" href="pic/Logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<meta name="theme-color" content="#ffd700">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="pic/Logo.png">
<link rel="stylesheet" href="pwa-native.css">
<style>
  :root {
    --bg-1: #0a0510; --bg-2: #140a22; --bg-3: #000;
    --surface: rgba(30, 15, 50, 0.7);
    --surface-hover: rgba(60, 30, 90, 0.8);
    --border: rgba(168, 85, 247, 0.2);
    --border-strong: rgba(255, 215, 0, 0.5);
    --gold: #ffd700; --gold-dark: #b8860b;
    --purple: #a855f7; --text: #fff; --text-2: #b0a0c0; --text-3: #7a6a8a;
    --danger: #ef4444; --success: #10b981; --info: #3b82f6;
  }
  body.light-mode {
    --bg-1: #f5f0fa; --bg-2: #e8dff5; --bg-3: #fff;
    --surface: rgba(255, 255, 255, 0.8);
    --surface-hover: rgba(240, 230, 255, 1);
    --border: rgba(168, 85, 247, 0.3);
    --text: #1a0a2e; --text-2: #4a3a5e; --text-3: #8a7a9a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background: radial-gradient(circle at 50% 0%, var(--bg-2) 0%, var(--bg-1) 70%); 
    background-color: var(--bg-1); color: var(--text); font-family: 'Cairo', sans-serif; 
    height: 100vh; overflow: hidden; display: flex; transition: 0.3s;
  }

  /* Particles */
  #bgParticles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  #bgParticles span { position: absolute; background: var(--gold); border-radius: 50%; box-shadow: 0 0 10px var(--gold); animation: floatUp linear infinite; opacity: 0; }
  @keyframes floatUp { 0% { transform: translateY(100vh); opacity: 0; } 10%, 90% { opacity: 0.6; } 100% { transform: translateY(-10vh); opacity: 0; } }

  /* Loading */
  #loadingScreen { position: fixed; inset: 0; background: var(--bg-1); z-index: 99999; display: flex; justify-content: center; align-items: center; flex-direction: column; gap: 20px; }
  .loader { width: 50px; height: 50px; border: 4px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Access Denied */
  #accessDenied { display: none; position: fixed; inset: 0; background: var(--bg-1); z-index: 99998; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 20px; }
  #accessDenied.show { display: flex; }
  #accessDenied h1 { font-size: 80px; color: var(--danger); }
  #accessDenied a { color: var(--gold); text-decoration: none; font-weight: bold; }

  /* Layout */
  #ownerPanel { display: none; width: 100%; height: 100%; position: relative; z-index: 1; }
  #ownerPanel.show { display: flex; }
  .admin-layout { display: flex; width: 100%; height: 100%; }

  /* Sidebar */
  .sidebar {
    width: 280px; background: rgba(10, 5, 16, 0.6); backdrop-filter: blur(20px);
    border-left: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0;
  }
  .sidebar-header { padding: 25px 20px; text-align: center; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, rgba(255,215,0,0.05) 0%, transparent 100%); }
  .avatar { width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--purple)); margin: 0 auto 15px; display: flex; justify-content: center; align-items: center; font-size: 28px; font-weight: bold; color: #000; border: 3px solid #fff; box-shadow: 0 0 20px rgba(255,215,0,0.4); overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .owner-name { font-size: 20px; font-weight: 900; color: var(--gold); text-shadow: 0 0 10px rgba(255,215,0,0.3); }
  .live-clock { font-size: 13px; color: var(--text-2); margin-top: 5px; font-family: monospace; letter-spacing: 1px; }
  
  .sidebar-nav { flex: 1; overflow-y: auto; padding: 15px 10px; display: flex; flex-direction: column; gap: 5px; }
  .sidebar-nav::-webkit-scrollbar { width: 4px; }
  .sidebar-nav::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
  .nav-group { margin-bottom: 15px; }
  .nav-group-title { font-size: 10px; font-weight: 900; color: var(--text-3); text-transform: uppercase; padding: 0 10px 8px; letter-spacing: 1px; }
  .nav-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 15px; background: transparent; border: 1px solid transparent; color: var(--text-2); border-radius: 10px; font-family: 'Cairo'; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; text-align: right; }
  .nav-item:hover { background: var(--surface-hover); color: var(--text); }
  .nav-item.active { background: linear-gradient(90deg, rgba(255,215,0,0.15), transparent); border-color: var(--gold); color: var(--gold); border-right: 4px solid var(--gold); }
  .nav-icon { font-size: 18px; }
  
  .sidebar-footer { padding: 20px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
  .btn-theme { background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 10px; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; transition: 0.2s; }
  .btn-theme:hover { background: var(--surface-hover); }
  .btn-logout { background: rgba(239,68,68,0.1); color: var(--danger); border: 1px solid var(--danger); padding: 12px; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-weight: 900; transition: 0.2s; }
  .btn-logout:hover { background: var(--danger); color: #fff; }

  /* Main Content */
  .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  .top-bar { padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: rgba(10, 5, 16, 0.4); backdrop-filter: blur(10px); }
  .page-title { font-size: 24px; font-weight: 900; color: var(--gold); display: flex; align-items: center; gap: 10px; }
  .page-sub { color: var(--text-2); font-size: 14px; margin-top: 5px; }
  
  .content-scroll { flex: 1; overflow-y: auto; padding: 25px 30px; }
  .content-scroll::-webkit-scrollbar { width: 6px; }
  .content-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; }
  
  .tab-pane { display: none; animation: fadeUp 0.3s ease; }
  .tab-pane.active { display: block; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* Feature Cards Grid */
  .features-section { margin-bottom: 30px; }
  .features-section-title { font-size: 16px; font-weight: 900; color: var(--purple); margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
  .features-section-title .count { background: var(--surface); padding: 2px 10px; border-radius: 10px; font-size: 12px; color: var(--text-2); }
  
  .features-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .feature-btn {
    background: var(--surface); border: 1px solid var(--border); padding: 15px; border-radius: 12px;
    display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text);
    font-family: 'Cairo'; font-weight: 700; font-size: 14px; transition: 0.2s; text-align: right;
    position: relative; overflow: hidden;
  }
  .feature-btn:hover { background: var(--surface-hover); border-color: var(--gold); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
  .feature-btn .icon { font-size: 20px; flex-shrink: 0; }
  .feature-btn .label { flex: 1; }
  .feature-btn .num { position: absolute; top: 5px; left: 5px; font-size: 9px; color: var(--text-3); font-family: monospace; }
  .feature-btn.danger:hover { border-color: var(--danger); background: rgba(239,68,68,0.1); }

  /* Stats Cards (Overview) */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 15px; padding: 25px; text-align: center; position: relative; overflow: hidden; }
  .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--gold), var(--purple)); }
  .stat-icon { font-size: 30px; margin-bottom: 10px; }
  .stat-value { font-size: 32px; font-weight: 900; color: var(--gold); font-family: monospace; }
  .stat-label { font-size: 13px; color: var(--text-2); font-weight: 700; margin-top: 5px; }

  /* Modals */
  #modalOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 99999; justify-content: center; align-items: center; backdrop-filter: blur(5px); padding: 20px; }
  #modalOverlay.active { display: flex; }
  .modal-box { background: var(--bg-2); border: 1px solid var(--gold); border-radius: 15px; width: 100%; max-width: 600px; max-height: 85vh; display: flex; flex-direction: column; position: relative; box-shadow: 0 0 50px rgba(255,215,0,0.2); }
  .modal-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal-title { font-size: 18px; font-weight: 900; color: var(--gold); }
  .close-modal { background: var(--danger); color: #fff; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-weight: bold; }
  .modal-content { padding: 20px; overflow-y: auto; flex: 1; }

  /* Modals UI Elements */
  .field-input { width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-1); color: var(--text); font-family: 'Cairo'; outline: none; margin-bottom: 15px; }
  .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; border-bottom: 1px solid var(--border); transition: 0.2s; }
  .list-item:hover { background: var(--surface-hover); }
  .list-item-content { display: flex; align-items: center; gap: 10px; }
  .list-item-title { font-weight: 700; font-size: 15px; }
  .mini-btn { padding: 8px 15px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: 'Cairo'; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px; }
  .mini-btn.gold { background: var(--gold); color: #000; border-color: var(--gold); }
  .mini-btn.gold:hover { background: #e6c200; }
  .mini-btn.bad { background: rgba(239,68,68,0.1); color: var(--danger); border-color: var(--danger); }
  .mini-btn.bad:hover { background: var(--danger); color: #fff; }
  
  #toast-container { position: fixed; bottom: 20px; left: 20px; z-index: 999999; display: flex; flex-direction: column; gap: 10px; }
  .toast { background: var(--surface); border: 1px solid var(--success); border-right: 4px solid var(--success); color: var(--text); padding: 12px 20px; border-radius: 10px; font-weight: 700; font-size: 14px; animation: slideIn 0.3s; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
  .toast.error { border-color: var(--danger); border-right-color: var(--danger); }
  .toast.info { border-color: var(--info); border-right-color: var(--info); }
  @keyframes slideIn { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  /* Command Palette */
  #commandPalette { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 99998; justify-content: center; align-items: flex-start; padding-top: 10vh; backdrop-filter: blur(5px); }
  #commandPalette.active { display: flex; }
  .palette-box { background: var(--bg-2); border: 1px solid var(--border-strong); border-radius: 15px; width: 100%; max-width: 600px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
  .palette-input { width: 100%; padding: 20px; background: transparent; border: none; border-bottom: 1px solid var(--border); color: var(--text); font-family: 'Cairo'; font-size: 18px; outline: none; }
  .palette-results { max-height: 50vh; overflow-y: auto; padding: 10px; }
  .palette-result { padding: 12px 15px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 12px; color: var(--text-2); font-weight: 700; transition: 0.1s; }
  .palette-result:hover, .palette-result.selected { background: var(--surface-hover); color: var(--text); border-right: 3px solid var(--gold); }
  .palette-result-icon { font-size: 18px; }
  .palette-empty { padding: 20px; text-align: center; color: var(--text-3); }

  /* Tables inside modals */
  .data-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  .data-table th, .data-table td { padding: 10px; border-bottom: 1px solid var(--border); text-align: right; }
  .data-table th { color: var(--gold); background: rgba(255,215,0,0.05); font-weight: 900; }
  .text-center { text-align: center; }
  .empty-state { text-align: center; color: var(--text-3); padding: 20px; }

  /* ===== 💬 شات الإدارة + 📬 رسايل الشغل ===== */
  .chat-layout { display: grid; grid-template-columns: 280px 1fr; gap: 16px; height: calc(100vh - 190px); min-height: 520px; }
  .chat-sidebar {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto;
  }
  .chat-sidebar-title {
    font-size: 13px; font-weight: 900; color: var(--gold);
    padding-bottom: 10px; margin-bottom: 6px; border-bottom: 1px solid var(--border);
    letter-spacing: 1px;
  }
  .chat-room-item {
    display: flex; align-items: center; gap: 10px; padding: 11px 12px; width: 100%;
    border-radius: 10px; background: transparent; color: var(--text-2);
    border: 1px solid transparent; cursor: pointer; font-family: 'Cairo';
    font-weight: 700; font-size: 13px; transition: 0.2s; text-align: right;
  }
  .chat-room-item:hover { background: var(--surface-hover); border-color: var(--border); color: var(--text); }
  .chat-room-item.active {
    background: linear-gradient(90deg, rgba(255,215,0,0.15), transparent);
    color: var(--gold); border-color: var(--gold);
  }
  .chat-room-emoji { font-size: 20px; }
  .chat-room-name { flex: 1; }
  .chat-room-badge {
    background: var(--danger); color: #fff; font-size: 10px; font-weight: 900;
    padding: 2px 7px; border-radius: 10px; min-width: 20px; text-align: center;
  }
  .chat-main {
    display: flex; flex-direction: column; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
  }
  .chat-main-header {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    background: linear-gradient(90deg, rgba(168,85,247,0.12), rgba(255,215,0,0.03));
    font-weight: 900; font-size: 15px; color: var(--gold);
    display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .chat-search {
    padding: 7px 12px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--bg-1); color: var(--text); font-family: 'Cairo';
    font-size: 12px; outline: none; width: 180px; transition: 0.2s;
  }
  .chat-search:focus { border-color: var(--gold); width: 230px; }
  .chat-stats-btn {
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    padding: 6px 12px; cursor: pointer; font-family: 'Cairo'; font-size: 12px;
    color: var(--text); transition: 0.2s;
  }
  .chat-stats-btn:hover { background: var(--gold); color: #000; border-color: var(--gold); }
  .chat-main-messages {
    flex: 1; padding: 18px; overflow-y: auto; display: flex;
    flex-direction: column; gap: 12px;
  }
  .chat-empty {
    text-align: center; color: var(--text-3); margin-top: 40px;
    font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .chat-empty-icon { font-size: 50px; opacity: 0.4; }
  .chat-msg {
    max-width: 80%; padding: 10px 14px; border-radius: 14px;
    font-size: 14px; line-height: 1.6; word-wrap: break-word; animation: msgIn 0.3s ease;
    position: relative;
  }
  @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .chat-msg.mine {
    align-self: flex-start;
    background: linear-gradient(135deg, var(--gold), #d9a400);
    color: #000; border-bottom-right-radius: 4px; font-weight: 700;
  }
  .chat-msg.theirs {
    align-self: flex-end; background: rgba(255,255,255,0.05); color: var(--text);
    border: 1px solid var(--border); border-bottom-left-radius: 4px;
  }
  body.light-mode .chat-msg.theirs { background: #fff; }
  .chat-msg-sender { font-size: 11px; font-weight: 900; opacity: 0.9; margin-bottom: 4px; }
  .chat-msg-time { font-size: 10px; opacity: 0.65; margin-top: 4px; display: flex; gap: 8px; align-items: center; }
  .msg-delete {
    background: rgba(0,0,0,0.25); border: none; cursor: pointer;
    padding: 2px 6px; border-radius: 4px; font-size: 10px; color: inherit;
    opacity: 0; transition: 0.2s; font-family: 'Cairo';
  }
  .chat-msg:hover .msg-delete { opacity: 0.85; }
  .msg-delete:hover { opacity: 1 !important; background: rgba(0,0,0,0.45); }
  .chat-main-input {
    padding: 12px; border-top: 1px solid var(--border);
    display: flex; gap: 8px; background: rgba(0,0,0,0.25);
  }
  body.light-mode .chat-main-input { background: rgba(0,0,0,0.04); }
  .chat-main-input input {
    flex: 1; padding: 12px 16px; border-radius: 25px; border: 1px solid var(--border);
    background: var(--bg-1); color: var(--text); font-family: 'Cairo'; font-size: 14px; outline: none;
  }
  .chat-main-input input:focus { border-color: var(--gold); }
  .chat-main-input button {
    padding: 0 22px; border-radius: 25px; border: none;
    background: linear-gradient(135deg, var(--gold), var(--purple));
    color: #000; font-family: 'Cairo'; font-weight: 900; font-size: 14px; cursor: pointer;
  }
  .chat-main-input button:disabled { opacity: 0.4; cursor: not-allowed; }
  .work-tag {
    background: rgba(168,85,247,0.25); color: #e9d5ff; font-size: 9px; font-weight: 900;
    padding: 1px 7px; border-radius: 8px; vertical-align: middle;
  }
  .work-tag.done { background: rgba(16,185,129,0.25); color: #a7f3d0; }
  /* بادج على عناصر القائمة الجانبية */
  .nav-item .nav-badge {
    background: var(--danger); color: #fff; font-size: 10px; font-weight: 900;
    padding: 2px 7px; border-radius: 10px; min-width: 20px; text-align: center;
    margin-right: auto; flex-shrink: 0;
  }

  @media (max-width: 900px) {
    .admin-layout { flex-direction: column-reverse; }
    .sidebar { width: 100%; height: auto; border-left: none; border-top: 1px solid var(--border); flex-direction: row; overflow-x: auto; }
    .sidebar-header, .sidebar-footer, .nav-group-title { display: none; }
    .sidebar-nav { flex-direction: row; padding: 10px; }
    .nav-item { white-space: nowrap; padding: 8px 15px; }
    .nav-label { display: none; }
    .main-content { height: 100%; }
  }
</style>
</head>
<body>

<div id="bgParticles"></div>

<!-- Loading Screen -->
<div id="loadingScreen">
  <div class="loader"></div>
  <h2 style="color:var(--gold); font-weight:900;">جاري تحميل لوحة التحكم...</h2>
</div>

<!-- Access Denied -->
<div id="accessDenied">
  <h1>⛔</h1>
  <h2 style="color: var(--danger); font-size: 28px;">وصول مرفوض</h2>
  <p style="color: var(--text-2);">هذه اللوحة مخصصة للأونر فقط.</p>
  <a href="index.html">⬅ العودة للرئيسية</a>
</div>

<!-- Owner Panel -->
<div id="ownerPanel">
  <div class="admin-layout">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="avatar" id="ownerAvatar">A</div>
        <div class="owner-name" id="ownerName">...</div>
        <div class="live-clock" id="liveClock">00:00:00</div>
      </div>
      
      <div class="sidebar-nav" id="sidebarNav">
        <!-- JS will inject tabs here -->
      </div>
      
      <div class="sidebar-footer">
        <button class="btn-theme" id="themeBtn" onclick="ownerToggleTheme()">🌙</button>
        <button class="btn-logout" onclick="ownerLogout()">🚪 تسجيل خروج</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="top-bar">
        <div>
          <div class="page-title" id="pageTitle">📊 نظرة عامة</div>
          <div class="page-sub" id="pageSub">لوحة تحكم الأونر</div>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="btn-theme" onclick="window._openPalette()" style="padding:8px 15px; font-size:13px;">🔍 بحث (Ctrl+K)</button>
        </div>
      </div>
      
      <div class="content-scroll" id="ownerMain">
        <!-- Tab content will be injected here -->
      </div>
    </main>
    
  </div>
</div>

<!-- Modal -->
<div id="modalOverlay">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">معلومات</div>
      <button class="close-modal" onclick="window.closeModal()">✖</button>
    </div>
    <div class="modal-content" id="modalContent"></div>
  </div>
</div>

<!-- Command Palette -->
<div id="commandPalette">
  <div class="palette-box">
    <input type="text" class="palette-input" id="paletteInput" placeholder="ابحث عن أي ميزة... (مثال: تصدير، حظر، رسالة)">
    <div class="palette-results" id="paletteResults"></div>
  </div>
</div>

<!-- Toasts -->
<div id="toast-container"></div>

<!-- Scripts -->
<script type="module" src="owner-core.js"></script>
