<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 مساعد الكويزات - Quiz Hub</title>
<link rel="icon" type="image/png" href="pic/Logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #000; --bg-gradient: radial-gradient(circle at center, #1a1015 0%, #000 100%);
    --text-color: #fff; --chat-bg: #111; --bot-bubble: #222; --user-bubble: #ff0000;
    --border-color: #333; --kb-bg: #1a1a1a;
  }
  body.light-mode {
    --bg-color: #f4f4f4; --bg-gradient: radial-gradient(circle at center, #ffffff 0%, #e0e0e0 100%);
    --text-color: #111; --chat-bg: #fff; --bot-bubble: #eee; --user-bubble: #ff0000;
    --border-color: #ccc; --kb-bg: #e0e0e0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background: var(--bg-gradient); background-color: var(--bg-color); color: var(--text-color); 
    font-family: 'Cairo', sans-serif; min-height: 100vh; padding: 20px; 
    display: flex; flex-direction: column; align-items: center; 
  }
  
  .back-btn { position: fixed; top: 20px; left: 20px; background: rgba(30, 30, 30, 0.9); color: #fff; border: 2px solid #555; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-family: 'Cairo', sans-serif; font-weight: bold; text-decoration: none; z-index: 999; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
  .back-btn:hover { background: #ff0000; border-color: #ff0000; }
  body.light-mode .back-btn { background: #fff; color: #111; border-color: #aaa; }

  .top-bar { width: 100%; max-width: 700px; display: flex; justify-content: flex-end; margin-bottom: 10px; }
  .lang-btn { background: #333; color: #fff; border: 2px solid #555; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; transition: 0.3s; }
  .lang-btn:hover { background: #ff0000; border-color: #ff0000; }

  .assistant-container { 
    width: 100%; max-width: 700px; background: var(--chat-bg); 
    border: 2px solid var(--border-color); border-radius: 20px; 
    box-shadow: 0 10px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; 
    height: 80vh; overflow: hidden;
  }
  
  .chat-header { 
    background: linear-gradient(135deg, #ff0000, #8b0000); color: #fff; 
    padding: 15px 20px; font-weight: bold; display: flex; align-items: center; gap: 15px;
  }
  .bot-avatar { width: 40px; height: 40px; background: #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; color: #ff0000; }
  .header-text h2 { font-size: 18px; margin-bottom: 2px; }
  .header-text p { font-size: 12px; opacity: 0.8; }

  .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
  
  .msg-row { display: flex; align-items: flex-end; gap: 10px; max-width: 85%; }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.bot { align-self: flex-start; }
  
  .msg-avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 16px; flex-shrink: 0; }
  .msg-row.user .msg-avatar { background: #333; color: #fff; }
  .msg-row.bot .msg-avatar { background: #ff0000; color: #fff; }

  .msg-bubble { padding: 12px 16px; border-radius: 15px; font-size: 15px; line-height: 1.5; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  .msg-row.user .msg-bubble { background: var(--user-bubble); color: #fff; border-bottom-left-radius: 2px; }
  .msg-row.bot .msg-bubble { background: var(--bot-bubble); color: var(--text-color); border-bottom-right-radius: 2px; border: 1px solid var(--border-color); }

  .typing-indicator { display: flex; gap: 4px; padding: 5px 0; }
  .typing-indicator span { width: 8px; height: 8px; background: #888; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
  .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
  .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

  .chat-keyboard { 
    background: var(--kb-bg); border-top: 1px solid var(--border-color); 
    padding: 10px; display: flex; flex-direction: column; gap: 8px;
  }
  
  .kb-top-bar { display: flex; justify-content: flex-start; margin-bottom: -5px; }
  .kb-back { 
    background: transparent; color: #888; border: none; 
    padding: 0; cursor: pointer; font-family: 'Cairo'; font-size: 14px; 
    display: flex; align-items: center; gap: 5px; transition: 0.3s;
  }
  .kb-back:hover { color: #ff0000; transform: translateX(-3px); }

  .kb-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  
  .kb-btn { 
    background: var(--chat-bg); color: var(--text-color); border: 1px solid var(--border-color); 
    padding: 12px; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-size: 14px; 
    font-weight: bold; text-align: center; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 5px;
  }
  .kb-btn:hover { background: #ff0000; color: #fff; border-color: #ff0000; }
  .kb-btn.full-width { grid-column: 1 / -1; }

  .chat-input-container { display: flex; padding: 10px; background: var(--chat-bg); border-top: 1px solid var(--border-color); gap: 10px; }
  .chat-input-container input { flex: 1; padding: 12px 18px; border-radius: 25px; border: 1px solid var(--border-color); background: var(--bot-bubble); color: var(--text-color); font-family: 'Cairo'; outline: none; font-size: 15px; }
  .chat-input-container button { padding: 0 20px; background: #ff0000; color: #fff; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; font-family: 'Cairo'; transition: 0.3s; }

  @media (max-width: 768px) {
    .assistant-container { height: 85vh; border-radius: 15px; }
    .kb-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<a href="index.html" class="back-btn" id="backBtn">⬅ رجوع</a>

<div class="top-bar">
  <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">EN</button>
</div>

<div class="assistant-container">
  <div class="chat-header">
    <div class="bot-avatar">🤖</div>
    <div class="header-text">
      <h2 id="headerTitle">مساعد Quiz Hub</h2>
      <p id="headerSubtitle">متصل الآن 🟢</p>
    </div>
  </div>
  
  <div class="chat-messages" id="chatMessages">
    <div class="msg-row bot">
      <div class="msg-avatar">🤖</div>
      <div class="msg-bubble" id="welcomeMsg">
        أهلاً بيك في Quiz Hub! اختار من القايمة اللي تحت عشان أساعدك تلاقي الكويز اللي يناسبك أو تعرف أكتر عن الموقع.
      </div>
    </div>
  </div>

  <div class="chat-keyboard" id="chatKeyboard"></div>

  <div class="chat-input-container">
    <input type="text" id="chatInput" placeholder="اكتب رسالتك هنا..." onkeypress="handleChatEnter(event)">
    <button onclick="sendMessage()" id="sendBtn">إرسال</button>
  </div>
</div>

<script>
  if (localStorage.getItem('theme') === 'light') { document.body.classList.add('light-mode'); }
  
  let currentLang = localStorage.getItem('lang') || 'ar';
  const chatMessages = document.getElementById('chatMessages');
  const chatKeyboard = document.getElementById('chatKeyboard');

  const ui = {
    ar: {
      back: "⬅ رجوع", title: "مساعد Quiz Hub", subtitle: "متصل الآن 🟢",
      welcome: "أهلاً بيك في Quiz Hub! اختار من القايمة اللي تحت عشان أساعدك تلاقي الكويز اللي يناسبك أو تعرف أكتر عن الموقع.",
      placeholder: "اكتب رسالتك هنا...", send: "إرسال",
      btnMovies: "🎬 الكويزات", btnSiteFeatures: "🛠️ مميزات الموقع", btnRanks: "🎖️ الرتب والبادجات", btnHelp: "❓ إزاي أستخدم الموقع؟", 
      btnHorror: "🎃 رعب", btnAction: "💥 أكشن", btnMystery: "🕵️ غموض", btnThriller: "🎬 تشويق",
      btnBack: "🔙 رجوع",
      btnFriends: "👥 الأصدقاء", btnRating: "⭐ تقييم الموقع",
      replyMovies: "اختار القسم اللي عايز تلعب فيه:",
      replyHorror: "عندنا كويزات رعب قوية زي: أنابيل (Annabelle)، الكونجورينج (The Conjuring)، الراهبة (The Nun)، فايف نايتس (FNAF)، قطار بوسان (Train to Busan)، وسكريم (Scream). تقدر تلعبهم من الصفحة الرئيسية!",
      replyAction: "عندنا كويزات أكشن جبارة زي: سبايدرمان (Spider-Man)، المنتقمون (Avengers)، أفاتار (Avatar)، لعبة الحبار (Squid Game). ادخل العب واثبت نفسك!",
      replyMystery: "عندنا كويزات غموض وتشويق للعقل زي: وينزداي (Wednesday) ومطارق (Knives Out بكل أجزائه).",
      replyThriller: "عندنا فيلم السقوط (Fall)، ده كويز تشويق وإثارة هيخليك مش قادر تتنفس!",
      replyFriends: "من صفحة 'اللاعبين' تقدر تضيف أصحابك. أول ما يقبلوا، تقدر تكلمهم في الشات أو تتحداهم في أي كويز (تحدي صديق)!",
      replyRanks: "الأنظمة شغالة كالتالي: أنت بتلعب كويزات وبتجمع XP، وبعدها بتبعت طلب للـ (Owner) عشان يطلعلك الرتبة المناسبة. لو مستواك عالي، الأونر هيديك رتبة أسطورية أو بادج مميز! تقدر تبعت الطلب من صفحة 'صندوق الرسائل' -> تبويب 'طلبات الأونر'.",
      replyHelp: "الموقع فيه كويزات لكل التصنيفات، ليدر بورد (عشان تشوف ترتيبك)، ونظام أصدقاء. كل اللي عليك تدخل وتلعب وتجمع XP!",
      replyRating: "رأيك يهمنا جداً! من القائمة الجانبية اختار 'قيّم الموقع' وقولي رأيك في التحديثات الجديدة.",
      replyDefault: "معلش مفهمتش قصدك. جرب تختار من الأزرار اللي تحت، أو اسألني عن قسم معين."
    },
    en: {
      back: "⬅ Back", title: "Quiz Hub Assistant", subtitle: "Online 🟢",
      welcome: "Welcome to Quiz Hub! Choose from the menu below to find a quiz or learn more about the site.",
      placeholder: "Type your message...", send: "Send",
      btnMovies: "🎬 Quizzes", btnSiteFeatures: "🛠️ Site Features", btnRanks: "🎖️ Ranks & Badges", btnHelp: "❓ How to use?", 
      btnHorror: "🎃 Horror", btnAction: "💥 Action", btnMystery: "🕵️ Mystery", btnThriller: "🎬 Thriller",
      btnBack: "🔙 Back",
      btnFriends: "👥 Friends", btnRating: "⭐ Rate Website",
      replyMovies: "Choose a category to play:",
      replyHorror: "We have great horror quizzes: Annabelle, The Conjuring, The Nun, FNAF, Train to Busan, and Scream. Play from the Home page!",
      replyAction: "We have amazing action quizzes: Spider-Man, Avengers, Avatar, Squid Game. Go play and prove yourself!",
      replyMystery: "We have mind-bending mystery quizzes: Wednesday, and Knives Out (all parts).",
      replyThriller: "We have the movie Fall, a thriller quiz that will leave you breathless!",
      replyFriends: "On the 'Players' page, you can add friends. Once they accept, you can chat or challenge them to any quiz (Challenge Friend)!",
      replyRanks: "The Rank & Badge system works like this: You play quizzes and earn XP. Then you submit a request to the (Owner) to give you the appropriate rank. If your level is high, the Owner will give you a legendary rank or a special badge! You can send the request from the 'Inbox' page -> 'Owner Requests' tab.",
      replyHelp: "The site has quizzes for all categories, a leaderboard, and a friend system. All you have to do is log in, play, and earn XP!",
      replyRating: "We value your opinion! From the side menu, choose 'Rate the Website' and tell us what you think of the new updates.",
      replyDefault: "Sorry, I didn't understand. Try choosing from the buttons below, or ask me about a specific category."
    }
  };

  function renderMainMenu() {
    const t = ui[currentLang];
    chatKeyboard.innerHTML = `
      <div class="kb-row">
        <button class="kb-btn" onclick="handleMenuClick('movies')">${t.btnMovies}</button>
        <button class="kb-btn" onclick="handleMenuClick('siteFeatures')">${t.btnSiteFeatures}</button>
      </div>
      <div class="kb-row">
        <button class="kb-btn" onclick="handleMenuClick('ranks')">${t.btnRanks}</button>
        <button class="kb-btn" onclick="handleMenuClick('help')">${t.btnHelp}</button>
      </div>
    `;
  }

  function renderMoviesMenu() {
    const t = ui[currentLang];
    chatKeyboard.innerHTML = `
      <div class="kb-top-bar">
        <button class="kb-back" onclick="renderMainMenu()">${t.btnBack}</button>
      </div>
      <div class="kb-row">
        <button class="kb-btn" onclick="handleMenuClick('horror')">${t.btnHorror}</button>
        <button class="kb-btn" onclick="handleMenuClick('action')">${t.btnAction}</button>
      </div>
      <div class="kb-row">
        <button class="kb-btn" onclick="handleMenuClick('mystery')">${t.btnMystery}</button>
        <button class="kb-btn" onclick="handleMenuClick('thriller')">${t.btnThriller}</button>
      </div>
    `;
  }

  function renderSiteFeaturesMenu() {
    const t = ui[currentLang];
    chatKeyboard.innerHTML = `
      <div class="kb-top-bar">
        <button class="kb-back" onclick="renderMainMenu()">${t.btnBack}</button>
      </div>
      <div class="kb-row">
        <button class="kb-btn" onclick="handleMenuClick('friends')">${t.btnFriends}</button>
        <button class="kb-btn" onclick="handleMenuClick('rating')">${t.btnRating}</button>
      </div>
    `;
  }

  function applyLanguage() {
    const t = ui[currentLang];
    document.body.dir = currentLang === 'en' ? 'ltr' : 'rtl';
    document.getElementById('backBtn').innerText = t.back;
    document.getElementById('headerTitle').innerText = t.title;
    document.getElementById('headerSubtitle').innerText = t.subtitle;
    document.getElementById('welcomeMsg').innerText = t.welcome;
    document.getElementById('chatInput').placeholder = t.placeholder;
    document.getElementById('sendBtn').innerText = t.send;
    document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'EN' : 'AR';
    
    renderMainMenu();
  }

  function toggleLanguage() {
    currentLang = currentLang === 'ar' ? 'en' : 'ar';
    localStorage.setItem('lang', currentLang);
    applyLanguage();
    
    chatMessages.innerHTML = `
      <div class="msg-row bot">
        <div class="msg-avatar">🤖</div>
        <div class="msg-bubble" id="welcomeMsg"></div>
      </div>
    `;
    applyLanguage();
  }

  function handleChatEnter(e) { if (e.key === 'Enter') sendMessage(); }

  function addMessage(text, sender) {
    const row = document.createElement('div');
    row.className = `msg-row ${sender}`;
    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.innerText = sender === 'bot' ? '🤖' : '👤';
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = text;
    row.appendChild(avatar);
    row.appendChild(bubble);
    chatMessages.appendChild(row);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = `msg-row bot`;
    row.id = 'typingIndicator';
    row.innerHTML = `<div class="msg-avatar">🤖</div><div class="msg-bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
    chatMessages.appendChild(row);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function hideTyping() {
    const indicator = document.getElementById('typingIndicator');
    if (indicator) indicator.remove();
  }

  function handleMenuClick(action) {
    const t = ui[currentLang];
    let btnText = '';
    let reply = '';

    if (action === 'movies') { btnText = t.btnMovies; reply = t.replyMovies; renderMoviesMenu(); }
    else if (action === 'siteFeatures') { btnText = t.btnSiteFeatures; reply = t.replyMovies; renderSiteFeaturesMenu(); }
    else if (action === 'horror') { btnText = t.btnHorror; reply = t.replyHorror; }
    else if (action === 'action') { btnText = t.btnAction; reply = t.replyAction; }
    else if (action === 'mystery') { btnText = t.btnMystery; reply = t.replyMystery; }
    else if (action === 'thriller') { btnText = t.btnThriller; reply = t.replyThriller; }
    else if (action === 'friends') { btnText = t.btnFriends; reply = t.replyFriends; }
    else if (action === 'rating') { btnText = t.btnRating; reply = t.replyRating; }
    else if (action === 'ranks') { btnText = t.btnRanks; reply = t.replyRanks; }
    else if (action === 'help') { btnText = t.btnHelp; reply = t.replyHelp; }

    addMessage(btnText, 'user');
    showTyping();

    setTimeout(() => {
      hideTyping();
      addMessage(reply, 'bot');
    }, 800);
  }

  function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    
    addMessage(input.value, 'user');
    input.value = '';
    showTyping();

    setTimeout(() => {
      hideTyping();
      const lowerText = text.toLowerCase();
      let reply = ui[currentLang].replyDefault;

      if (lowerText.includes('فيلم') || lowerText.includes('movie') || lowerText.includes('كويز') || lowerText.includes('quiz')) reply = ui[currentLang].replyMovies;
      else if (lowerText.includes('صديق') || lowerText.includes('friend')) reply = ui[currentLang].replyFriends;
      else if (lowerText.includes('رتبة') || lowerText.includes('rank') || lowerText.includes('بادج') || lowerText.includes('badge')) reply = ui[currentLang].replyRanks;

      addMessage(reply, 'bot');
    }, 800);
  }

  window.onload = () => {
    applyLanguage();
  };
</script>
</body>
</html>
