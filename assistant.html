<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 مساعد الكويزات - Quiz Hub</title>
<link rel="icon" type="image/png" href="pic/Logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #000; --bg-gradient: radial-gradient(circle at center, #1a1015 0%, #000 100%);
    --text-color: #fff; --chat-bg: #111; --bot-bubble: #222; --user-bubble: #ff0000;
    --border-color: #333;
  }
  body.light-mode {
    --bg-color: #f4f4f4; --bg-gradient: radial-gradient(circle at center, #ffffff 0%, #e0e0e0 100%);
    --text-color: #111; --chat-bg: #fff; --bot-bubble: #eee; --user-bubble: #ff0000;
    --border-color: #ccc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background: var(--bg-gradient); background-color: var(--bg-color); color: var(--text-color); 
    font-family: 'Cairo', sans-serif; min-height: 100vh; padding: 20px; 
    display: flex; flex-direction: column; align-items: center; 
  }
  
  .back-btn { position: fixed; top: 20px; left: 20px; background: rgba(30, 30, 30, 0.9); color: #fff; border: 2px solid #555; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-family: 'Cairo', sans-serif; font-weight: bold; text-decoration: none; z-index: 999; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
  .back-btn:hover { background: #ff0000; border-color: #ff0000; }
  body.light-mode .back-btn { background: #fff; color: #111; border-color: #aaa; }

  .assistant-container { 
    width: 100%; max-width: 700px; background: var(--chat-bg); 
    border: 2px solid var(--border-color); border-radius: 20px; 
    box-shadow: 0 10px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; 
    height: 85vh; margin-top: 40px; overflow: hidden;
  }
  
  .chat-header { 
    background: linear-gradient(135deg, #ff0000, #8b0000); color: #fff; 
    padding: 15px 20px; font-weight: bold; display: flex; align-items: center; gap: 15px;
  }
  .bot-avatar { width: 40px; height: 40px; background: #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; color: #ff0000; }
  .header-text h2 { font-size: 18px; margin-bottom: 2px; }
  .header-text p { font-size: 12px; opacity: 0.8; }

  .chat-messages { 
    flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; 
    scroll-behavior: smooth;
  }
  .chat-messages::-webkit-scrollbar { width: 6px; }
  .chat-messages::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

  .msg-row { display: flex; align-items: flex-end; gap: 10px; max-width: 85%; }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.bot { align-self: flex-start; }
  
  .msg-avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 16px; flex-shrink: 0; }
  .msg-row.user .msg-avatar { background: #333; color: #fff; }
  .msg-row.bot .msg-avatar { background: #ff0000; color: #fff; }

  .msg-bubble { 
    padding: 12px 16px; border-radius: 15px; font-size: 15px; line-height: 1.5; 
    position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }
  .msg-row.user .msg-bubble { background: var(--user-bubble); color: #fff; border-bottom-left-radius: 2px; }
  .msg-row.bot .msg-bubble { background: var(--bot-bubble); color: var(--text-color); border-bottom-right-radius: 2px; border: 1px solid var(--border-color); }

  /* مؤشر الكتابة */
  .typing-indicator { display: flex; gap: 4px; padding: 5px 0; }
  .typing-indicator span { width: 8px; height: 8px; background: #888; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
  .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
  .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

  .chat-input-container { 
    display: flex; padding: 15px; background: var(--chat-bg); 
    border-top: 1px solid var(--border-color); gap: 10px;
  }
  .chat-input-container input { 
    flex: 1; padding: 12px 18px; border-radius: 25px; border: 1px solid var(--border-color); 
    background: var(--bot-bubble); color: var(--text-color); font-family: 'Cairo'; outline: none; font-size: 15px;
  }
  .chat-input-container input:focus { border-color: #ff0000; }
  .chat-input-container button { 
    padding: 0 20px; background: #ff0000; color: #fff; border: none; 
    border-radius: 25px; cursor: pointer; font-weight: bold; font-family: 'Cairo'; transition: 0.3s;
  }
  .chat-input-container button:hover { background: #cc0000; }

  .chat-options { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .chat-option-btn { 
    background: transparent; color: var(--text-color); border: 1px solid #ff0000; 
    padding: 8px 15px; border-radius: 15px; cursor: pointer; font-family: 'Cairo'; 
    text-align: right; transition: 0.3s; font-size: 14px; width: 100%;
  }
  .chat-option-btn:hover { background: #ff0000; color: #fff; }

  @media (max-width: 768px) {
    .assistant-container { height: 90vh; margin-top: 50px; border-radius: 15px; }
    .msg-bubble { font-size: 14px; padding: 10px 14px; }
  }
</style>
</head>
<body>

<a href="index.html" class="back-btn">⬅ رجوع للرئيسية</a>

<div class="assistant-container">
  <div class="chat-header">
    <div class="bot-avatar">🤖</div>
    <div class="header-text">
      <h2>مساعد الكويزات</h2>
      <p>متصل الآن 🟢</p>
    </div>
  </div>
  
  <div class="chat-messages" id="chatMessages">
    <div class="msg-row bot">
      <div class="msg-avatar">🤖</div>
      <div class="msg-bubble">
        أهلاً بيك! أنا مساعدك الذكي. اختار من الأزرار اللي تحت عشان أساعدك:
        <div class="chat-options" id="chatOptions">
           <button class="chat-option-btn" onclick="sendOption('الافلام')">🎬 تفاصيل الأفلام</button>
           <button class="chat-option-btn" onclick="sendOption('المسلسلات')">📺 تفاصيل المسلسلات</button>
           <button class="chat-option-btn" onclick="sendOption('مساعدة')">❓ إزاي أستخدم الموقع؟</button>
        </div>
      </div>
    </div>
  </div>

  <div class="chat-input-container">
    <input type="text" id="chatInput" placeholder="اكتب رسالتك هنا..." onkeypress="handleChatEnter(event)">
    <button onclick="sendMessage()" id="sendBtn">إرسال</button>
  </div>
</div>

<script>
  if (localStorage.getItem('theme') === 'light') { document.body.classList.add('light-mode'); }

  const chatMessages = document.getElementById('chatMessages');

  function handleChatEnter(e) { if (e.key === 'Enter') sendMessage(); }

  // دالة إضافة رسالة جديدة
  function addMessage(text, sender, optionsHtml = '') {
    const row = document.createElement('div');
    row.className = `msg-row ${sender}`;
    
    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.innerText = sender === 'bot' ? '🤖' : '👤';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = text;
    
    if (optionsHtml) {
        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'chat-options';
        optionsDiv.innerHTML = optionsHtml;
        bubble.appendChild(optionsDiv);
    }

    row.appendChild(avatar);
    row.appendChild(bubble);
    chatMessages.appendChild(row);
    
    // التمرير لتحت
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  // مؤشر "بيكتب..."
  function showTyping() {
    const row = document.createElement('div');
    row.className = `msg-row bot`;
    row.id = 'typingIndicator';
    row.innerHTML = `
      <div class="msg-avatar">🤖</div>
      <div class="msg-bubble">
        <div class="typing-indicator"><span></span><span></span><span></span></div>
      </div>
    `;
    chatMessages.appendChild(row);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function hideTyping() {
    const indicator = document.getElementById('typingIndicator');
    if (indicator) indicator.remove();
  }

  function sendOption(option) {
    addMessage(option, 'user');
    const optionsDiv = document.getElementById('chatOptions');
    if (optionsDiv) optionsDiv.style.display = 'none';

    showTyping();

    setTimeout(() => {
      hideTyping();
      let reply = "";
      let optionsHtml = "";

      if (option === 'الافلام') {
         reply = "تحب تعرف تفاصيل أنهي فيلم؟";
         optionsHtml = `
           <button class='chat-option-btn' onclick="sendOption('انابيل')">🎃 أنابيل</button>
           <button class='chat-option-btn' onclick="sendOption('الراهبة')">✝️ الراهبة</button>
           <button class='chat-option-btn' onclick="sendOption('الكونجورينج')">👻 الكونجورينج</button>
           <button class='chat-option-btn' onclick="sendOption('FNAF')">🐻 FNAF</button>
           <button class='chat-option-btn' onclick="sendOption('قطار بوسان')">🚄 قطار بوسان</button>
         `;
      } else if (option === 'المسلسلات') {
         reply = "تحب تعرف تفاصيل أنهي مسلسل؟";
         optionsHtml = `
           <button class='chat-option-btn' onclick="sendOption('لعبة الحبار')">🦑 لعبة الحبار</button>
           <button class='chat-option-btn' onclick="sendOption('وينزداي')">🖤 وينزداي</button>
           <button class='chat-option-btn' onclick="sendOption('الجمال الحقيقي')">✨ الجمال الحقيقي</button>
           <button class='chat-option-btn' onclick="sendOption('عيلة بالاختيار')">🏡 عيلة بالاختيار</button>
           <button class='chat-option-btn' onclick="sendOption('حلم إليك')">🎬 حلم إليك</button>
           <button class='chat-option-btn' onclick="sendOption('لماذا هي')">⚖️ لماذا هي</button>
         `;
      } else if (option === 'مساعدة') {
         reply = "أنا هنا عشان أساعدك! الموقع فيه:<br>1. <b>كويزات</b> لكل فيلم ومسلسل.<br>2. <b>تحدي الأصدقاء</b> (تقدر تلعب مع صاحبك في نفس الوقت).<br>3. <b>وضع ليلي ونهاري</b>.<br>4. <b>لوحة تعليقات</b>.<br>5. <b>البروفايل والشارات</b>.<br>دوس على أي كويز عشان تلعب!";
         optionsHtml = `<button class='chat-option-btn' onclick="sendOption('تحدي')">⚔️ إزاي أعمل تحدي؟</button>`;
      } else if (option === 'تحدي') {
         reply = "عشان تلعب تحدي صديق:<br>1. افتح أي كويز.<br>2. دوس على '⚔️ تحدي صديق'.<br>3. ابعت الكود لصاحبك.<br>4. أول ما يدخل، اللعبة هتبدأ!";
      } else {
         const database = {
            "انابيل": "فيلم رعب أمريكي صدر في 2014. القصة: دمية مسكونة بروح شيطانية. الأبطال: Annabelle Wallis, Ward Horton.",
            "الراهبة": "فيلم رعب أمريكي صدر في 2018. القصة: الأب بيرك والأخت إيرين بيحققوا في انتحار راهبة في رومانيا. الأبطال: Taissa Farmiga, Demián Bichir.",
            "الكونجورينج": "فيلم رعب أمريكي صدر في 2013. القصة: عيلة وارن بيساعدوا عيلة بيرون. الأبطال: Vera Farmiga, Patrick Wilson.",
            "FNAF": "فيلم رعب أمريكي صدر في 2023. القصة: مايك شميت بيشتغل حارس ليلي في مطعم فريدي فازبير. الأبطال: Josh Hutcherson, Matthew Lillard.",
            "قطار بوسان": "فيلم رعب كوري صدر في 2016. القصة: أب وبنته بيسافروا بالقطار وبتنتشر موجة زومبي. الأبطال: Gong Yoo, Ma Dong-seok.",
            "لعبة الحبار": "مسلسل كوري على نيتفليكس. القصة: 456 لاعب بيشاركوا في ألعاب أطفال قاتلة. الأبطال: Lee Jung-jae, Park Hae-soo.",
            "وينزداي": "مسلسل أمريكي على نيتفليكس. القصة: وينزداي أدامز بتحقق في جرائم قتل غامضة. الأبطال: Jenna Ortega, Emma Myers.",
            "الجمال الحقيقي": "مسلسل كوري رومانسي كوميدي. القصة: جو كيونغ بتتعلم المكياج وبتتحول. الأبطال: Moon Ga-young, Cha Eun-woo.",
            "عيلة بالاختيار": "مسلسل كوري عائلي رومانسي. الأبطال: Hwang In-youp, Jung Chae-yeon.",
            "حلم إليك": "مسلسل كوري رومانسي كوميدي. الأبطال: Hwang In-youp, Lee Hye-ri.",
            "لماذا هي": "مسلسل كوري قانوني رومانسي. الأبطال: Seo Hyun-jin, Hwang In-youp."
         };
         reply = database[option] || "معلش، مفيش تفاصيل عن الحاجة دي.";
      }
      
      addMessage(reply, 'bot', optionsHtml);
    }, 1000);
  }

  function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim().toLowerCase();
    if (!text) return;
    
    addMessage(input.value, 'user');
    input.value = '';
    
    const optionsDiv = document.getElementById('chatOptions');
    if (optionsDiv) optionsDiv.style.display = 'none';

    showTyping();

    setTimeout(() => {
      hideTyping();
      
      if (text.includes('اهلا') || text.includes('أهلا') || text.includes('مرحبا') || text.includes('hi') || text.includes('hello') || text.includes('ازيك')) {
          addMessage("أهلاً بيك! إزاي أقدر أساعدك؟ جرب تدوس على واحد من الأزرار اللي فوق عشان تختار.", 'bot');
          return;
      }

      const database = {
        "annabelle": "فيلم رعب عن دمية مسكونة.",
        "انابيل": "فيلم رعب عن دمية مسكونة.",
        "the nun": "فيلم رعب عن الراهبة فالاك.",
        "الراهبة": "فيلم رعب عن الراهبة فالاك.",
        "conjuring": "فيلم رعب عن عيلة وارن.",
        "الكونجورينج": "فيلم رعب عن عيلة وارن.",
        "squid game": "مسلسل كوري عن لعبة بقاء قاتلة.",
        "لعبة الحبار": "مسلسل كوري عن لعبة بقاء قاتلة.",
        "wednesday": "مسلسل عن وينزداي أدامز.",
        "وينزداي": "مسلسل عن وينزداي أدامز.",
        "fnaf": "فيلم رعب عن مطعم فريدي والدمى المسكونة.",
        "busan": "فيلم رعب كوري عن الزومبي في القطار.",
        "قطار بوسان": "فيلم رعب كوري عن الزومبي في القطار.",
        "true beauty": "مسلسل كوري رومانسي عن الجمال الحقيقي.",
        "الجمال الحقيقي": "مسلسل كوري رومانسي عن الجمال الحقيقي."
      };

      let reply = "معلش، أنا برد على أسئلة الأفلام والمسلسلات اللي في الموقع بس. جرب تدوس على واحد من الأزرار اللي فوق.";
      for (let key in database) {
        if (text.includes(key)) { reply = database[key]; break; }
      }
      
      addMessage(reply, 'bot');
    }, 1000);
  }
</script>
</body>
</html>
