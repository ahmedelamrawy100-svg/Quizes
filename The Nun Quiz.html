<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✝️ كويز الراهبة - The Nun</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000; color: #eee; font-family: 'Cairo', sans-serif;
    min-height: 100vh; display: flex; justify-content: center; align-items: center;
    padding: 20px; overflow-x: hidden;
    background: radial-gradient(circle at center, #0f0f0f 0%, #000 100%);
  }

  .quiz-box {
    background: rgba(10,10,10,0.98); border: 2px solid #333;
    border-radius: 15px; padding: 25px; max-width: 750px; width: 100%;
    box-shadow: 0 0 30px rgba(255,255,255,0.1); position: relative;
  }
  h1 { text-align: center; color: #ddd; text-shadow: 0 0 15px #fff; margin-bottom: 15px; font-size: 30px; }
  
  .start-content { text-align: center; padding: 30px 10px; }
  .start-content h2 { color: #ccc; font-size: 32px; margin-bottom: 20px; }
  .start-content p { color: #aaa; font-size: 17px; margin-bottom: 25px; line-height: 1.7; }
  .start-btn {
    padding: 15px 50px; background: #222; color: #fff; border: 2px solid #555;
    border-radius: 10px; cursor: pointer; font-family: 'Cairo', sans-serif;
    font-size: 20px; font-weight: 900; transition: 0.3s;
  }
  .start-btn:hover { background: #444; color: #000; box-shadow: 0 0 20px #555; }
  
  .progress { background: #2a2a2a; height: 8px; border-radius: 4px; margin-bottom: 15px; }
  .progress-bar { background: #999; height: 100%; width: 0%; transition: width 0.5s; box-shadow: 0 0 10px #555; }
  .timer { text-align: center; font-size: 18px; color: #ccc; margin-bottom: 15px; font-weight: 700; }
  
  .movie-image {
    width: 100%; height: 250px; border-radius: 10px; margin-bottom: 15px;
    border: 2px solid #333; box-shadow: 0 0 20px rgba(255,255,255,0.1);
    background: #000; display: flex; justify-content: center; align-items: center;
    overflow: hidden; position: relative;
  }
  .movie-image svg { width: 100%; height: 100%; display: block; }

  .question { font-size: 20px; margin-bottom: 20px; color: #fff; line-height: 1.6; }
  .option {
    display: block; background: #1a1a1a; border: 1px solid #333;
    padding: 13px 18px; margin: 9px 0; border-radius: 10px; cursor: pointer;
    transition: 0.25s; font-size: 16px;
  }
  .option:hover:not(.disabled) { background: #2d2d2d; border-color: #666; transform: translateX(-5px); }
  .option.correct { background: #1a5c2a; border-color: #4caf50; }
  .option.wrong { background: #5c2a2a; border-color: #f44336; }
  
  #next {
    display: none; margin-top: 20px; padding: 12px; background: #222;
    color: #fff; border: none; border-radius: 8px; cursor: pointer;
    font-family: 'Cairo', sans-serif; font-size: 16px; font-weight: 700; width: 100%;
  }
  #next:hover { background: #444; color: #000; box-shadow: 0 0 15px #555; }
  #score { margin-top: 15px; font-size: 15px; color: #ccc; text-align: center; font-weight: 700; }
</style>
</head>
<body>

<div class="quiz-box" id="quizBox">
  <div id="startScreen">
    <h1>✝️ كويز الراهبة ✝️</h1>
    <div class="start-content">
      <h2>التحقيق في دير Cârța</h2>
      <p>20 سؤال عن أحداث فيلم The Nun 1 & 2<br><strong>لديك 20 ثانية لكل سؤال</strong><br>هل تقدر تكشف السر؟</p>
      <button class="start-btn" onclick="startQuiz()">✝️ ابدأ التحقيق</button>
    </div>
  </div>

  <div id="quizScreen" style="display:none;">
    <h1>✝️ كويز الراهبة ✝️</h1>
    <div class="progress"><div class="progress-bar" id="progress"></div></div>
    <div class="timer" id="timer">⏱️ 20</div>
    
    <div id="movieImage" class="movie-image"></div>
    
    <div id="question" class="question"></div>
    <div id="options"></div>
    <div id="score"></div>
    <button id="next">السؤال التالي ←</button>
  </div>
</div>

<script>
function generatePoster(title, subtitle) {
  return `
  <svg viewBox="0 0 500 250" xmlns="http://www.w3.org/2000/svg">
    <rect width="500" height="250" fill="#050505"/>
    <circle cx="250" cy="125" r="80" fill="#888" opacity="0.2"/>
    <text x="50%" y="40%" dominant-baseline="middle" text-anchor="middle" fill="#ddd" font-family="Cairo, sans-serif" font-weight="900" font-size="40" filter="drop-shadow(0 0 10px #fff)">${title}</text>
    <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-family="Cairo, sans-serif" font-weight="bold" font-size="20" opacity="0.7">${subtitle}</text>
    <path d="M 0 250 L 250 180 L 500 250" fill="none" stroke="#444" stroke-width="4"/>
  </svg>
  `;
}

const questions = [
  // The Nun 1 (2018)
  { q: "في بداية الجزء الأول، إيه اللي بيحصل في الدير اللي بيخلي الكنيسة تبعت تحقيق؟", options: ["راهبة بتنتحر", "راهبة بتختفي", "حريق في الدير", "سرقة الدير"], answer: 0, title: "THE NUN", subtitle: "PART 1 (2018)" },
  { q: "مين اللي بيتبعت من الفاتيكان للتحقيق في الدير؟", options: ["الأب بيرك", "الأب ميرين", "الأخت إيرين", "كاهن تاني"], answer: 0, title: "THE NUN", subtitle: "PART 1 (2018)" },
  { q: "مين الراهبة الشابة اللي بتساعد الأب في التحقيق؟", options: ["الأخت إيرين", "الأخت أوفيليا", "الأخت فيكتوريا", "الأخت ماري"], answer: 0, title: "THE NUN", subtitle: "PART 1 (2018)" },
  { q: "الشخص اللي بيساعدهم في الدير وبيعرف الطرق بتاعته اسمه إيه؟", options: ["فرينش", "الراهب", "الشرطي", "الراعي"], answer: 0, title: "THE NUN", subtitle: "PART 1 (2018)" },
  { q: "الروح الشريرة في الدير اسمها إيه؟", options: ["فالاك (Valak)", "أنابيل", "باثشيبة", "الراهبة الحمراء"], answer: 0, title: "THE NUN", subtitle: "PART 1 (2018)" },
  { q: "إيه اللي بيحرسه الدير فعلياً؟", options: ["بوابة لروح شريرة", "كنز", "مقبرة", "أسرار الكنيسة"], answer: 0, title: "THE NUN", subtitle: "PART 1 (2018)" },
  { q: "إيه المشكلة اللي بتواجه الأب ومساعدته في الدير؟", options: ["الرهبان مش بيردوا", "الروح الشريرة بتمنعهم", "الباب مقفول", "مفيش مية"], answer: 1, title: "THE NUN", subtitle: "PART 1 (2018)" },
  { q: "في نهاية الجزء الأول، إزاي بيواجهوا الروح الشريرة؟", options: ["بالصلاة والدم المسيح", "بالنار", "بالهروب", "بالماء المقدس"], answer: 0, title: "THE NUN", subtitle: "PART 1 (2018)" },
  { q: "إيه اللي بيحصل للراهبة الشابة في نهاية الجزء الأول؟", options: ["بتتحرر من الروح", "بيتم اختيارها للرهبنة", "بتموت", "بتختفي"], answer: 1, title: "THE NUN", subtitle: "PART 1 (2018)" },
  
  // The Nun 2 (2023)
  { q: "في الجزء الثاني، الراهبة إيرين بقت عايشة فين؟", options: ["دير في فرنسا", "دير في رومانيا", "كنيسة في إنجلترا", "بيت أهلها"], answer: 0, title: "THE NUN", subtitle: "PART 2 (2023)" },
  { q: "إيه اللي بيحصل في بداية الجزء الثاني في الكنيسة؟", options: ["ظهور فالاك", "حريق", "سرقة", "موت كاهن"], answer: 0, title: "THE NUN", subtitle: "PART 2 (2023)" },
  { q: "الروح الشريرة فالاك بترجع في الجزء الثاني عشان تعمل إيه؟", options: ["تنتقم من إيرين", "تاخد كنز", "تقتل الكاهن", "تخرج من الدير"], answer: 0, title: "THE NUN", subtitle: "PART 2 (2023)" },
  { q: "الجزء الثاني بيكشف إن فالاك بتختبئ جوه إيه؟", options: ["جسد راهبة", "جسد كاهن", "تمثال", "مرايا"], answer: 0, title: "THE NUN", subtitle: "PART 2 (2023)" },
  { q: "مين اللي بيساعد إيرين في الجزء الثاني؟", options: ["راهبة تانية", "الأب بيرك", "شخص من الفاتيكان", "صديقتها"], answer: 2, title: "THE NUN", subtitle: "PART 2 (2023)" },
  { q: "إيه اللي بتحاول إيرين تكتشفه عن فالاك؟", options: ["أصلها", "مكانها", "طريقة قتلها", "كل الإجابات صح"], answer: 3, title: "THE NUN", subtitle: "PART 2 (2023)" },
  { q: "إيه اللي بيحصل للمدرسة اللي بتشتغل فيها إيرين؟", options: ["بتتحرق", "بتحصل فيها حوادث غريبة", "بتتقفل", "بتتهد"], answer: 1, title: "THE NUN", subtitle: "PART 2 (2023)" },
  { q: "في نهاية الجزء الثاني، إيه اللي بتواجهه إيرين؟", options: ["فالاك نفسها", "أتباع فالاك", "الأب الشرير", "الروح القديمة"], answer: 0, title: "THE NUN", subtitle: "PART 2 (2023)" },
  { q: "الفيلم بيكشف إن فالاك عايزة إيه من إيرين؟", options: ["تاخد جسدها", "تقتلها", "تستخدمها", "تخوفها"], answer: 0, title: "THE NUN", subtitle: "PART 2 (2023)" },
  { q: "إيه النهاية الحقيقية للجزء الثاني؟", options: ["إيرين بتهرب", "إيرين بتهزم فالاك بالصلاة", "فالاك بتهرب", "الكنيسة بتتدخل"], answer: 1, title: "THE NUN", subtitle: "PART 2 (2023)" }
];

const TOTAL_TIME = 20;
let current = 0, score = 0, answered = false, timerInterval = null, timeLeft = TOTAL_TIME;
let shuffled = [];

function shuffleArray(array) {
  let currentIndex = array.length, randomIndex;
  while (currentIndex != 0) {
    randomIndex = Math.floor(Math.random() * currentIndex);
    currentIndex--;
    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
  }
  return array;
}

// صوت تكة خفيفة
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playClick() {
  if(audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  osc.type = 'sine'; 
  osc.frequency.setValueAtTime(400, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime); 
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
  osc.connect(gain); gain.connect(audioCtx.destination); 
  osc.start(); osc.stop(audioCtx.currentTime + 0.1);
}

function startQuiz() {
  if(audioCtx.state === 'suspended') audioCtx.resume();
  shuffled = [...questions].sort(() => Math.random() - 0.5);
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('quizScreen').style.display = 'block';
  current = 0; score = 0;
  document.getElementById('next').onclick = nextQuestion;
  loadQuestion();
}

function loadQuestion() {
  answered = false; timeLeft = TOTAL_TIME;
  const q = shuffled[current];
  
  document.getElementById('movieImage').innerHTML = generatePoster(q.title, q.subtitle);
  document.getElementById('question').innerText = q.q;
  
  const optEl = document.getElementById('options');
  optEl.innerHTML = '';
  
  let optionsWithAnswers = q.options.map((opt, index) => ({ text: opt, isCorrect: index === q.answer }));
  optionsWithAnswers = shuffleArray(optionsWithAnswers); 
  
  optionsWithAnswers.forEach((opt) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerText = opt.text;
    div.onclick = () => checkAnswer(opt.isCorrect, div);
    optEl.appendChild(div);
  });
  
  document.getElementById('score').innerText = `السؤال ${current + 1} من ${shuffled.length} | النقاط: ${score}`;
  document.getElementById('next').style.display = 'none';
  document.getElementById('progress').style.width = ((current) / shuffled.length * 100) + '%';
  
  clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 1000);
  updateTimer();
}

function updateTimer() {
  const timerEl = document.getElementById('timer');
  timerEl.innerText = `⏱️ ${timeLeft}`;
  if (timeLeft <= 5) timerEl.style.color = '#f44336'; else timerEl.style.color = '#ccc';
  
  if (timeLeft <= 0) {
    clearInterval(timerInterval);
    if (!answered) {
      answered = true;
      document.querySelectorAll('.option').forEach(o => o.classList.add('disabled'));
      document.querySelectorAll('.option').forEach(o => {
        if(o.innerText === shuffled[current].options[shuffled[current].answer]) o.classList.add('correct');
      });
      document.getElementById('next').style.display = 'inline-block';
    }
  }
  timeLeft--;
}

function checkAnswer(isCorrect, el) {
  if (answered) return;
  answered = true; clearInterval(timerInterval);
  
  const allOpts = document.querySelectorAll('.option');
  allOpts.forEach(o => o.classList.add('disabled'));
  
  allOpts.forEach(o => {
    if(o.innerText === shuffled[current].options[shuffled[current].answer]) o.classList.add('correct');
  });
  
  if (isCorrect) {
    score++;
    playClick();
  } else {
    el.classList.add('wrong');
    playClick();
  }
  
  document.getElementById('score').innerText = `السؤال ${current + 1} من ${shuffled.length} | النقاط: ${score}`;
  document.getElementById('next').style.display = 'inline-block';
}

function nextQuestion() {
  current++;
  if (current < shuffled.length) { loadQuestion(); } else { showFinal(); }
}

function showFinal() {
  clearInterval(timerInterval);
  document.getElementById('progress').style.width = '100%';
  document.getElementById('question').innerHTML = `<div style="text-align:center; padding:20px;">
    <h2 style="color:#ddd; font-size:36px;">انتهى التحقيق! ✝️</h2>
    <p style="color:#fff; font-size:22px;">نتيجتك: ${score} / ${shuffled.length}</p>
    <button onclick="location.reload()" style="margin-top:20px; padding:10px 30px; background:#222; color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:18px;">🔄 العب تاني</button>
  </div>`;
  document.getElementById('options').innerHTML = '';
  document.getElementById('movieImage').style.display = 'none';
  document.getElementById('timer').style.display = 'none';
  document.getElementById('score').innerText = '';
  document.getElementById('next').style.display = 'none';
}
</script>
</body>
</html>
