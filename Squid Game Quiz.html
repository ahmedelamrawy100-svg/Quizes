<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦑 كويز لعبة الحبار - Squid Game</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  /* زرار الرجوع */
  .back-btn {
    position: fixed; top: 20px; left: 20px; background: rgba(30, 30, 30, 0.9); color: #fff;
    border: 2px solid #555; padding: 8px 15px; border-radius: 8px; cursor: pointer;
    font-family: 'Cairo', sans-serif; font-weight: bold; text-decoration: none;
    transition: 0.3s; z-index: 999; display: flex; align-items: center; gap: 8px;
  }
  .back-btn:hover { background: #ff0000; border-color: #ff0000; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #050505; color: #eee; font-family: 'Cairo', sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 40px 20px; flex-direction: column; }
  
  h1 { text-align: center; color: #ff0066; text-shadow: 0 0 15px #ff0066; margin-bottom: 10px; font-size: 40px; }
  p.subtitle { text-align: center; color: #aaa; margin-bottom: 40px; font-size: 18px; }

  /* ستايل الكروت */
  .grid-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px; width: 100%; max-width: 1000px;
  }

  .quiz-card {
    background-color: #111; border: 2px solid #333; border-radius: 15px;
    text-decoration: none; color: #fff; text-align: center; transition: 0.3s;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    height: 320px; position: relative; overflow: hidden; background-size: cover; background-position: center;
    cursor: pointer;
  }
  .quiz-card::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, transparent 40%); z-index: 1;
  }
  .quiz-card h2 {
    position: relative; z-index: 2; font-size: 22px; margin-bottom: 15px;
    text-shadow: 0 0 10px #000; width: 100%; padding: 10px;
  }
  .quiz-card:hover { border-color: #ff0066; transform: translateY(-5px); box-shadow: 0 0 20px rgba(255,0,102,0.6); }

  /* شاشة اللعب */
  .play-screen { display: none; width: 100%; max-width: 750px; background: rgba(10,10,10,0.98); border: 2px solid #ff0066; border-radius: 15px; padding: 25px; box-shadow: 0 0 30px rgba(255,0,102,0.4); }
  .progress { background: #2a2a2a; height: 8px; border-radius: 4px; margin-bottom: 15px; }
  .progress-bar { background: #ff0066; height: 100%; width: 0%; transition: width 0.5s; }
  .timer { text-align: center; font-size: 18px; color: #00ffcc; margin-bottom: 15px; font-weight: 700; }
  .question { font-size: 20px; margin-bottom: 20px; color: #fff; line-height: 1.6; }
  .option { display: block; background: #1a1a1a; border: 1px solid #333; padding: 13px 18px; margin: 9px 0; border-radius: 10px; cursor: pointer; transition: 0.25s; font-size: 16px; }
  .option:hover:not(.disabled) { background: #2d1a27; border-color: #ff0066; }
  .option.correct { background: #1a5c2a; border-color: #4caf50; }
  .option.wrong { background: #5c2a2a; border-color: #f44336; }
  #next { display: none; margin-top: 20px; padding: 12px; background: #ff0066; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-family: 'Cairo', sans-serif; font-size: 16px; font-weight: 700; width: 100%; }
  #next:hover { background: #ff3388; }
  #score { margin-top: 15px; font-size: 15px; color: #00ffcc; text-align: center; font-weight: 700; }
</style>
</head>
<body>

<a href="index.html" class="back-btn" id="backBtn">⬅ رجوع / Back</a>

<div id="selectionScreen" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
  <h1 id="main-title">🦑 كويز لعبة الحبار 🦑</h1>
  <p class="subtitle" id="subtitle">اختر الجزء اللي عايز تلعب فيه</p>

  <div class="grid-container">
    <div class="quiz-card" onclick="startGame('part1')" style="background-image: url('pic/Squid Game 1.jpeg');">
      <h2>الجزء الأول (2021)</h2>
    </div>
    <div class="quiz-card" onclick="startGame('part2')" style="background-image: url('pic/Squid Game 2.jpg');">

    </div>
    <div class="quiz-card" onclick="startGame('part3')" style="background-image: url('pic/Squid Game 3.jpg');">
      <h2>الجزء الثالث (2025)</h2>
    </div>
    <div class="quiz-card" onclick="startGame('all')" style="background-image: url('pic/Squid Game.jpg');">
      <h2>الشامل (20 سؤال)</h2>
    </div>
  </div>
</div>

<div id="playScreen" class="play-screen">

  <div class="timer" id="timer">⏱️ 20</div>
  <div id="question" class="question"></div>
  <div id="options"></div>
  <div id="score"></div>
  <button id="next" onclick="nextQuestion()">السؤال التالي ←</button>
</div>

const translations = {
  ar: { title: "🦑 كويز لعبة الحبار 🦑", subtitle: "اختر الجزء اللي عايز تلعب فيه", nextBtn: "السؤال التالي ←", scoreText: "السؤال {c} من {t} | النقاط: {s}", endTitle: "انتهت اللعبة! 🦑", endScore: "نتيجتك: {s} / {t}", playAgain: "🔄 العب تاني", highScore: "🏆 أعلى نتيجة:" },
  en: { title: "🦑 Squid Game Quiz 🦑", subtitle: "Choose the part you want to play", nextBtn: "Next Question →", scoreText: "Question {c} of {t} | Score: {s}", endTitle: "Game Over! 🦑", endScore: "Your Score: {s} / {t}", playAgain: "🔄 Play Again", highScore: "🏆 High Score:" }
};

let currentQuestions = [];
let current = 0, score = 0, answered = false, timerInterval = null, timeLeft = 20;

function applyLanguage() {
  const t = translations[currentLang];
  document.body.dir = currentLang === 'en' ? 'ltr' : 'rtl';
  document.getElementById('main-title').innerText = t.title;
  document.getElementById('subtitle').innerText = t.subtitle;
  document.getElementById('quiz-title').innerText = t.title;
  document.getElementById('next').innerText = t.nextBtn;
}

function startGame(part) {
  if (part === 'part1') { currentQuestions = [...quizData.part1]; currentSaveKey = 'squid_part1_HighScore'; }
  else if (part === 'part2') { currentQuestions = [...quizData.part2]; currentSaveKey = 'squid_part2_HighScore'; }
  else if (part === 'part3') { currentQuestions = [...quizData.part3]; currentSaveKey = 'squid_part3_HighScore'; }
  else { currentQuestions = [...quizData.comprehensive]; currentSaveKey = 'squid_all_HighScore'; }

  highestScore = parseInt(localStorage.getItem(currentSaveKey)) || 0;
  currentQuestions.sort(() => Math.random() - 0.5);

  document.getElementById('selectionScreen').style.display = 'none';
  document.getElementById('playScreen').style.display = 'block';
  document.getElementById('backBtn').style.display = 'none';

  current = 0; score = 0;
  loadQuestion();
}

function loadQuestion() {
  answered = false; timeLeft = 20;
  const q = currentQuestions[current];
  document.getElementById('question').innerText = currentLang === 'ar' ? q.q_ar : q.q_en;
  const optEl = document.getElementById('options');
  optEl.innerHTML = '';
  const currentOptions = currentLang === 'ar' ? q.options_ar : q.options_en;
  let optionsWithAnswers = currentOptions.map((opt, index) => ({ text: opt, isCorrect: index === q.answer }));
  optionsWithAnswers.sort(() => Math.random() - 0.5); 
  optionsWithAnswers.forEach((opt) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerText = opt.text;
    div.onclick = () => checkAnswer(opt.isCorrect, div);
    optEl.appendChild(div);
  });
  document.getElementById('score').innerText = translations[currentLang].scoreText.replace('{c}', current + 1).replace('{t}', currentQuestions.length).replace('{s}', score);
  document.getElementById('next').style.display = 'none';
  document.getElementById('progress').style.width = ((current) / currentQuestions.length * 100) + '%';
  clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 1000);
  updateTimer();
}

function updateTimer() {
  const timerEl = document.getElementById('timer');
  timerEl.innerText = `⏱️ ${timeLeft}`;
  if (timeLeft <= 5) timerEl.style.color = '#f44336';
  if (timeLeft <= 0) {
    clearInterval(timerInterval);
    if (!answered) {
      answered = true;
      document.querySelectorAll('.option').forEach(o => o.classList.add('disabled'));
      const q = currentQuestions[current];
      const currentOptions = currentLang === 'ar' ? q.options_ar : q.options_en;
      document.querySelectorAll('.option').forEach(o => { if(o.innerText === currentOptions[q.answer]) o.classList.add('correct'); });
      document.getElementById('next').style.display = 'inline-block';
    }
  }
  timeLeft--;
}

function checkAnswer(isCorrect, el) {
  if (answered) return;
  answered = true; clearInterval(timerInterval);
  const q = currentQuestions[current];
  const currentOptions = currentLang === 'ar' ? q.options_ar : q.options_en;
  const allOpts = document.querySelectorAll('.option');
  allOpts.forEach(o => o.classList.add('disabled'));
  allOpts.forEach(o => { if(o.innerText === currentOptions[q.answer]) o.classList.add('correct'); });
  if (isCorrect) { score++; } else { el.classList.add('wrong'); }
  document.getElementById('score').innerText = translations[currentLang].scoreText.replace('{c}', current + 1).replace('{t}', currentQuestions.length).replace('{s}', score);
  document.getElementById('next').style.display = 'inline-block';
}

function nextQuestion() {
  current++;
  if (current < currentQuestions.length) { loadQuestion(); } else { showFinal(); }
}

function showFinal() {
  clearInterval(timerInterval);
  document.getElementById('progress').style.width = '100%';
  if (score > highestScore) { highestScore = score; localStorage.setItem(currentSaveKey, highestScore); }
  const t = translations[currentLang];
  document.getElementById('question').innerHTML = `<div style="text-align:center; padding:20px;">
    <h2 style="color:#ff0066; font-size:36px;">${t.endTitle}</h2>
    <p style="color:#fff; font-size:22px;">${t.endScore.replace('{s}', score).replace('{t}', currentQuestions.length)}</p>
    <p style="color:#ffcc00; font-size:18px; margin-top:10px; font-weight:bold;">${t.highScore} ${highestScore}</p>
    <button onclick="location.reload()" style="margin-top:20px; padding:10px 30px; background:#ff0066; color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:18px;">${t.playAgain}</button>
  </div>`;
  document.getElementById('options').innerHTML = '';
  document.getElementById('timer').style.display = 'none';
  document.getElementById('score').innerText = '';
  document.getElementById('next').style.display = 'none';
}

window.onload = applyLanguage;
</script>
