<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚖️ كويز لماذا هي؟ - Why Her?</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  .back-btn { position: fixed; top: 20px; left: 20px; background: rgba(30, 30, 30, 0.9); color: #fff; border: 2px solid #555; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-family: 'Cairo', sans-serif; font-weight: bold; text-decoration: none; transition: 0.3s; z-index: 999; display: flex; align-items: center; gap: 8px; }
  .back-btn:hover { background: #ff0000; border-color: #ff0000; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0a; color: #eee; font-family: 'Cairo', sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
  .quiz-box { background: rgba(15,15,15,0.98); border: 2px solid #a88c5a; border-radius: 15px; padding: 25px; max-width: 750px; width: 100%; box-shadow: 0 0 30px rgba(168,140,90,0.6); position: relative; }
  h1 { text-align: center; color: #d4b87a; text-shadow: 0 0 15px #a88c5a; margin-bottom: 20px; font-size: 30px; }
  p { text-align: center; color: #ccc; margin-bottom: 30px; font-size: 18px; }
  
  body.light-mode { background: #f4f4f4; color: #111; }
  body.light-mode h1 { color: #8b6b3d; text-shadow: none; }
  body.light-mode p { color: #333; }
  body.light-mode .quiz-box { background: #fff; border-color: #a88c5a; }
  body.light-mode .question { color: #111; }
  body.light-mode .option { background: #f9f9f9; color: #111; border-color: #ccc; }
  body.light-mode .option:hover:not(.disabled) { background: #eee; }
  body.light-mode .option.correct { background: #1a5c2a !important; color: #fff !important; border-color: #4caf50 !important; }
  body.light-mode .option.wrong { background: #5c2a2a !important; color: #fff !important; border-color: #f44336 !important; }

  .start-content { text-align: center; padding: 30px 10px; }
  .start-content h2 { color: #d4b87a; font-size: 32px; margin-bottom: 20px; }
  .start-btn { padding: 15px 50px; background: #a88c5a; color: #fff; border: 2px solid #d4b87a; border-radius: 10px; cursor: pointer; font-family: 'Cairo', sans-serif; font-size: 20px; font-weight: 900; transition: 0.3s; }
  .start-btn:hover { background: #d4b87a; color: #000; box-shadow: 0 0 20px #a88c5a; }

  .play-screen { display: none; }
  .progress { background: #2a2a2a; height: 8px; border-radius: 4px; margin-bottom: 15px; }
  .progress-bar { background: #d4b87a; height: 100%; width: 0%; transition: width 0.5s; }
  .timer { text-align: center; font-size: 18px; color: #d4b87a; margin-bottom: 15px; font-weight: 700; }
  .question { font-size: 20px; margin-bottom: 20px; color: #fff; line-height: 1.6; }
  .option { display: block; background: #1a1a1a; border: 1px solid #333; padding: 13px 18px; margin: 9px 0; border-radius: 10px; cursor: pointer; transition: 0.25s; font-size: 16px; }
  .option:hover:not(.disabled) { background: #2d2418; border-color: #d4b87a; }
  .option.correct { background: #1a5c2a; border-color: #4caf50; }
  .option.wrong { background: #5c2a2a; border-color: #f44336; }
  #next { display: none; margin-top: 20px; padding: 12px; background: #a88c5a; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-family: 'Cairo', sans-serif; font-size: 16px; font-weight: 700; width: 100%; }
  #next:hover { background: #d4b87a; color: #000; }
  #score { margin-top: 15px; font-size: 15px; color: #d4b87a; text-align: center; font-weight: 700; }
</style>
</head>
<body>

<a href="index.html" class="back-btn" id="backBtn">⬅ رجوع / Back</a>

<div class="quiz-box" id="quizBox">
  <div id="startScreen">
    <h1 id="main-title">⚖️ كويز لماذا هي؟ ⚖️</h1>
    <div class="start-content">
      <h2 id="start-heading">القانون والانتقام</h2>
      <p id="start-desc">20 سؤال عن أحداث مسلسل Why Her?<br><strong>لديك 20 ثانية لكل سؤال</strong><br>هل تقدر تكشف الحقيقة؟</p>
      <button class="start-btn" id="start-btn" onclick="startQuiz()">⚖️ ابدأ</button>
    </div>
  </div>

  <div id="playScreen" class="play-screen">
    <h1 id="quiz-title">⚖️ كويز لماذا هي؟ ⚖️</h1>
    <div class="progress"><div class="progress-bar" id="progress"></div></div>
    <div class="timer" id="timer">⏱️ 20</div>
    <div id="question" class="question"></div>
    <div id="options"></div>
    <div id="score"></div>
    <button id="next" onclick="nextQuestion()">السؤال التالي ←</button>
  </div>
</div>

<div id="leaderboardModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:2000; justify-content:center; align-items:center;">
    <div style="background:#111; border:2px solid #d4b87a; border-radius:15px; padding:20px; width:90%; max-width:400px; max-height:80vh; overflow-y:auto; box-shadow: 0 0 30px rgba(212,184,122,0.5);">
        <h3 style="color:#d4b87a; text-align:center; margin-bottom:15px;">🏆 لوحة الصدارة / Leaderboard</h3>
        <div id="leaderboardList"></div>
        <button onclick="document.getElementById('leaderboardModal').style.display='none'" style="margin-top:15px; width:100%; padding:10px; background:#d4b87a; color:#000; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">إغلاق / Close</button>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, onValue, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
  const firebaseConfig = { apiKey: "AIzaSyBmyW4tZGJfcHJ4jKSD3_6hebZK58Y3jXo", authDomain: "quiz-hub-app-f4cd0.firebaseapp.com", databaseURL: "https://quiz-hub-app-f4cd0-default-rtdb.firebaseio.com", projectId: "quiz-hub-app-f4cd0", storageBucket: "quiz-hub-app-f4cd0.firebasestorage.app", messagingSenderId: "282772179392", appId: "1:282772179392:web:64646d757592b29ff3a025", measurementId: "G-02K0TEPE31" };
  const app = initializeApp(firebaseConfig); const db = getDatabase(app);
  window.db = db; window.ref = ref; window.push = push; window.onValue = onValue; window.query = query; window.orderByChild = orderByChild; window.limitToLast = limitToLast;
</script>

<script>
if (localStorage.getItem('theme') === 'light') { document.body.classList.add('light-mode'); }
let currentLang = localStorage.getItem('lang') || 'ar'; let highestScore = 0; let currentSaveKey = 'whyher_HighScore';

const questions = [
  { q_ar: "في بداية المسلسل، البطلة (Oh Soo-jae) بتشتغل إيه؟", q_en: "At the start of the series, what does the protagonist (Oh Soo-jae) do?", options_ar: ["محامية في شركة كبيرة", "قاضية", "صحفية", "أستاذة"], options_en: ["A lawyer at a major firm", "A judge", "A journalist", "A professor"], answer: 0 },
  { q_ar: "إيه اللي بيحصل لـ Soo-jae عشان تغير حياتها؟", q_en: "What happens to Soo-jae that changes her life?", options_ar: ["بتحل قضية كبيرة", "بتتعرض لغدر من زميلها", "بتترقى", "بتسيب الشغل"], options_en: ["She solves a big case", "She's betrayed by a colleague", "She gets promoted", "She quits her job"], answer: 1 },
  { q_ar: "Soo-jae بتقابل مين في الجامعة بعد ما تسيب الشغل؟", q_en: "Who does Soo-jae meet at the university after quitting her job?", options_ar: ["طالب بيحبها", "صديق قديم", "محامي تاني", "مديرها"], options_en: ["A student who loves her", "An old friend", "Another lawyer", "Her boss"], answer: 0 },
  { q_ar: "الطالب اللي بتقابله Soo-jae إيه اللي بيميزه؟", q_en: "What characterizes the student Soo-jae meets?", options_ar: ["ذكي جداً وبيحبها", "غني", "مشاغب", "رياضي"], options_en: ["Very smart and loves her", "Rich", "Rebellious", "Athletic"], answer: 0 },
  { q_ar: "Soo-jae بتقرر تعمل إيه في الجامعة؟", q_en: "What does Soo-jae decide to do at the university?", options_ar: ["تدرس القانون", "تشتغل محامية", "تساعد طلاب", "تنتقم"], options_en: ["Study law", "Work as a lawyer", "Help students", "Get revenge"], answer: 0 },
  { q_ar: "إيه اللي بيحاول الطالب (Gong Chan) يعمله عشان يساعد Soo-jae؟", q_en: "What does the student (Gong Chan) try to do to help Soo-jae?", options_ar: ["يدور على الحقيقة", "يهرب معاها", "يسيب الجامعة", "يتجوزها"], options_en: ["Find the truth", "Escape with her", "Leave the university", "Marry her"], answer: 0 },
  { q_ar: "إيه القضية الأساسية اللي Soo-jae بتحقق فيها؟", q_en: "What is the main case Soo-jae investigates?", options_ar: ["قضية فساد", "قضية قتل", "قضية سرقة", "قضية نصب"], options_en: ["A corruption case", "A murder case", "A theft case", "A fraud case"], answer: 0 },
  { q_ar: "الشرير الرئيسي في المسلسل بيدير إيه؟", q_en: "What does the main villain run?", options_ar: ["شركة قانونية", "شركة تجارية", "مستشفى", "جامعة"], options_en: ["A law firm", "A trading company", "A hospital", "A university"], answer: 1 },
  { q_ar: "Soo-jae بتتعاون مع مين عشان تكشف الفساد؟", q_en: "Who does Soo-jae cooperate with to expose corruption?", options_ar: ["الطالب Gong Chan", "صديقتها", "الشرطة", "المحامي التاني"], options_en: ["The student Gong Chan", "Her friend", "The police", "Another lawyer"], answer: 0 },
  { q_ar: "إيه العلاقة اللي بتتطور بين Soo-jae وGong Chan؟", q_en: "What relationship develops between Soo-jae and Gong Chan?", options_ar: ["صداقة", "حب", "خناقة", "منافسة"], options_en: ["Friendship", "Love", "Fight", "Rivalry"], answer: 1 },
  { q_ar: "Soo-jae بتعرف إيه عن ماضيها؟", q_en: "What does Soo-jae find out about her past?", options_ar: ["إنها كانت فقيرة", "إنها كانت غنية", "إنها كانت يتيمة", "إنها كانت مشهورة"], options_en: ["She was poor", "She was rich", "She was an orphan", "She was famous"], answer: 0 },
  { q_ar: "الطالب Gong Chan إيه سر عيلته؟", q_en: "What is the secret of Gong Chan's family?", options_ar: ["عيلته غنية", "عيلته لها علاقة بالفساد", "عيلته مشهورة", "عيلته فقيرة"], options_en: ["His family is rich", "His family is involved in corruption", "His family is famous", "His family is poor"], answer: 1 },
  { q_ar: "إيه اللي بيخلي Soo-jae تقرر تواجه الشرير؟", q_en: "What makes Soo-jae decide to face the villain?", options_ar: ["عشان تنتقم", "عشان تحمي Gong Chan", "عشان تبقى مشهورة", "عشان الفلوس"], options_en: ["For revenge", "To protect Gong Chan", "To become famous", "For money"], answer: 1 },
  { q_ar: "في نهاية المسلسل، إيه اللي بيحصل للشرير؟", q_en: "At the end of the series, what happens to the villain?", options_ar: ["بيهرب", "بيتم القبض عليه", "بيموت", "بيختفي"], options_en: ["He escapes", "He gets arrested", "He dies", "He disappears"], answer: 1 },
  { q_ar: "إيه اللي بتتعلمه Soo-jae في النهاية؟", q_en: "What does Soo-jae learn at the end?", options_ar: ["إن القانون مش كافي", "إن الحب والعدالة هو الحل", "إن الفلوس هي كل حاجة", "إن الانتقام هو الحل"], options_en: ["The law isn't enough", "Love and justice are the answer", "Money is everything", "Revenge is the answer"], answer: 1 },
  { q_ar: "إيه اللي بيميز مسلسل Why Her? عن باقي المسلسلات القانونية؟", q_en: "What distinguishes Why Her? from other legal dramas?", options_ar: ["الرومانسية", "الغموض", "القضايا المعقدة", "كل الإجابات صح"], options_en: ["Romance", "Mystery", "Complex cases", "All answers are correct"], answer: 3 },
  { q_ar: "مين اللي كان بيساعد Soo-jae في تحقيقاتها؟", q_en: "Who helps Soo-jae in her investigations?", options_ar: ["صديقها المحامي", "الطالب Gong Chan", "الشرطة", "كل الإجابات صح"], options_en: ["Her lawyer friend", "The student Gong Chan", "The police", "All answers are correct"], answer: 1 },
  { q_ar: "إيه اللي كان بيمنع Soo-jae من الوصول للحقيقة؟", q_en: "What prevents Soo-jae from reaching the truth?", options_ar: ["الفساد", "الخوف", "الفلوس", "كل الإجابات صح"], options_en: ["Corruption", "Fear", "Money", "All answers are correct"], answer: 3 },
  { q_ar: "في النهاية، Soo-jae قررت تعمل إيه؟", q_en: "At the end, what does Soo-jae decide to do?", options_ar: ["تسيب القانون", "تساعد الناس", "تسافر", "تتجوز"], options_en: ["Quit law", "Help people", "Travel", "Marry"], answer: 1 },
  { q_ar: "إيه اللي بيميز العلاقة بين Soo-jae وGong Chan؟", q_en: "What characterizes the relationship between Soo-jae and Gong Chan?", options_ar: ["فارق السن", "الصداقة", "الحب", "كل الإجابات صح"], options_en: ["Age difference", "Friendship", "Love", "All answers are correct"], answer: 3 }
];

const translations = {
  ar: { title: "⚖️ كويز لماذا هي؟ ⚖️", startHeading: "القانون والانتقام", startDesc: "20 سؤال عن أحداث مسلسل Why Her?<br><strong>لديك 20 ثانية لكل سؤال</strong><br>هل تقدر تكشف الحقيقة؟", startBtn: "⚖️ ابدأ", nextBtn: "السؤال التالي ←", scoreText: "السؤال {c} من {t} | النقاط: {s}", endTitle: "انتهى التحقيق! ⚖️", endScore: "نتيجتك: {s} / {t}", playAgain: "🔄 العب تاني", highScore: "🏆 أعلى نتيجة:" },
  en: { title: "⚖️ Why Her? Quiz ⚖️", startHeading: "Law and Revenge", startDesc: "20 questions about Why Her?<br><strong>You have 20 seconds per question</strong><br>Can you uncover the truth?", startBtn: "⚖️ Start", nextBtn: "Next Question →", scoreText: "Question {c} of {t} | Score: {s}", endTitle: "Investigation Over! ⚖️", endScore: "Your Score: {s} / {t}", playAgain: "🔄 Play Again", highScore: "🏆 High Score:" }
};

let currentQuestions = []; let current = 0, score = 0, answered = false, timerInterval = null, timeLeft = 20;

function applyLanguage() {
  const t = translations[currentLang];
  document.body.dir = currentLang === 'en' ? 'ltr' : 'rtl';
  document.getElementById('main-title').innerText = t.title;
  document.getElementById('start-heading').innerText = t.startHeading;
  document.getElementById('start-desc').innerHTML = t.startDesc;
  document.getElementById('start-btn').innerText = t.startBtn;
  document.getElementById('quiz-title').innerText = t.title;
  document.getElementById('next').innerText = t.nextBtn;
  const backBtn = document.getElementById('backBtn');
  if(backBtn) backBtn.innerText = currentLang === 'en' ? '⬅ Back' : '⬅ رجوع / Back';
}

function startQuiz() {
  currentQuestions = [...questions];
  highestScore = parseInt(localStorage.getItem(currentSaveKey)) || 0;
  currentQuestions.sort(() => Math.random() - 0.5);
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('playScreen').style.display = 'block';
  document.getElementById('backBtn').style.display = 'none';
  current = 0; score = 0;
  loadQuestion();
}

function loadQuestion() {
  answered = false; timeLeft = 20;
  const q = currentQuestions[current];
  document.getElementById('question').innerText = currentLang === 'ar' ? q.q_ar : q.q_en;
  const optEl = document.getElementById('options'); optEl.innerHTML = '';
  const currentOptions = currentLang === 'ar' ? q.options_ar : q.options_en;
  let optionsWithAnswers = currentOptions.map((opt, index) => ({ text: opt, isCorrect: index === q.answer }));
  optionsWithAnswers.sort(() => Math.random() - 0.5); 
  optionsWithAnswers.forEach((opt) => {
    const div = document.createElement('div'); div.className = 'option'; div.innerText = opt.text;
    div.onclick = () => checkAnswer(opt.isCorrect, div); optEl.appendChild(div);
  });
  document.getElementById('score').innerText = translations[currentLang].scoreText.replace('{c}', current + 1).replace('{t}', currentQuestions.length).replace('{s}', score);
  document.getElementById('next').style.display = 'none';
  document.getElementById('progress').style.width = ((current) / currentQuestions.length * 100) + '%';
  clearInterval(timerInterval); timerInterval = setInterval(updateTimer, 1000); updateTimer();
}

function updateTimer() {
  const timerEl = document.getElementById('timer'); timerEl.innerText = `⏱️ ${timeLeft}`;
  if (timeLeft <= 5) timerEl.style.color = '#f44336';
  if (timeLeft <= 0) {
    clearInterval(timerInterval);
    if (!answered) {
      answered = true;
      document.querySelectorAll('.option').forEach(o => o.classList.add('disabled'));
      const q = currentQuestions[current]; const currentOptions = currentLang === 'ar' ? q.options_ar : q.options_en;
      document.querySelectorAll('.option').forEach(o => { if(o.innerText === currentOptions[q.answer]) o.classList.add('correct'); });
      document.getElementById('next').style.display = 'inline-block';
    }
  }
  timeLeft--;
}

function checkAnswer(isCorrect, el) {
  if (answered) return; answered = true; clearInterval(timerInterval);
  const q = currentQuestions[current]; const currentOptions = currentLang === 'ar' ? q.options_ar : q.options_en;
  const allOpts = document.querySelectorAll('.option'); allOpts.forEach(o => o.classList.add('disabled'));
  allOpts.forEach(o => { if(o.innerText === currentOptions[q.answer]) o.classList.add('correct'); });
  if (isCorrect) { score++; } else { el.classList.add('wrong'); }
  document.getElementById('score').innerText = translations[currentLang].scoreText.replace('{c}', current + 1).replace('{t}', currentQuestions.length).replace('{s}', score);
  document.getElementById('next').style.display = 'inline-block';
}

function nextQuestion() { current++; if (current < currentQuestions.length) { loadQuestion(); } else { showFinal(); } }

function showFinal() {
  clearInterval(timerInterval); document.getElementById('progress').style.width = '100%';
  if (score > highestScore) { highestScore = score; localStorage.setItem(currentSaveKey, highestScore); }
  const t = translations[currentLang]; const isEnglish = currentLang === 'en';
  
  const playerName = localStorage.getItem('loggedInUser') || (isEnglish ? 'Anonymous Player' : 'لاعب مجهول');
  if(window.db && window.push) {
      try {
          const quizName = 'whyher';
          window.push(window.ref(window.db, 'leaderboard/' + quizName), { user: playerName, score: score, total: currentQuestions.length, time: new Date().toISOString() });
      } catch(e) { console.log("Error saving score", e); }
  }

  document.getElementById('question').innerHTML = `<div style="text-align:center; padding:20px;">
    <h2 style="color:#d4b87a; font-size:36px;">${t.endTitle}</h2>
    <p style="color:#fff; font-size:22px;">${t.endScore.replace('{s}', score).replace('{t}', currentQuestions.length)}</p>
    <p style="color:#ffcc00; font-size:18px; margin-top:10px; font-weight:bold;">${t.highScore} ${highestScore}</p>
    <button onclick="showLeaderboard('whyher')" style="margin-top:15px; padding:12px 20px; background:#ffcc00; color:#000; border:none; border-radius:8px; cursor:pointer; font-size:16px; font-weight:bold; width:100%; max-width:250px; display:block; margin-left:auto; margin-right:auto;">${isEnglish ? '🏆 View Leaderboard' : '🏆 عرض لوحة الصدارة'}</button>
    <button onclick="location.reload()" style="margin-top:10px; padding:12px 30px; background:#a88c5a; color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:18px; width:100%; max-width:250px; display:block; margin-left:auto; margin-right:auto;">${t.playAgain}</button>
  </div>`;
  document.getElementById('options').innerHTML = ''; document.getElementById('timer').style.display = 'none';
  document.getElementById('score').innerText = ''; document.getElementById('next').style.display = 'none';
  document.getElementById('backBtn').style.display = 'flex'; 
}

function showLeaderboard(quizName) {
    const modal = document.getElementById('leaderboardModal'); const list = document.getElementById('leaderboardList');
    const isEnglish = localStorage.getItem('lang') === 'en';
    modal.style.display = 'flex';
    list.innerHTML = `<p style="color:#888; text-align:center;">${isEnglish ? 'Loading...' : 'جاري التحميل...'}</p>`;
    if(!window.db) return;
    try {
        const lbRef = window.query(window.ref(window.db, 'leaderboard/' + quizName), window.orderByChild('score'), window.limitToLast(10));
        window.onValue(lbRef, (snapshot) => {
            const data = snapshot.val(); list.innerHTML = '';
            if(!data) { list.innerHTML = `<p style="color:#888; text-align:center;">${isEnglish ? 'No scores yet!' : 'مفيش نتائج لحد دلوقتي!'}</p>`; return; }
            const arr = Object.values(data).sort((a,b) => b.score - a.score);
            arr.forEach((item, index) => {
                const div = document.createElement('div');
                div.style.cssText = 'display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #333; color:#fff;';
                let medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `#${index+1}`;
                div.innerHTML = `<span>${medal} 👤 ${item.user}</span> <span style="color:#ffcc00; font-weight:bold;">${item.score} / ${item.total}</span>`;
                list.appendChild(div);
            });
        });
    } catch(e) { list.innerHTML = 'Error loading leaderboard'; }
}
window.onload = applyLanguage;
</script>
</body>
</html>
