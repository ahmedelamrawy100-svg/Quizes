<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔔 الإشعارات - Quiz Hub</title>
<link rel="icon" type="image/png" href="pic/Logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg-color: #000; --text-color: #fff; --card-bg: #111; --border: #333; --accent: #ff0000; --gold: #ffd700; --danger: #f44336; }
  body.light-mode { --bg-color: #f4f4f4; --text-color: #111; --card-bg: #fff; --border: #ccc; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg-color); color: var(--text-color); font-family: 'Cairo', sans-serif; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
  
  .top-bar { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .back-btn { background: #222; color: #fff; border: 2px solid #555; padding: 8px 15px; border-radius: 8px; text-decoration: none; font-weight: bold; }
  .lang-btn { background: #333; color: #fff; border: 2px solid #555; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; }
  
  .container { width: 100%; max-width: 600px; }
  .header-title { text-align: center; color: var(--accent); font-size: 32px; margin-bottom: 30px; font-weight: bold; }
  
  .notif-list { display: flex; flex-direction: column; gap: 15px; }
  .notif-item { background: var(--card-bg); border: 2px solid var(--border); border-radius: 15px; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; }
  .notif-info { display: flex; align-items: center; gap: 15px; }
  .notif-icon { font-size: 24px; }
  .notif-text { font-weight: bold; font-size: 16px; }
  .notif-time { font-size: 14px; color: #aaa; margin-top: 5px; }
  
  .action-btn { padding: 8px 15px; border-radius: 8px; text-decoration: none; color: #fff; font-weight: bold; font-size: 14px; border: none; cursor: pointer; font-family: 'Cairo'; }
  .btn-gold { background: var(--gold); color: #000; }
  .btn-danger { background: var(--danger); color: #fff; }
  
  .no-data { text-align: center; color: #aaa; padding: 30px; background: var(--card-bg); border-radius: 15px; }
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html" class="back-btn" id="backBtn" data-ar="⬅ رجوع للرئيسية" data-en="⬅ Back to Home">⬅ رجوع للرئيسية</a>
  <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">EN</button>
</div>

<div class="container">
  <h1 class="header-title" id="mainTitle" data-ar="🔔 مركز الإشعارات" data-en="🔔 Notification Center">🔔 مركز الإشعارات</h1>
  
  <div class="notif-list" id="notificationsList">
    <div class="no-data" id="loadingText" data-ar="جاري تحميل الإشعارات..." data-en="Loading notifications...">جاري تحميل الإشعارات...</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = { apiKey: "AIzaSyBmyW4tZGJfcHJ4jKSD3_6hebZK58Y3jXo", authDomain: "quiz-hub-app-f4cd0.firebaseapp.com", databaseURL: "https://quiz-hub-app-f4cd0-default-rtdb.firebaseio.com", projectId: "quiz-hub-app-f4cd0", storageBucket: "quiz-hub-app-f4cd0.firebasestorage.app", messagingSenderId: "282772179392", appId: "1:282772179392:web:64646d757592b29ff3a025" };
  const app = initializeApp(firebaseConfig); const db = getDatabase(app);

  const currentUser = localStorage.getItem('loggedInUser');
  if (!currentUser) { window.location.href = 'index.html'; }

  let currentLang = localStorage.getItem('lang') || 'ar';
  const translations = {
    ar: { back: "⬅ رجوع للرئيسية", title: "🔔 مركز الإشعارات", loading: "جاري تحميل الإشعارات...", friendReq: "طلب صداقة من", waiting: "في انتظار الموافقة", viewReq: "عرض الطلب", warning: "تحذير من الإدارة", reason: "السبب:", message: "رسالة من", view: "عرض", noNotifs: "لا توجد إشعارات جديدة حالياً." },
    en: { back: "⬅ Back to Home", title: "🔔 Notification Center", loading: "Loading notifications...", friendReq: "Friend request from", waiting: "Waiting for approval", viewReq: "View Request", warning: "Warning from Admin", reason: "Reason:", message: "Message from", view: "View", noNotifs: "No new notifications." }
  };

  function applyLanguage() {
      const t = translations[currentLang];
      document.body.dir = currentLang === 'en' ? 'ltr' : 'rtl';
      document.getElementById('backBtn').innerText = t.back;
      document.getElementById('mainTitle').innerText = t.title;
      document.getElementById('loadingText').innerText = t.loading;
      document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'EN' : 'AR';
      loadNotifications(); // إعادة تحميل الإشعارات عشان تتحدث باللغة الجديدة
  }

  window.toggleLanguage = function() {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      localStorage.setItem('lang', currentLang);
      applyLanguage();
  }

  const list = document.getElementById('notificationsList');
  let totalNotifs = 0;

  function loadNotifications() {
      list.innerHTML = '';
      totalNotifs = 0;
      const t = translations[currentLang];

      // 1. طلبات الصداقة
      onValue(ref(db, 'friend_requests'), (snapshot) => {
          const data = snapshot.val();
          let myRequests = {};
          if (data) {
              for (let key in data) {
                  if (key.toLowerCase() === currentUser.toLowerCase()) { myRequests = data[key]; break; }
              }
          }
          
          list.innerHTML = '';
          totalNotifs = 0;

          for (let sender in myRequests) {
              totalNotifs++;
              const div = document.createElement('div');
              div.className = 'notif-item';
              div.innerHTML = `
                  <div class="notif-info">
                      <div class="notif-icon">👤</div>
                      <div>
                          <div class="notif-text">${t.friendReq} ${sender}</div>
                          <div class="notif-time">${t.waiting}</div>
                      </div>
                  </div>
                  <a href="inbox.html" class="action-btn btn-gold">${t.viewReq}</a>
              `;
              list.appendChild(div);
          }

          // 2. التحذيرات
          onValue(ref(db, 'warnings'), (warnSnapshot) => {
              const warnData = warnSnapshot.val();
              let myWarning = null;
              if (warnData) {
                  for (let key in warnData) {
                      if (key.toLowerCase() === currentUser.toLowerCase()) { myWarning = warnData[key]; break; }
                  }
              }

              if (myWarning) {
                  totalNotifs++;
                  const div = document.createElement('div');
                  div.className = 'notif-item';
                  div.style.borderColor = 'var(--danger)';
                  div.innerHTML = `
                      <div class="notif-info">
                          <div class="notif-icon">⚠️</div>
                          <div>
                              <div class="notif-text" style="color: var(--danger);">${t.warning}</div>
                              <div class="notif-time">${t.reason} ${myWarning.text}</div>
                          </div>
                      </div>
                      <div class="action-btn btn-danger">${t.warning}</div>
                  `;
                  list.appendChild(div);
              }

              // 3. الرسايل
              get(ref(db, 'messages/' + currentUser)).then((msgSnap) => {
                  const msgData = msgSnap.val();
                  if (msgData) {
                      const msgs = Object.values(msgData).reverse().slice(0, 5);
                      msgs.forEach(msg => {
                          totalNotifs++;
                          const div = document.createElement('div');
                          div.className = 'notif-item';
                          div.innerHTML = `
                              <div class="notif-info">
                                  <div class="notif-icon">📩</div>
                                  <div>
                                      <div class="notif-text">${t.message} ${msg.from}</div>
                                      <div class="notif-time">${msg.text}</div>
                                  </div>
                              </div>
                              <a href="inbox.html" class="action-btn btn-gold">${t.view}</a>
                          `;
                          list.appendChild(div);
                      });
                  }

                  if (totalNotifs === 0) {
                      list.innerHTML = `<div class="no-data">${t.noNotifs}</div>`;
                  }
              });
          });
      });
  }

  applyLanguage();
</script>
</body>
</html>
