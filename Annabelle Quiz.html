<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎃 كويز أنابيل - Annabelle</title>
<link rel="icon" type="image/png" href="pic/Logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; }
  .modal-box { background: #111; border: 2px solid #ff3333; border-radius: 15px; padding: 30px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 0 30px rgba(255,51,51,0.4); }
  .modal-box h2 { color: #ff3333; margin-bottom: 20px; }
  .modal-box input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #555; background: #222; color: #fff; font-family: 'Cairo'; font-size: 18px; text-align: center; letter-spacing: 2px; }
  .modal-box button { width: 100%; padding: 12px; margin-bottom: 10px; border: none; border-radius: 8px; font-family: 'Cairo'; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
  .btn-create { background: #ff3333; color: #fff; }
  .btn-create:hover { background: #fff; color: #ff3333; }
  .btn-join { background: #8b0000; color: #fff; }
  .btn-join:hover { background: #ff3333; color: #fff; }
  .btn-close { background: #333; color: #fff; }
  .btn-close:hover { background: #555; }
  .room-code-display { font-size: 32px; font-weight: bold; color: #fff; background: #000; padding: 15px; border-radius: 10px; border: 2px dashed #ff3333; margin-bottom: 15px; letter-spacing: 5px; }
  .status-text { color: #aaa; font-size: 14px; margin-bottom: 15px; min-height: 20px; }
  .challenge-btn { margin-top: 30px; padding: 15px 40px; background: #8b0000; color: #fff; border: 2px solid #ff3333; border-radius: 10px; font-family: 'Cairo'; font-size: 22px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 0 20px rgba(139,0,0,0.6); }
  .challenge-btn:hover { background: #ff3333; color: #fff; transform: scale(1.05); }
</style>
</head>
<body>

<a href="index.html" class="back-btn" id="backBtn">⬅ رجوع / Back</a>

<div id="selectionScreen" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
  <h1 id="main-title" class="main-title">🎃 كويز أنابيل 🎃</h1>
  <p class="subtitle" id="subtitle-text">اختر الجزء اللي عايز تلعب فيه</p>

  <div class="grid-container">
    <div class="quiz-card" onclick="startGame('part1')" style="background-image: url('pic/A. 2014.jpeg');"><h2 class="card-title" data-ar="الجزء الأول (2014)" data-en="Part 1 (2014)">الجزء الأول (2014)</h2></div>
    <div class="quiz-card" onclick="startGame('part2')" style="background-image: url('pic/Creation.jpeg');"><h2 class="card-title" data-ar="الجزء الثاني (2017)" data-en="Part 2 (2017)">الجزء الثاني (2017)</h2></div>
    <div class="quiz-card" onclick="startGame('part3')" style="background-image: url('pic/Comes Home.jpeg');"><h2 class="card-title" data-ar="الجزء الثالث (2019)" data-en="Part 3 (2019)">الجزء الثالث (2019)</h2></div>
    <div class="quiz-card" onclick="startGame('all')" style="background-image: url('pic/Annabelle.jpg');"><h2 class="card-title" data-ar="الشامل" data-en="Comprehensive">الشامل</h2></div>
  </div>

  <button class="challenge-btn" onclick="openChallengeModal()" id="challengeBtn">⚔️ تحدي صديق (الشامل)</button>
</div>

<div id="playScreen" class="play-screen">
  <h1 id="quiz-title" style="font-size: 30px; margin-bottom: 20px; color:#ff3333;">🎃 كويز أنابيل 🎃</h1>
  <div class="progress"><div class="progress-bar" id="progress"></div></div>
  <div class="timer" id="timer">⏱️ 20</div>
  <div id="question" class="question"></div>
  <div id="options"></div>
  <div id="score"></div>
  <button id="next" onclick="nextQuestion()">السؤال التالي ←</button>
</div>

<div class="modal-overlay" id="challengeModal">
  <div class="modal-box">
    <h2 id="modal-title"></h2>
    <div id="challengeOptions">
      <button id="btnCreateRoom" class="btn-create" onclick="createRoom()"></button>
      <input type="text" id="roomCodeInput" maxlength="6" style="margin-top: 15px;">
      <button id="btnJoinRoom" class="btn-join" onclick="joinRoom()"></button>
    </div>
    <div id="waitingRoom" style="display: none;">
      <p id="sendCodeText" style="color:#fff; margin-bottom: 10px;"></p>
      <div class="room-code-display" id="displayRoomCode">------</div>
      <p class="status-text" id="waitingStatus"></p>
    </div>
    <button id="btnCloseModal" class="btn-close" onclick="closeChallengeModal()" style="margin-top: 10px;"></button>
  </div>
</div>

<script>
  // تعريف الأصوات
  const correctSound = new Audio('sounds/the_nun.mp3'); 
  const wrongSound = new Audio('sounds/laugh-annabelle.mp3'); 
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, update, get, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
  const firebaseConfig = { apiKey: "AIzaSyBmyW4tZGJfcHJ4jKSD3_6hebZK58Y3jXo", authDomain: "quiz-hub-app-f4cd0.firebaseapp.com", databaseURL: "https://quiz-hub-app-f4cd0-default-rtdb.firebaseio.com", projectId: "quiz-hub-app-f4cd0", storageBucket: "quiz-hub-app-f4cd0.firebasestorage.app", messagingSenderId: "282772179392", appId: "1:282772179392:web:64646d757592b29ff3a025", measurementId: "G-02K0TEPE31" };
  const app = initializeApp(firebaseConfig); const db = getDatabase(app);
  window.db = db; window.ref = ref; window.set = set; window.onValue = onValue; window.update = update; window.get = get; window.remove = remove;
</script>

<script src="questions.js"></script>

<script>
  if (localStorage.getItem('theme') === 'light') { document.body.classList.add('light-mode'); }
  let currentLang = localStorage.getItem('lang') || 'ar'; let highestScore = 0; let currentSaveKey = 'annabelle';
  const quizData = allQuizzesData.annabelle;

  const translations = {
    ar: { 
      title: "🎃 كويز أنابيل 🎃", subtitle: "اختر الجزء اللي عايز تلعب فيه", nextBtn: "السؤال التالي ←", 
      scoreText: "السؤال {c} من {t} | النقاط: {s}", endTitle: "انتهى الكويز! 🎃", 
      endScore: "نتيجتك: {s} / {t}", playAgain: "🔄 العب تاني", highScore: "🏆 أعلى نتيجة:", 
      youWon: "🎉 أنت الفائز!", youLost: "😢 خسرت التحدي!", draw: "🤝 تعادل!", 
      waiting: "في انتظار صديقك... ⏳", waitingDesc: "رجاءً استنى لحد ما يخلص الكويز عشان تظهر النتيجة.",
      roomTitle: "تحدي الأصدقاء ⚔️", createRoomBtn: "إنشاء غرفة جديدة", joinRoomBtn: "انضمام لغرفة",
      roomCodePlaceholder: "اكتب كود الغرفة هنا", sendCodeText: "ابعت الكود ده لصاحبك:",
      waitJoinText: "في انتظار انضمام صديقك...", closeBtn: "إغلاق", challengeBtnText: "⚔️ تحدي صديق (الشامل)"
    },
    en: { 
      title: "🎃 Annabelle Quiz 🎃", subtitle: "Choose the part you want to play", nextBtn: "Next Question →", 
      scoreText: "Question {c} of {t} | Score: {s}", endTitle: "Quiz Over! 🎃", 
      endScore: "Your Score: {s} / {t}", playAgain: "🔄 Play Again", highScore: "🏆 High Score:", 
      youWon: "🎉 You Won!", youLost: "😢 You Lost!", draw: "🤝 Draw!", 
      waiting: "Waiting for your friend... ⏳", waitingDesc: "Please wait until they finish the quiz to see the final result.",
      roomTitle: "Challenge Friend ⚔️", createRoomBtn: "Create New Room", joinRoomBtn: "Join Room",
      roomCodePlaceholder: "Enter room code here", sendCodeText: "Send this code to your friend:",
      waitJoinText: "Waiting for your friend to join...", closeBtn: "Close", challengeBtnText: "⚔️ Challenge Friend (All)"
    }
  };

  let currentQuestions = []; let current = 0, score = 0, answered = false, timerInterval = null, timeLeft = 20;
  let isChallengeMode = false; let myRoomCode = null; let myRole = null;

  // دالة عشان نفك قفل الصوت في المتصفح عند أول دوسة
  document.body.addEventListener('click', function initAudio() {
      correctSound.volume = 0; wrongSound.volume = 0;
      correctSound.play().then(() => {
          correctSound.pause(); correctSound.volume = 1;
          wrongSound.play().then(() => {
              wrongSound.pause(); wrongSound.volume = 1;
          }).catch(()=>{});
      }).catch(()=>{});
      document.body.removeEventListener('click', initAudio);
  });

  function applyLanguage() {
    const t = translations[currentLang];
    document.body.dir = currentLang === 'en' ? 'ltr' : 'rtl';
    document.getElementById('main-title').innerText = t.title;
    document.getElementById('subtitle-text').innerText = t.subtitle;
    document.getElementById('quiz-title').innerText = t.title;
    document.getElementById('next').innerText = t.nextBtn;
    document.getElementById('challengeBtn').innerText = t.challengeBtnText;
    document.querySelectorAll('.card-title').forEach(card => {
      card.innerText = currentLang === 'en' ? card.getAttribute('data-en') : card.getAttribute('data-ar');
    });
    const backBtn = document.getElementById('backBtn');
    if(backBtn) backBtn.innerText = currentLang === 'en' ? '⬅ Back' : '⬅ رجوع / Back';

    document.getElementById('modal-title').innerText = t.roomTitle;
    document.getElementById('btnCreateRoom').innerText = t.createRoomBtn;
    document.getElementById('btnJoinRoom').innerText = t.joinRoomBtn;
    document.getElementById('roomCodeInput').placeholder = t.roomCodePlaceholder;
    document.getElementById('sendCodeText').innerText = t.sendCodeText;
    document.getElementById('waitingStatus').innerText = t.waitJoinText;
    document.getElementById('btnCloseModal').innerText = t.closeBtn;
  }

  function openChallengeModal() {
    document.getElementById('challengeModal').style.display = 'flex';
    document.getElementById('challengeOptions').style.display = 'block';
    document.getElementById('waitingRoom').style.display = 'none';
  }

  function closeChallengeModal() {
    document.getElementById('challengeModal').style.display = 'none';
    if (myRoomCode && myRole === 'player1') {
      window.remove(window.ref(window.db, 'rooms/' + myRoomCode));
      myRoomCode = null;
    }
  }

  function createRoom() {
    const code = Math.random().toString(36).substring(2, 8).toUpperCase();
    myRoomCode = code; myRole = 'player1'; isChallengeMode = true;
    document.getElementById('displayRoomCode').innerText = code;
    document.getElementById('challengeOptions').style.display = 'none';
    document.getElementById('waitingRoom').style.display = 'block';

    window.set(window.ref(window.db, 'rooms/' + code), {
      player1_score: null, player2_score: null, status: 'waiting', created_at: Date.now()
    }).then(() => {
      window.onValue(window.ref(window.db, 'rooms/' + code), (snapshot) => {
        const data = snapshot.val();
        if (data && data.status === 'playing' && myRole === 'player1' && !document.getElementById('playScreen').classList.contains('active-play')) {
           document.getElementById('challengeModal').style.display = 'none';
           startChallengeQuiz();
        }
      });
    });
  }

  function joinRoom() {
    const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
    if (!code) { alert("اكتب كود الغرفة الأول!"); return; }
    myRole = 'player2'; myRoomCode = code; isChallengeMode = true;

    window.get(window.ref(window.db, 'rooms/' + code)).then((snapshot) => {
      if (snapshot.exists()) {
        const data = snapshot.val();
        if (data.status === 'waiting') {
          window.update(window.ref(window.db, 'rooms/' + code), { status: 'playing' }).then(() => {
             document.getElementById('challengeModal').style.display = 'none';
             startChallengeQuiz();
          });
        } else {
          alert("هذه الغرفة ممتلئة أو اللعبة بدأت بالفعل.");
        }
      } else {
        alert("كود الغرفة غير صحيح.");
      }
    });
  }

  function startChallengeQuiz() {
    document.getElementById('playScreen').classList.add('active-play');
    currentQuestions = [...quizData.comprehensive]; 
    document.getElementById('selectionScreen').style.display = 'none';
    document.getElementById('playScreen').style.display = 'block';
    document.getElementById('backBtn').style.display = 'none';
    current = 0; score = 0; loadQuestion();
  }

  function startGame(part) {
    isChallengeMode = false;
    if (part === 'part1') { currentQuestions = [...quizData.part1]; currentSaveKey = 'annabelle_part1_HighScore'; }
    else if (part === 'part2') { currentQuestions = [...quizData.part2]; currentSaveKey = 'annabelle_part2_HighScore'; }
    else if (part === 'part3') { currentQuestions = [...quizData.part3]; currentSaveKey = 'annabelle_part3_HighScore'; }
    else { currentQuestions = [...quizData.comprehensive]; currentSaveKey = 'annabelle_all_HighScore'; }
    
    currentQuestions.sort(() => Math.random() - 0.5); 
    highestScore = parseInt(localStorage.getItem(currentSaveKey)) || 0;
    
    document.getElementById('selectionScreen').style.display = 'none';
    document.getElementById('playScreen').style.display = 'block';
    document.getElementById('backBtn').style.display = 'none';
    current = 0; score = 0; loadQuestion();
  }

  function loadQuestion() {
    answered = false; timeLeft = 20;
    const q = currentQuestions[current];
    document.getElementById('question').innerText = currentLang === 'ar' ? q.q_ar : q.q_en;
    const optEl = document.getElementById('options'); optEl.innerHTML = '';
    const currentOptions = currentLang === 'ar' ? q.options_ar : q.options_en;
    let optionsWithAnswers = currentOptions.map((opt, index) => ({ text: opt, isCorrect: index === q.answer }));
    optionsWithAnswers.sort(() => Math.random() - 0.5); 
    optionsWithAnswers.forEach((opt) => {
      const div = document.createElement('div'); div.className = 'option'; div.innerText = opt.text;
      div.onclick = () => checkAnswer(opt.isCorrect, div); optEl.appendChild(div);
    });
    document.getElementById('score').innerText = translations[currentLang].scoreText.replace('{c}', current + 1).replace('{t}', currentQuestions.length).replace('{s}', score);
    document.getElementById('next').style.display = 'none';
    document.getElementById('progress').style.width = ((current) / currentQuestions.length * 100) + '%';
    clearInterval(timerInterval); timerInterval = setInterval(updateTimer, 1000); updateTimer();
  }

  function updateTimer() {
    const timerEl = document.getElementById('timer'); timerEl.innerText = `⏱️ ${timeLeft}`;
    if (timeLeft <= 5) timerEl.style.color = '#f44336';
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      if (!answered) {
        answered = true;
        document.querySelectorAll('.option').forEach(o => o.classList.add('disabled'));
        const q = currentQuestions[current]; const currentOptions = currentLang === 'ar' ? q.options_ar : q.options_en;
        document.querySelectorAll('.option').forEach(o => { if(o.innerText === currentOptions[q.answer]) o.classList.add('correct'); });
        document.getElementById('next').style.display = 'inline-block';
      }
    }
    timeLeft--;
  }

  function checkAnswer(isCorrect, el) {
    if (answered) return; answered = true; clearInterval(timerInterval);
    const q = currentQuestions[current]; const currentOptions = currentLang === 'ar' ? q.options_ar : q.options_en;
    const allOpts = document.querySelectorAll('.option'); allOpts.forEach(o => o.classList.add('disabled'));
    allOpts.forEach(o => { if(o.innerText === currentOptions[q.answer]) o.classList.add('correct'); });
    
    if (isCorrect) { 
        score++; 
        correctSound.currentTime = 0; 
        correctSound.play(); 
    } else { 
        el.classList.add('wrong'); 
        wrongSound.currentTime = 0; 
        wrongSound.play(); 
    }
    
    document.getElementById('score').innerText = translations[currentLang].scoreText.replace('{c}', current + 1).replace('{t}', currentQuestions.length).replace('{s}', score);
    document.getElementById('next').style.display = 'inline-block';
  }

  function nextQuestion() { current++; if (current < currentQuestions.length) { loadQuestion(); } else { showFinal(); } }

  function showFinal() {
    clearInterval(timerInterval); document.getElementById('progress').style.width = '100%';
    
    if (isChallengeMode && myRoomCode) {
      let updateData = {};
      if (myRole === 'player1') updateData.player1_score = score;
      else updateData.player2_score = score;
      
      window.update(window.ref(window.db, 'rooms/' + myRoomCode), updateData).then(() => {
        document.getElementById('question').innerHTML = `<div style="text-align:center; padding:20px;">
          <h2 style="color:#ff3333; font-size:30px; margin-bottom:15px;">${translations[currentLang].waiting}</h2>
          <p style="color:#aaa; font-size:18px;">${translations[currentLang].waitingDesc}</p>
        </div>`;
        document.getElementById('options').innerHTML = ''; 
        document.getElementById('timer').style.display = 'none';
        document.getElementById('score').innerText = ''; 
        document.getElementById('next').style.display = 'none';

        window.onValue(window.ref(window.db, 'rooms/' + myRoomCode), (snapshot) => {
          const data = snapshot.val();
          
          if (data && data.player1_score !== null && data.player2_score !== null) {
            const myScore = myRole === 'player1' ? data.player1_score : data.player2_score;
            const opScore = myRole === 'player1' ? data.player2_score : data.player1_score;
            
            let resultMsg = "";
            if (myScore > opScore) resultMsg = translations[currentLang].youWon;
            else if (myScore < opScore) resultMsg = translations[currentLang].youLost;
            else resultMsg = translations[currentLang].draw;

            document.getElementById('question').innerHTML = `<div style="text-align:center; padding:20px;">
              <h2 style="color:#ff3333; font-size:36px;">${resultMsg}</h2>
              <p style="color:#fff; font-size:22px;">نتيجتك: ${myScore} | نتيجة صديقك: ${opScore}</p>
              <button onclick="location.reload()" style="margin-top:20px; padding:12px 30px; background:#8b0000; color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:18px; font-weight:bold;">العودة للرئيسية</button>
            </div>`;
            document.getElementById('backBtn').style.display = 'flex';
            window.remove(window.ref(window.db, 'rooms/' + myRoomCode));
          }
        });
      });
    } else {
      if (score > highestScore) { highestScore = score; localStorage.setItem(currentSaveKey, highestScore); }
      const t = translations[currentLang];
      document.getElementById('question').innerHTML = `<div style="text-align:center; padding:20px;">
        <h2 style="color:#ff3333; font-size:36px;">${t.endTitle}</h2>
        <p style="color:#fff; font-size:22px;">${t.endScore.replace('{s}', score).replace('{t}', currentQuestions.length)}</p>
        <p style="color:#ffcc00; font-size:18px; margin-top:10px; font-weight:bold;">${t.highScore} ${highestScore}</p>
        <button onclick="location.reload()" style="margin-top:10px; padding:12px 30px; background:#8b0000; color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:18px; width:100%; max-width:250px; display:block; margin-left:auto; margin-right:auto;">${t.playAgain}</button>
      </div>`;
      document.getElementById('options').innerHTML = ''; document.getElementById('timer').style.display = 'none';
      document.getElementById('score').innerText = ''; document.getElementById('next').style.display = 'none';
      document.getElementById('backBtn').style.display = 'flex'; 
    }
  }

  window.startGame = startGame;
  window.nextQuestion = nextQuestion;
  window.openChallengeModal = openChallengeModal;
  window.closeChallengeModal = closeChallengeModal;
  window.createRoom = createRoom;
  window.joinRoom = joinRoom;
  window.onload = applyLanguage;
</script>
</body>
</html>
