<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚄 كويز قطار بوسان - Train to Busan</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000; color: #eee; font-family: 'Cairo', sans-serif;
    min-height: 100vh; display: flex; justify-content: center; align-items: center;
    padding: 20px; overflow-x: hidden;
    background: radial-gradient(circle at center, #0d1117 0%, #000 100%);
  }

  .quiz-box {
    background: rgba(15,15,15,0.98); border: 2px solid #3b4a5a;
    border-radius: 15px; padding: 25px; max-width: 750px; width: 100%;
    box-shadow: 0 0 30px rgba(59,74,90,0.6); position: relative;
  }
  h1 { text-align: center; color: #7ba8d4; text-shadow: 0 0 15px #3b4a5a; margin-bottom: 15px; font-size: 30px; }
  
  .start-content { text-align: center; padding: 30px 10px; }
  .start-content h2 { color: #7ba8d4; font-size: 32px; margin-bottom: 20px; }
  .start-content p { color: #aaa; font-size: 17px; margin-bottom: 25px; line-height: 1.7; }
  .start-btn {
    padding: 15px 50px; background: #3b4a5a; color: #fff; border: 2px solid #7ba8d4;
    border-radius: 10px; cursor: pointer; font-family: 'Cairo', sans-serif;
    font-size: 20px; font-weight: 900; transition: 0.3s;
  }
  .start-btn:hover { background: #7ba8d4; color: #000; box-shadow: 0 0 20px #3b4a5a; }
  
  .progress { background: #2a2a2a; height: 8px; border-radius: 4px; margin-bottom: 15px; }
  .progress-bar { background: #7ba8d4; height: 100%; width: 0%; transition: width 0.5s; box-shadow: 0 0 10px #3b4a5a; }
  .timer { text-align: center; font-size: 18px; color: #7ba8d4; margin-bottom: 15px; font-weight: 700; }
  
  .movie-image {
    width: 100%; height: 250px; border-radius: 10px; margin-bottom: 15px;
    border: 2px solid #3b4a5a; box-shadow: 0 0 20px rgba(59,74,90,0.5);
    background: #000; display: flex; justify-content: center; align-items: center;
    overflow: hidden; position: relative;
  }
  .movie-image svg { width: 100%; height: 100%; display: block; }

  .question { font-size: 20px; margin-bottom: 20px; color: #fff; line-height: 1.6; }
  .option {
    display: block; background: #1a1a1a; border: 1px solid #333;
    padding: 13px 18px; margin: 9px 0; border-radius: 10px; cursor: pointer;
    transition: 0.25s; font-size: 16px;
  }
  .option:hover:not(.disabled) { background: #2d3a4a; border-color: #7ba8d4; transform: translateX(-5px); }
  .option.correct { background: #1a5c2a; border-color: #4caf50; }
  .option.wrong { background: #5c2a2a; border-color: #f44336; }
  
  #next {
    display: none; margin-top: 20px; padding: 12px; background: #3b4a5a;
    color: #fff; border: none; border-radius: 8px; cursor: pointer;
    font-family: 'Cairo', sans-serif; font-size: 16px; font-weight: 700; width: 100%;
  }
  #next:hover { background: #7ba8d4; color: #000; box-shadow: 0 0 15px #3b4a5a; }
  #score { margin-top: 15px; font-size: 15px; color: #7ba8d4; text-align: center; font-weight: 700; }
</style>
</head>
<body>

<div class="quiz-box" id="quizBox">
  <div id="startScreen">
    <h1>🚄 كويز قطار بوسان 🚄</h1>
    <div class="start-content">
      <h2>الرحلة الأخيرة</h2>
      <p>20 سؤال عن أحداث فيلم Train to Busan 1 & 2<br><strong>لديك 20 ثانية لكل سؤال</strong><br>هل تقدر توصل لبوسان؟</p>
      <button class="start-btn" onclick="startQuiz()">🚄 ابدأ الرحلة</button>
    </div>
  </div>

  <div id="quizScreen" style="display:none;">
    <h1>🚄 كويز قطار بوسان 🚄</h1>
    <div class="progress"><div class="progress-bar" id="progress"></div></div>
    <div class="timer" id="timer">⏱️ 20</div>
    
    <div id="movieImage" class="movie-image"></div>
    
    <div id="question" class="question"></div>
    <div id="options"></div>
    <div id="score"></div>
    <button id="next">السؤال التالي ←</button>
  </div>
</div>

<script>
function generatePoster(title, subtitle) {
  return `
  <svg viewBox="0 0 500 250" xmlns="http://www.w3.org/2000/svg">
    <rect width="500" height="250" fill="#0a0f14"/>
    <circle cx="250" cy="125" r="80" fill="#3b4a5a" opacity="0.3"/>
    <text x="50%" y="40%" dominant-baseline="middle" text-anchor="middle" fill="#7ba8d4" font-family="Cairo, sans-serif" font-weight="900" font-size="40" filter="drop-shadow(0 0 10px #3b4a5a)">${title}</text>
    <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-family="Cairo, sans-serif" font-weight="bold" font-size="20" opacity="0.7">${subtitle}</text>
    <path d="M 0 250 L 250 180 L 500 250" fill="none" stroke="#3b4a5a" stroke-width="4"/>
  </svg>
  `;
}

const questions = [
  // Train to Busan 1
  { q: "في الجزء الأول، إيه اللي بيخلي البطل يسافر بالقطار مع بنته؟", options: ["عشان يهربوا من الزومبي", "عشان بنته عايزة تشوف أمها", "عشان شغل", "عشان عيد ميلادها"], answer: 1, title: "TRAIN TO BUSAN", subtitle: "PART 1" },
  { q: "أول زومبي بيظهر في القطار بيكون مين؟", options: ["امرأة عجوز", "شاب", "طفل", "رجل أعمال"], answer: 0, title: "TRAIN TO BUSAN", subtitle: "PART 1" },
  { q: "الزومبي في الفيلم بيتحولوا بسرعة إيه؟", options: ["في ثواني", "في دقايق", "في ساعات", "في يومين"], answer: 0, title: "TRAIN TO BUSAN", subtitle: "PART 1" },
  { q: "إيه الحاجة اللي بتخلي الزومبي ما يشوفوش؟", options: ["الضوء", "الظلمة", "الأبواب المقفولة", "الصوت العالي"], answer: 1, title: "TRAIN TO BUSAN", subtitle: "PART 1" },
  { q: "إيه اللي بيخلي الزومبي يهاجموا أي حد؟", options: ["الصوت والحركة", "الضوء", "الروائح", "المية"], answer: 0, title: "TRAIN TO BUSAN", subtitle: "PART 1" },
  { q: "الراجل القوي اللي بيحمي البطلة بيشتغل إيه؟", options: ["شرطي", "جندي", "دكتور", "عامل"], answer: 0, title: "TRAIN TO BUSAN", subtitle: "PART 1" },
  { q: "الشخص الشرير في القطار اللي بيهتم بنفسه بس بيعمل إيه؟", options: ["بيضحي بالناس", "بيساعد الناس", "بيهرب معاهم", "بيموت"], answer: 0, title: "TRAIN TO BUSAN", subtitle: "PART 1" },
  { q: "لما القطار بيقف في محطة، إيه اللي بيكتشفوه؟", options: ["المدينة كلها زومبي", "في أمل", "المحطة آمنة", "في دكتور"], answer: 0, title: "TRAIN TO BUSAN", subtitle: "PART 1" },
  { q: "إيه اللي بيحصل للراجل القوي في القطار؟", options: ["بيتحول لزومبي عشان يحمي مراته", "بيموت", "بيهرب", "بيتقفل عليه"], answer: 0, title: "TRAIN TO BUSAN", subtitle: "PART 1" },
  { q: "في نهاية الجزء الأول، إيه اللي بيحصل للبطل؟", options: ["بيتحول لزومبي عشان يحمي بنته", "بيموت", "بيهرب", "بيتقفل عليه"], answer: 0, title: "TRAIN TO BUSAN", subtitle: "PART 1" },
  
  // Peninsula (Train to Busan 2)
  { q: "في الجزء الثاني (Peninsula)، الأحداث بتحصل بعد كام سنة من الجزء الأول؟", options: ["سنة", "4 سنين", "10 سنين", "20 سنة"], answer: 1, title: "PENINSULA", subtitle: "PART 2" },
  { q: "البطل الجديد في الجزء الثاني كان بيعمل إيه قبل الزومبي؟", options: ["جندي", "دكتور", "عامل", "مهندس"], answer: 0, title: "PENINSULA", subtitle: "PART 2" },
  { q: "إيه اللي بيرجع البطل الجديد لكوريا؟", options: ["مهمة سرية", "عشان عيلته", "عشان فلوس", "عشان ينتقم"], answer: 2, title: "PENINSULA", subtitle: "PART 2" },
  { q: "في الجزء الثاني، إيه اللي بيحصل للمدينة؟", options: ["اتحولت لمعسكر زومبي", "اتحررت", "اتدمرت", "بقت آمنة"], answer: 0, title: "PENINSULA", subtitle: "PART 2" },
  { q: "البطل بيقابل عيلة في المدينة، إيه اللي بيميزهم؟", options: ["بيسوقوا عربيات", "بيلعبوا كرة", "بيحبوا بعض", "بينقذوا الناس"], answer: 0, title: "PENINSULA", subtitle: "PART 2" },
  { q: "الزومبي في الجزء الثاني بيميزهم إيه؟", options: ["بيتحركوا أسرع", "بيطيروا", "بيتكلموا", "بيشموا الريحة"], answer: 0, title: "PENINSULA", subtitle: "PART 2" },
  { q: "الجزء الثاني فيه مشهد شهير جداً، إيه هو؟", options: ["سباق عربيات ضد الزومبي", "قتال بالسيف", "تحطيم القطار", "غرق المدينة"], answer: 0, title: "PENINSULA", subtitle: "PART 2" },
  { q: "إيه اللي بيحاول البطل الجديد ياخده من المدينة؟", options: ["شاحنة فلوس", "دوا", "سلاح", "أكل"], answer: 0, title: "PENINSULA", subtitle: "PART 2" },
  { q: "الشخصية الشريرة في الجزء الثاني بتعمل إيه؟", options: ["بتاجر بالزومبي", "بتحمي الناس", "بتهرب", "بتنقذ الأطفال"], answer: 0, title: "PENINSULA", subtitle: "PART 2" },
  { q: "في نهاية الجزء الثاني، إيه اللي بيحصل للبطل؟", options: ["بينقذ العيلة", "بيموت", "بيهرب", "بيتحول"], answer: 0, title: "PENINSULA", subtitle: "PART 2" }
];

const TOTAL_TIME = 20;
let current = 0, score = 0, answered = false, timerInterval = null, timeLeft = TOTAL_TIME;
let shuffled = [];

function shuffleArray(array) {
  let currentIndex = array.length, randomIndex;
  while (currentIndex != 0) {
    randomIndex = Math.floor(Math.random() * currentIndex);
    currentIndex--;
    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
  }
  return array;
}

// صوت تكة خفيفة
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playClick() {
  if(audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  osc.type = 'sine'; 
  osc.frequency.setValueAtTime(400, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime); 
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
  osc.connect(gain); gain.connect(audioCtx.destination); 
  osc.start(); osc.stop(audioCtx.currentTime + 0.1);
}

function startQuiz() {
  if(audioCtx.state === 'suspended') audioCtx.resume();
  shuffled = [...questions].sort(() => Math.random() - 0.5);
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('quizScreen').style.display = 'block';
  current = 0; score = 0;
  document.getElementById('next').onclick = nextQuestion;
  loadQuestion();
}

function loadQuestion() {
  answered = false; timeLeft = TOTAL_TIME;
  const q = shuffled[current];
  
  document.getElementById('movieImage').innerHTML = generatePoster(q.title, q.subtitle);
  document.getElementById('question').innerText = q.q;
  
  const optEl = document.getElementById('options');
  optEl.innerHTML = '';
  
  let optionsWithAnswers = q.options.map((opt, index) => ({ text: opt, isCorrect: index === q.answer }));
  optionsWithAnswers = shuffleArray(optionsWithAnswers); 
  
  optionsWithAnswers.forEach((opt) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerText = opt.text;
    div.onclick = () => checkAnswer(opt.isCorrect, div);
    optEl.appendChild(div);
  });
  
  document.getElementById('score').innerText = `السؤال ${current + 1} من ${shuffled.length} | النقاط: ${score}`;
  document.getElementById('next').style.display = 'none';
  document.getElementById('progress').style.width = ((current) / shuffled.length * 100) + '%';
  
  clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 1000);
  updateTimer();
}

function updateTimer() {
  const timerEl = document.getElementById('timer');
  timerEl.innerText = `⏱️ ${timeLeft}`;
  if (timeLeft <= 5) timerEl.style.color = '#f44336'; else timerEl.style.color = '#7ba8d4';
  
  if (timeLeft <= 0) {
    clearInterval(timerInterval);
    if (!answered) {
      answered = true;
      document.querySelectorAll('.option').forEach(o => o.classList.add('disabled'));
      document.querySelectorAll('.option').forEach(o => {
        if(o.innerText === shuffled[current].options[shuffled[current].answer]) o.classList.add('correct');
      });
      document.getElementById('next').style.display = 'inline-block';
    }
  }
  timeLeft--;
}

function checkAnswer(isCorrect, el) {
  if (answered) return;
  answered = true; clearInterval(timerInterval);
  
  const allOpts = document.querySelectorAll('.option');
  allOpts.forEach(o => o.classList.add('disabled'));
  
  allOpts.forEach(o => {
    if(o.innerText === shuffled[current].options[shuffled[current].answer]) o.classList.add('correct');
  });
  
  if (isCorrect) {
    score++;
    playClick();
  } else {
    el.classList.add('wrong');
    playClick();
  }
  
  document.getElementById('score').innerText = `السؤال ${current + 1} من ${shuffled.length} | النقاط: ${score}`;
  document.getElementById('next').style.display = 'inline-block';
}

function nextQuestion() {
  current++;
  if (current < shuffled.length) { loadQuestion(); } else { showFinal(); }
}

function showFinal() {
  clearInterval(timerInterval);
  document.getElementById('progress').style.width = '100%';
  document.getElementById('question').innerHTML = `<div style="text-align:center; padding:20px;">
    <h2 style="color:#7ba8d4; font-size:36px;">انتهت الرحلة! 🚄</h2>
    <p style="color:#fff; font-size:22px;">نتيجتك: ${score} / ${shuffled.length}</p>
    <button onclick="location.reload()" style="margin-top:20px; padding:10px 30px; background:#3b4a5a; color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:18px;">🔄 العب تاني</button>
  </div>`;
  document.getElementById('options').innerHTML = '';
  document.getElementById('movieImage').style.display = 'none';
  document.getElementById('timer').style.display = 'none';
  document.getElementById('score').innerText = '';
  document.getElementById('next').style.display = 'none';
}
</script>
</body>
</html>
