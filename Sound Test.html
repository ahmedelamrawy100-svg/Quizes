<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 تجربة الأصوات - Quiz Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  body { background: #111; color: #fff; font-family: 'Cairo', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
  h1 { color: #ffd700; margin-bottom: 30px; }
  .section { width: 100%; max-width: 600px; background: #1e1e1e; border: 1px solid #333; border-radius: 10px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
  .section h2 { margin: 0; font-size: 20px; color: #aaa; }
  .btns { display: flex; gap: 10px; }
  button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; font-size: 16px; transition: 0.2s; color: #fff; }
  button:hover { transform: scale(1.05); }
  
  /* ألوان الأقسام */
  .horror button { background: #8b0000; }
  .horror button:hover { background: #ff0000; }
  .mystery button { background: #5c2a75; }
  .mystery button:hover { background: #b17edb; }
  .action button { background: #ff0066; }
  .action button:hover { background: #ff3388; }
  .drama button { background: #c06a9c; }
  .drama button:hover { background: #f7a8d8; }
</style>
</head>
<body>

<h1>🎵 تجربة الأصوات (Quiz Hub)</h1>

<div class="section horror">
  <h2>👻 الرعب (Reverb & Scary)</h2>
  <div class="btns">
    <button onclick="playSound('correct', 'horror')">إجابة صح ✅</button>
    <button onclick="playSound('wrong', 'horror')">إجابة غلط ❌</button>
  </div>
</div>

<div class="section mystery">
  <h2>🕵️ الغموض (Sharp & Mysterious)</h2>
  <div class="btns">
    <button onclick="playSound('correct', 'mystery')">إجابة صح ✅</button>
    <button onclick="playSound('wrong', 'mystery')">إجابة غلط ❌</button>
  </div>
</div>

<div class="section action">
  <h2>💥 الأكشن (Electronic & Fast)</h2>
  <div class="btns">
    <button onclick="playSound('correct', 'action')">إجابة صح ✅</button>
    <button onclick="playSound('wrong', 'action')">إجابة غلط ❌</button>
  </div>
</div>

<div class="section drama">
  <h2>💖 الدراما (Soft & Melodic)</h2>
  <div class="btns">
    <button onclick="playSound('correct', 'drama')">إجابة صح ✅</button>
    <button onclick="playSound('wrong', 'drama')">إجابة غلط ❌</button>
  </div>
</div>

<script>
// إنشاء سياق الصوت
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type, category) {
    // التأكد من تشغيل الصوت (المتصفحات بتمنع الصوت التلقائي)
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }

    const t = audioCtx.currentTime;
    
    // دالة مساعدة لإنشاء نغمة
    function createTone(freqStart, freqEnd, typeWave, duration, startTime, volume = 0.1) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = typeWave;
        osc.frequency.setValueAtTime(freqStart, startTime);
        if (freqEnd !== freqStart) {
            osc.frequency.exponentialRampToValueAtTime(freqEnd, startTime + duration);
        }
        
        gain.gain.setValueAtTime(volume, startTime);
        gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start(startTime);
        osc.stop(startTime + duration);
    }

    // --- تخصيص الأصوات حسب القسم ---

    if (category === 'horror') {
        if (type === 'correct') {
            // صوت غامق ومشوش شوية (زي نغمة بيانو قديمة)
            createTone(150, 100, 'sawtooth', 0.4, t, 0.15);
            createTone(155, 105, 'sine', 0.4, t, 0.1);
        } else {
            // صوت واطي جداً ومرعب
            createTone(80, 40, 'square', 0.6, t, 0.2);
            createTone(85, 45, 'sawtooth', 0.6, t, 0.1);
        }
    } 
    
    else if (category === 'mystery') {
        if (type === 'correct') {
            // صوت تكة ساعة/نغمة غامضة حادة
            createTone(800, 1200, 'sine', 0.1, t, 0.15);
            createTone(1200, 800, 'sine', 0.1, t + 0.1, 0.15);
        } else {
            // صوت غامض مشوه
            createTone(300, 200, 'triangle', 0.3, t, 0.15);
            createTone(350, 250, 'sawtooth', 0.3, t + 0.1, 0.1);
        }
    } 
    
    else if (category === 'action') {
        if (type === 'correct') {
            // صوت ليزر إلكتروني سريع
            createTone(600, 1500, 'square', 0.15, t, 0.1);
            createTone(1500, 600, 'square', 0.15, t + 0.15, 0.1);
        } else {
            // صوت خطأ إلكتروني
            createTone(200, 50, 'sawtooth', 0.3, t, 0.15);
        }
    } 
    
    else if (category === 'drama') {
        if (type === 'correct') {
            // نغمة بيانو هادية (سي مايجور)
            createTone(523.25, 523.25, 'sine', 0.2, t, 0.1); // C5
            createTone(659.25, 659.25, 'sine', 0.2, t + 0.1, 0.1); // E5
            createTone(783.99, 783.99, 'sine', 0.4, t + 0.2, 0.1); // G5
        } else {
            // نغمة حزينة هادية (سي مينور)
            createTone(493.88, 493.88, 'sine', 0.3, t, 0.1); // B4
            createTone(440.00, 440.00, 'sine', 0.5, t + 0.15, 0.1); // A4
        }
    }
}
</script>
</body>
</html>
