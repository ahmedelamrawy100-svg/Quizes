<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 بوت الاختبار الذكي (Database Tester)</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #050505; --panel: #111; --text: #fff; --accent: #00ffcc; --danger: #ff3333; --success: #00cc66; --warning: #ffcc00; --border: #333; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Cairo', sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  .container { width: 100%; max-width: 900px; background: var(--panel); border: 2px solid var(--accent); border-radius: 15px; padding: 25px; box-shadow: 0 0 30px rgba(0, 255, 204, 0.1); }
  .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
  .header h1 { color: var(--accent); font-size: 24px; }
  .btn { padding: 12px 25px; border: none; border-radius: 8px; font-family: 'Cairo'; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
  .btn-start { background: var(--accent); color: #000; }
  .btn-start:hover { background: #fff; }
  .btn-start:disabled { background: #555; color: #aaa; cursor: not-allowed; }
  .stats-bar { display: flex; gap: 20px; margin-bottom: 20px; font-size: 16px; font-weight: bold; background: #000; padding: 15px; border-radius: 10px; border: 1px solid var(--border); flex-wrap: wrap; }
  .stat-item { display: flex; align-items: center; gap: 8px; }
  .stat-item span { color: var(--accent); font-size: 18px; }
  .console { background: #000; border: 1px solid var(--border); border-radius: 10px; padding: 15px; font-family: monospace; font-size: 14px; height: 400px; overflow-y: auto; direction: ltr; text-align: left; }
  .log-line { margin-bottom: 5px; border-bottom: 1px dashed #222; padding-bottom: 5px; }
  .log-info { color: var(--accent); }
  .log-success { color: var(--success); }
  .log-error { color: var(--danger); font-weight: bold; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🤖 بوت الاختبار الذكي (Database Tester)</h1>
    <button id="startBtn" class="btn btn-start" onclick="startSimulation()">▶️ ابدأ الاختبار الشامل</button>
  </div>
  
  <div class="stats-bar">
    <div class="stat-item">نجاح: <span id="stat-success" style="color: var(--success)">0</span></div>
    <div class="stat-item">أخطاء: <span id="stat-errors" style="color: var(--danger)">0</span></div>
    <div class="stat-item">معدل النجاح: <span id="stat-percent" style="color: var(--warning)">0%</span></div>
  </div>

  <div class="console" id="console1"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, get, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = { apiKey: "AIzaSyBmyW4tZGJfcHJ4jKSD3_6hebZK58Y3jXo", authDomain: "quiz-hub-app-f4cd0.firebaseapp.com", databaseURL: "https://quiz-hub-app-f4cd0-default-rtdb.firebaseio.com", projectId: "quiz-hub-app-f4cd0", storageBucket: "quiz-hub-app-f4cd0.firebasestorage.app", messagingSenderId: "282772179392", appId: "1:282772179392:web:64646d757592b29ff3a025" };
  const app = initializeApp(firebaseConfig); 
  const db = getDatabase(app);

  let validTests = 0, passedTests = 0, totalErrors = 0;
  const console1 = document.getElementById('console1');

  function log(msg, type = 'info') {
      const div = document.createElement('div');
      div.className = `log-line log-${type}`;
      div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
      console1.appendChild(div);
      console1.scrollTop = console1.scrollHeight;
      
      if (type === 'success') { passedTests++; validTests++; }
      if (type === 'error') { totalErrors++; validTests++; }
      
      document.getElementById('stat-success').innerText = passedTests;
      document.getElementById('stat-errors').innerText = totalErrors;
      
      let percent = validTests === 0 ? 0 : Math.round((passedTests / validTests) * 100);
      document.getElementById('stat-percent').innerText = percent + '%';
      
      if (percent === 100 && passedTests >= 3) {
          document.getElementById('stat-percent').style.color = 'var(--success)';
      }
  }

  async function startSimulation() {
      const btn = document.getElementById('startBtn');
      btn.disabled = true;
      btn.innerText = '⏳ جاري المحاكاة...';
      console1.innerHTML = '';
      validTests = 0; passedTests = 0; totalErrors = 0;
      document.getElementById('stat-percent').style.color = 'var(--warning)';
      
      log('🚀 بدء اختبار قاعدة البيانات...', 'info');
      
      try {
          log('▶️ [اختبار 1] الاتصال بـ Firebase...', 'info');
          await set(ref(db, 'test_connection/ping'), Date.now());
          log('✅ [نجاح] الاتصال بـ Firebase يعمل بنجاح.', 'success');

          log('▶️ [اختبار 2] محاكاة إنشاء غرفة (اللاعب 1)...', 'info');
          const testRoomCode = 'TEST_' + Math.floor(Math.random() * 10000);
          await set(ref(db, 'rooms/' + testRoomCode), { player1_score: null, player2_score: null, status: 'waiting', quizType: 'test', created_at: Date.now() });
          
          const roomSnap = await get(ref(db, 'rooms/' + testRoomCode));
          if (roomSnap.exists() && roomSnap.val().status === 'waiting') {
              log(`✅ [نجاح] الغرفة ${testRoomCode} تم إنشاؤها (waiting).`, 'success');
          } else {
              log('❌ [فشل] فشل إنشاء الغرفة.', 'error');
          }

          log('▶️ [اختبار 3] محاكاة انضمام لاعب (اللاعب 2)...', 'info');
          await set(ref(db, 'rooms/' + testRoomCode + '/status'), 'playing');
          const updatedSnap = await get(ref(db, 'rooms/' + testRoomCode));
          if (updatedSnap.val().status === 'playing') {
              log('✅ [نجاح] حالة الغرفة اتغيرت لـ (playing).', 'success');
          } else {
              log('❌ [فشل] فشل تحديث حالة الغرفة.', 'error');
          }

          log('▶️ [اختبار 4] محاكاة إرسال نتائج اللاعبين...', 'info');
          await set(ref(db, 'rooms/' + testRoomCode), { player1_score: 5, player2_score: 3, status: 'finished', quizType: 'test', created_at: Date.now() });
          const finalSnap = await get(ref(db, 'rooms/' + testRoomCode));
          if (finalSnap.val().player1_score === 5 && finalSnap.val().player2_score === 3) {
              log('✅ [نجاح] النتائج اتحفظت صح في الغرفة.', 'success');
          } else {
              log('❌ [فشل] فشل حفظ النتائج.', 'error');
          }

          log('▶️ [اختبار 5] تنظيف الغرفة التجريبية...', 'info');
          await remove(ref(db, 'rooms/' + testRoomCode));
          await remove(ref(db, 'test_connection'));
          const deletedSnap = await get(ref(db, 'rooms/' + testRoomCode));
          if (!deletedSnap.exists()) {
              log('✅ [نجاح] الغرفة اتمسحت بنجاح.', 'success');
          } else {
              log('❌ [فشل] الغرفة لسه موجودة.', 'error');
          }

      } catch (e) {
          log('💥 [خطأ فادح] ' + e.message, 'error');
      }

      btn.disabled = false;
      btn.innerText = '▶️ ابدأ الاختبار الشامل';
      log('🎉 الاختبار انتهى!', 'info');
  }
</script>
</body>
</html>
