<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اختبار الصوت</title>
</head>
<body style="background: #111; color: #fff; text-align: center; padding-top: 50px;">
    <h1>اختبار الصوت</h1>
    <button onclick="testAudio()" style="padding: 20px; font-size: 20px; cursor: pointer;">دوس هنا</button>

    <!-- PWA Meta Tags -->
<meta name="theme-color" content="#ff0000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plot Twist">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Plot Twist">
<meta name="msapplication-TileColor" content="#ff0000">
<meta name="msapplication-tap-highlight" content="no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="pic/Logo.png">
<link rel="apple-touch-icon" sizes="192x192" href="pic/Logo.png">
<link rel="apple-touch-icon" sizes="512x512" href="pic/Logo.png">
<link rel="stylesheet" href="pwa-native.css">

    <script>
        function testAudio() {
            // محاولة تشغيل ملف صوتي
            let audio = new Audio('https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg');
            
            audio.play().then(() => {
                alert("✅ ملف الصوت شغال!");
            }).catch((error) => {
                alert("❌ ملف الصوت مش شغال: " + error.name);
                
                // لو الملف مش شغال، هنستخدم النطق كبديل
                let msg = new SpeechSynthesisUtterance("الصوت شغال!");
                msg.lang = 'ar-SA';
                window.speechSynthesis.speak(msg);
            });
        }
    </script>
    <script type="module" src="notifications.js"></script>
    <script type="module" src="theme-engine.js"></script>
    <script src="pwa-manager.js" defer></script>
</body>
</html>
