<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0f14; color: #eee; font-family: 'Cairo', sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 40px 20px; flex-direction: column; }

  p.subtitle { text-align: center; color: #aaa; margin-bottom: 40px; font-size: 18px; }

  /* ستايل الكروت */
  .grid-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px; width: 100%; max-width: 1000px;

  body.light-mode { background: #f4f4f4; color: #111; }

  body.light-mode .question { color: #111; }

  body.light-mode .quiz-card h2 { color: #111; text-shadow: none; }

  body.light-mode .option.wrong { background: #5c2a2a !important; color: #fff !important; border-color: #f44336 !important; }

  .quiz-card {

    text-decoration: none; color: #fff; text-align: center; transition: 0.3s;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    height: 320px; position: relative; overflow: hidden; background-size: cover; background-position: center;
    cursor: pointer;

  .quiz-card::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, transparent 40%); z-index: 1;
  }
  .quiz-card h2 {
    position: relative; z-index: 2; font-size: 22px; margin-bottom: 15px;
    text-shadow: 0 0 10px #000; width: 100%; padding: 10px;
  }
  .quiz-card:hover { border-color: #8ba3b8; transform: translateY(-5px); box-shadow: 0 0 20px rgba(139,163,184,0.6); }

  .play-screen { display: none; width: 100%; max-width: 750px; background: rgba(15,15,15,0.98); border: 2px solid #4a5a6a; border-radius: 15px; padding: 25px; box-shadow: 0 0 30px rgba(74,90,106,0.6); }

const translations = {
  ar: { title: "👻 كويز الكونجورينج 👻", subtitle: "اختر الجزء اللي عايز تلعب فيه", nextBtn: "السؤال التالي ←", scoreText: "السؤال {c} من {t} | النقاط: {s}", endTitle: "انتهى التحقيق! 👻", endScore: "نتيجتك: {s} / {t}", playAgain: "🔄 العب تاني", highScore: "🏆 أعلى نتيجة:" },
  en: { title: "👻 The Conjuring Quiz 👻", subtitle: "Choose the part you want to play", nextBtn: "Next Question →", scoreText: "Question {c} of {t} | Score: {s}", endTitle: "Investigation Over! 👻", endScore: "Your Score: {s} / {t}", playAgain: "🔄 Play Again", highScore: "🏆 High Score:" }
};

let currentQuestions = [];
let current = 0, score = 0, answered = false, timerInterval = null, timeLeft = 20;

function applyLanguage() {
  const t = translations[currentLang];
  document.body.dir = currentLang === 'en' ? 'ltr' : 'rtl';
  document.getElementById('main-title').innerText = t.title;
  document.getElementById('subtitle').innerText = t.subtitle;
  document.getElementById('quiz-title').innerText = t.title;
  document.getElementById('next').innerText = t.nextBtn;
}

function startGame(part) {
  if (part === 'part1') { currentQuestions = [...quizData.part1]; currentSaveKey = 'conjuring_part1_HighScore'; }
  else if (part === 'part2') { currentQuestions = [...quizData.part2]; currentSaveKey = 'conjuring_part2_HighScore'; }
  else if (part === 'part3') { currentQuestions = [...quizData.part3]; currentSaveKey = 'conjuring_part3_HighScore'; }
  else { currentQuestions = [...quizData.comprehensive]; currentSaveKey = 'conjuring_all_HighScore'; }

  highestScore = parseInt(localStorage.getItem(currentSaveKey)) || 0;
  currentQuestions.sort(() => Math.random() - 0.5);

  document.getElementById('selectionScreen').style.display = 'none';
  document.getElementById('playScreen').style.display = 'block';
  document.getElementById('backBtn').style.display = 'none';

  current = 0; score = 0;
  loadQuestion();
}

function loadQuestion() {
  answered = false; timeLeft = 20;
  const q = currentQuestions[current];
  document.getElementById('question').innerText = currentLang === 'ar' ? q.q_ar : q.q_en;
  const optEl = document.getElementById('options');
  optEl.innerHTML = '';
  const currentOptions = currentLang === 'ar' ? q.options_ar : q.options_en;
  let optionsWithAnswers = currentOptions.map((opt, index) => ({ text: opt, isCorrect: index === q.answer }));
  optionsWithAnswers.sort(() => Math.random() - 0.5); 
  optionsWithAnswers.forEach((opt) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerText = opt.text;
    div.onclick = () => checkAnswer(opt.isCorrect, div);
    optEl.appendChild(div);
  });
  document.getElementById('score').innerText = translations[currentLang].scoreText.replace('{c}', current + 1).replace('{t}', currentQuestions.length).replace('{s}', score);
  document.getElementById('next').style.display = 'none';
  document.getElementById('progress').style.width = ((current) / currentQuestions.length * 100) + '%';
  clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 1000);
  updateTimer();
}

function updateTimer() {
  const timerEl = document.getElementById('timer');
  timerEl.innerText = `⏱️ ${timeLeft}`;
  if (timeLeft <= 5) timerEl.style.color = '#f44336';
  if (timeLeft <= 0) {
    clearInterval(timerInterval);
    if (!answered) {
      answered = true;
      document.querySelectorAll('.option').forEach(o => o.classList.add('disabled'));
      const q = currentQuestions[current];
      const currentOptions = currentLang === 'ar' ? q.options_ar : q.options_en;
      document.querySelectorAll('.option').forEach(o => { if(o.innerText === currentOptions[q.answer]) o.classList.add('correct'); });
      document.getElementById('next').style.display = 'inline-block';
    }
  }
  timeLeft--;
}

function checkAnswer(isCorrect, el) {
  if (answered) return;
  answered = true; clearInterval(timerInterval);
  const q = currentQuestions[current];
  const currentOptions = currentLang === 'ar' ? q.options_ar : q.options_en;
  const allOpts = document.querySelectorAll('.option');
  allOpts.forEach(o => o.classList.add('disabled'));
  allOpts.forEach(o => { if(o.innerText === currentOptions[q.answer]) o.classList.add('correct'); });
  if (isCorrect) { score++; } else { el.classList.add('wrong'); }
  document.getElementById('score').innerText = translations[currentLang].scoreText.replace('{c}', current + 1).replace('{t}', currentQuestions.length).replace('{s}', score);
  document.getElementById('next').style.display = 'inline-block';
}

function nextQuestion() {
  current++;
  if (current < currentQuestions.length) { loadQuestion(); } else { showFinal(); }
}

function showFinal() {
  clearInterval(timerInterval);
  document.getElementById('progress').style.width = '100%';
  if (score > highestScore) { highestScore = score; localStorage.setItem(currentSaveKey, highestScore); }
  const t = translations[currentLang];
  document.getElementById('question').innerHTML = `<div style="text-align:center; padding:20px;">
    <h2 style="color:#8ba3b8; font-size:36px;">${t.endTitle}</h2>
    <p style="color:#fff; font-size:22px;">${t.endScore.replace('{s}', score).replace('{t}', currentQuestions.length)}</p>
    <p style="color:#ffcc00; font-size:18px; margin-top:10px; font-weight:bold;">${t.highScore} ${highestScore}</p>
    <button onclick="location.reload()" style="margin-top:20px; padding:10px 30px; background:#4a5a6a; color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:18px;">${t.playAgain}</button>
  </div>`;
  document.getElementById('options').innerHTML = '';
  document.getElementById('timer').style.display = 'none';
  document.getElementById('score').innerText = '';
  document.getElementById('next').style.display = 'none';
}

window.onload = applyLanguage;
</script>
