<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👥 المستخدمين - Plot Twist</title>
<link rel="icon" type="image/png" href="pic/Logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<!-- PWA Meta Tags -->
<meta name="theme-color" content="#ff0000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plot Twist">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Plot Twist">
<meta name="msapplication-TileColor" content="#ff0000">
<meta name="msapplication-tap-highlight" content="no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="pic/Logo.png">
<link rel="apple-touch-icon" sizes="192x192" href="pic/Logo.png">
<link rel="apple-touch-icon" sizes="512x512" href="pic/Logo.png">
<link rel="stylesheet" href="pwa-native.css">
<style>
  :root { --bg-color: #000; --text-color: #fff; --subtitle-color: #aaa; --card-bg: #111; --card-border: #333; --accent: #ff0000; }
  body.light-mode { --bg-color: #f4f4f4; --text-color: #111; --subtitle-color: #555; --card-bg: #fff; --card-border: #ccc; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Cairo', sans-serif; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
  
  .top-bar { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .back-btn { background: #222; color: #fff; border: 2px solid #555; padding: 8px 15px; border-radius: 8px; text-decoration: none; font-weight: bold; }
  .lang-btn { background: #333; color: #fff; border: 2px solid #555; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: 'Cairo'; }
  
  .users-container { width: 100%; max-width: 800px; }
  .header-title { text-align: center; color: var(--accent); font-size: 36px; margin-bottom: 20px; }
  
  .search-box { width: 100%; margin-bottom: 20px; position: relative; }
  .search-box input { width: 100%; padding: 15px 45px 15px 15px; border-radius: 10px; border: 2px solid var(--card-border); background: var(--card-bg); color: var(--text-color); font-family: 'Cairo'; font-size: 16px; outline: none; transition: 0.3s; }
  .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(255,0,0,0.2); }
  .search-box::before { content: '🔍'; position: absolute; right: 15px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--subtitle-color); }
  
  .users-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
  .user-card { background: var(--card-bg); border: 2px solid var(--card-border); border-radius: 15px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 15px; transition: 0.3s; position: relative; overflow: hidden; text-align: center; }
  .user-card:hover { border-color: var(--accent); transform: translateY(-5px); box-shadow: 0 10px 20px rgba(255,0,0,0.2); }
  
  .owner-card { border-color: #ffd700; box-shadow: 0 0 20px rgba(255,215,0,0.15); }
  .owner-card .user-avatar { background: #ffd700; color: #000; }
  
  .user-info { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
  .user-avatar { width: 70px; height: 70px; background: var(--accent); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 32px; color: #fff; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.3); overflow: hidden; }
  .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
  
  .user-name { font-weight: bold; font-size: 20px; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; word-break: break-all; }
  .owner-badge { color: #000; font-size: 12px; background: #ffd700; padding: 2px 8px; border-radius: 10px; font-weight: bold; }
  
  /* ✅ علامة التوثيق */
  .verified-badge { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; background: #1DA1F2; color: #fff; border-radius: 50%; font-size: 10px; font-weight: bold; margin-right: 4px; vertical-align: middle; }

  .action-buttons { display: flex; gap: 8px; width: 100%; margin-top: auto; flex-wrap: wrap; }
  .action-btn { flex: 1; padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-family: 'Cairo'; text-decoration: none; color: #fff; font-size: 14px; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 5px; min-width: 100px; }
  .action-btn:hover { transform: scale(1.05); }
  .btn-visit { background: #9c27b0; }
  .btn-add { background: var(--accent); }
  .btn-msg { background: #0088cc; }
  .btn-pending { background: #555; cursor: not-allowed; }
  
  .no-data { text-align: center; color: var(--subtitle-color); padding: 30px; background: var(--card-bg); border-radius: 15px; width: 100%; grid-column: 1 / -1; }
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html" class="back-btn" id="backBtn">⬅ رجوع</a>
  <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">EN</button>
</div>

<div class="users-container">
  <h1 class="header-title" id="pageTitle">👥 كل اللاعبين</h1>
  
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="ابحث عن لاعب بالاسم..." onkeyup="window.filterUsers()">
  </div>
  <div class="users-list" id="usersList">
    <div class="no-data" id="loadingMsg">جاري تحميل اللاعبين...</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = { apiKey: "AIzaSyBmyW4tZGJfcHJ4jKSD3_6hebZK58Y3jXo", authDomain: "quiz-hub-app-f4cd0.firebaseapp.com", databaseURL: "https://quiz-hub-app-f4cd0-default-rtdb.firebaseio.com", projectId: "quiz-hub-app-f4cd0", storageBucket: "quiz-hub-app-f4cd0.firebasestorage.app", messagingSenderId: "282772179392", appId: "1:282772179392:web:64646d757592b29ff3a025" };
  const app = initializeApp(firebaseConfig); const db = getDatabase(app);
  window.db = db; window.ref = ref; window.onValue = onValue; window.get = get; window.set = set;

  const currentUser = localStorage.getItem('loggedInUser');
  if (!currentUser) { window.location.href = 'index.html'; }

  let currentLang = localStorage.getItem('lang') || 'ar';
  const translations = {
    ar: { back: "⬅ رجوع", title: "👥 كل اللاعبين", placeholder: "ابحث عن لاعب بالاسم...", noUsers: "مفيش مستخدمين تانيين متاحين حالياً.", noResults: "مفيش لاعبين بالاسم ده.", add: "➕ إضافة صديق", msg: "💬 رسالة", visit: "👤 زيارة", pending: "⏳ في الانتظار", owner: "👑 الأونر" },
    en: { back: "⬅ Back", title: "👥 All Players", placeholder: "Search by username...", noUsers: "No other players available.", noResults: "No players with this name.", add: "➕ Add Friend", msg: "💬 Message", visit: "👤 Visit", pending: "⏳ Pending", owner: "👑 Owner" }
  };

  function applyLanguage() {
    const t = translations[currentLang];
    document.body.dir = currentLang === 'en' ? 'ltr' : 'rtl';
    document.getElementById('backBtn').innerText = t.back;
    document.getElementById('pageTitle').innerText = t.title;
    document.getElementById('searchInput').placeholder = t.placeholder;
    document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'EN' : 'AR';
    window.renderUsers();
  }

  window.toggleLanguage = function() {
    currentLang = currentLang === 'ar' ? 'en' : 'ar';
    localStorage.setItem('lang', currentLang);
    applyLanguage();
  }

  let allUsers = [], myFriends = {}, sentRequests = {}, allUsersData = {}, verifiedUsers = {}; // ✅ ضفنا verifiedUsers

  window.onValue(window.ref(window.db, 'verified_users'), (snapshot) => {
    verifiedUsers = snapshot.val() || {};
    window.renderUsers();
  });

  window.onValue(window.ref(window.db, 'friends'), (snapshot) => {
    const allFriends = snapshot.val();
    myFriends = {};
    if (allFriends) {
        for (let key in allFriends) {
            if (key.toLowerCase() === currentUser.toLowerCase()) {
                myFriends = allFriends[key];
                break;
            }
        }
    }
    window.renderUsers();
  });

  window.onValue(window.ref(window.db, 'friend_requests'), (snapshot) => {
    const data = snapshot.val();
    sentRequests = {};
    if (data) {
      for (let targetUser in data) {
        for (let sender in data[targetUser]) {
            if (sender.toLowerCase() === currentUser.toLowerCase()) {
                sentRequests[targetUser] = true;
            }
        }
      }
    }
    window.renderUsers();
  });

  window.onValue(window.ref(window.db, 'usernames'), (snapshot) => {
    const data = snapshot.val();
    allUsers = [];
    if (data) {
      for (let username in data) allUsers.push(username);
    }
    window.renderUsers();
  });

  window.onValue(window.ref(window.db, 'users_data'), (snapshot) => {
    allUsersData = snapshot.val() || {};
    window.renderUsers();
  });

  window.renderUsers = function() {
    const list = document.getElementById('usersList');
    list.innerHTML = '';
    const t = translations[currentLang];
    const searchTerm = (document.getElementById('searchInput').value || '').toLowerCase().trim();
    
    const hiddenAdminNames = ['owner', 'admin', 'banned']; 
    const uniqueUsersMap = new Map();
    
    allUsers.forEach(u => {
        const lower = u.toLowerCase();
        if (hiddenAdminNames.includes(lower)) return;
        if (lower === currentUser.toLowerCase()) return;
        if (!uniqueUsersMap.has(lower)) uniqueUsersMap.set(lower, u);
    });

    let displayUsers = Array.from(uniqueUsersMap.values());
    
    if (searchTerm) displayUsers = displayUsers.filter(u => u.toLowerCase().includes(searchTerm));

    if (displayUsers.length === 0) {
      if (searchTerm) list.innerHTML = `<div class="no-data">${t.noResults}</div>`;
      else list.innerHTML = `<div class="no-data">${t.noUsers}</div>`;
      return;
    }

    displayUsers.forEach(user => {
      let isFriend = false;
      for(let f in myFriends) { if(f.toLowerCase() === user.toLowerCase()) { isFriend = true; break; } }
      
      let isPending = false;
      for(let p in sentRequests) { if(p.toLowerCase() === user.toLowerCase()) { isPending = true; break; } }

      const isOwner = (user.toLowerCase() === 'ahmed'); 
      
      // ✅ التحقق من التوثيق
      let isVerified = false;
      for(let v in verifiedUsers) {
          if(v.toLowerCase() === user.toLowerCase()) { isVerified = true; break; }
      }
      const badge = isVerified ? '<span class="verified-badge">✓</span>' : '';

      const div = document.createElement('div');
      div.className = `user-card ${isOwner ? 'owner-card' : ''}`; 
      div.setAttribute('data-username', user.toLowerCase());

      let avatarContent = user.charAt(0).toUpperCase();
      
      for(let key in allUsersData) {
          if(key.toLowerCase() === user.toLowerCase() && allUsersData[key].profilePic) {
              avatarContent = `<img src="${allUsersData[key].profilePic}" alt="${user}">`;
              break;
          }
      }

      let actionButtons = `<a href="profile.html?user=${user}" class="action-btn btn-visit" title="${t.visit}">${t.visit}</a>`;
      
      if (isOwner) {
          actionButtons += `<a href="messages.html?to=${user}" class="action-btn btn-msg">${t.msg}</a>`;
      } else if (isFriend) {
        actionButtons += `<a href="messages.html?to=${user}" class="action-btn btn-msg">${t.msg}</a>`;
      } else if (isPending) {
        actionButtons += `<button class="action-btn btn-pending" disabled>${t.pending}</button>`;
      } else {
        actionButtons += `<button class="action-btn btn-add" onclick="window.addFriend('${user}', this)">${t.add}</button>`;
      }

      div.innerHTML = `
        <div class="user-info">
          <div class="user-avatar">${avatarContent}</div>
          <div class="user-name">${user} ${badge} ${isOwner ? `<span class="owner-badge">${t.owner}</span>` : ''}</div>
        </div>
        <div class="action-buttons">${actionButtons}</div>
      `;
      list.appendChild(div);
    });
  };

  window.addFriend = async function(targetUser, btnElement) {
    if (targetUser.toLowerCase() === currentUser.toLowerCase()) return;
    btnElement.innerText = '...'; btnElement.disabled = true;

    try {
        if (currentUser.toLowerCase() === 'ahmed') {
            await window.set(window.ref(window.db, 'friends/' + currentUser + '/' + targetUser), true);
            await window.set(window.ref(window.db, 'friends/' + targetUser + '/' + currentUser), true);
            alert(currentLang === 'en' ? `Added ${targetUser} as friend!` : `تمت إضافة ${targetUser} كصديق فوراً!`);
        } else {
            await window.set(window.ref(window.db, 'friend_requests/' + targetUser + '/' + currentUser), "pending");
            alert(currentLang === 'en' ? `Friend request sent to ${targetUser}.` : `تم إرسال طلب صداقة لـ ${targetUser}.`);
        }
    } catch (e) {
        alert("Error: " + e.message);
        btnElement.innerText = translations[currentLang].add;
        btnElement.disabled = false;
    }
  };

  window.filterUsers = function() { window.renderUsers(); };

  window.onload = () => {
    if (localStorage.getItem('theme') === 'light') { document.body.classList.add('light-mode'); }
    applyLanguage();
  };
</script>
<script type="module" src="notifications.js"></script>
<script type="module" src="theme-engine.js"></script>
<script src="pwa-manager.js" defer></script>
</body>
</html>
