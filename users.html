<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👥 قائمة المستخدمين - Quiz Hub</title>
<link rel="icon" type="image/png" href="pic/Logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #000; --bg-gradient: radial-gradient(circle at center, #1a1015 0%, #000 100%);
    --text-color: #fff; --subtitle-color: #aaa; --card-bg: #111; --card-border: #333; --accent: #ff0000;
  }
  body.light-mode {
    --bg-color: #f4f4f4; --bg-gradient: radial-gradient(circle at center, #ffffff 0%, #e0e0e0 100%);
    --text-color: #111; --subtitle-color: #555; --card-bg: #fff; --card-border: #ccc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background: var(--bg-gradient); background-color: var(--bg-color); color: var(--text-color); 
    font-family: 'Cairo', sans-serif; min-height: 100vh; padding: 20px; 
    display: flex; flex-direction: column; align-items: center; 
  }
  
  .back-btn { position: fixed; top: 20px; left: 20px; background: rgba(30, 30, 30, 0.9); color: #fff; border: 2px solid #555; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-family: 'Cairo', sans-serif; font-weight: bold; text-decoration: none; z-index: 999; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
  .back-btn:hover { background: var(--accent); border-color: var(--accent); }
  body.light-mode .back-btn { background: #fff; color: #111; border-color: #aaa; }

  .users-container { width: 100%; max-width: 800px; margin-top: 50px; }
  .header-title { text-align: center; color: var(--accent); font-size: 36px; margin-bottom: 20px; text-shadow: 0 0 15px rgba(255,0,0,0.5); }
  
  .search-box { width: 100%; margin-bottom: 20px; display: flex; gap: 10px; }
  .search-box input { flex: 1; padding: 15px; border-radius: 10px; border: 2px solid var(--card-border); background: var(--card-bg); color: var(--text-color); font-family: 'Cairo'; font-size: 16px; outline: none; }
  .search-box input:focus { border-color: var(--accent); }

  .users-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
  
  .user-card { background: var(--card-bg); border: 2px solid var(--card-border); border-radius: 15px; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; gap: 15px; transition: 0.3s; }
  .user-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  
  /* كارت الأونر */
  .user-card.owner-card { border-color: #ffd700; background: linear-gradient(135deg, rgba(255,215,0,0.05), transparent); box-shadow: 0 0 15px rgba(255,215,0,0.2); }

  .user-info { display: flex; align-items: center; gap: 15px; flex: 1; }
  .user-avatar { width: 50px; height: 50px; background: var(--card-border); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; color: var(--text-color); font-weight: bold; }
  .owner-card .user-avatar { background: #ffd700; color: #000; }
  
  .user-name { font-weight: bold; font-size: 18px; display: flex; align-items: center; gap: 5px; }

  .action-btn { padding: 8px 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-family: 'Cairo'; transition: 0.3s; text-decoration: none; display: flex; align-items: center; gap: 5px; font-size: 14px; }
  .btn-add { background: var(--accent); color: #fff; }
  .btn-add:hover { background: #cc0000; }
  .btn-msg { background: #0088cc; color: #fff; }
  .btn-msg:hover { background: #006699; }
  
  /* زرار الانتظار */
  .btn-pending { background: #444; color: #ccc; cursor: not-allowed; }
  body.light-mode .btn-pending { background: #ddd; color: #666; }

  .no-data { text-align: center; color: var(--subtitle-color); padding: 30px; background: var(--card-bg); border-radius: 15px; width: 100%; grid-column: 1 / -1; }
</style>
</head>
<body>

<a href="index.html" class="back-btn">⬅ رجوع للرئيسية</a>

<div class="users-container">
  <h1 class="header-title">👥 كل اللاعبين</h1>
  
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="ابحث عن لاعب بالاسم..." onkeyup="filterUsers()">
  </div>

  <div class="users-list" id="usersList">
    <div class="no-data">جاري تحميل اللاعبين...</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, get, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBmyW4tZGJfcHJ4jKSD3_6hebZK58Y3jXo",
    authDomain: "quiz-hub-app-f4cd0.firebaseapp.com",
    databaseURL: "https://quiz-hub-app-f4cd0-default-rtdb.firebaseio.com",
    projectId: "quiz-hub-app-f4cd0",
    storageBucket: "quiz-hub-app-f4cd0.firebasestorage.app",
    messagingSenderId: "282772179392",
    appId: "1:282772179392:web:64646d757592b29ff3a025"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  
  window.db = db; window.ref = ref; window.onValue = onValue; window.get = get; window.set = set; window.remove = remove;

  const currentUser = localStorage.getItem('loggedInUser');
  if (!currentUser) { window.location.href = 'index.html'; }

  let allUsers = [];
  let myFriends = {};
  let sentRequests = {};

  // 1. جلب أصدقائي
  window.onValue(window.ref(window.db, 'friends/' + currentUser), (snapshot) => {
    myFriends = snapshot.val() || {};
    renderUsers();
  });

  // 2. جلب الطلبات اللي أنا بعتها
  window.onValue(window.ref(window.db, 'friend_requests'), (snapshot) => {
    const data = snapshot.val();
    sentRequests = {};
    if (data) {
      for (let targetUser in data) {
        if (data[targetUser][currentUser]) {
          sentRequests[targetUser] = true;
        }
      }
    }
    renderUsers();
  });

  // 3. جلب كل المستخدمين
  window.onValue(window.ref(window.db, 'usernames'), (snapshot) => {
    const data = snapshot.val();
    allUsers = [];
    
    if (data) {
      for (let username in data) {
        allUsers.push(username);
      }
    }
    
    renderUsers();
  });

  // 4. دالة رسم المستخدمين
  function renderUsers() {
    const list = document.getElementById('usersList');
    list.innerHTML = '';

    // ترتيب القائمة بحيث الأونر (Ahmed) يبقى في الأول
    allUsers.sort((a, b) => {
      const isAOwner = (a.toLowerCase() === 'ahmed' || a === 'احمد');
      const isBOwner = (b.toLowerCase() === 'ahmed' || b === 'احمد');
      if (isAOwner) return -1;
      if (isBOwner) return 1;
      return a.localeCompare(b);
    });

    if (allUsers.length === 0) {
      list.innerHTML = '<div class="no-data">مفيش مستخدمين تانيين لحد دلوقتي.</div>';
      return;
    }

    allUsers.forEach(user => {
      // إخفاء المستخدم الحالي (عشان متشوفش نفسك)
      if (user === currentUser) return; 

      const isFriend = myFriends[user] === true;
      const isOwner = (user.toLowerCase() === 'ahmed' || user === 'احمد'); 
      const isPending = sentRequests[user] === true; 

      let displayName = user;
      if (isOwner) displayName = 'Ahmed';

      const div = document.createElement('div');
      div.className = `user-card ${isOwner ? 'owner-card' : ''}`;
      div.setAttribute('data-username', user.toLowerCase());

      let actionBtn = '';

      if (isFriend) {
        actionBtn = `<a href="messages.html?to=${user}" class="action-btn btn-msg">💬 رسالة</a>`;
      } else if (isPending) {
        actionBtn = `<button class="action-btn btn-pending" disabled>⏳ في انتظار الموافقة</button>`;
      } else {
        // زرار إضافة بيظهر للكل (حتى للأونر)
        actionBtn = `<button class="action-btn btn-add" onclick="addFriend('${user}', this)">➕ إضافة</button>`;
      }

      div.innerHTML = `
        <div class="user-info">
          <div class="user-avatar">${displayName.charAt(0).toUpperCase()}</div>
          <div class="user-name">
            ${displayName} 
            ${isOwner ? '<span style="color: #ffd700; font-size: 12px; background: #333; padding: 2px 6px; border-radius: 10px;">👑 Owner</span>' : ''}
          </div>
        </div>
        <div>
          ${actionBtn}
        </div>
      `;
      list.appendChild(div);
    });
  }

  // 5. دالة إضافة صديق
  window.addFriend = async function(targetUser, btnElement) {
    if (targetUser === currentUser) {
        alert("مش ممكن تضيف نفسك يا صاحبي! 😂");
        return;
    }

    try {
      btnElement.innerHTML = '⏳ في انتظار الموافقة';
      btnElement.className = 'action-btn btn-pending';
      btnElement.disabled = true;

      if (currentUser.toLowerCase() === 'ahmed' || currentUser === 'احمد') {
        await window.set(window.ref(window.db, 'friends/' + currentUser + '/' + targetUser), true);
        await window.set(window.ref(window.db, 'friends/' + targetUser + '/' + currentUser), true);
        alert(`تمت إضافة ${targetUser} كصديق فوراً! 👑`);
      } else {
        await window.set(window.ref(window.db, 'friend_requests/' + targetUser + '/' + currentUser), "pending");
        alert(`تم إرسال طلب صداقة لـ ${targetUser}. في انتظار الموافقة. ⏳`);
      }
    } catch (e) {
      alert("حدث خطأ: " + e.message);
    }
  };

  // 6. دالة البحث
  window.filterUsers = function() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    document.querySelectorAll('.user-card').forEach(card => {
      const username = card.getAttribute('data-username');
      if (username.includes(query)) {
        card.style.display = 'flex';
      } else {
        card.style.display = 'none';
      }
    });
  };
</script>
</body>
</html>
